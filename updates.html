<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product updates · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=dd4e9861">
<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --line:#E3E1DB; --line2:#CFCDC5;
  --ink:#1F1F1D; --ink2:#6B6A64; --ink3:#9C9A92;
  --graybg:#F1EFE8; --grayd:#5F5E5A; --dark:#1A0C12; --yellow:#F9DD5A;
  --serif:'Manner','Spectral',Georgia,serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.shell{display:flex;height:100vh;overflow:hidden}
.mainc{flex:1;overflow:auto;min-width:0;scroll-behavior:smooth}
.topbar{height:61px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1200}
.crumbs{display:flex;align-items:center;gap:9px;font-size:16px;min-width:0}
.crumbs .cr{color:var(--ink2);cursor:pointer;white-space:nowrap}
.crumbs .cr:hover{color:var(--ink)}
.crumbs .cr.cur{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink3);font-size:14px}

/* hero */
.hero{max-width:1120px;margin:0 auto;padding:36px 32px 20px}
.hero .phead{display:flex;align-items:center;gap:14px}
.hero .phead .acts{margin-left:auto;display:flex;gap:10px}
.hero .asearch{margin:16px 0 0}
.empty{max-width:1120px;margin:0 auto;padding:56px 32px;border-top:1px solid var(--line);color:var(--ink2);font-size:16px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;color:var(--ink)}

/* jump row */
.jump{max-width:1120px;margin:0 auto;padding:0 32px 40px;display:flex;flex-wrap:wrap;gap:8px}
.jump a{font-size:14px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}
.jump a:hover{color:var(--ink);border-color:var(--line2)}

/* releases */
.rel{max-width:1120px;margin:0 auto;padding:56px 32px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;border-top:1px solid var(--line);scroll-margin-top:61px}
.rdate{position:sticky;top:93px;align-self:start}
.rdate .d{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.01em}
.rdate .wd{font-size:14.5px;color:var(--ink2);margin-top:4px}
.items{display:flex;flex-direction:column;gap:72px;max-width:780px}
.it h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.015em;line-height:1.18;margin:0 0 6px}
.it .area{display:inline-block;font-size:13.5px;font-weight:500;color:var(--grayd);background:var(--graybg);border-radius:999px;padding:3px 11px;margin-bottom:18px}
.shot{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(20,18,12,.04),0 12px 32px rgba(20,18,12,.08);transition:transform .2s,box-shadow .2s}
.shot:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(20,18,12,.04),0 18px 40px rgba(20,18,12,.12)}
.shot img{display:block;width:100%;height:auto;aspect-ratio:16/10}
.it p{font-size:17px;line-height:1.6;color:var(--ink);margin-top:20px}
.it .open{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:15.5px;font-weight:600;color:var(--ink)}
.it .open .ti{font-size:17px;transition:transform .15s}
.it .open:hover .ti{transform:translateX(3px)}
.also{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:20px 24px}
.also h3{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:10px}
.also ul{list-style:none;padding:0}
.also li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15.5px}
.also li:first-child{border-top:none}
.also li .ti{font-size:17px;color:var(--ink2);flex:none}
.also li a{display:flex;align-items:center;gap:12px;width:100%}
.also li a .go{margin-left:auto;color:var(--ink3)}
.also li a:hover .go{color:var(--ink)}
.foot{max-width:1120px;margin:0 auto;padding:40px 32px 90px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}

@media(max-width:860px){
  .hero{padding:32px 20px 18px}
  .jump{padding:0 20px 28px}
  .rel{grid-template-columns:1fr;gap:18px;padding:40px 20px}
  .rdate{position:static}
  .it h2{font-size:24px}
}
</style>
</head>
<body>

<div class="shell">
<script>window.GYNAV={"active":"none"};</script>
<script src="gy-nav.js?v=d99df486"></script>
<script src="gy-select.js?v=8aa301ed"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr" onclick="location.href='home.html'">Great Yellow</span>
    <span class="sep">&rsaquo;</span><span class="cr cur">Product updates</span>
  </div>
</div>

<section class="hero"><div class="phead"><h1>Product updates</h1><div class="acts"><div id="abar"></div></div></div></section>
<nav class="jump" id="jump"></nav>
<main id="rels"></main>
<footer class="foot">Based on changes to the GY OS prototype between 28 September and 8 October 2026.</footer>
</div>
</div>

<script>
/* Newest release first. Featured items get a screenshot (upd-<id>.jpg, flat in this folder so the publish crawl finds it) with the
   main element highlighted; smaller changes go in "also". Add a new release at the top. */
var RELEASES = [
  {id:'oct-08', d:'8 October', wd:'Thursday', items:[
    {img:'upd-commercial-strategy.jpg', area:'Deliverables', title:'Commercial Strategy, built from a Blueprint', h:'commercial-strategy-v8.html',
     p:'The first Deliverable made from a Blueprint document: Commercial Strategy for Upper Dee, based on the real May 2026 final. It opens with four chapters already filled from the finished Customer Demand Mapping. Eight Ecosystem Service agents then write the market chapters.'},
    {img:'upd-financial-model.jpg', area:'Deliverables', title:'Deliverables that are spreadsheets', h:'financial-model-v8.html',
     p:'The ELR investment model runs as a Deliverable with its own workbook viewer. Sheet tabs fill in as the run goes, and the real file is one click away in Google Sheets.'},
    {img:'upd-portfolio-matrix.jpg', area:'Deliverables', title:'Every Blueprint, every programme', h:'deliverables-portfolio.html',
     p:'Portfolio Deliverables is now a matrix of Blueprints against programmes. See at a glance where a decision is waiting, what is blocked and which programmes run an older Blueprint version.'},
    {img:'upd-blueprint-agent.jpg', area:'Agents', title:'Agents get their own page', h:'agent-blueprint.html',
     p:'The Blueprint agent and six more agents each have a page with their purpose, jobs, guardrails and evals. The Ecosystem Service agents other than Woodland Carbon are placeholders until their experts fill them in.'},
    {img:'upd-agent-chat.jpg', area:'Agents', title:'Talk to an agent', h:'agent-woodland-carbon.html?chat=1',
     p:'Ask an agent about itself: who manages it, what it never does, what is still open. Answers come from its own definition. The message button in the Hive Mind agents table opens the chat.'},
    {img:'upd-inventory-review.jpg', area:'Inventory', title:'Inventory is a tool, not an agent', h:'inventory-overview-v3.html',
     p:'Inventory is a system of record with fixed actions. Agents and checks propose changes, and a person approves them in Review before the tool runs.'},
    {also:[
      {a:'Hive Mind', i:'ti-brain', t:'Hive Mind simplified, with a new Activity tab', h:'hive-mind-v2.html'},
      {a:'Deliverables', i:'ti-archive', t:'Canvas view and document view moved to the Deliverables Archive', h:'deliverables-landing.html'},
      {a:'Deliverables', i:'ti-layout-sidebar-right', t:'Demand Mapping v8 opens Outputs, items and agents in one right drawer', h:'deliverable-sketch-v8.html'}
    ]}
  ]},
  {id:'oct-06', d:'6 October', wd:'Tuesday', items:[
    {also:[
      {a:'Deliverables', i:'ti-arrow-down', t:'Demand Mapping v8: scroll-down button in the agent chat', h:'deliverable-sketch-v8.html'},
      {a:'Deliverables', i:'ti-messages', t:'Demand Mapping v8: side threads and notes from people in the run', h:'deliverable-sketch-v8.html'}
    ]}
  ]},
  {id:'oct-04', d:'4 October', wd:'Sunday', items:[
    {img:'upd-hive-mind.jpg', area:'Hive Mind', title:'Hive Mind v2', h:'hive-mind-v2.html',
     p:'The Hive Mind becomes the knowledge of the harness: eight shelves, a review queue and answers that show their sources. Every item has an owner and a status.'},
    {also:[
      {a:'Home', i:'ti-home', t:'Home v2, merging the earlier home sketches', h:'home-v2.html'},
      {a:'Navigation', i:'ti-forms', t:'"Hive Mind Library" is now "Hive Mind" across the sidebar', h:'hive-mind-v2.html'}
    ]}
  ]},
  {id:'oct-03', d:'3 October', wd:'Saturday', items:[
    {img:'upd-demand-mapping-v8.jpg', area:'Deliverables', title:'The agent runs the Deliverable', h:'deliverable-sketch-v8.html',
     p:'In Demand Mapping v8 the agent runs the workflow, fills the document and stops when it needs a person. Decisions show as cards, and Ecosystem Service agents report to an expert manager.'},
    {img:'upd-icon-rail.jpg', area:'Navigation', title:'A sidebar that gets out of the way', h:'deliverable-sketch-v8.html',
     p:'The sidebar folds into a slim icon rail, so the work gets the room. Deliverable pages open on the rail by default.'},
    {also:[
      {a:'Inventory', i:'ti-box', t:'Inventory v2 with an agent column, since replaced by v3', h:'inventory-overview-v2.html'},
      {a:'Design system', i:'ti-palette', t:'Design system: Sidebar section and design principles', h:'design-system.html'}
    ]}
  ]},
  {id:'oct-01', d:'1 October', wd:'Thursday', items:[
    {img:'upd-connectors.jpg', area:'Settings', title:'Connectors', h:'settings-connectors.html',
     p:'Settings, Connectors follows the Claude Connectors pattern: your connected systems in one list, a Discover catalogue and a page per connector.'}
  ]},
  {id:'sep-29', d:'29 September', wd:'Tuesday', items:[
    {img:'upd-personas.jpg', area:'Hive Mind', title:'Buyer personas', h:'persona.html?p=c1',
     p:'Nine Carbon and BNG buyer personas from Millie\'s segmentation, as cards in the Hive Mind. Each opens into a page with who they are, what drives them and how to talk to them.'}
  ]},
  {id:'sep-28', d:'28 September', wd:'Monday', items:[
    {img:'upd-versions-pill.jpg', area:'Navigation', title:'Step between versions', h:'deliverable-sketch-v8.html',
     p:'A small pill in the corner lists every version of a sketch. Click one, or use the [ and ] keys.'},
    {also:[
      {a:'Navigation', i:'ti-stack-2', t:'View menu links to the Design system', h:'design-system.html'}
    ]}
  ]}
];

var UQ='', UAREA='all';
function uMatch(area, text){
  if(UAREA!=='all' && area!==UAREA) return false;
  if(!UQ) return true;
  return text.replace(/<[^>]+>/g,'').toLowerCase().indexOf(UQ.toLowerCase())>-1;
}
function uRender(){
  var j='', out='';
  RELEASES.forEach(function(r){
    var body='', n=0, feats=r.items.filter(function(x){return !x.also}).length;
    r.items.forEach(function(it){
      if(it.also){
        var li=it.also.filter(function(a){return uMatch(a.a, a.t)});
        if(!li.length) return;
        n+=li.length;
        body += '<div class="also"><h3>'+(feats?'Also in this update':'Improvements')+'</h3><ul>';
        li.forEach(function(a){
          body += '<li><a href="'+a.h+'"><i class="ti '+a.i+'"></i><span>'+a.t+'</span><i class="ti ti-arrow-right go"></i></a></li>';
        });
        body += '</ul></div>';
        return;
      }
      if(!uMatch(it.area, it.title+' '+it.p+' '+it.area)) return;
      n++;
      body += '<article class="it"><h2>'+it.title+'</h2><span class="area">'+it.area+'</span>'
        + '<a class="shot" href="'+it.h+'"><img src="'+it.img+'" alt="'+it.title+'" width="2160" height="1350"></a>'
        + '<p>'+it.p+'</p>'
        + '<a class="open" href="'+it.h+'">Open in GY OS <i class="ti ti-arrow-right"></i></a></article>';
    });
    if(!n) return;
    j += '<a href="#'+r.id+'">'+r.d+'</a>';
    out += '<section class="rel" id="'+r.id+'"><div class="rdate"><div class="d">'+r.d+'</div><div class="wd">'+r.wd+'</div></div><div class="items">'+body+'</div></section>';
  });
  document.getElementById('jump').innerHTML = j;
  document.getElementById('jump').style.display = j ? '' : 'none';
  document.getElementById('rels').innerHTML = out || '<div class="empty">No updates match.</div>';
}
gyBar('abar', {
  search: {placeholder:'Search updates', oninput:function(v){ UQ=v.trim(); uRender(); }},
  filters: [
    ['Area',[['ti-circle-dot','All areas','all'],['ti-file-text','Deliverables','Deliverables'],['ti-robot','Agents','Agents'],
             ['ti-box','Inventory','Inventory'],['ti-brain','Hive Mind','Hive Mind'],['ti-home','Home','Home'],
             ['ti-layout-sidebar','Navigation','Navigation'],['ti-settings','Settings','Settings'],['ti-palette','Design system','Design system']]]
  ],
  onfilter: function(g, v){ UAREA=v; uRender(); }
});
uRender();
</script>
</body>
</html>
