<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites · Evenlode · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=c2eda4c9">
<style>
.wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px}
@media(max-width:900px){.wrap{padding:32px 22px 90px}}

.espill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:7px;background:var(--esc);color:#fff;white-space:nowrap}
.uchip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FBF1DC;color:var(--amberd);white-space:nowrap}

.scards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 22px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px}
.sc .lb{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sc .vl{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.sc .vl small{font-size:20px;font-weight:500}
.sc .sb{font-size:13px;color:var(--ink2);margin-top:6px}
.sc.warn{background:#F9DD5A;border-color:#E9CA36;cursor:pointer}
.sc.warn .lb,.sc.warn .sb{color:#6B5606}
.sc.warn.on{box-shadow:0 0 0 3px rgba(26,12,18,.14)}
@media(max-width:980px){.scards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.scards{grid-template-columns:1fr}}

.stbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.ptbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.phd,.prow{display:grid;grid-template-columns:104px minmax(180px,1.4fr) 80px 78px minmax(210px,1.5fr) 104px;
           align-items:center;gap:14px;padding:13px 18px}
.phd{background:var(--graybg);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);letter-spacing:.02em}
.phd .r,.prow .r{text-align:right}
.prow{border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:none}
.prow:hover{background:#FBFAF5}
.prow .pref{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.prow .pst,.prow .plu{font-size:14px;color:var(--ink2)}
.prow .par{font-size:14px;font-variant-numeric:tabular-nums}
.pempty{padding:30px 18px;color:var(--ink3);font-size:14px}
@media(max-width:820px){.phd{display:none}.prow{grid-template-columns:1fr auto;row-gap:8px}}
.shd,.srow{display:grid;grid-template-columns:minmax(180px,1.45fr) 62px 80px 78px minmax(210px,1.5fr) minmax(120px,.95fr) 104px;
           align-items:center;gap:14px;padding:13px 20px}
.shd{background:var(--graybg);border-bottom:1px solid var(--line);
     font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.shd .r,.srow .r{text-align:right}
.srow{border-bottom:1px solid var(--line);cursor:pointer;padding:15px 20px}
.srow:last-child{border-bottom:none}
.srow:hover{background:#FBF8EF}
.srow .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.srow .ad{font-size:13px;color:var(--ink3);margin-top:3px}
.srow .pc{font-size:14.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.srow .ar{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.srow .lu{font-size:14px;color:var(--ink2)}
.srow .al,.prow .al{display:flex;flex-direction:column;gap:6px;min-width:0}
.srow .alrow,.prow .alrow{display:flex;align-items:center;gap:9px;font-size:14.5px;min-width:0}
.srow .alrow .pn,.prow .alrow .pn{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .alrow .pp,.prow .alrow .pp{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.srow .ct{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ac{justify-self:end}
.allocbtn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.allocbtn:hover{border-color:var(--ink3)}
.sempty{padding:28px 20px;font-size:14px;color:var(--ink3);text-align:center}
@media(max-width:1060px){
  .shd{display:none}
  .srow{grid-template-columns:1fr auto;row-gap:10px;align-items:start}
  .srow .pc,.srow .ar,.srow .lu{grid-column:1;font-size:13.5px;color:var(--ink2);text-align:left}
  .srow .al,.srow .ct{grid-column:1 / 3}
  .srow .ac{grid-column:1;justify-self:start}
}
</style>
</head>
<body>
<div class="shell">
<script>window.GYNAV={"active":"prog-sites"};</script>
<script src="gy-nav.js?v=ee2546cc"></script>
<script src="gy-projects.js?v=493e46ca"></script>
<script src="gy-sites.js?v=31691678"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr" onclick="location.href='portfolio-overview.html'">Great Yellow</span>
    <span class="sep">›</span><span class="cr" onclick="location.href='programme-overview.html'">Evenlode</span>
    <span class="sep">›</span><span class="cr cur">Sites</span>
  </div>
</div>

<div class="wrap">
  <div class="phead">
    <div class="h1">Sites</div>
    <div class="acts" id="abar"></div>
  </div>

  <div class="seg" id="grainSeg" style="margin:14px 0 18px">
    <button class="on" data-g="sites" onclick="setGrain('sites')">Sites</button>
    <button data-g="parcels" onclick="setGrain('parcels')">Parcels</button>
  </div>

  <div class="scards" id="scards"></div>
  <div class="stbl" id="stbl"></div>
  <div class="ptbl" id="ptbl" hidden></div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3400);}
if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};
</script>
<script>
/* Bulk operations for land. Parcel allocation is the land-side half of
   "Add inventory to projects" on the Projects page; both ends exist. */
var LAND_ACTIONS = [
  ['label','Bulk'],
  ['ti-map-pin-plus','Allocate parcels to projects','Pick unallocated parcels, then the project they join'],
  ['ti-file-import','Import land schedule','Import sites and parcels from a spreadsheet, matched on land title'],
  '-',
  ['ti-file-export','Export land schedule','Export: every site and parcel as a spreadsheet'],
  ['ti-history','Audit log','go:activity-overview.html']
];
var GRAIN='sites';
var ALLOC='any', LANDUSE='any', BAR=null;
function esPill(k){ return '<span class="espill '+GY_ES[k].cls+'">'+GY_ES[k].short+'</span>'; }
function projOf(id){ return GY_PROJECTS.filter(function(p){return p.id===id;})[0]; }
function openSite(s){ toast(s.name+': the site page is not in this prototype yet'); }

function card(lb,vl,sb){
  return '<div class="sc"><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div>'
       + (sb?'<div class="sb">'+sb+'</div>':'') + '</div>';
}
function cards(){
  var A=GY_SITES_API;
  document.getElementById('scards').innerHTML =
     card('Sites', A.count(), '')
   + card('Land parcels', A.parcels(), '')
   + card('Total area', A.area()+' <small>ha</small>', '')
   + '<div class="sc warn'+(ALLOC==='unalloc'?' on':'')+'" onclick="toggleAlloc()">'
     +'<div class="lb">Unallocated land</div>'
     +'<div class="vl">'+A.unallocatedParcels()+' <small>parcels</small></div>'
     +'<div class="sb">'+A.unallocatedArea()+' ha</div></div>';
}
function setGrain(g){
  GRAIN=g;
  document.querySelectorAll('#grainSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.g===g);});
  render();
}
/* allocated means it has at least one project on it */
function byAlloc(has){ return ALLOC==='any' || (ALLOC==='alloc' ? has : !has); }
function byUse(use){ return LANDUSE==='any' || String(use).toLowerCase().indexOf(LANDUSE)>=0; }
/* the Unallocated land card is a shortcut into the Allocation filter, so it
   has to move the action bar's own state with it, badge included */
function setAlloc(v){
  ALLOC=v;
  if(BAR && BAR.pop){
    BAR.filter['Allocation']=v;
    [].forEach.call(BAR.pop.querySelectorAll('.ar[data-g="Allocation"]'), function(r){
      r.classList.toggle('on', r.getAttribute('data-v')===v);
    });
    paintBadge();
  }
  render();
}
function paintBadge(){
  var c=document.querySelector('#abar .cnt');
  if(!c) return;
  var n=(LANDUSE!=='any'?1:0)+(ALLOC!=='any'?1:0);
  c.textContent = n ? String(n) : '';
}
function renderParcels(q){
  var rows=GY_SITES_API.parcelRows().filter(function(p){
    if(!byAlloc(!!p.project) || !byUse(p.use)) return false;
    return (p.ref+' '+p.site+' '+p.use).toLowerCase().indexOf(q)>=0;
  });
  var h='<div class="phd"><span>Parcel</span><span>Site</span><span class="r">Area</span>'
       +'<span>Land use</span><span>Allocated to</span><span></span></div>';
  h+= rows.length ? rows.map(function(p){
    var pr=p.project?projOf(p.project):null;
    var al = pr
      ? '<div class="alrow"><span class="pn">'+pr.name+'</span>'+esPill(pr.es)+'</div>'
      : '<div class="alrow"><span class="uchip">Unallocated</span></div>';
    return '<div class="prow" onclick="toast(\''+p.ref+': the parcel page is not in this prototype yet\')">'
      +'<span class="pref">'+p.ref+'</span>'
      +'<span class="pst">'+p.site+'</span>'
      +'<span class="par r">'+p.ha+' ha</span>'
      +'<span class="plu">'+p.use+'</span>'
      +'<span class="al">'+al+'</span>'
      +'<span class="ac">'+(pr?'':'<button class="allocbtn" onclick="event.stopPropagation();toast(\'Allocate '+p.ref+' to a Project\')">Allocate <i class="ti ti-arrow-right"></i></button>')+'</span>'
      +'</div>';
  }).join('') : '<div class="pempty">No parcels match that search.</div>';
  document.getElementById('ptbl').innerHTML=h;
}
function render(){
  cards();
  var seg=document.getElementById('grainSeg').children;
  seg[0].textContent='Sites \u00b7 '+GY_SITES_API.count();
  seg[1].textContent='Parcels \u00b7 '+GY_SITES_API.parcels();
  var q=(window.SQ||'').toLowerCase();
  document.getElementById('stbl').hidden = (GRAIN!=='sites');
  document.getElementById('ptbl').hidden = (GRAIN!=='parcels');
  if(GRAIN==='parcels') return renderParcels(q);
  var list=GY_SITES_API.all().filter(function(s){
    if(!byAlloc(s.alloc.length>0) || !byUse(s.use)) return false;
    return (s.name+' '+s.addr+' '+s.contact+' '+s.use).toLowerCase().indexOf(q)>=0;
  });
  var h='<div class="shd"><span>Site</span><span class="r">Parcels</span><span class="r">Area</span>'
       +'<span>Land use</span><span>Allocated to</span><span>Contact</span><span></span></div>';
  h+= list.length ? list.map(function(s){
    var i=GY_SITES.indexOf(s);
    var al = s.alloc.length
      ? s.alloc.map(function(a){ var p=projOf(a.project);
          return '<div class="alrow"><span class="pn">'+p.name+'</span>'+esPill(p.es)
               + (s.alloc.length>1 ? '<span class="pp">'+a.parcels+' parcel'+(a.parcels>1?'s':'')+'</span>' : '')
               + '</div>'; }).join('')
      : '<div class="alrow"><span class="uchip">Unallocated</span>'
        + (s.note?'<span class="pp">'+s.note+'</span>':'') + '</div>';
    return '<div class="srow" onclick="openSite(GY_SITES['+i+'])">'
      +'<span><div class="nm">'+s.name+'</div><div class="ad">'+s.addr+'</div></span>'
      +'<span class="pc r">'+s.parcels+'</span>'
      +'<span class="ar r">'+s.ha+' ha</span>'
      +'<span class="lu">'+s.use+'</span>'
      +'<span class="al">'+al+'</span>'
      +'<span class="ct">'+s.contact+'</span>'
      +'<span class="ac">'+(s.alloc.length?'':'<button class="allocbtn" onclick="event.stopPropagation();toast(\'Allocate '+s.name+' to a Project\')">Allocate <i class="ti ti-arrow-right"></i></button>')+'</span>'
      +'</div>';
  }).join('') : '<div class="sempty">No sites match that search.</div>';
  document.getElementById('stbl').innerHTML=h;
}
function toggleAlloc(){ setAlloc(ALLOC==='unalloc'?'any':'unalloc'); }
window.addEventListener('DOMContentLoaded',render);

BAR = gyBar('abar', {
  search:  {placeholder:'Search sites and parcels', oninput:function(v){ window.SQ=v; render(); }},
  filters: [
    ['Land use',[['ti-circle-dot','Any','any'],['ti-wheat','Arable','arable'],['ti-plant','Pasture','pasture'],
                 ['ti-layers-intersect','Mixed','mixed'],['ti-trees','Woodland','woodland'],['ti-droplet','Water','water']]],
    ['Allocation',[['ti-circle-dot','All','any'],['ti-map-pin-check','Allocated','alloc'],['ti-map-pin-question','Unallocated','unalloc']]]
  ],
  onfilter: function(group, value){
    if(group==='Land use') LANDUSE=value; else ALLOC=value;
    render();
  },
  primary: {icon:'ti-plus', label:'Add site', onclick:'Add site: address, contact and the parcels it holds'},
  actions: LAND_ACTIONS
});
/* tag the Allocation rows so the Unallocated land card can tick the right one */
if(BAR && BAR.pop){
  var vals=['any','alloc','unalloc'];
  [].forEach.call(BAR.pop.querySelectorAll('.ar[data-g="Allocation"]'), function(r,i){ r.setAttribute('data-v', vals[i]); });
}
</script>
</body>
</html>
