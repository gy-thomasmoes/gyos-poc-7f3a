<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --field:#F5F3EF; --line:#E3E1DB; --line2:#CFCDC5;
  --ink:#1F1F1D; --ink2:#6B6A64; --ink3:#9C9A92;
  --amber:#EF9F27; --amberd:#854F0B;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:row;overflow:hidden;font-size:16px;color-scheme:light}
.mainc{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.snav{position:relative;width:var(--nav,264px);flex:none;background:#fff;border-right:1px solid #E6E4DE;display:flex;flex-direction:column;padding:12px 12px 16px;color:#1F1F1D;color-scheme:light}
body.navhid .snav{display:none}
.snavpeek{position:fixed;top:0;left:0;width:14px;height:100vh;z-index:44;display:none}
body.navhid .snavpeek{display:block}
body.navhid.navpeek .snav{display:flex;position:fixed;left:0;top:10px;bottom:10px;width:264px;z-index:45;border:1px solid #E6E4DE;border-radius:0 14px 14px 0;box-shadow:0 12px 40px rgba(31,31,29,.3);animation:snavslide .16s ease}
@keyframes snavslide{from{transform:translateX(-100%)}to{transform:none}}
.snavgrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.snavgrip:hover,.snavgrip.on{background:rgba(31,31,29,.08)}
.sworks{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.sworks .wtile{width:30px;height:30px;border-radius:9px;background:#F9DD5A;color:#1A0C12;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sworks b{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:4px;color:#1F1F1D}
.sworks .ti{font-size:15px;color:#9C9A92}
.scollapse{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:#9C9A92;display:flex;align-items:center;justify-content:center;cursor:pointer}
.scollapse:hover{background:#EFEDE8;color:#1F1F1D}
.scollapse .ti{font-size:17px}
.sitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:15px;color:#1F1F1D;cursor:pointer;margin-bottom:1px}
.sitem .ti{font-size:17px;color:#6B6A64}
.sitem:hover{background:#F3F2EE}
.sdiv{height:1px;min-height:1px;flex:none;background:#E3E1DB;margin:8px 6px}
.sitem.on{background:#EFEDE8;font-weight:500}
.sarr{margin-left:auto;font-size:14px;color:#9C9A92;transition:transform .15s;padding:2px;border-radius:5px}
.sarr:hover{background:rgba(31,31,29,.08)}
.sarr.closed{transform:rotate(-90deg)}
.ssub{margin:2px 0 4px 30px}
.ssub.closed{display:none}
.ssub .sitem{font-size:14.5px;padding:6px 10px;color:#6B6A64}
.ssub .sitem.on{color:#1F1F1D}
.row1{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid #E6E4DE;flex:none;height:61px;box-sizing:border-box}
.row1 .ti{font-size:19px;color:#6B6A64}
.title{font-size:17px;font-weight:600;white-space:nowrap;color:#1F1F1D}
.crumb{color:#9C9A92;cursor:pointer;font-size:16px;white-space:nowrap}
.crumb:hover{color:#6B6A64}
.sep{color:#9C9A92;font-size:14px}
.esdd{position:relative;display:inline-flex;align-items:center;gap:5px;cursor:pointer;border-radius:8px;padding:3px 7px;margin-left:-3px}
.esdd:hover{background:#F3F2EE}
.esdd .title{font-size:17px}
.esmenu{position:absolute;top:calc(100% + 7px);left:0;min-width:242px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px rgba(31,31,29,.17);padding:6px;z-index:50;display:none}
.esmenu.open{display:block}
.em-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14.5px;color:var(--ink);cursor:pointer}
.em-item:hover{background:#F3F2EE}
.em-item.on{font-weight:600}
.em-item .emj{font-size:18px;width:22px;text-align:center}
.em-item .ck{margin-left:auto;color:#639922;font-size:16px}
.chip{font-size:15px;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip .ti{font-size:16px}
.spacer{flex:1}
.stage{flex:1;overflow:auto;min-width:0}
.stagewrap{display:flex;justify-content:flex-start;align-items:flex-start;padding:34px 34px 72px}
.npage{background:#fff;flex:1 1 auto;max-width:none;min-width:0;border-radius:10px;border:1px solid var(--line);padding:52px 72px 72px;color:#1F1F1D;font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif}
.npicon{font-size:46px;line-height:1}
.nptitle{font-family:var(--serif);font-size:37px;font-weight:500;letter-spacing:-.01em;line-height:1.15;margin-top:12px}
.nprop{display:flex;gap:10px;align-items:center;font-size:15px;color:#787774;margin-top:9px}
.nprop .ti{font-size:15px;color:#9C9A92}
.nprop .plab{width:104px;flex:none;display:flex;align-items:center;gap:8px}
.nprop b{color:#37352F;font-weight:400}
.ptag{background:#F6ECC4;border:1px solid #E3D391;border-radius:6px;padding:1px 8px;font-size:13px;color:#6B5B12}
.ptag.g{background:#E7F1D8;border-color:#C4DBA3;color:#3F5A2B}
.ptag.r{background:#FBE4E4;border-color:#F0B4B4;color:#A32D2D}
.ptag.run{background:#E1F5EE;border-color:#B7E3D3;color:#0F6E56;cursor:pointer}
.ptag.run:hover{filter:brightness(.97)}
.ndiv{height:1px;background:#EDECE8;margin:26px 0 6px}
.callout{display:flex;gap:11px;align-items:flex-start;background:#F7F6F3;border:1px solid #EDECE8;border-radius:10px;padding:14px 16px;margin-top:18px;font-size:15.5px;line-height:1.6;color:#37352F}
.callout .ti{font-size:17px;color:#B78A0E;flex:none;position:relative;top:1px}
.nh2{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.005em;margin-top:32px;display:flex;align-items:baseline;gap:10px}
.vx{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;font-size:12px;font-weight:400;color:var(--ink3)}
.pblk{margin-top:11px;font-size:16.5px;line-height:1.7;color:#2A2824}
.bul{display:flex;gap:11px;align-items:flex-start;margin-top:10px;font-size:16.5px;line-height:1.65;color:#2A2824}
.bul .dot{color:#9C9A92;flex:none;position:relative;top:1px}
.bul .btxt{flex:1}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 34px;margin-top:14px;font-size:16px;color:#2A2824}
.rgrid span{display:flex;align-items:center;cursor:help}
.rgrid .rd{width:9px;height:9px;border-radius:50%;flex:none;margin-right:9px}
.rgrid b{margin-left:auto;font-weight:600}
.rnote{font-size:13px;color:var(--ink3);margin-top:13px;line-height:1.55}
.wbpill{position:fixed;right:18px;bottom:18px;z-index:48;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:11px 18px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.wbpill .ti{font-size:16px;color:var(--amberd)}
.wbpill:hover{border-color:var(--amber)}
.toc{width:186px;flex:none;position:sticky;top:34px;align-self:flex-start;display:flex;flex-direction:column;gap:1px;margin-right:30px}
.tocpad{display:none}
.toc .tlab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;padding:2px 10px 6px}
.toc a{display:block;font-size:13.5px;line-height:1.35;color:var(--ink3);text-decoration:none;padding:6px 10px;border-left:2px solid var(--line);cursor:pointer;transition:color .12s,border-color .12s,background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--ink2);background:rgba(31,31,29,.04)}
.toc a.on{color:var(--ink);border-left-color:var(--amber);font-weight:500}
@media (max-width:1220px){.toc,.tocpad{display:none}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F1F1D;color:#fff;font-size:15px;padding:9px 18px;border-radius:999px;z-index:40;display:none;max-width:80vw}
@keyframes sheetin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stage{animation:sheetin .32s ease-out both}

/* title badge */
.npbadge{width:62px;height:62px;border-radius:17px;background:linear-gradient(155deg,#EAF1DE,#F6ECC4);display:flex;align-items:center;justify-content:center;font-size:34px;border:1px solid #E3D9B8;box-shadow:0 2px 10px rgba(120,110,60,.08)}
/* meta property panel */
.metacard{margin-top:22px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#FCFBF8,#fff);padding:4px 22px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(120,110,60,.05)}
.metacard .nprop{margin-top:0;padding:13px 2px;font-size:15.5px;line-height:1.55;border-bottom:1px solid #F2F0EB}
.metacard .nprop:last-child{border-bottom:none}
.metacard .plab{width:136px;color:var(--ink3);font-weight:500}
.metacard .plab .ti{font-size:16px;color:var(--ink3)}
.metacard .nprop b{color:#33312C;font-weight:500}
.metacard .ptag,.metacard .ptag.g,.metacard .ptag.r,.metacard .ptag.run{padding:3px 11px;font-size:13.5px;border-radius:7px}
/* section tag pills */
.tagpill{font-family:-apple-system,system-ui,Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:2px 10px;display:inline-flex;align-items:center;gap:5px;position:relative;top:-2px}
.tagpill.static{color:var(--ink3);background:var(--field);border:1px solid var(--line);font-weight:500}
.tagpill.method{color:#6B5B12;background:#F6ECC4;border:1px solid #E3D391;font-weight:500}
.tagpill.live{color:#2F7D45;background:#E7F1D8;border:1px solid #C4DBA3}
.livedot{width:7px;height:7px;border-radius:50%;background:#39A85B;flex:none;animation:lpulse 2.4s infinite}
.tagpill.live .livedot{width:6px;height:6px}
@keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(57,168,91,.5)}70%{box-shadow:0 0 0 5px rgba(57,168,91,0)}100%{box-shadow:0 0 0 0 rgba(57,168,91,0)}}
/* dynamic data block - reads live from a source */
.dynblock{border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#FCFBF8,#FFFFFF);margin-top:13px;padding:0 17px 16px;position:relative;overflow:hidden}
.dynblock::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#639922,#EF9F27)}
.dynhead{display:flex;align-items:center;gap:8px;padding:12px 2px 11px;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.dynhead .src{font-weight:600;color:var(--ink)}
.dynhead .meta{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink3);white-space:nowrap}
.dynhead .meta .ti{font-size:14px}
.dynblock .bul:first-of-type{margin-top:12px}
.dynblock .rgrid{margin-top:14px}

:root{--serif:'Manner','Spectral',Georgia,serif}
.title{font-weight:600}
.grt-h{font-family:var(--serif);font-weight:500}
</style>
</head>

// ── build the page from the data ──
function statusCls(s){return s==='g'?'g':(s==='r'?'r':'');}
function bul(t){return `<div class="bul"><span class="dot">•</span><span class="btxt">${t}</span></div>`;}
var P_STATIC='<span class="tagpill static">Static</span>';
var P_METHOD='<span class="tagpill method">GY methodology</span>';
var P_LIVE='<span class="tagpill live"><span class="livedot"></span>Live</span>';
function dynblock(src,tail,meta,inner){
  return `<div class="dynblock"><div class="dynhead"><span class="livedot"></span><span class="src">${src}</span>${tail?' · '+tail:''}<span class="meta"><i class="ti ti-refresh"></i> ${meta}</span></div>${inner}</div>`;
}
(function(){
  var n=0;
  function h2(label,pill){n++;return `<div class="nh2">${n} · ${label}${pill?' '+pill:''}</div>`;}
  var head=''
   +`<div class="npbadge">${E.em}</div>`
   +`<div class="nptitle">${E.name}</div>`
   +`<div class="metacard">`
     +`<div class="nprop"><span class="plab"><i class="ti ti-tag"></i>Type</span><b>${E.type}</b></div>`
     +`<div class="nprop"><span class="plab"><i class="ti ti-activity"></i>Status</span><span class="ptag ${statusCls(E.status)}">${RLAB[E.status]}</span></div>`
     +`<div class="nprop"><span class="plab"><i class="ti ti-coin"></i>Market size</span><b>${E.vol} · ${E.volsub}</b></div>`
     +`<div class="nprop"><span class="plab"><i class="ti ti-refresh"></i>Refreshed</span><b>Oct 2025 · NatWest Markets Report</b></div>`
     +`<div class="nprop"><span class="plab"><i class="ti ti-topology-star-3"></i>Read by</span><span class="ptag run" onclick="location.href='demand-mapping-canvas-prototype.html'">Demand Mapping</span></div>`
   +`</div>`;

  var s='';
  s+=h2('About',P_STATIC)+`<div class="pblk">${E.about}</div>`;
  s+=h2('How we sell it',P_STATIC)+`<div class="pblk">${E.mon}</div>`;
  if(E.ready){
    var cats=Object.keys(E.ready).length;
    var grid=`<div class="rgrid">${Object.entries(E.ready).map(([k,v])=>`<span title="${(CATDEF[k]||'').replace(/"/g,'&quot;')}"><span class="rd" style="background:${RCOL[v]}"></span>${k}<b style="color:${RCOL[v]}">${RLAB[v]}</b></span>`).join('')}</div>`
      +`<div class="rnote">Hover a category for its definition. Scored <span style="color:#639922">●</span> active · <span style="color:#EF9F27">●</span> emerging · <span style="color:#D64545">●</span> nascent, per the GY Market Readiness Assessment (triangulating registry hard data, intermediary intelligence and GY deal-pipeline insight).</div>`;
    s+=h2('Market readiness',P_METHOD)+dynblock('GY Market Readiness Assessment',cats+' categories','scored Oct 2025',grid);
  }else{
    s+=h2('Market readiness','')+`<div class="pblk" style="color:var(--ink3)">Too nascent or bespoke to assess against the framework. Sized per opportunity as demand emerges.</div>`;
  }
  if(E.sizing) s+=h2('Sizing method',P_METHOD)+`<div class="pblk">${E.sizing}</div>`;
  if(E.dyn&&E.dyn.length) s+=h2('Market dynamics',P_LIVE)+dynblock('Data Platform','market feed','synced 14 Jul 2026 · ~3-month cadence',E.dyn.map(bul).join(''));
  if(E.uk&&E.uk.length) s+=h2('UK signals',P_LIVE)+dynblock('Data Platform · registries','WCC · PCC','synced 14 Jul 2026',E.uk.map(bul).join(''));
  if(E.risks&&E.risks.length) s+=h2('Market risks',P_STATIC)+E.risks.map(bul).join('');

   +bul('Registries · DEFRA BNG, Gaia, WCC, PCC · hard data · <b>gold</b>')

   +bul('Intermediary intelligence · Earthly, Patch, Swallowtail · soft data · <b>bronze</b>')
   +bul('NatWest Markets Report (Caitlin + Harry) · <b>gold</b>')
   +bul('Trade team and buyer signals · logged by Qualitative research · <b>gold</b>');

  document.getElementById('npage').innerHTML=head+s;
})();

// ── TOC ──
let TOCHEADS=[];
function tocGo(i){if(TOCHEADS[i])TOCHEADS[i].scrollIntoView({behavior:'smooth',block:'start'});}
(function(){
  const stage=document.querySelector('.stage'), wrap=document.querySelector('.stagewrap');
  TOCHEADS=[...document.querySelectorAll('.npage .nh2')];
  if(!TOCHEADS.length||!stage||!wrap)return;
  const nav=document.createElement('nav');nav.className='toc';
  let h='<div class="tlab">On this page</div>';
  TOCHEADS.forEach((el,i)=>{el.id='h'+i;el.style.scrollMarginTop='24px';const lab=(el.firstChild&&el.firstChild.nodeType===3)?el.firstChild.textContent.trim():el.textContent.trim();h+=`<a data-i="${i}" onclick="tocGo(${i})">${lab}</a>`;});
  nav.innerHTML=h;
  wrap.insertBefore(nav,wrap.firstChild);
  const links=[...nav.querySelectorAll('a')];
  function upd(){
    const top=stage.getBoundingClientRect().top;let cur=0;
    TOCHEADS.forEach((el,i)=>{if(el.getBoundingClientRect().top-top<48)cur=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===cur));
  }
  stage.addEventListener('scroll',upd,{passive:true});upd();
})();
function toggleNav(){
  document.body.classList.remove('navpeek');
  const hid=document.body.classList.toggle('navhid');
  document.getElementById('expandBtn').style.display=hid?'flex':'none';
  localStorage.setItem('gyNavHid',hid?'1':'0');
}
(function(){
  if(localStorage.getItem('gyNavHid')==='1'){
    document.body.classList.add('navhid');
    document.getElementById('expandBtn').style.display='flex';
  }
})();
(function(){
  const zone=document.createElement('div');zone.className='snavpeek';document.body.appendChild(zone);
  zone.addEventListener('mouseenter',()=>{if(document.body.classList.contains('navhid'))document.body.classList.add('navpeek');});
  const sn=document.querySelector('.snav'); if(sn) sn.addEventListener('mouseleave',()=>document.body.classList.remove('navpeek'));
  zone.addEventListener('mouseleave',e=>{if(!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.snav')))document.body.classList.remove('navpeek');});
})();
</script>
