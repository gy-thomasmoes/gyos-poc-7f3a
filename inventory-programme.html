<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All inventory · Evenlode · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=c2eda4c9">
<style>.dtbl .r{text-align:right}.dtbl td.r{font-variant-numeric:tabular-nums}.esrow{display:flex;align-items:center;gap:10px;margin:0 0 16px}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover .ca{color:var(--ink)}
.ca.on{color:var(--ink)}
</style>
</head>
<body>
<div class="shell">
<script>
(function(){ var es=''; try{ es=new URLSearchParams(location.search).get('es')||''; }catch(e){}
  window.GYNAV={"active": es ? 'prog-inv-'+es : 'prog-inv-list'};
})();
</script>
<script src="gy-nav.js?v=35621c30"></script>
<script src="gy-projects.js?v=493e46ca"></script>
<script src="gy-inventory.js?v=358d8962"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr" onclick="location.href='portfolio-overview.html'">Great Yellow</span>
    <span class="sep">›</span><span class="cr" onclick="location.href='programme-overview.html'">Evenlode</span>
    <span class="sep">›</span><span class="cr" onclick="location.href='inventory-overview.html'">Inventory</span>
    <span class="sep">›</span><span class="cr cur">All inventory</span>
  </div>
</div>

<div class="wrap">
  <div class="phead">
    <div class="h1">All inventory</div>
    <div class="acts" id="abar"></div>
  </div>

  <div class="searchbar"><span class="showing" id="showing"></span></div>

  <div class="tblwrap">
    <table class="dtbl">
      <thead>
        <tr>
          <th colspan="5"></th>
          <th colspan="8" class="vdiv"><div style="display:flex;align-items:center;justify-content:space-between;gap:20px"><span style="font-weight:600;color:var(--ink2)">BNG Data</span><span class="wccpill">WCC data <i class="ti ti-chevron-right"></i></span></div></th>
        </tr>
        <tr>
          <th><span class="chkbox"></span></th>
          <th data-k="es" onclick="setSort('es')">ES Type <span class="ca" data-ca="es">⇅</span> <i class="ti ti-info-circle" style="font-size:13px;color:var(--ink3)"></i></th>
          <th data-k="avail" onclick="setSort('avail')">Availability <span class="ca" data-ca="avail">⇅</span></th>
          <th data-k="type" onclick="setSort('type')">Specific Type / Vintage <span class="ca" data-ca="type">⇅</span></th>
          <th class="r" data-k="units" onclick="setSort('units')">Units <span class="ca" data-ca="units">⇅</span></th>
          <th class="vdiv" data-k="dist" onclick="setSort('dist')">Distinctiveness <span class="ca" data-ca="dist">⇅</span></th>
          <th data-k="cond" onclick="setSort('cond')">Condition <span class="ca" data-ca="cond">⇅</span></th>
          <th>Broad Habitat</th>
          <th>Habitat ID</th>
          <th>LPA</th>
          <th>NCA</th>
          <th>LNRS</th>
          <th>Area</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="pager">
    <span>Page 1 of 1</span>
    <button class="pgbtn"><i class="ti ti-chevrons-left"></i></button>
    <button class="pgbtn"><i class="ti ti-chevron-left"></i></button>
    <button class="pgbtn"><i class="ti ti-chevron-right"></i></button>
    <button class="pgbtn"><i class="ti ti-chevrons-right"></i></button>
  </div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3400);}
if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};
const dash='<span class="dash">&mdash;</span>';
var ES_FILTER='';
try{ ES_FILTER = new URLSearchParams(location.search).get('es') || ''; }catch(e){}

function esTag(k){ return '<span class="estag">'+(k==='bng'?'BNG':k==='wcc'?'WCC':'Soil')+'</span>'; }
function badge(a){
  var cls = a==='Available' ? 'avail' : a==='Sold' ? 'sold' : 'future';
  return '<span class="badge '+cls+'">'+a+'</span>';
}
function cell(v){ return v ? v : dash; }

/* Every facet below is built from the rows themselves, so a filter can never
   offer a value the inventory does not hold. F holds one array per facet and
   an empty array means the facet is off. */
var F={avail:[], type:[], broad:[], dist:[], cond:[], site:[]};
/* Commonest first, then alphabetical. A capped group shows its first four,
   so the four that matter should be the ones the inventory actually holds
   most of, not whatever sorts first. */
function vals(key){
  var n={};
  GY_INV_API.rows('Evenlode').forEach(function(r){
    var v=r[key]; if(v) n[v]=(n[v]||0)+1;
  });
  var rank=RANK[key];
  return Object.keys(n).sort(function(a,b){
    if(rank) return (rank[a]===undefined?99:rank[a])-(rank[b]===undefined?99:rank[b]);
    return n[b]-n[a] || a.localeCompare(b);
  });
}
function keep(r){
  for(var k in F){ if(F[k].length && F[k].indexOf(r[k])<0) return false; }
  return true;
}
/* these three read in their own order, for both the filter and the sort */
var RANK={
  avail:{'Available':0,'Projected':1,'Reserved':2,'Sold':3},
  dist :{'High':0,'Medium':1,'Low':2},
  cond :{'Good':0,'Fairly Good':1,'Moderate':2,'Poor':3}
};
var SORT={k:null, dir:1};
function setSort(k){
  SORT = (SORT.k===k) ? {k:k, dir:-SORT.dir} : {k:k, dir:1};
  render();
}
function sortRows(list){
  if(!SORT.k) return list;
  var k=SORT.k, rank=RANK[k];
  return list.slice().sort(function(a,b){
    var x=a[k], y=b[k];
    if(rank){ x=rank[x]===undefined?99:rank[x]; y=rank[y]===undefined?99:rank[y]; }
    if(typeof x==='string'){ return SORT.dir*x.localeCompare(y); }
    return SORT.dir*(x-y);
  });
}
function render(){
  var q=(window.IQ||'').toLowerCase();
  var all=GY_INV_API.rows('Evenlode');
  var list=sortRows(all.filter(function(r){
    if(ES_FILTER && r.es!==ES_FILTER) return false;
    if(!keep(r)) return false;
    return (r.es+' '+r.avail+' '+r.type+' '+r.site+' '+r.broad+' '+r.dist+' '+r.cond).toLowerCase().indexOf(q)>=0;
  }));
  document.querySelectorAll('.ca').forEach(function(c){
    var on = c.dataset.ca===SORT.k;
    c.classList.toggle('on', on);
    c.textContent = on ? (SORT.dir>0?'↑':'↓') : '⇅';
  });
  document.getElementById('rows').innerHTML = list.length ? list.map(function(r){
    return '<tr>'
      +'<td><span class="chkbox"></span></td>'
      +'<td>'+esTag(r.es)+'</td>'
      +'<td>'+badge(r.avail)+'</td>'
      +'<td>'+r.type+'</td>'
      +'<td class="r">'+r.units.toLocaleString()+'</td>'
      +'<td class="vdiv">'+cell(r.dist)+'</td>'
      +'<td>'+cell(r.cond)+'</td><td>'+cell(r.broad)+'</td><td>'+cell(r.hid)+'</td>'
      +'<td>'+cell(r.lpa)+'</td><td>'+cell(r.nca)+'</td><td>'+cell(r.lnrs)+'</td>'
      +'<td>'+r.ha+' ha</td>'
      +'</tr>';
  }).join('') : '<tr><td colspan="13" style="text-align:center;color:var(--ink3);padding:26px">No inventory matches that search.</td></tr>';

  var units=list.reduce(function(t,r){return t+r.units;},0);
  document.getElementById('showing').textContent =
    'Showing '+list.length+' of '+all.length+' · '+units.toLocaleString()+' units';
  document.querySelectorAll('#esSeg button').forEach(function(b){
    b.classList.toggle('on', (b.dataset.es||'')===ES_FILTER);
  });
}
function setEs(k){
  ES_FILTER=k;
  try{ history.replaceState(null,'', k ? '?es='+k : location.pathname); }catch(e){}
  render();
}
window.addEventListener('DOMContentLoaded',render);

/* One group per real facet, values straight from the data, all multi-select.
   Price used to sit here as a sort; sorting belongs to the column headers.
   Designations are gone until a line carries its own LPA, NCA and LNRS:
   today every line shares one of each, so the facet could not narrow anything. */
function facet(label, key, icon){
  return [label, [['ti-circle-dot','Any','any']].concat(
    vals(key).map(function(v){ return [icon, v, v]; })
  ), {multi:true}];
}
gyBar('abar', {
  search:  {placeholder:'Search by status, habitat or ref', oninput:function(v){ window.IQ=v; render(); }},
  filters: [
    facet('Availability',   'avail', 'ti-circle-check'),
    facet('Type / vintage', 'type',  'ti-leaf'),
    facet('Broad habitat',  'broad', 'ti-map-2'),
    facet('Distinctiveness','dist',  'ti-star'),
    facet('Condition',      'cond',  'ti-heart-rate-monitor'),
    facet('Site',           'site',  'ti-map-pin')
  ],
  onfilter: function(group, value){
    var key={'Availability':'avail','Type / vintage':'type','Broad habitat':'broad',
             'Distinctiveness':'dist','Condition':'cond','Site':'site'}[group];
    if(key) F[key]=value||[];
    render();
  },
  buttons: [{icon:'ti-settings', label:'Settings', onclick:'Settings: columns, defaults and who can edit this inventory'}],
  actions: [['label','Bulk'],
            ['ti-tag','Set prices','Set prices on the selected lines'],
            ['ti-adjustments','Set sales restrictions','Restrict who these lines can be sold to'],
            '-',
            ['ti-file-export','Export inventory','Export the current view as a spreadsheet'],
            ['ti-history','Audit log','go:audit-log.html']]
});
</script>
</body>
</html>
