/* ── editing and comments in the paged report (8 Oct) ── */
.csc{outline:none;border-radius:3px}
.csc,.csc:focus,.csc:hover{background:none !important;box-shadow:none !important;outline:none !important;border:none !important;cursor:text;caret-color:#1A0C12}
.csc:empty:before{content:attr(data-ph);color:#A39E93}
.csb.writing{padding:0}
.csb.sk .skl .csw{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid #E3DDCD;background:#fff;border-radius:999px;padding:2px 10px 2px 8px;font:inherit;font-size:11.5px;color:#3A3732;cursor:pointer;white-space:nowrap;flex:none}
.csb.sk .skl .csw:hover{border-color:#1A0C12;color:#1A0C12}
.csby{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#55514A;background:#EEF3FA;border-radius:10px;padding:1px 8px;margin:0 4px 6px 0}
mark.cscm{background:#F7EBC2;color:inherit;border-bottom:2px solid #DDBF5C;border-radius:2px;cursor:pointer;padding:0 1px}
mark.cscm.sug{background:#EAF1E4;border-bottom-color:#7BA05B}
mark.cscm.pending{background:#E6EEF8;border-bottom-color:#7AA2D6}
.cmbtn{position:fixed;z-index:1300;display:none;align-items:center;gap:6px;background:#1A0C12;color:#fff;border:none;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(26,12,18,.25)}
.cmbtn.on{display:inline-flex}
.cmpop{position:fixed;z-index:1300;display:none;width:300px;background:var(--card,#fff);border:1px solid #E3DDCD;border-radius:12px;box-shadow:0 12px 32px rgba(26,12,18,.18);padding:12px}
.cmpop.on{display:block}
.cmpop .chip{display:inline-flex;align-items:center;gap:6px;background:#EEF3FA;color:#1F5FA8;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:500}
.cmpop .chip .v8ava{width:16px;height:16px;font-size:10px}
.cmpop textarea{display:block;width:100%;box-sizing:border-box;border:none;outline:none;resize:none;font:inherit;font-size:14px;line-height:1.5;margin:8px 0;min-height:56px;background:transparent;color:var(--ink)}
.cmpop .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2,#55514A)}
.cmpop .row input{width:16px;height:16px;accent-color:#1F6FB2;margin:0}
.cmpop .row .send{margin-left:auto;width:30px;height:30px;border-radius:50%;border:none;background:#1A0C12;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cmq{border-left:3px solid #DDBF5C;padding:4px 10px;margin:4px 0 10px;font-size:14px;color:var(--ink)}
.cmq.old{text-decoration:line-through;color:var(--ink3);border-left-color:#E3DDCD}
.cmsug{border-left:3px solid #7BA05B;padding:4px 10px;margin:4px 0 10px;font-size:14px}
.cmacts{display:flex;gap:8px;margin-top:6px}
/* flat layout option (Thomas, 8 Oct): pages flush to the canvas edge, square corners, 10px between pages; the TOC stays on the grey canvas */
/* agent collapsed: the document takes the freed width instead of staying centred (8 Oct) */
body.pclosed.docview .v5body{max-width:none !important;margin-left:0 !important;margin-right:0 !important}
body.docview.flat .v5body{padding:0 !important;border-radius:0 !important;background:var(--bg) !important;box-shadow:none !important}
body.docview.flat .cspages{gap:10px !important}
body.docview.flat .v5panel{padding-top:0 !important}
body.docview.flat .cspages > .cspg:first-child{border-top:none !important}
body.docview.flat .cspg{box-shadow:none !important;border:1px solid #E9E4D8 !important;border-radius:0 !important}
body.docview.flat .v8docw .v8anc{margin-right:40px !important}
body.docview.flat .v8docw .v8anc a:hover{background:#F4F0E6 !important}
body.docview.flat .v8docw .v8anc a.on{background:#EFEBE1 !important}

/* review block, more outspoken (8 Oct): solid card, header band, primary CTA */
.v8wait{border:1px solid var(--line2);border-radius:16px;background:var(--card);padding:0;margin:16px 0;overflow:hidden;
  box-shadow:0 8px 24px rgba(26,12,18,.07)}
.v8waith{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--graybg);border-bottom:1px solid var(--line)}
.v8waith .pip{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;animation:gypip 1.5s ease-in-out infinite}
.v8waith .k{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.v8waith .ti{font-size:15px;color:var(--ink2)}
.v8wait .h{display:flex;align-items:flex-start;gap:10px;padding:15px 16px 4px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.v8wait .h .dlav{width:26px;height:26px;font-size:10px;flex:none;margin-top:0}
.v8wait .v8aopts{padding:12px 16px 16px}
.v8wait.done{box-shadow:none}
.v8wait.done .h{padding-bottom:15px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.v8waith .pip{animation:none}}

/* grouped Table of Contents */
body.docview .v8docw .v8anc .csgh{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink3);padding:12px 10px 4px;margin-left:-10px;cursor:pointer;text-align:left}
body.docview .v8docw .v8anc .csgh .ti{font-size:14px;transition:transform .15s;flex:none;width:16px}
body.docview .v8docw .v8anc .csgh:hover,body.docview .v8docw .v8anc .csg.has .csgh{color:var(--ink)}
body.docview .v8docw .v8anc .csg.open .csgh .ti{transform:rotate(90deg)}
body.docview .v8docw .v8anc .csg:not(.open) .csgb{display:none}
body.docview .v8docw .v8anc .csm:not(.cur) a.l2{display:none !important}
body.docview .v8docw .v8anc a.l2{padding-left:35px !important;font-size:13px !important}

/* group icons, chevron on the right, children indented (Thomas, 8 Oct) */
body.docview .v8docw .v8anc .csgh{font-size:13.5px !important;font-weight:600;color:var(--ink2);padding:6px 10px !important;margin-top:6px}
body.docview .v8docw .v8anc .csgh .gi{font-size:16px !important;width:16px;transform:none !important}
body.docview .v8docw .v8anc .csgh .cv{margin-left:auto;font-size:14px;width:14px;color:var(--ink3)}
body.docview .v8docw .v8anc .csg.open .csgh .gi{transform:none !important}
body.docview .v8docw .v8anc .csg.open .csgh .cv{transform:rotate(90deg)}
body.docview .v8docw .v8anc .csgb a{padding-left:30px !important}
body.docview .v8docw .v8anc .csgb a.l2{padding-left:55px !important}
/* no indent under the group rows (Thomas, 8 Oct): chapters line up with the group rows; sections line up with the chapter text, same size */
body.docview .v8docw .v8anc .csgb a{padding-left:10px !important}
body.docview .v8docw .v8anc .csgb a.l2{padding-left:35px !important;font-size:13.5px !important}
/* sections get an L icon in the chapter icon column; long names truncate (Thomas, 8 Oct) */
body.docview .v8docw .v8anc a,body.docview .v8docw .v8anc .csgh{min-width:0;max-width:100%;overflow:hidden}
body.docview .v8docw .v8anc a span,body.docview .v8docw .v8anc .csgh span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.docview .v8docw .v8anc .csgb a.l2{padding-left:10px !important}
body.docview .v8docw .v8anc a.l2 i{color:var(--ink3);opacity:.7}
/* group rows: a filled triangle in the icon column instead of an icon plus chevron (Thomas, 8 Oct) */
body.docview .v8docw .v8anc .csgh .cr{font-size:14px !important;width:16px;text-align:center;color:var(--ink3);transform:none;transition:transform .15s}
body.docview .v8docw .v8anc .csg.open .csgh .cr{transform:rotate(90deg) !important}

/* ── NatCap 101: the visual deck (8 Oct, v2). Brand palette from the GY presentation guidelines;
   illustrations are schematics on a dot grid, as on the In the Weeds heroes. ── */
.cspg.nsl{height:auto;min-height:360px;padding:22px 34px 30px;font-size:10.5px;line-height:1.5;color:#1C1A17;border-top:4px solid var(--ch)}
.cspages .cspg.nsl{scroll-margin-top:20px}
body.docview .cspages{gap:24px}
.nsl .nsltop{display:flex;align-items:center;margin-bottom:6px}
.nsl .nchap{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:.02em;color:#3A3732}
.nsl .nchap i{width:8px;height:8px;border-radius:50%;background:var(--ch)}
.nsl .nslt{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.2;color:#1A0C12;margin:0 0 12px;padding-right:90px}
.nsl .nslogo{position:absolute;top:22px;right:34px;height:12px}
.nsl .nslno{position:absolute;bottom:12px;right:34px;font-size:9.5px;color:#77736B}
.nsl .csb{margin:0 0 8px}
.nsl .csb .csi{left:-28px}
.nsl .csb.sk{margin-left:-10px;margin-right:-10px;padding:8px 10px}
.nsl .csb.sk .skl{font-size:10.5px;margin-bottom:6px}
.nsl .csb.sk .skl .sklt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nsl .csb.sk .skl .csw{font-size:10.5px;padding:1px 9px 1px 7px}
.nsl .csb.sk .skb{height:7px;margin:6px 0}
.nsl .csb p{margin:0 0 7px}
.nsl .csinj{font-size:9.5px;margin-bottom:6px}
.nsl .csinj.lib{background:#EEF3FA;color:#1F4E80}
.nsl .nsub{font-size:11.5px;color:#3A3732;max-width:88%}
.nsl .nlead{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.35;color:#1A0C12;margin:4px 0 10px}
.nsl .nquote{font-family:var(--serif);font-size:12px;line-height:1.45;color:#1A0C12;border-left:3px solid var(--ch);padding-left:10px}
.nsl .nsrc{font-size:9.5px;color:#55514A}
.nsl .nnote{font-size:10px;background:#FAEEDA;border-radius:6px;padding:5px 8px}
.nsl .nk{font-size:11px;font-weight:600;color:#1A0C12;margin:0 0 6px !important}
.nsl .nsl2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.nsl .nsl2.eq{grid-template-columns:1fr 1fr}
.nsl .nsl2.rev{grid-template-columns:1fr 1fr}
.nsl .nic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;flex:none;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.nsl .nic .ti{font-size:13px}
.nsl .nstat{display:flex;gap:8px;margin:0 0 8px}
.nsl .nstat > div{flex:1;background:color-mix(in srgb,var(--c,#3A3732) 10%,#fff);border-left:3px solid var(--c,#3A3732);border-radius:4px 6px 6px 4px;padding:6px 9px;min-width:0}
.nsl .nstat b{display:block;font-family:var(--serif);font-weight:500;font-size:15px;line-height:1.2;color:#1A0C12}
.nsl .nstat span{display:block;font-size:9.5px;line-height:1.35;color:#3A3732;margin-top:2px}
.nsl .nli{list-style:none;padding:0;margin:2px 0 8px}
.nsl .nli li{display:flex;align-items:center;gap:8px;margin:0 0 5px}
.nsl .nnum{counter-reset:n;list-style:none;padding:0;margin:8px 0 0}
.nsl .nnum li{counter-increment:n;position:relative;padding-left:24px;margin:0 0 5px}
.nsl .nnum li:before{content:counter(n);position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:#1A0C12;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
.nsl .ncards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.nsl .ncards > div,.nsl .nroute > div{display:grid;grid-template-columns:22px 1fr;column-gap:8px;row-gap:1px;background:#FBF9F3;border:1px solid #ECE7DB;border-radius:8px;padding:8px 10px}
.nsl .ncards .nic,.nsl .nroute .nic{grid-row:span 2}
.nsl .ncards b,.nsl .nroute b{font-size:10.5px;color:#1A0C12}
.nsl .ncards span,.nsl .nroute span{color:#3A3732;font-size:10px}
.nsl .nroute{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.nsl .nspecies{display:grid;grid-template-columns:1fr;gap:6px}
.nsl .nspecies > div{display:grid;grid-template-columns:22px 1fr;column-gap:8px;align-items:center;border-bottom:1px solid #ECE7DB;padding-bottom:5px}
.nsl .nspecies .nic{grid-row:span 2}
.nsl .nspecies b{font-size:10.5px;color:#1A0C12}
.nsl .nspecies span{font-size:9.5px;color:#55514A}
.nsl .nlogos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 12px}
.nsl .nlogos.sm{grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.nsl .nlg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:74px;background:#fff;border:1px solid #E3DDCD;border-radius:10px;padding:10px 8px}
.nsl .nlogos.sm .nlg{min-height:62px;padding:8px 6px}
.nsl .nlg b{font-size:11.5px;font-weight:600;line-height:1.25;color:#1A0C12}
.nsl .nlg span{font-size:9px;color:#77736B}
.nsl .nlg img{max-width:96%;max-height:46px;object-fit:contain}
.nsl .nlg.tall{min-height:150px;gap:8px}
.nsl .nlg.tall .nic{width:36px;height:36px;border-radius:10px;margin-bottom:6px}
.nsl .nlg.tall .nic .ti{font-size:19px}
.nsl .nlogos.sm .nlg b{font-size:10px}
.nsl .nconf{display:inline-flex;align-items:center;gap:5px;background:#FBEFD9;color:#7A4A0C;border-radius:6px;padding:3px 9px;font-size:10px;font-weight:600}
.nsl .nbar{margin:14px 0 14px}
.nsl .nbt{max-width:200px}
.nsl .nbtrack{display:flex;gap:3px;height:58px;margin-top:6px}
.nsl .nbtrack span{display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-radius:6px;color:#fff;font-size:10px}
.nsl .nbtrack b{font-family:var(--serif);font-weight:500;font-size:16px;color:#fff}
.nsl .nleg{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:6px}
.nsl .nleg span{display:flex;align-items:center;gap:7px;font-size:10px;line-height:1.25}
.nsl .nwheel{position:relative;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto}
.nsl .nwheel svg{position:absolute;inset:0;width:100%;height:100%}
.nsl .nwc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--serif);font-weight:500;font-size:13px;line-height:1.15;color:#1A0C12}
.nsl .nwi{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:1.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center}
.nsl .nwi .ti{font-size:15px}
/* the schematic illustrations */
.nsl svg.nil{display:block;width:100%;height:auto;overflow:visible}
.nil .g{fill:#B9B4A9;opacity:.5}
.nil .o{fill:#fff;stroke:#3A3732;stroke-width:1.4;stroke-linejoin:round}
.nil .ye{fill:#F9DD5A}
.nil .ln{fill:none;stroke:#3A3732;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.nil .ln2{fill:none;stroke:#8C877C;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.nil .ar{fill:#8C877C}
.nil .ink{fill:#3A3732}
.nil .rv{fill:none;stroke:#1F6FB2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nil .ct{fill:none;stroke:#C9C2B2;stroke-width:1;stroke-dasharray:3 3}
.nil .dr{fill:none;stroke:#7A6248;stroke-width:1.6;stroke-dasharray:5 3;stroke-linecap:round}
.nil .rt{fill:none;stroke:#6B5B3E;stroke-width:1.2;stroke-linecap:round}
.nil .gs{fill:none;stroke:#628147;stroke-width:1.3;stroke-linecap:round}
.nil .bd{fill:none;stroke:#3A3732;stroke-width:1.3;stroke-dasharray:6 4;stroke-linejoin:round}
.nil .frame{fill:#FBF9F3;stroke:#DDD8CC;stroke-width:1.2}
.nil .ring{fill:none;stroke:#C9C2B2;stroke-width:1.2;stroke-dasharray:4 4}
.nil .mk{fill:#1A0C12}
.nil .mkt{fill:#fff;font:600 9.5px var(--sans)}
.nil text{font-family:var(--sans);fill:#1C1A17}
.nil .nm{font-size:10.5px;font-weight:600}
.nil .sb{font-size:9.5px;fill:#55514A}
.nil .hx{font-size:11px;font-weight:700}
.nil .pl rect{fill:#fff;stroke:#DDD8CC;stroke-width:1}
.nil .pl text{font-size:10px;fill:#3A3732}
.nil .pl.st rect{fill:#1A0C12;stroke:#1A0C12}
.nil .pl.st text{fill:#fff;font-weight:600}
/* the cover: brand landscape behind, warm white wash for legibility */
.cspg.nsl.cover{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;padding:34px 40px 22px;border-top:none;
  background:linear-gradient(90deg,rgba(254,250,236,.96) 0%,rgba(254,250,236,.86) 42%,rgba(254,250,236,.18) 78%),url('gy-bg-projects.jpg') center/cover}
.nsl.cover .ncov{display:flex;flex-direction:column;align-items:flex-start}
.nsl.cover .ncl{width:84px;margin-bottom:44px}
.nsl.cover .nct{font-family:var(--serif);font-weight:500;font-size:25px;letter-spacing:-.01em;color:#1A0C12;max-width:60%;line-height:1.15}
.nsl.cover .ncs{font-family:var(--serif);font-weight:400;font-size:16px;color:#1A0C12;margin-top:6px}
.nsl.cover .ncd{margin-top:14px;color:#3A3732;font-size:11px}
.nsl.cover .nfca{font-size:8px;line-height:1.45;color:#3A3732;margin-top:30px;max-width:56%}
/* the key message slide: Green, warm white text */
.cspg.nsl.key{background:#628147;border-top:none;color:#FEFAEC}
.nsl.key .nchap,.nsl.key .nslt,.nsl.key .nslno{color:#FEFAEC}
.nsl.key .nchap i{background:#F9DD5A}
.nsl.key .nslogo{filter:brightness(0) invert(1)}
.nsl.key .nkm{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.2;color:#FEFAEC;max-width:82%;margin:26px 0 30px !important}
.nsl.key .nkm em{font-style:normal;border-bottom:3px solid #F9DD5A}
.nsl.key .nkr{display:flex;gap:10px}
.nsl.key .nkr span{flex:1;border-top:1px solid rgba(254,250,236,.5);padding-top:8px;font-size:10.5px;color:#FEFAEC}
.nsl.key .nkr b{display:block;font-size:11.5px;color:#FEFAEC}
.nsl.key .csb.sk{border-color:rgba(254,250,236,.4)}
.nsl.key .csb.sk .skl{color:#FEFAEC}
.v8out .pg.ncthumb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:18px 20px;aspect-ratio:16/9;height:auto;cursor:pointer;text-align:left;
  background:linear-gradient(90deg,rgba(254,250,236,.96) 0%,rgba(254,250,236,.8) 55%,rgba(254,250,236,.2) 100%),url('gy-bg-projects.jpg') center/cover}
.v8out .pg.ncthumb img{width:40px;margin-bottom:14px}
.v8out .pg.ncthumb .nt{font-family:var(--serif);font-weight:500;font-size:15px;line-height:1.25;color:#1A0C12;max-width:70%}
.v8out .pg.ncthumb .ns{font-size:12px;color:#3A3732}

/* the Slides sidebar can be dragged wider or narrower (8 Oct) */
body.docview .v8docw .v8anc{width:var(--tocw,244px) !important;min-height:calc(100vh - 220px);box-sizing:border-box;padding:30px !important;margin-left:0 !important;margin-right:0 !important}
body.docview .v5body{padding-right:0 !important}
body.docview.flat .v8docw .v8anc.v8anc,body.docview .v8docw .v8anc.v8anc{margin-right:0 !important}
body.docview .v8docw .v8anc a,body.docview .v8docw .v8anc .csgh{margin-right:0 !important;max-width:none !important}
body.docview .v8docw .v8anc .tocgrip{display:block;position:absolute;top:0;bottom:0;left:-4px;width:9px;cursor:col-resize;z-index:5}
body.docview .v8docw .v8anc .tocgrip:after{content:'';position:absolute;top:0;bottom:0;left:3px;width:3px;border-radius:2px;background:transparent;transition:background .12s}
body.docview .v8docw .v8anc .tocgrip:hover:after,body.tocdrag .v8docw .v8anc .tocgrip:after{background:var(--line2)}
body.tocdrag{cursor:col-resize;user-select:none}
/* fill to here: the step circle in Workflow is a button (8 Oct) */
.v8ws .mk{cursor:pointer;transition:box-shadow .12s}
.v8ws .mk:hover{box-shadow:0 0 0 4px rgba(26,12,18,.12)}

/* cover: logo, title and FCA wording are fixed by the Blueprint, so they show from the start; only the audience line waits for 1.1 */
.nsl.cover .ncov .csb{margin:12px 0 0;width:62%}
.nsl.cover .ncov .csb .ncd{margin-top:0}
.nsl.cover .csb.sk{background:rgba(254,250,236,.7)}

/* the generated PDF in Outputs is landscape (8 Oct) */
.v8out .pg.cov.nccov{aspect-ratio:16/9;background:#FEFAEC}
</style>

var EDITS = {}, HUMAN = {}, EDITED = {}, LASTHTML = {}, WRITING = null, DOCPEND = false;

document.addEventListener('focusout', function(e){
  var el = e.target; if(!el || !el.classList || !el.classList.contains('csc')) return;

  var k = el.dataset.k, html = el.innerHTML.trim(), text = el.textContent.trim(), t = SRC[k].t;

  setTimeout(function(){ if(!docBusy() && TAB === 'doc'){ DOCPEND = false; openTab('doc', true); } }, 0);
});

/* a simple rule-based rewrite for the sketch: shorter and or plainer */
function rewrite(q, msg){
  var m = msg.toLowerCase(), t = q;
  var plain = /simpl|plain|jargon|clear|understand|easier|layman|landowner/.test(m), short = /short|concise|tight|brief|less|trim|cut|wordy/.test(m);
  if(!plain && !short){ plain = short = true; }
  if(short){
    t = t.replace(/\s*\([^)]*\)/g, '').replace(/\b(really|very|also|just|actually|both|already|currently)\s+/gi, '');
    var ss = t.match(/[^.!?]+[.!?]+/g); if(ss && ss.length > 2) t = ss.slice(0, 2).join('');
    t = t.replace(/,\s*(which|and)\s+[^,.]*(?=\.)/, '');
  }
  if(plain){
    [['dissolved organic carbon','brown water'],['\\bDOC\\b','brown water'],['\\bMRV\\b','measurement'],['monetisable','sellable'],['abstracts from','takes water from'],
     ['abstraction','water taking'],['co-funded by','part-funded by'],['co-funding','part-funding'],['indicative','rough'],['landscape-scale','large-scale'],
     ['landscape scale','large scale'],['sequestering','storing'],['interventions','planned work'],['additionality','extra impact'],['stacking','combining'],['bilateral','one-to-one']]
      .forEach(function(p){ t = t.replace(new RegExp(p[0], 'gi'), function(w){ return /^[A-Z]/.test(w) && !/^[A-Z]+$/.test(w) ? p[1].charAt(0).toUpperCase()+p[1].slice(1) : p[1]; }); });
  }
  return t.replace(/\s{2,}/g, ' ').trim();
}

  if(DR === 'agent') openAgent(id);
}

/* ── tabs and panels ───────────────────────────────────────────────────── */
var TABS = [['doc','ti-file-text','Document'],['workflow','ti-hierarchy-2','Workflow'],['activity','ti-activity','Activity'],['settings','ti-settings','Settings']];
var DRAWERS = [['outputs','ti-package','Outputs','']];
var TAB = 'doc', DR = null;
function paintTabs(){
  var shut = document.body.classList.contains('pclosed');
  document.getElementById('tabs').innerHTML =
    '<button class="v8agt'+(shut?'':' on')+'" onclick="toggleChat()" title="'+(shut?'Show':'Hide')+' the agent">'
      + '<span class="v8ava'+(BUSY?' live':'')+'" id="agtav"><i class="ti '+AGENT_IC+'"></i></span>Agent</button>'
    + '<span class="v5tdiv"></span>'
    + '<div class="v5tabgrp">' + TABS.map(function(t){
        var badge = t[0]==='workflow' ? DONE.length+'/'+stepList().length : '';
        return '<button class="v5tab'+(TAB===t[0]?' on':'')+'" onclick="openTab(\''+t[0]+'\')">'
          + '<i class="ti '+t[1]+'"></i><span class="lb">'+t[2]+'</span>'+(badge?'<b>'+badge+'</b>':'')+'</button>';
      }).join('') + '</div>'
    + '<div class="v5drgrp">' + DRAWERS.map(function(d){
        return '<button class="v5tab dr'+(DR===d[0]?' on':'')+'" onclick="openDrawer(\''+d[0]+'\')">'
          + '<i class="ti '+d[1]+'"></i><span class="lb">'+d[2]+'</span>'+(isDone('4.3')?'<b>1</b>':'')+'</button>';
      }).join('') + '</div>';
}
function openTab(k, keep){
  if(k === 'doc' && keep && TAB === 'doc' && docBusy()){ DOCPEND = true; return; }
  if(k !== 'workflow' && DR === 'step') closeDrawer();
  TAB = k; paintTabs();
  var el = document.getElementById('pbody');
  var sc = el.parentNode.scrollTop;
  el.classList.remove('wide');
  el.innerHTML = VIEWS[k]();
  document.body.classList.toggle('docview', k === 'doc');
  if(k === 'doc') paginate();
  el.parentNode.scrollTop = keep ? sc : 0;
}
function paintAll(){ paintTabs(); paintProg(); openTab(TAB, true);
  if(DR === 'outputs') document.getElementById('drbody').innerHTML = VIEWS.outputs(); }
function scrollDoc(k){
  if(TAB !== 'doc') return;
  var map = {'1.1':'sl-cover','2.2':'sl-peat','2.3':'sl-bngd','3.1':'sl-unlock','3.2':'sl-peat','3.3':'sl-buyers','4.1':'sl-peat','4.2':'sl-nfm'};
  var id = map[k]; if(!id) return;
  var s = document.getElementById(id); if(s) s.scrollIntoView({behavior:'smooth', block:'start'});
}
function toggleChat(){
  document.body.classList.toggle('pclosed');
  paintTabs();
}
function openDrawer(k){
  if(DR === k) return closeDrawer();
  DR = k;
  var d = DRAWERS.filter(function(x){ return x[0]===k; })[0];
  document.getElementById('dricon').className = 'v5dri hide';
  document.getElementById('drtitle').textContent = d[2];
  document.getElementById('drbody').innerHTML = VIEWS[k]();
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
  if(TAB === 'workflow') openTab('workflow', true);
}
function closeDrawer(){
  var wasStep = DR === 'step';
  var wasSrc = DR === 'src';
  DR = null; STEPSEL = null; SRCSEL = null;
  document.getElementById('drawer').classList.add('hide');
  document.getElementById('dricon').style.borderRadius = '';
  paintTabs();
  if(wasStep && TAB === 'workflow') openTab('workflow', true);
  if(wasSrc && TAB === 'doc') openTab('doc', true);
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(STEPSEL) closeStep(); else closeDrawer(); } });
function runReset(){
  if(T){ clearTimeout(T); T = null; }
  location.reload();
}
function sendMsg(){
  var inp = document.getElementById('ask'); var v = (inp.value||'').trim();
  if(!v) return;
  inp.value = '';
  var id = addSide([['Caitlin Ciceri', v, null]], '', null);
  var g = SIDE[id]; g.live = true; paintChat();
  setTimeout(function(){
    g.x[g.x.length-1][2] = 'In this sketch I cannot answer free questions yet. Nothing in the document changed, so for the others this folds into one line.';
    paintChat();
    setTimeout(function(){ g.live = false; paintChat(); }, 2600);
  }, 700);
}
function crExpand(){
  document.getElementById('crtrail').classList.add('on');
  document.getElementById('crmore').classList.add('hide');
}
document.addEventListener('paste', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[contenteditable]') : null;
  if(!t) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
/* chat width, as in v4-chat */
var CHAT_MIN = 340, CHAT_MAX = 680;
(function(){
  var w = 0;
  try{ w = parseInt(localStorage.getItem('gyChatW8') || '', 10) || 0; }catch(e){}
  if(w) document.body.style.setProperty('--chatw', Math.max(CHAT_MIN, Math.min(CHAT_MAX, w)) + 'px');
  var grip = document.getElementById('chatgrip'), chat = document.querySelector('.v5chat');
  if(!grip || !chat) return;
  grip.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var x0 = e.clientX, w0 = chat.getBoundingClientRect().width;
    document.body.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    function move(ev){
      var room = document.querySelector('.v5row').getBoundingClientRect().width - 420;
      var nx = Math.max(CHAT_MIN, Math.min(Math.min(CHAT_MAX, room), w0 + (ev.clientX - x0)));
      document.body.style.setProperty('--chatw', Math.round(nx) + 'px');
    }
    function up(){
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up);
      document.body.classList.remove('dragging');
      try{ localStorage.setItem('gyChatW8', String(Math.round(chat.getBoundingClientRect().width))); }catch(e){}
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
})();
/* drag the Slides sidebar: its left edge trades width with the deck, remembered per browser */
(function(){
  var MIN = 210, MAX = 440;
  try{ var w = parseInt(localStorage.getItem('gyTocW') || '', 10); if(w) document.body.style.setProperty('--tocw', Math.max(MIN, Math.min(MAX, w)) + 'px'); }catch(e){}
  document.addEventListener('pointerdown', function(e){
    var g = e.target.closest && e.target.closest('.tocgrip'); if(!g) return;
    e.preventDefault();
    var nav = g.parentNode, x0 = e.clientX, w0 = nav.getBoundingClientRect().width;
    document.body.classList.add('tocdrag'); g.setPointerCapture(e.pointerId);
    function move(ev){ var nw = Math.max(MIN, Math.min(MAX, w0 + (x0 - ev.clientX))); document.body.style.setProperty('--tocw', Math.round(nw) + 'px'); fitPages(); }
    function up(){ g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); document.body.classList.remove('tocdrag');
      try{ localStorage.setItem('gyTocW', String(Math.round(nav.getBoundingClientRect().width))); }catch(err){} fitPages(); }
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
  });
})();
/* the sidebar opens on the collapsed icon rail here: GYNAV.rail in gy-nav.js */

/* opening state: the agent introduces itself and asks the first question */
act('Caitlin Ciceri','start','Created the deliverable from the NatCap 101 Presentation Blueprint v0.1');
act('ai','start','Pre-filled 4 slides from Customer Demand Mapping');
LOG.push(say('I am set up for <b>Walkham Valley</b> from the NatCap 101 Presentation Blueprint: seventeen steps, two decisions. I pre-filled the project vision, BNG demand, downstream flood risk and water consent holders from the finished Customer Demand Mapping. Library slides land at 3.1 and programme slides at 3.2. Click any grey block to see where it comes from or write it yourself, and select text to leave me a comment.'));
LOG.push(dmCard());
BI = 0;
Q = {t:'start'};
paintTabs(); paintProg(); openTab('doc'); paintChat();
/* ── fill to here (8 Oct): click a step's circle in Workflow and the run fast-forwards to the end of
   that step, taking the recommended answer at every question, decision and review, then pauses. ── */
var FF = null, FFSP = null;
function ffTo(k){
  if(FF) return;
  if(isDone(k)){ gyToast('Step '+k+' is already done. Restart the run from the page menu to go back.'); return; }
  FF = k; FFSP = {say:SP.say, item:SP.item, settle:SP.settle, con:SP.con};
  SP.say = SP.item = SP.settle = SP.con = 0;
  if(Q && Q.t === 'ff'){ Q = null; }
  if(!Q && !T && S[BI] && S[BI].t !== 'end') run();
  ffPump();
}
function ffPump(){
  if(!FF) return;
  if(S[BI-1] && S[BI-1].t === 'end' && !Q){ ffRestore(); return; }
  if(Q){
    if(Q.t === 'start') startDeliverable();
    else if(Q.t === 'ask') answer(0);
    else if(Q.t === 'dec') decide(0);
    else if(Q.t === 'wait') reply();
  }
  setTimeout(ffPump, 15);
}
function ffRestore(){ if(FFSP){ SP.say = FFSP.say; SP.item = FFSP.item; SP.settle = FFSP.settle; SP.con = FFSP.con; } FFSP = null; FF = null; }
var ffRun0 = run;
run = function(){
  if(FF && isDone(FF)){
    var k = FF; T = null; BUSY = false; ffRestore();
    LOG.push(say('Filled the document up to step <b>'+k+'</b>, taking the recommended answer at each question and decision. I paused here.'));
    Q = {t:'ff'}; paintAll(); paintChat(); return;
  }
  ffRun0();
};
function ffResume(){ if(!Q || Q.t !== 'ff') return; Q = null; paintChat(); run(); }
var ffPaint0 = paintChat;
paintChat = function(keep){
  ffPaint0(keep);
  if(Q && Q.t === 'ff'){
    var el = document.getElementById('chatin');
    el.insertAdjacentHTML('beforeend', '<div class="v8start"><button class="v8aopt pri" onclick="ffResume()"><i class="ti ti-player-play"></i><span>Continue the run</span></button></div>');
    var lg = document.getElementById('chatlog'); if(lg && !keep) lg.scrollTop = lg.scrollHeight;
  }
};
document.addEventListener('click', function(e){
  var m = e.target.closest && e.target.closest('.v8ws .mk'); if(!m) return;
  e.stopPropagation(); e.preventDefault();
  var no = m.parentNode.querySelector('.no'); if(no) ffTo(no.textContent.trim());
}, true);
</script>
