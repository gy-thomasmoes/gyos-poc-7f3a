<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --line:#ECE7DB; --line2:#DED8CA;
  --ink:#1A0C12; --ink2:#766B62; --ink3:#A79E8D;
  --green:#628147; --greenbg:#EAF1DE; --greend:#3F5A2B;
  --amber:#B75A40; --amberbg:#F7E7DE; --amberd:#8A3F28;
  --blue:#3B82F6; --bluebg:#E6F1FB; --blued:#185FA5;
  --teal:#1D9E75; --tealbg:#E1F5EE; --teald:#0F6E56;
  --graybg:#F3EFE1; --grayd:#5F5E5A; --red:#E24B4A; --dark:#1A0C12;
  --gyNature:#628147; --gyCapital:#215274; --gyTrade:#B75A40; --gyProg:#333333;
  --serif:'Manner','Spectral',Georgia,serif; --sans:-apple-system,system-ui,"Inter","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:row;overflow:hidden;font-size:16px;--nav:264px}
body.navhid{--nav:0px}
.snav{position:relative;width:var(--nav);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 12px 16px;overflow-y:auto}
.snavgrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.sarr{margin-left:auto;font-size:14px;color:var(--ink3);transition:transform .15s;padding:2px;border-radius:5px}
.sarr:hover{background:rgba(31,31,29,.08)}
.ssub{margin:2px 0 4px 30px}
.ssub .sitem{font-size:14.5px;padding:6px 10px;color:var(--ink2)}
.ssub .sitem.on{color:var(--ink)}
.ssub.closed{display:none}
.sarr.closed{transform:rotate(-90deg)}
body.navhid .snav{display:none}
.sworks{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.sworks .wtile{width:30px;height:30px;border-radius:9px;background:#F9DD5A;color:#1A0C12;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sworks b{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:4px;color:var(--ink)}
.sworks .ti{font-size:15px;color:var(--ink3)}
.scollapse{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scollapse:hover{background:var(--graybg);color:var(--ink)}
.scollapse .ti{font-size:17px}
.sitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:1px}
.sitem .ti{font-size:17px;color:var(--ink2)}
.sitem:hover{background:#F3F2EE}
.sdiv{height:1px;min-height:1px;flex:none;background:#E3E1DB;margin:8px 6px}
.scount{margin-left:auto;font-size:12px;font-weight:600;background:#EFEDE8;color:var(--ink2);border-radius:999px;padding:1px 8px;display:none;line-height:1.5}
.sitem.on{background:var(--graybg);font-weight:500}
.mainc{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.row1{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);height:61px;box-sizing:border-box}
.title{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb{color:var(--ink3);cursor:pointer;font-size:16px}
.crumb:hover{color:var(--ink2)}
.sep{color:var(--ink3);font-size:14px}
.spacer{flex:1}
.chip{font-size:15px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}

/* ── cockpit ── */
.scroll{flex:1;overflow:auto}
.wrap{max-width:1060px;margin:0 auto;padding:34px 32px 60px}
.grt{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.grt-h{font-size:27px;font-weight:700;letter-spacing:-.015em}
.grt-sub{font-size:14.5px;color:var(--ink3);margin-top:4px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-size:14.5px;color:var(--ink3);min-width:320px;cursor:pointer}
.search:hover{border-color:var(--line2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.01em}
.stat .l{font-size:13.5px;color:var(--ink2);margin-top:3px}
.sectitle{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em;color:var(--ink);margin:38px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.sectitle small{font-family:var(--sans);font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink3)}
/* book tiles, from the Lifecycle Map overview sketch */
.books{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.book{position:relative;aspect-ratio:5/7;display:flex;flex-direction:column;justify-content:space-between;border-radius:3px 8px 8px 3px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 9px rgba(0,0,0,.10),inset 4px 0 0 rgba(0,0,0,.16);padding:16px 15px 15px 20px;color:#fff}
.book::before{display:none}
.book:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 18px rgba(0,0,0,.12),inset 4px 0 0 rgba(0,0,0,.22)}
.book.sel{outline:2.5px solid var(--ink);outline-offset:2px}
.book-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;line-height:1}
.book-ic i{font-size:21px;color:#fff}
.book-title{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.15;letter-spacing:-.01em;margin-top:13px}
.book-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.book-vol{font-size:15px;font-weight:600;line-height:1.15}
.book-vol small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}
.bchip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.22)}
/* deliverable rows */
.drow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.drow:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(31,31,29,.06)}
.dic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.dname{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.dmeta{font-size:13.5px;color:var(--ink3);margin-top:2px}
.dchip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chvw{color:var(--ink3);font-size:16px}
/* two-column lower */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.pcard-h{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.act{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid #F3F0E7;font-size:14px}
.act:first-of-type{border-top:none;padding-top:4px}
.act .pill{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.act .mid{flex:1;min-width:0;line-height:1.45}
.act .mid b{font-weight:600}
.act .mid span{color:var(--ink2)}
.act .time{font-size:12.5px;color:var(--ink3);white-space:nowrap}
/* ── drawer (identical language to the canvas drawers) ── */
.drawer{position:fixed;top:75px;right:12px;bottom:12px;width:424px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(31,31,29,.12);z-index:40;display:none;overflow:auto}
.sh{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:#fff;padding:16px 20px 12px;min-height:59px;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.sh .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sh .nt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sh .ns{font-size:13px;color:var(--ink3);margin-top:1px}
.sh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sh .x:hover{background:var(--graybg);color:var(--ink)}
.sbody{padding:14px 20px 18px}
.sbody>.flabel:first-child{margin-top:0}
.flabel{font-size:13.5px;color:var(--ink2);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.flabel .vx{font-size:12px;color:var(--ink3);font-family:ui-monospace,Menlo,monospace}
.pt{font-size:15px;line-height:1.6;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:#F7F6F3;border:1px solid #EFEDE8;border-radius:10px;padding:11px 13px;font-size:13.5px}
.rgrid span b{float:right;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#fff;font-size:14.5px;padding:11px 18px;border-radius:12px;transition:transform .25s;z-index:99;max-width:70vw}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.books{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}

/* warm/Manner titles */
:root{--serif:'Manner','Spectral',Georgia,serif}
.title{font-weight:600}
.grt-h{font-family:var(--serif);font-weight:500}
</style>
</head>

 dyn:['Emerging through bundled conversations with corporates such as Lidl, AstraZeneca and Nestlé'],
 uk:[],
 risks:['No rule book yet: built per buyer, logged here as signals accumulate']}
];

const ICMAP={carbon:'ti-leaf',bng:'ti-plant-2',volbio:'ti-paw',nn:'ti-molecule',nfm:'ti-cloud-rain',wq:'ti-droplet',rm:'ti-ripple',scr:'ti-truck'};
let SEL=null;
function renderBooks(){
  document.getElementById('books').innerHTML=ESDATA.map(e=>`
  <div class="book${SEL===e.id?' sel':''}" style="background:${e.col}" onclick="openES('${e.id}')">
    <div><span class="book-ic"><i class="ti ${ICMAP[e.id]||'ti-leaf'}"></i></span>
      <div class="book-title">${e.name}</div></div>
    <div class="book-foot">
      <div class="book-vol">${e.vol}<small>${e.volsub}</small></div>
    </div>
  </div>`).join('');
}
function openES(id){
  if(id==='carbon'){location.href='carbon-rule-book.html';return;}
  location.href='es-rule-book.html?es='+id;return;
  SEL=id;renderBooks();
  const e=ESDATA.find(x=>x.id===id);
  const li=t=>`<div class="pt" style="display:flex;gap:8px;margin-top:6px"><span style="color:var(--ink3);flex:none">·</span><span>${t}</span></div>`;
  const dot=v=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${RCOL[v]};margin-right:7px"></span>`;
  const ready=e.ready?`<div class="flabel">Market readiness <span class="vx">9 categories · GY methodology</span></div>
    <div class="rgrid">${Object.entries(e.ready).map(([k,v])=>`<span title="${(CATDEF[k]||'').replace(/"/g,'&quot;')}" style="cursor:help">${dot(v)}${k}<b style="color:${RCOL[v]}">${RLAB[v]}</b></span>`).join('')}</div>
    <div class="pt" style="font-size:12.5px;color:var(--ink3);margin-top:7px">Hover a category for its definition. Scored <span style="color:${RCOL.g}">●</span> active · <span style="color:${RCOL.o}">●</span> emerging · <span style="color:${RCOL.r}">●</span> nascent, per the GY Market Readiness Assessment (triangulating registry hard data, intermediary intelligence and GY deal-pipeline insight).</div>`
    :`<div class="flabel">Market readiness</div><div class="pt" style="color:var(--ink3)">Too nascent or bespoke to assess against the nine-category framework. Sized per opportunity.</div>`;
  const d=document.getElementById('drawer');
  d.innerHTML=`<div class="sh">
    <div class="ic" style="background:#F7F6F3;font-size:19px">${e.em}</div>
    <div style="flex:1"><div class="nt">${e.name}</div><div class="ns">Rule book · refreshed Oct 2025 · NatWest Markets Report</div></div>
    <button class="x" onclick="closeES()" aria-label="Close"><i class="ti ti-x"></i></button></div>
  <div class="sbody">
    <div class="flabel">About <span class="vx">static</span></div><div class="pt">${e.about}</div>
    <div class="flabel">How we sell it <span class="vx">static</span></div><div class="pt">${e.mon}</div>
    ${ready}
    ${e.sizing?`<div class="flabel">Sizing method <span class="vx">GY Market Sizing Methodology</span></div><div class="pt">${e.sizing}</div>`:''}
    <div class="flabel">Market dynamics <span class="vx">dynamic · refresh ~3 months</span></div>${e.dyn.map(li).join('')}
    ${e.uk.length?`<div class="flabel">UK signals <span class="vx">dynamic</span></div>${e.uk.map(li).join('')}`:''}
    <div class="flabel">Market risks</div>${e.risks.map(li).join('')}
    <div class="flabel">Sources and data tiers <span class="vx">hard vs soft</span></div>
    ${li('Registries — DEFRA BNG, Gaia, WCC, PCC · hard data · <b>gold</b>')}
    ${li('Market data — World Bank, ICE, EEX, Forest Research · hard data · <b>silver</b>')}
    ${li('Intermediary intelligence — Earthly, Patch, Swallowtail · soft data · <b>bronze</b>')}
    ${li('NatWest Markets Report (Caitlin + Harry) · <b>gold</b>')}
    ${li('Trade team and buyer signals · logged by Qualitative research · <b>gold</b>')}
    <div style="background:#F7F6F3;border:1px solid #EFEDE8;border-radius:10px;padding:11px 13px;margin-top:16px;font-size:13.5px;color:var(--ink2)">Read by <b>Desktop research</b> in every Demand Mapping run · readiness scored and market sized per the GY methodology · stale pages are flagged, never silently used</div>
  </div>`;
  d.style.display='block';
}
function closeES(){SEL=null;renderBooks();document.getElementById('drawer').style.display='none'}

/* deliverables under the Library */
const DELS=[
 {em:'🗺',bg:'var(--greenbg)',name:'Demand Mapping',meta:'Nature Advisory · reads 8 rule books · writes evidence packs back',chip:['Live','var(--greenbg)','var(--greend)'],go:()=>location.href='demand-mapping-canvas-prototype.html'},
 {em:'💬',bg:'var(--bluebg)',name:'Investor Q&A Log',meta:'Capital · reads the Answer Library · writes canonical answers back',chip:['Live','var(--greenbg)','var(--greend)'],go:()=>location.href='investor-qa-log-canvas-prototype.html'},
 {em:'📊',bg:'var(--graybg)',name:'Market Readiness',meta:'The NatWest report as a recurring Deliverable · would refresh these rule books automatically',chip:['Concept','var(--amberbg)','var(--amberd)'],go:()=>toast('Market Readiness Assessment is not in this prototype yet')},
 {em:'📈',bg:'var(--graybg)',name:'Financial Model',meta:'Builds on Demand Mapping evidence packs',chip:['Concept','var(--amberbg)','var(--amberd)'],go:()=>toast('Financial Model is not in this prototype yet')},
 {em:'🧭',bg:'var(--graybg)',name:'Commercial Strategy',meta:'Builds on the shortlist and buyer map',chip:['Concept','var(--amberbg)','var(--amberd)'],go:()=>toast('Commercial Strategy is not in this prototype yet')}
];
document.getElementById('dels').innerHTML=DELS.map((d,i)=>`
 <div class="drow" onclick="DELS[${i}].go()">
   <span class="dic" style="background:${d.bg}">${d.em}</span>
   <div style="flex:1;min-width:0"><div class="dname">${d.name}</div><div class="dmeta">${d.meta}</div></div>
   <span class="dchip" style="background:${d.chip[1]};color:${d.chip[2]}">${d.chip[0]}</span>
   <i class="ti ti-chevron-right chvw"></i>
 </div>`).join('');

renderBooks();
(function(){var p=new URLSearchParams(location.search).get('es');if(p&&p!=='carbon'&&ESDATA.find(x=>x.id===p))openES(p);})();
</script>
</body>
