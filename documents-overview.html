<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">

<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --line:#E3E1DB; --line2:#CFCDC5;
  --ink:#1F1F1D; --ink2:#6B6A64; --ink3:#9C9A92;
  --green:#639922; --greenbg:#EAF3DE; --greend:#27500A;
  --amber:#EF9F27; --amberbg:#FAEEDA; --amberd:#854F0B;
  --blue:#378ADD; --bluebg:#E6F1FB; --blued:#185FA5;
  --teal:#1D9E75; --tealbg:#E1F5EE; --teald:#0F6E56;
  --graybg:#F1EFE8; --grayd:#5F5E5A; --dark:#1F1F1D;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px}
.topbar{height:61px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .ti{font-size:19px;color:var(--ink2)}
.title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.spacer{flex:1}
.shell{display:flex;height:100vh;overflow:hidden}
.snav{position:relative;width:var(--nav,264px);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 12px 16px}
.snavgrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.snavgrip:hover,.snavgrip.on{background:rgba(31,31,29,.08)}
.sarr{margin-left:auto;font-size:14px;color:var(--ink3);transition:transform .15s;padding:2px;border-radius:5px}
.sarr:hover{background:rgba(31,31,29,.08)}
.ssub{margin:2px 0 4px 30px}
.ssub .sitem{font-size:14.5px;padding:6px 10px;color:var(--ink2)}
.ssub .sitem.on{color:var(--ink)}
.ssub.closed{display:none}
.sarr.closed{transform:rotate(-90deg)}
.snav.hid{display:none}
.snavpeek{position:fixed;top:0;left:0;width:14px;height:100vh;z-index:44;display:none}
body.navpeek .snav.hid{display:flex;position:fixed;left:0;top:10px;bottom:10px;width:264px;z-index:45;border:1px solid var(--line);border-radius:0 14px 14px 0;box-shadow:0 12px 40px rgba(31,31,29,.18);animation:snavslide .16s ease}
@keyframes snavslide{from{transform:translateX(-100%)}to{transform:none}}
.sworks{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.sworks .wtile{width:30px;height:30px;border-radius:9px;background:#F9DD5A;color:#1A0C12;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sworks b{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:4px}
.sworks .ti{font-size:15px;color:var(--ink3)}
.scollapse{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scollapse:hover{background:var(--graybg);color:var(--ink)}
.sitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:1px}
.sitem .ti{font-size:17px;color:var(--ink2)}
.sitem:hover{background:#F3F2EE}
.sdiv{height:1px;min-height:1px;flex:none;background:#E3E1DB;margin:8px 6px}
.sitem.on{background:var(--graybg);font-weight:500}
.mainc{flex:1;overflow:auto;min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px}
@media(max-width:900px){.wrap{padding:32px 22px 90px}}

/* warm/Manner titles */
:root{--serif:'Manner','Spectral',Georgia,serif}
.title{font-weight:600}

/* page header: breadcrumbs in the topbar, the page name in the page */
.crumbs{display:flex;align-items:center;gap:9px;font-size:16px;min-width:0}
.crumbs .cr{color:var(--ink2);cursor:pointer;white-space:nowrap}
.crumbs .cr:hover{color:var(--ink)}
.crumbs .cr.cur{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink3);font-size:14px}
.phead{display:flex;align-items:flex-start;gap:14px;padding-bottom:15px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.phead .acts{margin-left:auto;display:flex;gap:10px}
.h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;color:var(--ink)}

/* ── folder path: where in the tree this view is standing ─────────────── */
.fpath{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-width:0;flex-wrap:wrap}
.fpath .up{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.fpath .up:hover{border-color:var(--ink3);color:var(--ink)}
.fpath .up .ti{font-size:16px}
.fpath .fc{font-size:15px;color:var(--ink2);cursor:pointer;white-space:nowrap;padding:3px 2px;border-radius:6px}
.fpath .fc:hover{color:var(--ink)}
.fpath .fc.cur{color:var(--ink);font-weight:600;cursor:default}
.fpath .fs{color:var(--ink3);font-size:13px}

/* ── table: same card, header and row rhythm as Sites and Projects ────── */
.glab{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 9px;display:flex;align-items:center;gap:8px}
.glab:first-of-type{margin-top:4px}
.count{font-size:11.5px;background:var(--graybg);color:var(--grayd);border-radius:6px;padding:1px 7px;font-weight:600;letter-spacing:0}
.dtbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.dhd,.drow{display:grid;grid-template-columns:minmax(200px,2.6fr) minmax(110px,1fr) minmax(100px,.9fr) minmax(112px,.92fr) 88px;
           align-items:center;gap:14px;padding:13px 20px}
.dhd{background:var(--graybg);border-bottom:1px solid var(--line);
     font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.drow{border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-child{border-bottom:none}
.drow:hover{background:#FBF8EF}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.tile{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bluebg);color:var(--blued)}
.tile .ti{font-size:17px}
.tile.fold{background:var(--graybg);color:var(--grayd)}
.nm{font-size:15px;font-weight:600;letter-spacing:-.01em;min-width:0;display:flex;align-items:center;gap:8px}
.nm .ttx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm .dpt{font-weight:400;font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none}
.pill{font-size:13.5px;font-weight:500;padding:3px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
  width:fit-content;max-width:100%;min-width:0;background:var(--tealbg);color:var(--teald)}
.pill .px{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dprog{display:flex;align-items:center;gap:9px;min-width:0}
.dbar{flex:none;width:64px;height:6px;border-radius:999px;background:#EFEDE6;overflow:hidden}
.dbar i{display:block;height:100%;border-radius:999px;background:var(--ink2)}
.dst{font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.src{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);min-width:0}
.src .ti{font-size:15px;color:var(--ink3);flex:none}
.src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;color:var(--ink2)}
.who .av{width:24px;height:24px;border-radius:999px;flex:none;color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--ink3);font-size:14px;white-space:nowrap}
.dempty{padding:30px 20px;font-size:14px;color:var(--ink3);text-align:center}
@media(max-width:980px){
  .dhd{display:none}
  .drow{grid-template-columns:1fr;row-gap:9px;align-items:start}
}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:15px;padding:9px 18px;border-radius:999px;z-index:1500;display:none;max-width:80vw}
</style>
</head>
<body>

<div class="shell">
<script>window.GYNAV={"active": "documents", "arts": "demand"};</script>
<script src="gy-nav.js?v=35621c30"></script>
<script src="gy-todos.js?v=7226a07d"></script>
<script src="gy-docs.js?v=eb6965dc"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse" id="expandBtn" style="display:none" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr" onclick="location.href='portfolio-overview.html'">Great Yellow</span>
    <span class="sep">&rsaquo;</span><span class="cr" onclick="location.href='programme-overview.html'">Evenlode</span>
    <span class="sep">&rsaquo;</span><span class="cr cur">Documents</span>
  </div>
</div>

<div class="wrap">
  <div class="phead">
    <div class="h1">Documents</div>
    <div class="acts" id="abar"></div>
  </div>

  <div class="fpath" id="fpath"></div>
  <div id="body"></div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── state ────────────────────────────────────────────────────────────────
   PATH is where in the folder tree we are standing. A search or a filter
   flattens the view: it searches the whole tree from here down, the way
   Drive does, so folders drop out and every match shows as a row. */
var PATH = [];
var FQ = '', FTYPE = 'all', FWHO = 'any', FWHEN = 'any';

function flat(){ return !!(FQ || FTYPE!=='all' || FWHO!=='any' || FWHEN!=='any'); }

function ext(n){ var m=/\.([a-z0-9]+)$/i.exec(String(n)); return m?m[1].toLowerCase():''; }
function typeOf(x){
  if(x.kind==='deliverable') return 'deliverable';
  var e=ext(x.name);
  if(e==='xlsx'||e==='csv'||e==='xls') return 'sheet';
  return e==='pdf' ? 'pdf' : 'doc';
}
/* Documents means every plain document; PDFs and Spreadsheets narrow it further */
function matchType(x){
  if(FTYPE==='all') return true;
  if(FTYPE==='doc') return x.kind!=='deliverable';
  return typeOf(x)===FTYPE;
}
function days(iso){
  if(!iso) return 9999;
  var t=GYD.today.split('-'), d=iso.split('-');
  var a=new Date(+t[0],+t[1]-1,+t[2]), b=new Date(+d[0],+d[1]-1,+d[2]);
  return Math.round((a-b)/86400000);
}
function matchWhen(x){
  var n=days(x.on);
  if(FWHEN==='today')  return n<=0;
  if(FWHEN==='week')   return n<=7;
  if(FWHEN==='month')  return n<=30;
  if(FWHEN==='year')   return String(x.on||'').indexOf(String(GYD.today).slice(0,4))===0;
  return true;
}
function keep(x){
  var q=FQ.toLowerCase();
  if(q && (String(x.name)+' '+String(x.wf||'')+' '+String(x.by||'')).toLowerCase().indexOf(q)<0) return false;
  if(!matchType(x)) return false;
  if(FWHO!=='any' && x.by!==FWHO) return false;
  return matchWhen(x);
}

/* ── render ───────────────────────────────────────────────────────────── */
function fRender(){
  var pth=document.getElementById('fpath'), h='';
  if(PATH.length || flat()){
    h+='<span class="up" onclick="fUp()" title="Up one level"><i class="ti ti-arrow-up"></i></span>';
    h+='<span class="fc'+(PATH.length?'':' cur')+'" onclick="fGo([])">All documents</span>';
    PATH.forEach(function(k,i){
      var n=GYD.node(PATH.slice(0,i+1))||{name:k};
      h+='<span class="fs">&rsaquo;</span><span class="fc'+(i===PATH.length-1?' cur':'')
        +'" onclick=\'fGo('+JSON.stringify(PATH.slice(0,i+1))+')\'>'+n.name+'</span>';
    });
    if(flat()) h+='<span class="fs">&rsaquo;</span><span class="fc cur">Matches</span>';
  }
  pth.innerHTML=h;
  pth.style.display=h?'':'none';

  var out='';
  if(!flat()){
    var kids=GYD.children(PATH);
    if(kids.length){
      out+='<div class="glab">Folders <span class="count">'+kids.length+'</span></div>'
        +'<div class="dtbl">'+kids.map(fRow).join('')+'</div>';
    }
  }
  var rows = flat() ? GYD.inFolder(PATH,true).filter(keep) : GYD.inFolder(PATH,false);
  var dl=rows.filter(function(x){return x.kind==='deliverable';});
  var dc=rows.filter(function(x){return x.kind!=='deliverable';});
  if(dl.length) out+='<div class="glab">Deliverables <span class="count">'+dl.length+'</span></div>'+tbl(dl);
  if(dc.length) out+='<div class="glab">Documents <span class="count">'+dc.length+'</span></div>'+tbl(dc);
  if(!out) out='<div class="dtbl"><div class="dempty">'
    +(flat()?'Nothing matches this filter.':'This folder is empty.')+'</div></div>';
  document.getElementById('body').innerHTML=out;
}
function tbl(list){
  return '<div class="dtbl"><div class="dhd">'
    +'<span>Name</span><span>Workflow</span><span>State</span><span>People</span><span>Modified</span>'
    +'</div>'+list.map(dRow).join('')+'</div>';
}
function fRow(f){
  var kids=(f.kids||[]).length;
  var path=PATH.concat([f.k]);
  var inside=GYD.inFolder(path,true);
  var last=inside.map(function(x){return x.on||'';}).sort().pop()||'';
  var lab=inside.length+(inside.length===1?' item':' items')
    +(kids?' · '+kids+(kids===1?' folder':' folders'):'');
  var d=f.dept?GYD.dept(f.dept):null;
  var tile=d?'<div class="tile fold" style="background:'+d.bg+';color:'+d.fg+'"><i class="ti ti-folder"></i></div>'
            :'<div class="tile fold"><i class="ti ti-folder"></i></div>';
  return '<div class="drow" onclick=\'fGo('+JSON.stringify(path)+')\'>'
    +'<div class="name">'+tile+'<div class="nm"><span class="ttx">'+f.name+'</span></div></div>'
    +'<div class="mut">Folder</div>'
    +'<div class="dst">'+lab+'</div>'
    +'<div></div>'
    +'<div class="mut">'+fmt(last)+'</div></div>';
}
function dRow(x){
  var d=GYD.dept(x.dept);
  var es=x.es?(window.GY_ES||{})[x.es]:null;
  var tile = x.kind==='deliverable'
    ? '<div class="tile" style="background:'+d.bg+';color:'+d.fg+'"><i class="ti ti-checkup-list"></i></div>'
    : '<div class="tile"><i class="ti '+(typeOf(x)==='sheet'?'ti-table':'ti-file-text')+'"></i></div>';
  var third;
  if(x.kind==='deliverable'){
    var pct = x.steps ? Math.round(x.done/x.steps*100) : 0;
    third = x.state==='Not started' ? '<div class="dprog"><span class="dst">Not started</span></div>'
      : x.state==='Final' ? '<div class="dprog"><span class="dst" style="color:var(--greend)">Final</span></div>'
      : '<div class="dprog"><span class="dbar"><i style="width:'+pct+'%"></i></span><span class="dst">'+x.state+'</span></div>';
  } else {
    third = '<div class="src"><i class="ti ti-forms"></i><span>'+(x.src||'')+'</span></div>';
  }
  var p=GYD.person(x.by);
  var go = x.href ? "location.href='"+x.href+"'"
         : "toast('"+String(x.name).replace(/&amp;/g,'and').replace(/'/g,'')+" is not built out in this prototype yet')";
  return '<div class="drow" onclick="'+go+'">'
    +'<div class="name">'+tile+'<div class="nm"><span class="ttx">'+x.name+'</span>'
      +(es?'<span class="es-chip '+es.cls+'" style="font-weight:400;font-size:12px"><i class="ti '+es.icon+'"></i>'+es.short+'</span>':'')
      +(x.attach?'<span class="dpt">'+x.attach+'</span>':'')
      +'</div></div>'
    +'<div><span class="pill"><i class="ti ti-topology-star-3" style="font-size:13px"></i><span class="px">'+x.wf+'</span></span></div>'
    +third
    +'<div class="who"><span class="av" style="background:'+p.c+'">'+p.ini+'</span><span>'+(x.by||'')+'</span></div>'
    +'<div class="mut">'+x.upd+'</div></div>';
}
function fmt(iso){
  if(!iso) return '';
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], p=iso.split('-');
  return (+p[2])+' '+M[+p[1]-1];
}
function fGo(p){ PATH=p.slice(); fRender(); }
function fUp(){ if(PATH.length) PATH.pop(); fRender(); }

window.addEventListener('DOMContentLoaded',fRender);
if(document.readyState!=='loading')fRender();

/* ── page chrome ──────────────────────────────────────────────────────── */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3600);
}
function toggleNav(){
  document.body.classList.remove('navpeek');
  const n=document.getElementById('snav');
  const hid=n.classList.toggle('hid');
  document.getElementById('expandBtn').style.display=hid?'flex':'none';
  const z=document.getElementById('snavpeek-zone');
  if(z)z.style.display=hid?'block':'none';
  localStorage.setItem('gyNavHid',hid?'1':'0');
}
(function(){
  if(localStorage.getItem('gyNavHid')==='1'){
    document.getElementById('snav').classList.add('hid');
    document.getElementById('expandBtn').style.display='flex';
    const z=document.getElementById('snavpeek-zone');
    if(z)z.style.display='block';
  }
})();
(function(){
  const zone=document.createElement('div');
  zone.className='snavpeek';
  zone.id='snavpeek-zone';
  document.body.appendChild(zone);
  zone.addEventListener('mouseenter',()=>document.body.classList.add('navpeek'));
  const nav=document.getElementById('snav');
  nav.addEventListener('mouseleave',()=>document.body.classList.remove('navpeek'));
  zone.addEventListener('mouseleave',e=>{
    if(!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.snav')))
      document.body.classList.remove('navpeek');
  });
  if(nav.classList.contains('hid'))zone.style.display='block';
})();
function toggleArts(){
  const open=document.getElementById('artSub').classList.toggle('closed');
  document.getElementById('artArr').classList.toggle('closed',open);
  localStorage.setItem('gyArtsOpen',open?'0':'1');
}
if(localStorage.getItem('gyArtsOpen')==='1'){
  document.getElementById('artSub').classList.remove('closed');
  document.getElementById('artArr').classList.remove('closed');
}
function toggleDel(){
  const open=document.getElementById('delSub').classList.toggle('closed');
  document.getElementById('delArr').classList.toggle('closed',open);
  localStorage.setItem('gyDelOpen',open?'0':'1');
}
if(localStorage.getItem('gyDelOpen')==='0'){
  document.getElementById('delSub').classList.add('closed');
  document.getElementById('delArr').classList.add('closed');
}
(function(){
  const saved=parseInt(localStorage.getItem('gyNavW')||'',10);
  if(saved&&!document.body.classList.contains('navhid')&&!(document.getElementById('snav')&&document.getElementById('snav').classList.contains('hid')))document.body.style.setProperty('--nav',saved+'px');
  const grip=document.getElementById('snavgrip');
  if(!grip)return;
  let drag=false;
  grip.addEventListener('mousedown',e=>{drag=true;grip.classList.add('on');document.body.style.userSelect='none';e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const w=Math.min(420,Math.max(200,e.clientX));
    document.body.style.setProperty('--nav',w+'px');
  });
  window.addEventListener('mouseup',()=>{
    if(!drag)return;
    drag=false;grip.classList.remove('on');document.body.style.userSelect='';
    const w=parseInt(getComputedStyle(document.body).getPropertyValue('--nav'),10);
    if(w)localStorage.setItem('gyNavW',String(w));
  });
})();

gyBar('abar', {
  search:  {placeholder:'Search documents', oninput:function(v){ FQ=v; fRender(); }},
  filters: [
    ['Type',[
      ['ti-circle-dot','All types','all'],
      ['ti-checkup-list','Deliverables','deliverable'],
      ['ti-file-text','Documents','doc'],
      ['ti-file-type-pdf','PDFs','pdf'],
      ['ti-table','Spreadsheets','sheet']
    ]],
    ['People',[['ti-users','Anyone','any']].concat(GYD.owners().map(function(n){return ['ti-user',n,n];}))],
    ['Modified',[
      ['ti-circle-dot','Any time','any'],
      ['ti-calendar','Today','today'],
      ['ti-calendar-week','Last 7 days','week'],
      ['ti-calendar-month','Last 30 days','month'],
      ['ti-calendar-stats','This year','year']
    ]]
  ],
  onfilter: function(group, value){
    if(group==='Type') FTYPE=value;
    else if(group==='People') FWHO=value;
    else FWHEN=value;
    fRender();
  },
  primary: {icon:'ti-plus', label:'Add document', onclick:'Upload: drop a file here or forward a client email and the AI Assistant files it to the right run'}
});
</script>
</body>
</html>
