<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css">

<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --line:#E3E1DB; --line2:#CFCDC5;
  --ink:#1F1F1D; --ink2:#6B6A64; --ink3:#9C9A92;
  --green:#639922; --greenbg:#EAF3DE; --greend:#27500A;
  --amber:#EF9F27; --amberbg:#FAEEDA; --amberd:#854F0B;
  --blue:#378ADD; --bluebg:#E6F1FB; --blued:#185FA5;
  --teal:#1D9E75; --tealbg:#E1F5EE; --teald:#0F6E56;
  --graybg:#F1EFE8; --grayd:#5F5E5A; --dark:#1F1F1D;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px}
.topbar{height:61px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .ti{font-size:19px;color:var(--ink2)}
.title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.chip{font-size:15px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip .ti{font-size:16px}
.btn-dark{font-size:15px;font-weight:500;padding:9px 18px;border-radius:999px;background:var(--dark);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-dark .ti{font-size:16px;color:#fff}
.spacer{flex:1}
.shell{display:flex;height:100vh;overflow:hidden}
.snav{position:relative;width:var(--nav,264px);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 12px 16px}
.snavgrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.snavgrip:hover,.snavgrip.on{background:rgba(31,31,29,.08)}
.sarr{margin-left:auto;font-size:14px;color:var(--ink3);transition:transform .15s;padding:2px;border-radius:5px}
.sarr:hover{background:rgba(31,31,29,.08)}
.ssub{margin:2px 0 4px 30px}
.ssub .sitem{font-size:14.5px;padding:6px 10px;color:var(--ink2)}
.ssub .sitem.on{color:var(--ink)}
.ssub.closed{display:none}
.sarr.closed{transform:rotate(-90deg)}
.snav.hid{display:none}
.snavpeek{position:fixed;top:0;left:0;width:14px;height:100vh;z-index:44;display:none}
body.navpeek .snav.hid{display:flex;position:fixed;left:0;top:10px;bottom:10px;width:264px;z-index:45;border:1px solid var(--line);border-radius:0 14px 14px 0;box-shadow:0 12px 40px rgba(31,31,29,.18);animation:snavslide .16s ease}
@keyframes snavslide{from{transform:translateX(-100%)}to{transform:none}}
.sworks{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.sworks .wtile{width:30px;height:30px;border-radius:9px;background:#F9DD5A;color:#1A0C12;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sworks b{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:4px}
.sworks .ti{font-size:15px;color:var(--ink3)}
.scollapse{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scollapse:hover{background:var(--graybg);color:var(--ink)}
.sitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:1px}
.sitem .ti{font-size:17px;color:var(--ink2)}
.sitem:hover{background:#F3F2EE}
.sdiv{height:1px;min-height:1px;flex:none;background:#E3E1DB;margin:8px 6px}
.sitem.on{background:var(--graybg);font-weight:500}
.mainc{flex:1;overflow:auto;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
.clink{color:var(--blued);cursor:pointer;font-size:14.5px}
.clink:hover{text-decoration:underline}
.lbl{font-size:12.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:18px 0 8px}
.thead{display:grid;grid-template-columns:minmax(0,2.4fr) 1.2fr 1.3fr 1fr;gap:12px;padding:8px 18px;font-size:13.5px;color:var(--ink3)}
.thead span{display:flex;align-items:center;gap:6px}
.thead .ti{font-size:14px}
.group{font-size:14px;color:var(--ink2);padding:14px 4px 6px;display:flex;align-items:center;gap:8px;font-weight:500}
.count{font-size:12.5px;background:var(--graybg);color:var(--grayd);border-radius:6px;padding:1px 7px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) 1.2fr 1.3fr 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:8px;font-size:15px}
.row.click{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.row.click:hover{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.07)}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;background:var(--bluebg);color:var(--blued)}
.tile .ti{font-size:18px}
.nm{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.pill{font-size:13.5px;font-weight:500;padding:3px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;width:fit-content;background:var(--tealbg);color:var(--teald)}
.src{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink2)}
.src .ti{font-size:16px;color:var(--ink3)}
.mut{color:var(--ink3);font-size:14.5px}
/* doc viewer overlay (reused from the canvas prototype) */
.dvov{position:fixed;inset:0;background:rgba(31,31,29,.45);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.dvov.open{display:flex}
.dvbox{background:#fff;border-radius:16px;width:min(760px,100%);box-shadow:0 24px 64px rgba(31,31,29,.3);margin:auto}
.dvhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.dvhead .ti{font-size:18px;color:var(--ink2)}
.dvhead .dvx{margin-left:auto;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dvhead .dvx:hover{background:var(--graybg)}
.dvpage{margin:24px;border:1px solid var(--line);border-radius:6px;padding:40px 46px;min-height:420px;box-shadow:0 2px 10px rgba(31,31,29,.05)}
.dvpage h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 4px}
.dvpage .dvsub{font-size:14px;color:var(--ink3);margin-bottom:22px}
.dvpage h3{font-size:15px;margin:20px 0 6px}
.dvpage p{font-size:14.5px;line-height:1.7;color:var(--ink2);margin:0 0 10px}
.dvfoot{padding:0 24px 18px;font-size:13px;color:var(--ink3);text-align:center}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:15px;padding:9px 18px;border-radius:999px;z-index:40;display:none;max-width:80vw}

/* warm/Manner titles */
:root{--serif:'Manner','Spectral',Georgia,serif}
.title{font-weight:600}
.grt-h{font-family:var(--serif);font-weight:500}
</style>
</head>
<body>

<div class="shell">
<script>window.GYNAV={"active": "documents", "arts": "demand"};</script>
<script src="gy-nav.js"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse" id="expandBtn" style="display:none" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <i class="ti ti-file-text"></i>
  <span class="title">Documents</span>
</div>

<div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
    <span class="spacer"></span>
    <span class="chip" aria-label="Search"><i class="ti ti-search"></i></span>
    <span class="chip"><i class="ti ti-layout-grid"></i> View settings</span>
    <button class="btn-dark" onclick="toast('Upload: drop a file here or forward a client email and the AI Assistant files it to the right run')"><i class="ti ti-plus"></i> Add document</button>
  </div>

  <div class="thead" style="margin-top:18px">
    <span>Document</span>
    <span><i class="ti ti-stack-2"></i> Workflow</span>
    <span><i class="ti ti-inbox"></i> Source</span>
    <span><i class="ti ti-calendar-event"></i> Received</span>
  </div>

  <div class="group">Documents from the client <span class="count">3</span></div>

  <div class="row click" onclick="openDocViewer('mgmt')">
    <div class="name">
      <div class="tile"><i class="ti ti-file-text"></i></div>
      <div class="nm">estate_management_plan.pdf</div>
    </div>
    <div><span class="pill"><i class="ti ti-topology-star-3" style="font-size:13px"></i> Demand Mapping</span></div>
    <div class="src"><i class="ti ti-forms"></i> Questionnaire</div>
    <div class="mut">2 Jul</div>
  </div>

  <div class="row click" onclick="openDocViewer('sfi')">
    <div class="name">
      <div class="tile"><i class="ti ti-file-text"></i></div>
      <div class="nm">sfi_agreement_2024.pdf</div>
    </div>
    <div><span class="pill"><i class="ti ti-topology-star-3" style="font-size:13px"></i> Demand Mapping</span></div>
    <div class="src"><i class="ti ti-forms"></i> Questionnaire</div>
    <div class="mut">3 Jul</div>
  </div>

  <div class="row click" onclick="openDocViewer('tenure')">
    <div class="name">
      <div class="tile" style="background:var(--greenbg);color:var(--greend)"><i class="ti ti-map"></i></div>
      <div class="nm">tenure_map.pdf</div>
    </div>
    <div><span class="pill"><i class="ti ti-topology-star-3" style="font-size:13px"></i> Demand Mapping</span></div>
    <div class="src"><i class="ti ti-mail"></i> Email reply</div>
    <div class="mut">Wed 08:52</div>
  </div>
</div>
</div>
</div>

<div class="dvov" id="dvov" onclick="closeDocViewer()"></div>
<div class="toast" id="toast"></div>

<script>
const DOCV={
 mgmt:{ic:'ti-file-text',name:'estate_management_plan.pdf',body:`
  <h2>Estate Management Plan</h2><div class="dvsub">Evenlode Landscape Recovery · prepared by the estate · 38 pages</div>
  <h3>1 · Vision</h3><p>Restore the estate to good ecological condition over the next decade: cleaner water, lower flood risk, richer habitat, and a durable income from nature markets alongside continued farming.</p>
  <h3>2 · The land today</h3><p>Six parcels across 400 ha of mixed arable, pasture and riparian corridor. Grazing is central to the current business and should continue on enrolled parcels.</p>
  <h3>3 · Planned interventions</h3><p>Riparian buffer planting along the main watercourse, two wetland creation areas, leaky woody dams, hedgerow restoration, and reduced inputs on enrolled parcels. Phased from spring 2027.</p>`},
 sfi:{ic:'ti-file-text',name:'sfi_agreement_2024.pdf',body:`
  <h2>SFI Agreement 2024</h2><div class="dvsub">Sustainable Farming Incentive · agreement ref SFI-24-8841 · 12 pages</div>
  <h3>Parties and term</h3><p>The estate and Defra. Three-year term from March 2024, covering herbal leys, hedgerow management and integrated pest management actions.</p>
  <h3>Enrolled parcels</h3><p>Parcels 1 to 4. Actions on these parcels must be compatible with any new nature-market commitments; stacking rules apply.</p>
  <h3>Payments</h3><p>Quarterly payments against completed actions, subject to annual declaration.</p>`},
 tenure:{ic:'ti-map',name:'tenure_map.pdf',body:`
  <h2>Tenure Map</h2><div class="dvsub">Six parcels · five owned, one tenanted · received Wed 08:52</div>
  <svg viewBox="0 0 560 260" style="width:100%;margin:10px 0 16px" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="160" height="120" rx="8" fill="#E4F0DC" stroke="#9DBA8A"/><text x="90" y="74" text-anchor="middle" font-size="13" fill="#3F5C2E">Parcel 1 · owned</text>
    <rect x="180" y="10" width="180" height="120" rx="8" fill="#E4F0DC" stroke="#9DBA8A"/><text x="270" y="74" text-anchor="middle" font-size="13" fill="#3F5C2E">Parcel 2 · owned</text>
    <rect x="370" y="10" width="180" height="120" rx="8" fill="#E4F0DC" stroke="#9DBA8A"/><text x="460" y="74" text-anchor="middle" font-size="13" fill="#3F5C2E">Parcel 3 · owned</text>
    <rect x="10" y="140" width="250" height="110" rx="8" fill="#E4F0DC" stroke="#9DBA8A"/><text x="135" y="199" text-anchor="middle" font-size="13" fill="#3F5C2E">Parcel 4 · owned</text>
    <rect x="270" y="140" width="140" height="110" rx="8" fill="#E4F0DC" stroke="#9DBA8A"/><text x="340" y="199" text-anchor="middle" font-size="13" fill="#3F5C2E">Parcel 5 · owned</text>
    <rect x="420" y="140" width="130" height="110" rx="8" fill="#FBEFD8" stroke="#D9A23F"/><text x="485" y="192" text-anchor="middle" font-size="13" fill="#8A5A10">Parcel 6 · east</text><text x="485" y="210" text-anchor="middle" font-size="13" fill="#8A5A10">tenanted</text>
  </svg>
  <p>The east parcel is tenanted; selling outcomes there depends on the grazing agreement (still awaited). All other parcels are held freehold with no prior commitments beyond SFI 2024.</p>`}
};
function openDocViewer(id){
  const d=DOCV[id];
  const o=document.getElementById('dvov');
  o.innerHTML=`<div class="dvbox" onclick="event.stopPropagation()">
    <div class="dvhead"><i class="ti ${d.ic}"></i>${d.name}
      <span class="dvx" onclick="closeDocViewer()"><i class="ti ti-x"></i></span></div>
    <div class="dvpage">${d.body}</div>
    <div class="dvfoot">Prototype preview · the original file lives in the run's document store</div>
  </div>`;
  o.classList.add('open');
}
function closeDocViewer(){document.getElementById('dvov').classList.remove('open');}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3600);
}
function toggleNav(){
  document.body.classList.remove('navpeek');
  const n=document.getElementById('snav');
  const hid=n.classList.toggle('hid');
  document.getElementById('expandBtn').style.display=hid?'flex':'none';
  const z=document.getElementById('snavpeek-zone');
  if(z)z.style.display=hid?'block':'none';
  localStorage.setItem('gyNavHid',hid?'1':'0');
}
(function(){
  if(localStorage.getItem('gyNavHid')==='1'){
    document.getElementById('snav').classList.add('hid');
    document.getElementById('expandBtn').style.display='flex';
    const z=document.getElementById('snavpeek-zone');
    if(z)z.style.display='block';
  }
})();
(function(){
  const zone=document.createElement('div');
  zone.className='snavpeek';
  zone.id='snavpeek-zone';
  document.body.appendChild(zone);
  zone.addEventListener('mouseenter',()=>document.body.classList.add('navpeek'));
  const nav=document.getElementById('snav');
  nav.addEventListener('mouseleave',()=>document.body.classList.remove('navpeek'));
  zone.addEventListener('mouseleave',e=>{
    if(!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.snav')))
      document.body.classList.remove('navpeek');
  });
  if(nav.classList.contains('hid'))zone.style.display='block';
})();
function toggleArts(){
  const open=document.getElementById('artSub').classList.toggle('closed');
  document.getElementById('artArr').classList.toggle('closed',open);
  localStorage.setItem('gyArtsOpen',open?'0':'1');
}
if(localStorage.getItem('gyArtsOpen')==='1'){
  document.getElementById('artSub').classList.remove('closed');
  document.getElementById('artArr').classList.remove('closed');
}
function toggleDel(){
  const open=document.getElementById('delSub').classList.toggle('closed');
  document.getElementById('delArr').classList.toggle('closed',open);
  localStorage.setItem('gyDelOpen',open?'0':'1');
}
if(localStorage.getItem('gyDelOpen')==='0'){
  document.getElementById('delSub').classList.add('closed');
  document.getElementById('delArr').classList.add('closed');
}
(function(){
  const saved=parseInt(localStorage.getItem('gyNavW')||'',10);
  if(saved&&!document.body.classList.contains('navhid')&&!(document.getElementById('snav')&&document.getElementById('snav').classList.contains('hid')))document.body.style.setProperty('--nav',saved+'px');
  const grip=document.getElementById('snavgrip');
  if(!grip)return;
  let drag=false;
  grip.addEventListener('mousedown',e=>{drag=true;grip.classList.add('on');document.body.style.userSelect='none';e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const w=Math.min(420,Math.max(200,e.clientX));
    document.body.style.setProperty('--nav',w+'px');
  });
  window.addEventListener('mouseup',()=>{
    if(!drag)return;
    drag=false;grip.classList.remove('on');document.body.style.userSelect='';
    const w=parseInt(getComputedStyle(document.body).getPropertyValue('--nav'),10);
    if(w)localStorage.setItem('gyNavW',String(w));
  });
})();
</script>
</body>
</html>
