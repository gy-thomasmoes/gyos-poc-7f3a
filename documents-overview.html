<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">

<style>
:root{
  --bg:#FCFAF4; --card:#FFFFFF; --line:#E3E1DB; --line2:#CFCDC5;
  --ink:#1F1F1D; --ink2:#6B6A64; --ink3:#9C9A92;
  --green:#639922; --greenbg:#EAF3DE; --greend:#27500A;
  --amber:#EF9F27; --amberbg:#FAEEDA; --amberd:#854F0B;
  --blue:#378ADD; --bluebg:#E6F1FB; --blued:#185FA5;
  --teal:#1D9E75; --tealbg:#E1F5EE; --teald:#0F6E56;
  --graybg:#F1EFE8; --grayd:#5F5E5A; --dark:#1F1F1D;
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px}
.topbar{height:61px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .ti{font-size:19px;color:var(--ink2)}
.title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.chip{font-size:15px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip .ti{font-size:16px}
.btn-dark{font-size:15px;font-weight:500;padding:9px 18px;border-radius:999px;background:var(--dark);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-dark .ti{font-size:16px;color:#fff}
.spacer{flex:1}
.shell{display:flex;height:100vh;overflow:hidden}
.snav{position:relative;width:var(--nav,264px);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 12px 16px}
.snavgrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:30}
.snavgrip:hover,.snavgrip.on{background:rgba(31,31,29,.08)}
.sarr{margin-left:auto;font-size:14px;color:var(--ink3);transition:transform .15s;padding:2px;border-radius:5px}
.sarr:hover{background:rgba(31,31,29,.08)}
.ssub{margin:2px 0 4px 30px}
.ssub .sitem{font-size:14.5px;padding:6px 10px;color:var(--ink2)}
.ssub .sitem.on{color:var(--ink)}
.ssub.closed{display:none}
.sarr.closed{transform:rotate(-90deg)}
.snav.hid{display:none}
.snavpeek{position:fixed;top:0;left:0;width:14px;height:100vh;z-index:44;display:none}
body.navpeek .snav.hid{display:flex;position:fixed;left:0;top:10px;bottom:10px;width:264px;z-index:45;border:1px solid var(--line);border-radius:0 14px 14px 0;box-shadow:0 12px 40px rgba(31,31,29,.18);animation:snavslide .16s ease}
@keyframes snavslide{from{transform:translateX(-100%)}to{transform:none}}
.sworks{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.sworks .wtile{width:30px;height:30px;border-radius:9px;background:#F9DD5A;color:#1A0C12;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sworks b{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:4px}
.sworks .ti{font-size:15px;color:var(--ink3)}
.scollapse{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.scollapse:hover{background:var(--graybg);color:var(--ink)}
.sitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:1px}
.sitem .ti{font-size:17px;color:var(--ink2)}
.sitem:hover{background:#F3F2EE}
.sdiv{height:1px;min-height:1px;flex:none;background:#E3E1DB;margin:8px 6px}
.sitem.on{background:var(--graybg);font-weight:500}
.mainc{flex:1;overflow:auto;min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px}
@media(max-width:900px){.wrap{padding:32px 22px 90px}}
.clink{color:var(--blued);cursor:pointer;font-size:14.5px}
.clink:hover{text-decoration:underline}
.lbl{font-size:12.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:18px 0 8px}
.thead{display:grid;grid-template-columns:minmax(0,2.4fr) 1.2fr 1.3fr 1fr;gap:12px;padding:6px 18px;margin-top:20px;font-size:13px;color:var(--ink3)}
.thead span{display:flex;align-items:center;gap:6px}
.thead .ti{font-size:14px}
.group{font-size:14px;color:var(--ink2);padding:14px 4px 6px;display:flex;align-items:center;gap:8px;font-weight:500}
.count{font-size:12.5px;background:var(--graybg);color:var(--grayd);border-radius:6px;padding:1px 7px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) 1.2fr 1.3fr 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:8px;font-size:15px}
.row.click{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.row.click:hover{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.07)}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;background:var(--bluebg);color:var(--blued)}
.tile .ti{font-size:18px}
.nm{font-weight:600;letter-spacing:-.01em;min-width:0}
.nm>span.ttx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;vertical-align:bottom}
.nm small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.nm .mach{display:block;font-weight:400;font-size:12.5px;color:var(--ink3);margin-top:3px}
.nm .mach i.ti{font-size:13px;margin-right:3px;vertical-align:-1px}
.nm .mach span{margin-right:11px;white-space:nowrap}
.dprog{display:flex;align-items:center;gap:9px}
.dbar{flex:none;width:86px;height:6px;border-radius:999px;background:#EFEDE6;overflow:hidden}
.dbar i{display:block;height:100%;border-radius:999px;background:var(--ink2)}
.dst{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.groupnote{font-weight:400;color:var(--ink3);font-size:13px}
.fbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.fchip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fchip:hover{border-color:var(--line2);color:var(--ink)}
.fchip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.fsep{width:1px;height:18px;background:var(--line);margin:0 5px}

.fchip .sw{width:9px;height:9px;border-radius:3px;flex:none}
.nm .dpt{font-weight:400;font-size:11.5px;color:var(--ink3);margin-left:8px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nm .needs{display:block;font-weight:400;font-size:12.5px;color:var(--ink3);margin-top:3px}

/* ---- Areas view: the whole territory, visited and not ---- */
.dhead{position:relative;display:flex;align-items:center;gap:10px;margin-top:6px}
.fbtn2{font:inherit;font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.fbtn2:hover{border-color:var(--line2);color:var(--ink)}
.fbtn2.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbtn2 .ti{font-size:15px;color:inherit}
.fbtn2 .cnt{font-size:12px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;line-height:17px}
.fbtn2.on .cnt{background:#fff;color:var(--ink)}
.fpop{position:absolute;right:0;top:calc(100% + 9px);width:274px;background:var(--card);border:1px solid var(--line2);
  border-radius:14px;box-shadow:0 14px 40px rgba(31,31,29,.16);padding:7px;z-index:40;display:none}
.fpop.on{display:block}
.fpop .fg{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 11px 4px}
.fpop .fr{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;font-size:14px;color:var(--ink2);cursor:pointer}
.fpop .fr:hover{background:#F1EFE8}
.fpop .fr.on{color:var(--ink);font-weight:500}
.fpop .fr .sw{width:9px;height:9px;border-radius:3px;flex:none}
.fpop .fr .ti{font-size:16px}
.fpop .fr .ck{margin-left:auto;font-size:16px;color:var(--greend);opacity:0}
.fpop .fr.on .ck{opacity:1}
.fpop .fsep{height:1px;background:var(--line);margin:6px 8px}
.dhead .vtog{position:absolute;left:50%;transform:translateX(-50%)}
.vtog{display:inline-flex;background:var(--graybg);border-radius:999px;padding:3px}
.vtog button{font:inherit;font-size:13.5px;font-weight:500;padding:5px 13px;border-radius:999px;border:none;background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.vtog button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(31,31,29,.08)}
.vtog .ti{font-size:15px}
.cov{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:14px;align-items:start}
@media(max-width:900px){.cov{grid-template-columns:repeat(2,1fr)}}
.cvcol{min-width:0}
.cvh{padding:0 2px 10px}
.cvh b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.cvh .sw{width:9px;height:9px;border-radius:3px;flex:none}
.cvh .n{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:400}
.cvh .bar{height:4px;border-radius:999px;background:#EDEBE4;overflow:hidden;margin-top:8px}
.cvh .bar i{display:block;height:100%;border-radius:999px}
.cvgrid{display:flex;flex-direction:column;gap:9px}
.cvt{position:relative;border-radius:13px;padding:14px 15px;min-height:84px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;transition:transform .1s,box-shadow .12s,border-color .12s}
.cvt:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(31,31,29,.07)}
.cvt .t{font-size:14px;font-weight:600;line-height:1.32;letter-spacing:-.01em}
.cvt .m{font-size:12px;margin-top:6px;opacity:.75;font-variant-numeric:tabular-nums}
/* visited, complete */
.cvt.done{background:var(--tint);border:1px solid var(--edge);color:var(--ink)}
.cvt.done .ck{position:absolute;top:11px;right:12px;font-size:14px;color:var(--edge)}
/* being explored */
.cvt.live{background:var(--card);border:1px solid var(--edge);color:var(--ink)}
.cvt.live .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--edge)}
/* known, never visited */
.cvt.none{background:transparent;border:1px dashed #DCD8CD;color:var(--ink3)}
.cvt.none .t{font-weight:500}
.cvt.none:hover{border-color:var(--edge);color:var(--ink2)}
/* known, but gated behind something else */
.cvt.locked .m{color:var(--ink3)}
.cvt .esd{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:2px}
.covlegend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink3);margin:22px 2px 0}
.covlegend span{display:inline-flex;align-items:center;gap:7px}
.covlegend i.k{width:11px;height:11px;border-radius:3px;display:inline-block}
.covsum{font-size:13px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.femp{border:1px dashed var(--line2);border-radius:14px;padding:34px 20px;text-align:center;color:var(--ink3);font-size:14px;margin-top:18px}
.pill{font-size:13.5px;font-weight:500;padding:3px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;width:fit-content;background:var(--tealbg);color:var(--teald)}
.src{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink2)}
.src .ti{font-size:16px;color:var(--ink3)}
.mut{color:var(--ink3);font-size:14.5px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:15px;padding:9px 18px;border-radius:999px;z-index:40;display:none;max-width:80vw}

/* warm/Manner titles */
:root{--serif:'Manner','Spectral',Georgia,serif}
.title{font-weight:600}
.grt-h{font-family:var(--serif);font-weight:500}
</style>
</head>
<body>

<div class="shell">
<script>window.GYNAV={"active": "documents", "arts": "demand"};</script>
<script src="gy-nav.js?v=f01e59c8"></script>
<script src="gy-todos.js?v=7226a07d"></script>
<script src="gy-docs.js?v=8c86f270"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse" id="expandBtn" style="display:none" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <i class="ti ti-file-text"></i>
  <span class="title">Documents</span>
</div>

<div class="wrap">
  <div class="dhead">
    <span class="spacer"></span>
    <div class="vtog">
      <button id="vList" class="on" onclick="dView('list')"><i class="ti ti-list"></i> List</button>
      <button id="vCov" onclick="dView('cov')"><i class="ti ti-layout-grid"></i> Areas</button>
    </div>
    <span class="chip" aria-label="Search"><i class="ti ti-search"></i></span>
    <button class="fbtn2" id="fBtn" onclick="dPop(event)"><i class="ti ti-adjustments-horizontal"></i> Filters<span class="cnt" id="fCnt" style="display:none"></span></button>
    <button class="btn-dark" onclick="toast('Upload: drop a file here or forward a client email and the AI Assistant files it to the right run')"><i class="ti ti-plus"></i> Add document</button>
    <div class="fpop" id="fPop"></div>
  </div>

  <div id="listView">
    <div class="thead">
      <span>Document</span>
      <span>Workflow</span>
      <span>State</span>
      <span>Updated</span>
    </div>
    <div id="docList"></div>
  </div>
  <div id="covView" style="display:none">
    <div class="cov" id="cov"></div>
    <div class="covlegend">
      <span><i class="k" style="background:#CFE3D6;border:1px solid #1E8A63"></i>Complete</span>
      <span><i class="k" style="background:#fff;border:1px solid #1E8A63"></i>In progress</span>
      <span><i class="k" style="background:transparent;border:1px dashed #DCD8CD"></i>Not started</span>
      <span class="covsum" id="covsum"></span>
    </div>
  </div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>


var DVIEW='list';
function dView(v){
  DVIEW=v;
  document.getElementById('vList').classList.toggle('on',v==='list');
  document.getElementById('vCov').classList.toggle('on',v==='cov');
  document.getElementById('listView').style.display = v==='list'?'':'none';
  document.getElementById('covView').style.display  = v==='cov'?'':'none';
  dRender();
}
/* Every deliverable this programme could hold, laid out by department.
   Filled means visited, outlined means known territory we have not been to. */
function dCoverage(){
  var rows=dScope().filter(function(x){return x.kind==='deliverable';});
  var tot=0, started=0, complete=0, h='';
  GYD.depts.forEach(function(d){
    var g=rows.filter(function(x){return x.dept===d.k;});
    if(!g.length) return;
    var gdone=g.filter(function(x){return x.state==='Final';}).length;
    var glive=g.filter(function(x){return x.state!=='Final'&&x.state!=='Not started';}).length;
    tot+=g.length; complete+=gdone; started+=gdone+glive;
    h+='<div class="cvcol"><div class="cvh">'
      +'<b><span class="sw" style="background:'+d.fg+'"></span>'+d.name+'<span class="n">'+gdone+'/'+g.length+'</span></b>'
      +'<div class="bar"><i style="width:'+Math.round(gdone/g.length*100)+'%;background:'+d.fg+'"></i></div>'
      +'</div><div class="cvgrid">'
      + g.map(function(x){ return cvTile(x,d); }).join('')
      +'</div></div>';
  });
  document.getElementById('cov').innerHTML = h || '<div class="femp" style="grid-column:1/-1">No deliverables match this filter.</div>';
  document.getElementById('covsum').textContent = complete+' complete · '+started+' of '+tot+' started';
}
function cvTile(x,d){
  var es=x.es?(window.GY_ES||{})[x.es]:null;
  var name=String(x.name).replace(/&amp;/g,'and').replace(/'/g,'');
  var go = x.href ? "location.href='"+x.href+"'" : "toast('"+name+" is not built out in this prototype yet')";
  var cls, inner='', meta='';
  if(x.state==='Final'){
    cls='done'; inner='<i class="ti ti-check ck"></i>'; meta=x.upd;
  } else if(x.state==='Not started'){
    cls='none'+(x.needs?' locked':''); meta = x.needs ? 'Needs '+String(x.needs).replace(/&amp;/g,'and') : x.steps+' steps';
  } else {
    cls='live'; inner='<span class="fill" style="width:'+Math.round(x.done/x.steps*100)+'%"></span>'; meta=x.state;
  }
  var tint = cls==='done' ? d.bg : 'transparent';
  return '<div class="cvt '+cls+'" style="--edge:'+d.fg+';--tint:'+d.bg+'" onclick="'+go+'" title="'+name+'">'
    +inner
    +(es?'<span class="esd '+es.cls+'" style="background:var(--esc)"></span>':'')
    +'<span class="t">'+x.name+'</span><span class="m">'+meta+'</span></div>';
}

var DDEPT='all', DES='all';
function dScope(){
  return GYD.items.filter(function(x){
    return (DDEPT==='all'||x.dept===DDEPT) && (DES==='all'||x.es===DES);
  });
}
function dPop(e){
  if(e) e.stopPropagation();
  var el=document.getElementById('fPop'), b=document.getElementById('fBtn');
  var on=el.classList.toggle('on'); b.classList.toggle('on',on);
}
function dRow_(k,label,on,sw,ic,fn){
  return '<div class="fr'+(on?' on':'')+'" onclick="'+fn+'(\''+k+'\')">'
    +(sw?'<span class="sw" style="background:'+sw+'"></span>':'')
    +(ic?'<i class="ti '+ic+'"></i>':'')
    +label+'<i class="ti ti-check ck"></i></div>';
}
function dSet(k){ DDEPT=k; dRender(); }
function dEs(k){ DES = (DES===k?'all':k); dRender(); }
function dFilters(){
  var f='<div class="fg">Department</div>'+dRow_('all','All departments',DDEPT==='all',null,null,'dSet');
  GYD.depts.forEach(function(d){ f+=dRow_(d.k,d.name,DDEPT===d.k,d.fg,null,'dSet'); });
  f+='<div class="fsep"></div><div class="fg">Ecosystem service</div>';
  ['bng','wcc'].forEach(function(k){
    var m=(window.GY_ES||{})[k]; if(!m)return;
    f+=dRow_(k,m.name,DES===k,null,m.icon,'dEs').replace('class="fr','class="fr '+m.cls);
  });
  document.getElementById('fPop').innerHTML=f;
  var n=(DDEPT==='all'?0:1)+(DES==='all'?0:1), c=document.getElementById('fCnt');
  c.textContent=n; c.style.display = n?'':'none';
}
function dRender(){
  dFilters();
  if(DVIEW==='cov'){ dCoverage(); return; }

  var rows=dScope();
  var dl=rows.filter(function(x){return x.kind==='deliverable';});
  var dc=rows.filter(function(x){return x.kind==='document';});
  var h='';
  if(dl.length) h+='<div class="group">Deliverables <span class="count">'+dl.length+'</span></div>'+dl.map(dRow).join('');
  if(dc.length) h+='<div class="group">Documents <span class="count">'+dc.length+'</span></div>'+dc.map(dRow).join('');
  document.getElementById('docList').innerHTML = h || '<div class="femp">No documents match this filter.</div>';
}
function dRow(x){
  var d=GYD.dept(x.dept);
  var es=x.es?(window.GY_ES||{})[x.es]:null;
  var tile = x.kind==='deliverable'
    ? '<div class="tile" style="background:'+d.bg+';color:'+d.fg+'"><i class="ti ti-checkup-list"></i></div>'
    : '<div class="tile"><i class="ti ti-file-text"></i></div>';
  var mach = (x.todos&&window.GYT)
    ? '<span class="mach"><span><i class="ti ti-list-check"></i>'+GYT.stats(x.todos).label+'</span></span>' : '';
  var third;
  if(x.kind==='deliverable'){
    var pct = x.steps ? Math.round(x.done/x.steps*100) : 0;
    third = x.state==='Not started' ? '<div class="dprog"><span class="dst">Not started</span></div>'
      : x.state==='Final' ? '<div class="dprog"><span class="dst" style="color:var(--greend)">Final</span></div>'
      : '<div class="dprog"><span class="dbar"><i style="width:'+pct+'%"></i></span><span class="dst">'+x.state+'</span></div>';
  } else {
    third = '<div class="src"><i class="ti ti-forms"></i> '+(x.src||'')+'</div>';
  }
  var go = x.href ? "location.href='"+x.href+"'" : "toast('"+String(x.name).replace(/&amp;/g,'and').replace(/'/g,'')+" is not built out in this prototype yet')";
  return '<div class="row click" onclick="'+go+'">'
    +'<div class="name">'+tile+'<div class="nm"><span class="ttx">'+x.name+'</span>'
      +(es?' <span class="es-chip '+es.cls+'" style="font-weight:400;font-size:12px;margin-left:7px"><i class="ti '+es.icon+'"></i>'+es.short+'</span>':'')
      +(x.attach?'<span class="dpt">'+x.attach+'</span>':'')
      +(x.needs?'<span class="needs">Needs '+x.needs+'</span>':'')
      +mach+'</div></div>'
    +'<div><span class="pill"><i class="ti ti-topology-star-3" style="font-size:13px"></i> '+x.wf+'</span></div>'
    +third
    +'<div class="mut">'+x.upd+'</div></div>';
}
document.addEventListener('click',function(e){
  if(e.target.closest('#fPop')||e.target.closest('#fBtn'))return;
  var el=document.getElementById('fPop'); if(el&&el.classList.contains('on')){
    el.classList.remove('on'); document.getElementById('fBtn').classList.remove('on');
  }
});
window.addEventListener('DOMContentLoaded',dRender);
if(document.readyState!=='loading')dRender();

(function(){
  function paint(){
    if(!window.GYT)return;
    var c=document.getElementById('cntTodos'); if(c)c.textContent=GYT.myOpen().length;
  }
  window.addEventListener('DOMContentLoaded',paint);
  if(document.readyState!=='loading')paint();
})();

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3600);
}
function toggleNav(){
  document.body.classList.remove('navpeek');
  const n=document.getElementById('snav');
  const hid=n.classList.toggle('hid');
  document.getElementById('expandBtn').style.display=hid?'flex':'none';
  const z=document.getElementById('snavpeek-zone');
  if(z)z.style.display=hid?'block':'none';
  localStorage.setItem('gyNavHid',hid?'1':'0');
}
(function(){
  if(localStorage.getItem('gyNavHid')==='1'){
    document.getElementById('snav').classList.add('hid');
    document.getElementById('expandBtn').style.display='flex';
    const z=document.getElementById('snavpeek-zone');
    if(z)z.style.display='block';
  }
})();
(function(){
  const zone=document.createElement('div');
  zone.className='snavpeek';
  zone.id='snavpeek-zone';
  document.body.appendChild(zone);
  zone.addEventListener('mouseenter',()=>document.body.classList.add('navpeek'));
  const nav=document.getElementById('snav');
  nav.addEventListener('mouseleave',()=>document.body.classList.remove('navpeek'));
  zone.addEventListener('mouseleave',e=>{
    if(!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.snav')))
      document.body.classList.remove('navpeek');
  });
  if(nav.classList.contains('hid'))zone.style.display='block';
})();
function toggleArts(){
  const open=document.getElementById('artSub').classList.toggle('closed');
  document.getElementById('artArr').classList.toggle('closed',open);
  localStorage.setItem('gyArtsOpen',open?'0':'1');
}
if(localStorage.getItem('gyArtsOpen')==='1'){
  document.getElementById('artSub').classList.remove('closed');
  document.getElementById('artArr').classList.remove('closed');
}
function toggleDel(){
  const open=document.getElementById('delSub').classList.toggle('closed');
  document.getElementById('delArr').classList.toggle('closed',open);
  localStorage.setItem('gyDelOpen',open?'0':'1');
}
if(localStorage.getItem('gyDelOpen')==='0'){
  document.getElementById('delSub').classList.add('closed');
  document.getElementById('delArr').classList.add('closed');
}
(function(){
  const saved=parseInt(localStorage.getItem('gyNavW')||'',10);
  if(saved&&!document.body.classList.contains('navhid')&&!(document.getElementById('snav')&&document.getElementById('snav').classList.contains('hid')))document.body.style.setProperty('--nav',saved+'px');
  const grip=document.getElementById('snavgrip');
  if(!grip)return;
  let drag=false;
  grip.addEventListener('mousedown',e=>{drag=true;grip.classList.add('on');document.body.style.userSelect='none';e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const w=Math.min(420,Math.max(200,e.clientX));
    document.body.style.setProperty('--nav',w+'px');
  });
  window.addEventListener('mouseup',()=>{
    if(!drag)return;
    drag=false;grip.classList.remove('on');document.body.style.userSelect='';
    const w=parseInt(getComputedStyle(document.body).getPropertyValue('--nav'),10);
    if(w)localStorage.setItem('gyNavW',String(w));
  });
})();
</script>
</body>
