<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Evenlode · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=c2eda4c9">
<style>
.wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px}
@media(max-width:900px){.wrap{padding:32px 22px 90px}}

.phead{align-items:baseline}
.acts{position:relative}
/* one filter popover, so the page keeps a single row of controls */
.fpop{position:absolute;right:0;top:calc(100% + 9px);width:268px;background:var(--card);border:1px solid var(--line2);
  border-radius:14px;box-shadow:0 14px 40px rgba(31,31,29,.16);padding:7px;z-index:40;display:none;text-align:left}
.fpop.on{display:block}
.fpop .fg{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 11px 4px}
.fpop .fr{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;font-size:14px;color:var(--ink2);cursor:pointer}
.fpop .fr:hover{background:#F1EFE8}
.fpop .fr.on{color:var(--ink);font-weight:500}
.fpop .fr .ck{margin-left:auto;font-size:16px;color:var(--greend);opacity:0}
.fpop .fr.on .ck{opacity:1}
.fpop .fsep{height:1px;background:var(--line);margin:6px 8px}
.btn-out.on{background:var(--ink);border-color:var(--ink);color:#fff}
.srow{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.srow .search{margin-left:auto;width:290px}
.plab{display:flex;align-items:center;gap:12px}
.plab .act{margin-left:auto;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink2);cursor:pointer}
.plab .act:hover{color:var(--ink)}

/* solid ES pill */
.espill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:7px;background:var(--esc);color:#fff;white-space:nowrap}

/* top-3 selling priority */
.plab{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 15px 15px 17px;cursor:pointer}
.tcard:hover{border-color:var(--line2)}
.tcard .tr{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--ink3);line-height:1;flex:none;width:18px}
.tcard .tb{flex:1;min-width:0}
.tcard .tn{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.tcard .tm{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2)}
.tcard .grip{color:var(--ink3);font-size:15px;flex:none;cursor:grab}
@media(max-width:900px){.top3{grid-template-columns:1fr}}

/* grouped table */
.ptbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);margin-top:20px}
.ghead{display:flex;align-items:center;gap:11px;padding:13px 18px;background:var(--graybg);border-bottom:1px solid var(--line);cursor:pointer}
.ptbl .ghead:not(:first-child){border-top:1px solid var(--line)}
.ghead .gt{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ghead .gch{margin-left:auto;color:var(--ink3);font-size:16px;transition:transform .15s}
.ghead.closed .gch{transform:rotate(-90deg)}
.prow{display:grid;grid-template-columns:34px minmax(150px,1fr) 52px minmax(190px,1.15fr) 62px 74px 168px;
      align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:none}
.prow:hover{background:#FBF8EF}
.prow.hid{display:none}
.prow .rk{font-size:14px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prow .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .st{font-size:14px;color:var(--ink2);min-width:0}
.prow .un{font-size:14px;color:var(--ink2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .vl{font-size:15.5px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .vl.none{color:var(--ink3);font-weight:400}
.prow .ac{justify-self:end}
.nextbtn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 13px;font-family:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.nextbtn:hover{border-color:var(--ink3)}
.unitbtn{border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 11px;font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.unitbtn:hover{border-color:var(--line2);color:var(--ink)}
.gempty{padding:26px 18px;font-size:14px;color:var(--ink3);text-align:center}
@media(max-width:980px){
  .prow{grid-template-columns:30px 1fr 52px 62px 74px;row-gap:8px}
  .prow .st{grid-column:2 / 6;font-size:13.5px}
  .prow .ac{grid-column:2 / 6;justify-self:start}
}
</style>
</head>
<body>
<div class="shell">
<script>window.GYNAV={"active":"prog-projects"};</script>
<script src="gy-nav.js?v=010c5c19"></script>
<script src="gy-projects.js?v=493e46ca"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr" onclick="location.href='portfolio-overview.html'">Great Yellow</span>
    <span class="sep">›</span><span class="cr" onclick="location.href='programme-overview.html'">Evenlode</span>
    <span class="sep">›</span><span class="cr cur">Projects</span>
  </div>
</div>

<div class="wrap">
  <div class="phead">
    <div class="h1">Projects</div>
    <div class="acts">
      <button class="btn-out" id="sBtn" onclick="pSearch(event)"><i class="ti ti-search"></i> Search</button>
      <button class="btn-out" id="fBtn" onclick="pFilters(event)"><i class="ti ti-adjustments-horizontal"></i> Filters</button>
      <button class="btn-out" onclick="event.stopPropagation();gyMenu(this,PROJ_ACTIONS)">Actions <i class="ti ti-chevron-down"></i></button>
      <button class="btn-dark" onclick="toast('Add project: name it, pick the ecosystem service, then allocate parcels')"><i class="ti ti-plus"></i> Add project</button>
      <div class="fpop" id="fPop">
        <div class="fg">Stage</div>
        <div class="fr on" onclick="toast('Stage: all')">All stages<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Stage: Draft')">Draft<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Stage: Pending')">Pending<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Stage: Registered')">Registered<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Stage: Selling')">Selling<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Stage: Closed')">Closed<i class="ti ti-check ck"></i></div>
        <div class="fsep"></div>
        <div class="fg">Habitat and vintage</div>
        <div class="fr on" onclick="toast('Habitat and vintage: any')">Any<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Habitat filter applies to BNG projects')">Habitat<i class="ti ti-check ck"></i></div>
        <div class="fr" onclick="toast('Vintage filter applies to carbon projects')">Vintage<i class="ti ti-check ck"></i></div>
      </div>
    </div>
  </div>

  <div class="srow">
    <div class="seg">
      <button class="on" data-f="all" onclick="setFilter('all')">All · 9</button>
      <button data-f="bng" onclick="setFilter('bng')">BNG · 5</button>
      <button data-f="wcc" onclick="setFilter('wcc')">WCC · 2</button>
      <button data-f="soc" onclick="setFilter('soc')">Soil · 2</button>
    </div>
    <div class="search" id="qwrap" style="display:none"><i class="ti ti-search"></i>
      <input id="q" placeholder="Search projects" oninput="render()"
             style="border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:var(--ink);width:100%">
    </div>
  </div>

  <div class="plab">Selling priority
    <span class="act" onclick="toast('Reorder priorities: drag the cards. Only a PM can change selling order.')">Reorder</span>
  </div>
  <div class="top3" id="top3"></div>

  <div class="ptbl" id="ptbl"></div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
/* Search is a button until it is wanted, then a field beside the chips. */
function pSearch(e){
  if(e) e.stopPropagation();
  var w=document.getElementById('qwrap'), b=document.getElementById('sBtn');
  var on = w.style.display==='none';
  w.style.display = on ? '' : 'none';
  if(on){ document.getElementById('q').focus(); }
  else { document.getElementById('q').value=''; render(); }
  b.classList.toggle('on',on);
  pClosePop();
}
function pFilters(e){
  if(e) e.stopPropagation();
  var el=document.getElementById('fPop'), b=document.getElementById('fBtn');
  b.classList.toggle('on', el.classList.toggle('on'));
}
function pClosePop(){
  var el=document.getElementById('fPop');
  if(el&&el.classList.contains('on')){ el.classList.remove('on'); document.getElementById('fBtn').classList.remove('on'); }
}
document.addEventListener('click',function(e){
  if(e.target.closest('#fPop')||e.target.closest('#fBtn')) return;
  pClosePop();
});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3400);}
if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};

/* Bulk operations for projects. Stage progression lives here, not on
   Inventory: it is a registry event applied to a project's units, and the
   wireframe scoped it by project too. */
var PROJ_ACTIONS = [
  ['label','Bulk'],
  ['ti-package-import','Add inventory to projects','Pick projects, then pick the unallocated lines that move into them'],
  ['ti-arrow-up-circle','Progress unit stage','BNG Projected to Registered. WCC Projected to Validated (PIU) or Verified (WCU)'],
  '-',
  ['ti-file-export','Export project register','Export: every project with its rank, stage, units and value'],
  ['ti-history','Audit log','go:activity-overview.html']
];
</script>
<script>
/* One list of Projects for the programme. The Programme Overview reads the
   same shape from gy-projects.js, so the two pages never drift. */
var GROUPS = [
  {k:'bng', head:'5 projects · £219k available · £638k planned'},
  {k:'wcc', head:'2 projects · nothing sellable yet · £142k planned'},
  {k:'soc', head:'2 projects · baselining · £63k planned'}
];
var ES_SHORT={bng:'BNG',wcc:'WCC',soc:'SOIL'};
function esPill(k){ return '<span class="espill '+GY_ES[k].cls+'">'+ES_SHORT[k]+'</span>'; }
function openProject(p){ toast(p.name+': the project page is not in this prototype yet'); }

function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var list=GY_PROJECTS;

  var top=list.filter(function(p){return p.top;}).sort(function(a,b){return a.rank-b.rank;});
  document.getElementById('top3').innerHTML=top.map(function(p){
    return '<div class="tcard" onclick="openProject(GY_PROJECTS['+list.indexOf(p)+'])">'
      +'<span class="tr">'+p.rank+'</span>'
      +'<span class="tb"><div class="tn">'+p.name+'</div>'
      +'<div class="tm">'+esPill(p.es)+'<span>'+p.note+'</span></div></span>'
      +'<i class="ti ti-grip-vertical grip" onclick="event.stopPropagation();toast(\'Drag to reorder. Only a PM can change selling order.\')"></i></div>';
  }).join('');

  var h='';
  GROUPS.forEach(function(g){
    if(FILTER!=='all' && FILTER!==g.k) return;
    var rows=list.filter(function(p){return p.es===g.k && p.name.toLowerCase().indexOf(q)>=0;})
                 .sort(function(a,b){return a.rank-b.rank;});
    h+='<div class="ghead" onclick="this.classList.toggle(\'closed\');this.nextElementSibling.classList.toggle(\'ghid\')">'
      +esPill(g.k)+'<span class="gt">'+g.head+'</span><i class="ti ti-chevron-down gch"></i></div>';
    h+='<div class="gbody">';
    h+= rows.length ? rows.map(function(p){
      return '<div class="prow" onclick="openProject(GY_PROJECTS['+list.indexOf(p)+'])">'
        +'<span class="rk">'+p.rank+'</span>'
        +'<span class="nm">'+p.name+'</span>'
        +esPill(p.es)
        +'<span class="st">'+p.stage+'</span>'
        +'<span class="un">'+p.units+' u</span>'
        +'<span class="vl'+(p.value?'':' none')+'">'+(p.value||'&mdash;')+'</span>'
        +'<span class="ac">'
        +'<button class="unitbtn" onclick="event.stopPropagation();toast(\'Units · '+p.name+': view and edit the '+p.units+' units this project holds\')">Units</button>'
        +(p.next?'<button class="nextbtn" onclick="event.stopPropagation();toast(\''+p.next+' · '+p.name+'\')">'+p.next+'</button>':'')+'</span>'
        +'</div>';
    }).join('') : '<div class="gempty">No projects match that search.</div>';
    h+='</div>';
  });
  document.getElementById('ptbl').innerHTML=h;
}
var FILTER='all';
function setFilter(f){
  FILTER=f;
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});
  render();
}
window.addEventListener('DOMContentLoaded',render);
</script>
<style>.gbody.ghid{display:none}</style>
</body>
</html>
