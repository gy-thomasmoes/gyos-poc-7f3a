  gyToast(p[0]+' added to the team');
}

var AGENT = 'Catchment Investment Plan agent';
var AGENT_IC = 'ti-building-bank';
function agAv(cls){ return '<span class="v8ava '+(cls||'')+'"><i class="ti '+AGENT_IC+'"></i></span>'; }

/* ── the Ecosystem Service agents ─────────────────────────────────────────
   Company-wide, one per service, each managed by an expert. Manager names
   are placeholders until GY names them. */
var ESA = {
  phos:{n:'Phosphorus Agent', s:'Phosphorus', ic:'ti-droplet', c:'#1F6FB2', bg:'#E4EFF8',
        mgr:['Al Maltby','AM'], checked:'7 Oct 2026', used:'2 runs',
        knows:['UKTAG phosphorus standards and method statement','EA WFD cycle 4 classifications 2025','Farmscoper mitigation potential','Anglian Water P removal costs (AMP7 claim)'],
        tools:['Need and source split (AI-led GIS)','Fair share and price calculator','Cap test against stripping'],
        open:['Hotspot streams carry most of the A-WINEP need: who investigates them, the EA or Anglian?']},
  wr:{n:'Water resources Agent', s:'Water resources', ic:'ti-droplet-half-2', c:'#2A8C9A', bg:'#E2F2F4',
        mgr:['Water resources lead','WR'], checked:'Not yet built', used:'0 runs',
        knows:['WRMP supply and demand cases','EA abstraction licences','EA NbS position statement (May 2026)'],
        tools:['Abstraction licence lookup (Kwame)','Water retention estimate'],
        open:['No unit value yet: carry a costed gap until EA and Ofwat guidance lands?']},
  bath:{n:'Bathing water Agent', s:'Bathing water quality', ic:'ti-swimming', c:'#3C6E8F', bg:'#E3EDF4',
        mgr:['Bathing water lead','BW'], checked:'Not yet built', used:'0 runs',
        knows:['Bathing water classifications','Anglian ODIs and their values'],
        tools:['Bathing water site lookup'],
        open:[]},
  flood:{n:'Flood Agent', s:'Flood and sewer flooding', ic:'ti-ripple', c:'#4A5F8C', bg:'#E6E9F2',
        mgr:['Flood lead','FL'], checked:'15 Sep 2026', used:'3 projects',
        knows:['Anglian Flooding Incident Reduction Plan','Sewer flooding PCDs','Evenlode NFM deals'],
        tools:['Assets at risk lookup','Hydrological modelling partners'],
        open:[]},
  bng:{n:'BNG Agent', s:'Biodiversity Net Gain', ic:'ti-plant', c:'#4E7D3A', bg:'#E8F0E1',
        mgr:['BNG lead','BN'], checked:'22 Sep 2026', used:'11 projects',
        knows:['DEFRA statutory biodiversity metric','Gain Site Register rules','Voluntary BNG price evidence'],
        tools:['Habitat baseline check (GIS)','Biodiversity metric calculator'],
        open:[]},
  carb:{n:'Carbon Agent', s:'Soil and woodland carbon', ic:'ti-trees', c:'#C67F16', bg:'#FAEEDA',
        mgr:['Carbon lead','CL'], checked:'2 Sep 2026', used:'9 projects',
        knows:['Woodland Carbon Code rule book','Soil carbon methods under review','GY carbon pricing curve 2026 to 2032'],
        tools:['Planting area check (GIS)','Pricing calculator'],
        open:[]}
};
function esAv(id, cls){ var a = ESA[id]; return '<span class="v8esa '+(cls||'')+'" style="background:'+a.c+'"><i class="ti '+a.ic+'"></i></span>'; }
function mgrAv(id){ var m = ESA[id].mgr; return av([m[0], m[1], '#9C9A92', 'Manager, placeholder']); }

/* What each agent hands back, written into chapter 3 as an Ecosystem Service Card. */
var ESCARD = {
  phos:{cf:['ind','Indicative'], res:'Pursue. Land closes 47% of the 2,652 kg gap on 5,130 ha, priced below the cost of stripping.', rows:[['Gap','2,652 kg/yr'],['From land','47%']], next:'Fair share and price'},
  wr:{cf:['lo','Costed gap'], res:'Hold as a costed gap. The value logic holds, but the &pound; per m&sup3; waits for EA and Ofwat guidance.', rows:[['Unit','m&sup3; retained'],['Value','Pending']], next:'Wait for guidance'},
  bath:{cf:['lo','Screened'], res:'Screen only. Each classification step is worth about &pound;1m+ to Anglian; no site in this catchment is quantified yet.', rows:[['Unit','Classification step'],['Value','Not quantified']], next:'Screen sites'},
  flood:{cf:['lo','Screened'], res:'Screen with Anglian. Sewer flooding PCD priority areas at North Creek, South Creek and the Burnhams; value not yet quantified.', rows:[['Unit','Incidents avoided'],['Value','Not quantified']], next:'Asset data from Anglian'},
  bng:{cf:['ind','Indicative'], res:'Stack. 1,410 ha of new habitat creates biodiversity units, subject to additionality rules.', rows:[['Area','1,410 ha'],['Units','After baseline']], next:'Baseline survey'},
  carb:{cf:['ind','Indicative'], res:'Stack. Soil and woodland carbon on the targeted and regenerative land, sold alongside phosphorus.', rows:[['Area','5,130 ha'],['Credits','After baseline']], next:'Eligibility check'}
};
/* ── the document ───────────────────────────────────────────────────────── */
var FIELDS = {};
var DIR = '';
var BUYCOLS = ['Buyer','Why relevant','Hook','Relationship'];
var MARKETS = [];
function tableHtml(cols, rows){
  return '<div class="v5tw"><table class="v5tbl"><thead><tr>'
    + cols.map(function(c){ return '<th>'+c+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r){
        return '<tr>' + r.map(function(c,i){
          return '<td contenteditable="true" spellcheck="false" class="'+(i===0?'k':'')+'">'+c+'</td>';
        }).join('') + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

/* ── the run ──────────────────────────────────────────────────────────── */
var WF = [
  {n:'1. Frame', short:'Frame', s:[
    {k:'1.1',t:'Check operational-area pricing',x:'ai'},
    {k:'1.2',t:'Map buyer drivers',x:'Lola Grundmann'},
    {k:'1.3',t:'Scope agreed?',x:'gate',by:'Lola Grundmann'}]},
  {n:'2. Model', short:'Model', s:[
    {k:'2.1',t:'Apply outcome modules',x:'ai'},
    {k:'2.2',t:'Stack co-benefits',x:'ai'},
    {k:'2.3',t:'Build funding stack',x:'ai'},
    {k:'2.4',t:'Longlist other buyers',x:'ai'}]},
  {n:'3. Draft', short:'Draft', s:[
    {k:'3.1',t:'Assemble and check',x:'ai'},
    {k:'3.2',t:'Review draft',x:'Archie Ruggles-Brise'},
    {k:'3.3',t:'Ready to issue?',x:'gate',by:'Al Maltby'}]},
  {n:'4. Agree', short:'Agree', s:[
    {k:'4.1',t:'Issue prospectus',x:'Lola Grundmann'},
    {k:'4.2',t:'Present to Anglian Water',x:'Al Maltby'},
    {k:'4.3',t:'Anglian signed off?',x:'gate',by:'Al Maltby'},
    {k:'4.4',t:'Save learnings',x:'ai'}]}
];
/* a person's part in this run, read from the workflow: the steps they lead and the decisions they make */
function runRole(p){
  var nm = p[0], lead = [], dec = [];
  stepList().forEach(function(x){ if(x.x==='gate' && x.by===nm) dec.push(x.k); else if(x.x===nm) lead.push(x.k); });
  var j = function(a){ return a.length > 1 ? a.slice(0,-1).join(', ')+' and '+a[a.length-1] : a[0]; };
  var out = [];
  if(lead.length) out.push('Leads '+j(lead));
  if(dec.length) out.push((out.length?'decides ':'Decides ')+j(dec));
  return out.length ? out.join(', ') : p[3];
}
function stepList(){ var o=[]; WF.forEach(function(c){ c.s.forEach(function(s){ o.push(s); }); }); return o; }
function stepByKey(k){ var r=null; stepList().forEach(function(s){ if(s.k===k) r=s; }); return r; }
function chapOf(k){ return WF[parseInt(k,10)-1]; }

var DONE = [], CUR = null, DEC = {}, FLAGS = {}, JUST = null, ESDONE = {}, LOG = [], Q = null, BI = 0, BUSY = false, T = null;

var SP = {say:520, item:430, settle:380, con:650};

function item(it, run){

  return '<div class="v5step rise"><span class="bx'+(run?' run':'')+'"></span><div><span class="w">'+it[0]+'</span>'

}
function made(ic,bg,fg,n,m){

}
function conHtml(id, state){
  var a = ESA[id], c = ESCARD[id];

                     : '<span class="s"><span class="v8cf '+c.cf[0]+'">'+c.cf[1]+'</span></span>')
    + '</div>'
    + (state==='ask' ? '<div class="v8conb">Reading the project context against its rule book</div>'
                     : '<div class="v8conb">'+c.res+'</div>')
    + '<div class="v8conm">'+mgrAv(id)+'Managed by '+a.mgr[0]+'</div></div>';
}

/* The script. The agent runs on its own until it reaches an ask, a decision
   or a person's step, and waits there. */
var PRICE = '', NEED = '';

function push(h){ LOG.push(h); paintChat(); }
function next(){ T = setTimeout(run, SP.say); }
function run(){
  T = null;
  if(Q) return;
  var b = S[BI]; if(!b) return;
  BI++;
  BUSY = true; paintProg();
  if(b.t === 'step'){ CUR = b.k; push(lab(b.k)); paintAll(); return next(); }
  if(b.t === 'say'){ push(say(b.h)); return next(); }
  if(b.t === 'made'){ push(made.apply(null, b.a)); act('ai','made','Made '+b.a[3]); return next(); }
  if(b.t === 'flag'){ doFlag(b.id, true); return next(); }
  if(b.t === 'set'){ DIR = b.v; return next(); }
  if(b.t === 'set2'){ window[b.n] = b.v; paintAll(); return next(); }
  if(b.t === 'side'){ addSide(b.x, b.s, b.keep); return next(); }
  if(b.t === 'done'){
    DONE.push(b.k); JUST = b.k;
    Object.keys(SRC).forEach(function(sk){ if(SRC[sk].at === b.k && HUMAN[sk]) LOG.push(say('<b>'+SRC[sk].t+'</b> was already written by '+ME.split(' ')[0]+', so I kept her text and checked it against the sources.')); }); if(stepByKey(b.k).x !== 'gate') act(stepByKey(b.k).x === 'ai' ? 'ai' : stepByKey(b.k).x,'done','Finished '+b.k+' '+stepByKey(b.k).t, b.k); paintAll(); scrollDoc(b.k);
    setTimeout(function(){ JUST = null; }, 1300);
    return next();
  }
  if(b.t === 'work'){
    var id = ACC.length, a = {i:b.i, n:0, done:false};
    ACC.push(a); LOG.push({acc:id});
    (function tick(){
      paintChat();
      T = setTimeout(function(){
        a.n++;
        if(a.n < b.i.length) return tick();
        a.done = true; paintChat(); T = setTimeout(run, SP.settle);
      }, SP.item);
    })();
    return;
  }
  if(b.t === 'consult'){
    push(say(b.ids.length > 2 ? 'Asking four water outcome agents. Each writes its module for North Norfolk Rivers, with a verdict.' : 'Asking the BNG and Carbon agents to value the co-benefits on the same land.'));
    var base2 = LOG.length; LOG.push('');
    var st = b.ids.map(function(){ return 'ask'; });
    function paintC(){ LOG[base2] = b.ids.map(function(id,i){ return conHtml(id, st[i]); }).join(''); paintChat(); }
    paintC();
    var i = 0;
    (function land(){
      T = setTimeout(function(){
        st[i] = 'back'; ESDONE[b.ids[i]] = 1; act(b.ids[i],'card','Assessed '+ESA[b.ids[i]].s.toLowerCase(),CUR); paintC(); paintAll();
        i++;
        if(i < b.ids.length) return land();
        T = setTimeout(run, SP.settle);
      }, SP.con);
    })();
    return;
  }
  if(b.t === 'ask' || b.t === 'dec' || b.t === 'wait'){ Q = b; BUSY = false; paintAll(); paintChat(); return; }
  if(b.t === 'end'){
    BUSY = false; CUR = null;
    push(say('Done. Fourteen steps, three decisions, one prospectus. Anglian has signed off, and the next catchment starts from the same price and rate card.'));
    paintAll(); return;
  }
}
function answer(i){
  var b = Q; if(!b) return;
  Q = null;
  var o = b.o[i];
  act('Lola Grundmann','ask','Answered: '+o[0], CUR);
  LOG.push(say(b.q));
  LOG.push(you(o[0]));
  S.splice.apply(S, [BI, 0].concat(o[1]));
  paintChat(); next();
}
function decide(i){
  var b = Q; if(!b) return;
  Q = null;
  var s = stepByKey(b.k);
  DEC[b.k] = {o:b.o[i][0], by:s.by, alt:i>0};
  act(s.by,'dec','Decided '+b.k+' '+s.t+' '+b.o[i][0], b.k);
  LOG.push(decHtml(b, true));
  if(i > 0) S.splice(BI, 0, {t:'say', h:'Recorded. In this sketch the run carries on so you can see the rest.'});
  paintChat(); paintAll(); next();
}
function reply(){
  var b = Q; if(!b) return;
  Q = null;
  LOG.push(waitHtml(b, true));
  LOG.push(them(b.who, b.r));
  act(b.who,'reply','Replied: '+b.r.split('. ')[0]+'.', CUR);
  paintChat(); next();
}

document.addEventListener('keydown', function(e){
  if(!Q || Q.t !== 'ask') return;
  var t = e.target; if(t && (t.tagName === 'INPUT' || t.isContentEditable)) return;
  var n = parseInt(e.key, 10); if(n >= 1 && n <= Q.o.length) answer(n-1);
});

/* Side questions from the team. Exchanges that changed nothing fold into one
   line; one that changed the document or a decision stays open. */
var SIDE = [];
function addSide(x, sub, keep){
  var last = LOG[LOG.length-1];
  if(!keep && last && last.side !== undefined){
    var g = SIDE[last.side];
    if(!g.keep && !g.live && g.x[0][0] === x[0][0]){ g.x = g.x.concat(x); g.s = sub || g.s; paintChat(); return last.side; }
  }
  SIDE.push({x:x, s:sub||'', keep:keep||null, open:false, pin:false});
  LOG.push({side:SIDE.length-1}); paintChat();
  if(keep) act(x[0][0],'ask','Asked a question that '+keep.charAt(0).toLowerCase()+keep.slice(1));
  return SIDE.length-1;
}
function firstName(n){ return n === 'Lola Grundmann' ? 'You' : n.split(' ')[0]; }
function sideBubbles(g){
  return g.x.map(function(e){
    return (e[0] === 'Lola Grundmann' ? you(e[1]) : '<div class="v8them">'+avName(e[0])+'<div class="v5you">'+e[1]+'</div></div>')
      + (e[2] ? say(e[2]) : '');
  }).join('');
}
function sideHtml(id){
  var g = SIDE[id];
  if(g.keep || g.pin || g.live){
    return sideBubbles(g) + (g.keep ? '<div class="v8keep"><i class="ti ti-pencil"></i>'+g.keep+'</div>' : '')
      + (g.pin ? '<div class="v8keep" style="color:var(--ink3)"><button class="v8pin" onclick="pinSide('+id+',false)">Fold away</button></div>' : '');
  }
  var n = g.x.length, who = firstName(g.x[0][0]);
  var t = who + ' asked ' + (n === 1 ? 'a question' : n + ' questions') + '<em>' + (g.s || g.x[0][1]) + '</em>';
  var mine = g.x[0][0] === 'Lola Grundmann';
  return '<div class="v8acc v8side'+(g.open?' open':'')+'"><button class="v8acch" onclick="toggleSide('+id+')"><i class="ti ti-messages"></i>'
    + '<span class="t">'+t+'</span><i class="ti ti-chevron-down ch"></i></button>'
    + (g.open ? '<div class="v8sideb">'+sideBubbles(g)+(mine ? '<button class="v8pin" onclick="pinSide('+id+',true)">Keep open for everyone</button>' : '')+'</div>' : '')
    + '</div>';
}
function toggleSide(id){ SIDE[id].open = !SIDE[id].open; var lg = document.getElementById('chatlog'), st = lg.scrollTop; paintChat(true); lg.scrollTop = st; }
function pinSide(id, on){ SIDE[id].pin = on; SIDE[id].open = false; var lg = document.getElementById('chatlog'), st = lg.scrollTop; paintChat(true); lg.scrollTop = st; }

function chatDownCheck(){
  var lg = document.getElementById('chatlog'), b = document.getElementById('chatdown'); if(!lg || !b) return;
  b.classList.toggle('on', lg.scrollHeight - lg.scrollTop - lg.clientHeight > 80);
}
function chatToEnd(){ var lg = document.getElementById('chatlog'); lg.scrollTo({top:lg.scrollHeight, behavior:'smooth'}); }
document.getElementById('chatlog').addEventListener('scroll', chatDownCheck);
window.addEventListener('resize', chatDownCheck);

var ACC = [], ACCOPEN = {};
function accHtml(id){
  var a = ACC[id], open = ACCOPEN[id];
  var cur = a.i[Math.min(a.n, a.i.length-1)];
  var head = a.done
    ? '<i class="ti ti-circle-check ok"></i><span class="t">'+a.i.length+(a.i.length===1?' action':' actions')+'<em>'+a.i[0][0]+(a.i.length>1?' and more':'')+'</em></span>'
    : '<i class="ti ti-loader-2 gyspin"></i><span class="t run">'+cur[0]+'</span>';
  return '<div class="v8acc'+(open?' open':'')+'"><button class="v8acch" onclick="toggleAcc('+id+')">'+head
    + '<i class="ti ti-chevron-down ch"></i></button>'
    + (open ? '<div class="v8accb">' + a.i.slice(0, a.done ? a.i.length : a.n+1).map(function(it,j){ return item(it, !a.done && j===a.n); }).join('') + '</div>' : '')
    + '</div>';
}
function toggleAcc(id){ ACCOPEN[id] = !ACCOPEN[id]; var lg = document.getElementById('chatlog'), st = lg.scrollTop; paintChat(true); lg.scrollTop = st; }
function paintChat(keep){
  var el = document.getElementById('chatin');
  var h = LOG.map(function(x){ return typeof x === 'string' ? x : x.side !== undefined ? sideHtml(x.side) : accHtml(x.acc); }).join('');
  if(Q){
    if(Q.t === 'start') h += startHtml();
    if(Q.t === 'ask') h += askHtml(Q);
    if(Q.t === 'dec') h += decHtml(Q, false);
    if(Q.t === 'wait') h += waitHtml(Q, false);
  } else if(BUSY && S[BI-1] && S[BI-1].t !== 'end' && S[BI-1].t !== 'work'){
    h += '<div class="v5step" style="color:var(--ink3)"><i class="ti ti-loader-2 gyspin" style="font-size:14px;margin-top:3px"></i><span>Working</span></div>';
  }
  if(S[BI-1] && S[BI-1].t === 'end' && !Q){
    h += '<div class="v8opts" style="margin-top:6px"><button class="v8opt" onclick="runReset()"><i class="ti ti-rotate" style="font-size:14px;margin-right:4px"></i>Run it again</button></div>';
  }
  el.innerHTML = h;
  var lg = document.getElementById('chatlog'); if(lg && !keep) lg.scrollTop = lg.scrollHeight;
  chatDownCheck();
}
function paintProg(){
  var el = document.getElementById('prog'); if(!el) return;
  var all = stepList(), tot = all.length, done = DONE.length;
  var s = CUR ? stepByKey(CUR) : null;
  var line = !DONE.length && !CUR ? '<b>Not started</b> &middot; '+tot+' steps'
    : done === tot ? '<b>All '+tot+' steps done</b>'
    : '<b>Step '+CUR+' of '+tot+'</b> &middot; '+chapOf(CUR).short;
  el.innerHTML = '<div class="v8pt">'+line+'<span class="c">'+done+' done</span></div>'
    + '<div class="v8bar">' + WF.map(function(c){
        var d = c.s.filter(function(x){ return isDone(x.k); }).length;
        var cur = CUR && !isDone(CUR) && c.s.some(function(x){ return x.k===CUR; });
        return '<span style="flex-grow:'+c.s.length+'"><i style="width:'+(d/c.s.length*100)+'%"></i>'
          + (cur ? '<em style="left:'+(d/c.s.length*100)+'%;width:'+(100/c.s.length)+'%"></em>' : '') + '</span>';
      }).join('') + '</div>';
  var a = document.getElementById('agtav'); if(a) a.classList.toggle('live', BUSY);
  var b = document.getElementById('agtav2'); if(b) b.classList.toggle('live', BUSY);
}

function paginate(){

    var el = kids[i], h = hOf(el);

      for(var j=i+1;j<kids.length;j++){ var hj = hOf(kids[j]); if(kids[j].dataset.h){ h += hj; continue; } h += Math.min(hj, PAGE_H - 40); break; }
    }
    if(used + h > PAGE_H && pages[pages.length-1].length){ pages.push([]); big.push(false); used = 0; }
    pages[pages.length-1].push(el.outerHTML);
    if(hOf(el) > PAGE_H) big[big.length-1] = true;

/* a simple rule-based rewrite for the sketch: shorter and or plainer */
function rewrite(q, msg){
  var m = msg.toLowerCase(), t = q;
  var plain = /simpl|plain|jargon|clear|understand|easier|layman|landowner/.test(m), short = /short|concise|tight|brief|less|trim|cut|wordy/.test(m);
  if(!plain && !short){ plain = short = true; }
  if(short){
    t = t.replace(/\s*\([^)]*\)/g, '').replace(/\b(really|very|also|just|actually|both|already|currently)\s+/gi, '');
    var ss = t.match(/[^.!?]+[.!?]+/g); if(ss && ss.length > 2) t = ss.slice(0, 2).join('');
    t = t.replace(/,\s*(which|and)\s+[^,.]*(?=\.)/, '');
  }
  if(plain){
    [['dissolved organic carbon','brown water'],['\\bDOC\\b','brown water'],['\\bMRV\\b','measurement'],['monetisable','sellable'],['abstracts from','takes water from'],
     ['abstraction','water taking'],['co-funded by','part-funded by'],['co-funding','part-funding'],['indicative','rough'],['landscape-scale','large-scale'],
     ['landscape scale','large scale'],['sequestering','storing'],['interventions','planned work'],['additionality','extra impact'],['stacking','combining'],['bilateral','one-to-one']]
      .forEach(function(p){ t = t.replace(new RegExp(p[0], 'gi'), function(w){ return /^[A-Z]/.test(w) && !/^[A-Z]+$/.test(w) ? p[1].charAt(0).toUpperCase()+p[1].slice(1) : p[1]; }); });
  }
  return t.replace(/\s{2,}/g, ' ').trim();
}

function navOff(){ var nav = navRow(); return nav ? nav.offsetHeight : 0; }
function relTop(el, sc){ return el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop; }

  var el = document.getElementById(id), sc = document.querySelector('.v5body');
  if(!el || !sc) return;
  ANCLOCK = Date.now() + 900;
  sc.scrollTo({top: Math.max(0, relTop(el, sc) - 32 - navOff()), behavior:'smooth'});
  setActive(id);
}
function setActive(id){
  var nav = document.getElementById('setnav'); if(!nav) return;
  [].forEach.call(nav.querySelectorAll('a'), function(a){ a.classList.toggle('on', a.getAttribute('data-id') === id); });
  var row = navRow(), on = nav.querySelector('a.on');
  if(row && on){ var box = row.firstChild; box.scrollTo({left: Math.max(0, on.offsetLeft - box.offsetLeft - 24), behavior:'smooth'}); }
  tocFollow(nav);
}
document.addEventListener('scroll', function(e){
  if(!e.target || !e.target.classList || !e.target.classList.contains('v5body')) return;
  var nav = document.getElementById('setnav'); if(!nav || Date.now() < ANCLOCK) return;
  var sc = e.target, ids = [].map.call(nav.querySelectorAll('a'), function(a){ return a.getAttribute('data-id'); }), cur = ids[0];
  ids.forEach(function(id){ var el = document.getElementById(id); if(el && relTop(el, sc) - 80 - navOff() <= sc.scrollTop) cur = id; });
  if(sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) cur = ids[ids.length-1];
  setActive(cur);
}, true);

    what:'Problem assets, treatment costs, ODIs and PCDs: needed to value water resources, bathing water and flood.', det:[['From','Not received'],['Ask','Data request to Anglian']]}
  ,
  out1:{kind:'Outputs', n:'GY Catchment Investment Plan, North Norfolk Rivers', ic:'ti-file-type-pdf', used:['4.1'], tag:'The client prospectus',
    what:'The prospectus Anglian Water receives: buyer drivers, outcome modules, funding stack and vehicle.', det:[['Format','PDF prospectus'],['Goes to','Anglian Water'],['Approved by','Al Maltby']]},
  out2:{kind:'Outputs', n:'Decisions log', ic:'ti-list-check', used:['4.3'], tag:'What was decided and why',
    what:'Every decision in this run, with who made it, plus the payment unit Anglian agreed.', det:[['Format','Rows on the programme record']]},
  out3:{kind:'Outputs', n:'Catchment rows', ic:'ti-database-export', used:['4.4'], tag:'Starts the next catchment',
    what:'Price, rate card, need and funding stack, written as data.', det:[['Format','Rows in the GY Data platform']]},
  out4:{kind:'Outputs', n:'Blueprint learnings', ic:'ti-bulb', used:['4.4'], tag:'Improves the next run',
    what:'What this run taught, sent to the Blueprint owner.', det:[['Format','Note, 1 learning'],['Goes to','Blueprint owner']]}
};
Object.keys(SITEMS).forEach(function(k){
  var it = SITEMS[k];
  it.meta = function(){
    if(it.kind === 'Skills' || it.kind === 'Context') return [it.tag, ''];
    if(it.kind === 'Connections') return it.st;
    if(it.kind === 'Tools') return [it.tag, ''];
    if(it.kind === 'Outputs') return isDone(it.used[0]) ? ['Ready','ok'] : [it.tag,''];
    if(it.kind === 'Inputs'){ if(it.miss) return it.inp; return isDone('1.1') ? it.inp : ['Not received','warn']; }
    return ['',''];
  };
});
function skDoc(b){
  return '<div class="v8dk2">Instructions</div><div class="v8skdoc">' + b.map(function(s){
    return '<h5>'+s[0]+'</h5>' + (Array.isArray(s[1]) ? '<ol>'+s[1].map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ol>' : '<p>'+s[1]+'</p>');
  }).join('') + '</div>';
}
function openItem(k){
  if(k === 'in1' || k === 'kndm') return openDM();
  var it = SITEMS[k]; if(!it) return;
  DR = 'item';
  var kd = KINDS.filter(function(x){ return x[0] === it.kind; })[0];
  var ic = document.getElementById('dricon');
  ic.className = 'v5dri'; ic.style.borderRadius = '';
  ic.style.background = it.dark ? 'var(--dark)' : (kd ? kd[2] : 'var(--graybg)');
  ic.style.color = it.dark ? 'var(--yellow)' : (kd ? kd[3] : 'var(--ink)');
  ic.innerHTML = '<i class="ti '+it.ic+'"></i>';
  document.getElementById('drtitle').textContent = it.n;
  var m = it.kind === 'Context' ? it.fresh
    : it.kind === 'Outputs' ? (isDone(it.used[0]) ? ['Ready','ok'] : ['Made at '+it.used[0],''])
    : it.meta();
  var b = '<div class="v8dr">'
    + '<div class="v8dk2">'+(it.kind === 'Agent' ? 'Agent' : it.kind.replace(/s$/,''))+'</div>'
    + '<div class="v8dtxt">'+it.what+'</div>'
    + (it.body ? skDoc(it.body) : '')
    + (m[0] && it.kind !== 'Skills' ? '<div class="v8istat '+(m[1]||'')+'">'+m[0]+'</div>' : '')
    + '<div class="v8dk2">Details</div>'
    + it.det.map(function(d,i){ return '<div class="v8row"'+(i?'':' style="border:none"')+'><span class="k">'+d[0]+'</span><span class="nm">'+d[1]+'</span></div>'; }).join('')
    + (it.lists||[]).map(function(l){
        return '<div class="v8dk2">'+l[0]+'</div>' + l[1].map(function(x,i){
          return '<div class="v8row"'+(i?'':' style="border:none"')+'><span class="ic"><i class="ti '+l[2]+'"></i></span><span class="nm">'+x+'</span></div>'; }).join('');
      }).join('')
    + (it.used.length ? '<div class="v8dk2">Used at</div>' : '') + '<div class="v8steps">' + it.used.map(function(s){
        var st = stepByKey(s);
        return '<button onclick="openTab(\'workflow\');openStep(\''+s+'\')"><b>'+s+'</b>'+st.t+'</button>';
      }).join('') + '</div>'
    + '</div>';
  document.getElementById('drbody').innerHTML = b;
  document.getElementById('drbody').scrollTop = 0;
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
}

/* ── the Ecosystem Service agent, read-only in the drawer ─────────────── */
function openAgent(id){
  var a = ESA[id];
  DR = 'agent';
  var ic = document.getElementById('dricon');
  ic.className = 'v5dri'; ic.style.background = a.c; ic.style.color = '#fff'; ic.style.borderRadius = '50%';
  ic.innerHTML = '<i class="ti '+a.ic+'"></i>';
  document.getElementById('drtitle').textContent = a.n;
  var open = (FLAGS[id] ? ['From North Norfolk Rivers: the need appears as 2,652 kg before committed works and 2,128 kg after AMP8. Fix one basis at Level 1?'] : []).concat(a.open);
  document.getElementById('drbody').innerHTML = '<div class="v8dr">'
    + '<div class="v8dk2">Manager</div>'
    + '<div class="v8row" style="border:none">'+mgrAv(id)+'<span class="nm">'+a.mgr[0]+'</span><span class="v8ph">Placeholder</span></div>'
    + '<div class="v8dk2">Status</div>'
    + '<div class="v8row" style="border:none"><span class="k">Checked</span><span class="nm">'+a.checked+'</span></div>'
    + '<div class="v8row"><span class="k">Used on</span><span class="nm">'+a.used+'</span></div>'
    + '<div class="v8dk2">Knows</div>' + a.knows.map(function(k,i){ return '<div class="v8row"'+(i?'':' style="border:none"')+'><span class="ic"><i class="ti ti-book"></i></span><span class="nm">'+k+'</span></div>'; }).join('')
    + '<div class="v8dk2">Can use</div>' + a.tools.map(function(k,i){ return '<div class="v8row"'+(i?'':' style="border:none"')+'><span class="ic"><i class="ti ti-tool"></i></span><span class="nm">'+k+'</span></div>'; }).join('')
    + '<div class="v8dk2">Waiting on its manager</div>'
    + (open.length ? open.map(function(q,i){ return '<div class="v8q'+(FLAGS[id]&&i===0?' new':'')+'"><i class="ti ti-help-circle"></i><div>'+q+'</div></div>'; }).join('')
                   : '<div class="v8dtxt">Nothing open.</div>')
    + '</div>';
  document.getElementById('drbody').scrollTop = 0;
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
}
function doFlag(id, quiet){
  if(FLAGS[id]) return;
  FLAGS[id] = 1;
  act('Lola Grundmann','flag','Flagged the need basis mismatch to '+ESA[id].mgr[0]);
  gyToast('Added to '+ESA[id].mgr[0]+'\'s weekly list');
  if(TAB === 'doc') openTab('doc', true);
  if(DR === 'agent') openAgent(id);
}

/* ── tabs and panels ───────────────────────────────────────────────────── */
var TABS = [['doc','ti-file-text','Document'],['workflow','ti-hierarchy-2','Workflow'],['activity','ti-activity','Activity'],['settings','ti-settings','Settings']];
var DRAWERS = [['outputs','ti-package','Outputs','']];
var TAB = 'doc', DR = null;
function paintTabs(){
  var shut = document.body.classList.contains('pclosed');
  document.getElementById('tabs').innerHTML =
    '<button class="v8agt'+(shut?'':' on')+'" onclick="toggleChat()" title="'+(shut?'Show':'Hide')+' the agent">'
      + '<span class="v8ava'+(BUSY?' live':'')+'" id="agtav"><i class="ti '+AGENT_IC+'"></i></span>Agent</button>'
    + '<span class="v5tdiv"></span>'
    + '<div class="v5tabgrp">' + TABS.map(function(t){
        var badge = t[0]==='workflow' ? DONE.length+'/'+stepList().length : '';
        return '<button class="v5tab'+(TAB===t[0]?' on':'')+'" onclick="openTab(\''+t[0]+'\')">'
          + '<i class="ti '+t[1]+'"></i><span class="lb">'+t[2]+'</span>'+(badge?'<b>'+badge+'</b>':'')+'</button>';
      }).join('') + '</div>'
    + '<div class="v5drgrp">' + DRAWERS.map(function(d){
        return '<button class="v5tab dr'+(DR===d[0]?' on':'')+'" onclick="openDrawer(\''+d[0]+'\')">'
          + '<i class="ti '+d[1]+'"></i><span class="lb">'+d[2]+'</span>'+(isDone('4.1')?'<b>1</b>':'')+'</button>';
      }).join('') + '</div>';
}
function openTab(k, keep){
  if(k === 'doc' && keep && TAB === 'doc' && docBusy()){ DOCPEND = true; return; }
  if(k !== 'workflow' && DR === 'step') closeDrawer();
  TAB = k; paintTabs();
  var el = document.getElementById('pbody');
  var sc = el.parentNode.scrollTop;
  el.classList.remove('wide');
  el.innerHTML = VIEWS[k]();
  document.body.classList.toggle('docview', k === 'doc');
  if(k === 'doc') paginate();
  el.parentNode.scrollTop = keep ? sc : 0;
}
function paintAll(){ paintTabs(); paintProg(); openTab(TAB, true);
  if(DR === 'outputs') document.getElementById('drbody').innerHTML = VIEWS.outputs(); }
function scrollDoc(k){
  if(TAB !== 'doc') return;
  var map = {'1.1':'sec-need','1.2':'sec-drivers','2.1':'sec-phos','2.2':'sec-cob','2.3':'sec-fund','2.4':'sec-buyers','3.1':'sec-exec','3.2':'sec-exec','4.3':'sec-basis'};
  var id = map[k]; if(!id) return;
  var s = document.getElementById(id); if(s) s.scrollIntoView({behavior:'smooth', block:'start'});
}
function toggleChat(){
  document.body.classList.toggle('pclosed');
  paintTabs();
}
function openDrawer(k){
  if(DR === k) return closeDrawer();
  DR = k;
  var d = DRAWERS.filter(function(x){ return x[0]===k; })[0];
  document.getElementById('dricon').className = 'v5dri hide';
  document.getElementById('drtitle').textContent = d[2];
  document.getElementById('drbody').innerHTML = VIEWS[k]();
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
  if(TAB === 'workflow') openTab('workflow', true);
}
function closeDrawer(){
  var wasStep = DR === 'step';
  var wasSrc = DR === 'src';
  DR = null; STEPSEL = null; SRCSEL = null;
  document.getElementById('drawer').classList.add('hide');
  document.getElementById('dricon').style.borderRadius = '';
  paintTabs();
  if(wasStep && TAB === 'workflow') openTab('workflow', true);
  if(wasSrc && TAB === 'doc') openTab('doc', true);
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(STEPSEL) closeStep(); else closeDrawer(); } });
function runReset(){
  if(T){ clearTimeout(T); T = null; }
  location.reload();
}
function sendMsg(){
  var inp = document.getElementById('ask'); var v = (inp.value||'').trim();
  if(!v) return;
  inp.value = '';
  var id = addSide([['Lola Grundmann', v, null]], '', null);
  var g = SIDE[id]; g.live = true; paintChat();
  setTimeout(function(){
    g.x[g.x.length-1][2] = 'In this sketch I cannot answer free questions yet. Nothing in the document changed, so for the others this folds into one line.';
    paintChat();
    setTimeout(function(){ g.live = false; paintChat(); }, 2600);
  }, 700);
}
function crExpand(){
  document.getElementById('crtrail').classList.add('on');
  document.getElementById('crmore').classList.add('hide');
}
document.addEventListener('paste', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[contenteditable]') : null;
  if(!t) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
/* chat width, as in v4-chat */
var CHAT_MIN = 340, CHAT_MAX = 680;
(function(){
  var w = 0;
  try{ w = parseInt(localStorage.getItem('gyChatW8') || '', 10) || 0; }catch(e){}
  if(w) document.body.style.setProperty('--chatw', Math.max(CHAT_MIN, Math.min(CHAT_MAX, w)) + 'px');
  var grip = document.getElementById('chatgrip'), chat = document.querySelector('.v5chat');
  if(!grip || !chat) return;
  grip.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var x0 = e.clientX, w0 = chat.getBoundingClientRect().width;
    document.body.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    function move(ev){
      var room = document.querySelector('.v5row').getBoundingClientRect().width - 420;
      var nx = Math.max(CHAT_MIN, Math.min(Math.min(CHAT_MAX, room), w0 + (ev.clientX - x0)));
      document.body.style.setProperty('--chatw', Math.round(nx) + 'px');
    }
    function up(){
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up);
      document.body.classList.remove('dragging');
      try{ localStorage.setItem('gyChatW8', String(Math.round(chat.getBoundingClientRect().width))); }catch(e){}
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
})();
/* the sidebar opens on the collapsed icon rail here: GYNAV.rail in gy-nav.js */

/* opening state: the agent introduces itself and asks the first question */
act('Lola Grundmann','start','Created the deliverable from the Catchment Investment Plan Blueprint v0.2');
act('ai','start','Pre-filled 2 parts of the plan from the Level 1 pricing');
LOG.push(say('I am set up for <b>North Norfolk Rivers</b> from the Catchment Investment Plan Blueprint: fourteen steps, three decisions. I pre-filled the need and the price and rate card from the A-WINEP phosphorus pricing, so this catchment uses the same price as the other ten. The rest fills in as we go; click any grey block to see where it comes from or write it yourself, and select text to leave me a comment.'));
LOG.push(dmCard());
BI = 0;
Q = {t:'start'};
paintTabs(); paintProg(); openTab('doc'); paintChat();
/* ── fill to here (8 Oct): click a step's circle in Workflow and the run fast-forwards to the end of
   that step, taking the recommended answer at every question, decision and review, then pauses. ── */
var FF = null, FFSP = null;
function ffTo(k){
  if(FF) return;
  if(isDone(k)){ gyToast('Step '+k+' is already done. Restart the run from the page menu to go back.'); return; }
  FF = k; FFSP = {say:SP.say, item:SP.item, settle:SP.settle, con:SP.con};
  SP.say = SP.item = SP.settle = SP.con = 0;
  if(Q && Q.t === 'ff'){ Q = null; }
  if(!Q && !T && S[BI] && S[BI].t !== 'end') run();
  ffPump();
}
function ffPump(){
  if(!FF) return;
  if(S[BI-1] && S[BI-1].t === 'end' && !Q){ ffRestore(); return; }
  if(Q){
    if(Q.t === 'start') startDeliverable();
    else if(Q.t === 'ask') answer(0);
    else if(Q.t === 'dec') decide(0);
    else if(Q.t === 'wait') reply();
  }
  setTimeout(ffPump, 15);
}
function ffRestore(){ if(FFSP){ SP.say = FFSP.say; SP.item = FFSP.item; SP.settle = FFSP.settle; SP.con = FFSP.con; } FFSP = null; FF = null; }
var ffRun0 = run;
run = function(){
  if(FF && isDone(FF)){
    var k = FF; T = null; BUSY = false; ffRestore();
    LOG.push(say('Filled the document up to step <b>'+k+'</b>, taking the recommended answer at each question and decision. I paused here.'));
    Q = {t:'ff'}; paintAll(); paintChat(); return;
  }
  ffRun0();
};
function ffResume(){ if(!Q || Q.t !== 'ff') return; Q = null; paintChat(); run(); }
var ffPaint0 = paintChat;
paintChat = function(keep){
  ffPaint0(keep);
  if(Q && Q.t === 'ff'){
    var el = document.getElementById('chatin');
    el.insertAdjacentHTML('beforeend', '<div class="v8start"><button class="v8aopt pri" onclick="ffResume()"><i class="ti ti-player-play"></i><span>Continue the run</span></button></div>');
    var lg = document.getElementById('chatlog'); if(lg && !keep) lg.scrollTop = lg.scrollHeight;
  }
};
document.addEventListener('click', function(e){
  var m = e.target.closest && e.target.closest('.v8ws .mk'); if(!m) return;
  e.stopPropagation(); e.preventDefault();
  var no = m.parentNode.querySelector('.no'); if(no) ffTo(no.textContent.trim());
}, true);
</script>
