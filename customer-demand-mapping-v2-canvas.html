 else if(_m)history.replaceState(null,'',location.pathname);}
function isPrev(){return MODE==='run'&&RUN==='preview'}
function runMenu(e){
  e.stopPropagation();
  const m=document.getElementById('runmenu');
  if(m.style.display==='block'){m.style.display='none';return;}
  const r=e.currentTarget.getBoundingClientRect();
  m.style.left=r.left+'px'; m.style.top=(r.bottom+8)+'px';
  const item=(id,ic,t)=>`<div onclick="setRun('${id}')" style="display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;${RUN===id?'background:#F8F5ED':''}" onmouseover="this.style.background='#F8F5ED'" onmouseout="this.style.background='${RUN===id?'#F8F5ED':'#fff'}'">
    <span style="width:18px;text-align:center;flex:none">${ic.startsWith('ti-')?`<i class="ti ${ic}" style="font-size:16px;color:var(--ink2)"></i>`:ic}</span>
    <span style="flex:1;white-space:nowrap">${t}</span>
    ${RUN===id?'<i class="ti ti-check" style="font-size:15px;color:var(--greend)"></i>':''}</div>`;
  m.innerHTML=item('spains','🪺','Spains Hall')
    +item('riverallen','🌸','River Allen')
    +item('denton','🦡','Denton Reserve')
    +item('wash','🐚','The Wash')
    +item('wylye','🐞','Wylye Valley')
    +item('norfolk','🌼','West Norfolk Nature Network')
    +`<div onclick="setRun('new')" style="display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line);color:var(--ink2)" onmouseover="this.style.background='#F8F5ED'" onmouseout="this.style.background='#fff'">
      <i class="ti ti-plus" style="font-size:15px"></i><span>Start a new run</span></div>`;
  m.style.display='block';
}
document.addEventListener('click',()=>{const m=document.getElementById('runmenu');if(m)m.style.display='none';});
function setRun(r){
  document.getElementById('runmenu').style.display='none';
  if(r==='new'){toast('This would open the pre-flight brief: pick the Programme, confirm the people, launch');return;}
  if(r!=='preview'&&r!=='spains'){toast('Prototype: only the Spains Hall run has data. The others are set dressing.');return;}
  if(DEMOT!==null||DEMOSNAP)stopDemo();
  RUN=r;SELECTED=null;renderAll();
}

function portPos(id,i){
  const nodeEl=document.querySelector(`.node[data-id="${id}"]`);
  if(!nodeEl)return null;
  const p=nodeEl.querySelectorAll('.bport')[i];
  if(!p)return null;
  let x=p.offsetWidth/2,y=p.offsetHeight/2,el=p;
  while(el&&!(el.classList&&el.classList.contains('world'))){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent;}
  return{x,y:y-5};
}

function edgeTarget(e){
  if(e.from)return NODES.find(n=>n.id===e.from);
  if(e.x2==null)return null;
  return NODES.find(n=>Math.abs(n.x-e.x2)<10||Math.abs(n.x+n.w/2-e.x2)<10);
}
function edgeS(e){
  const t=edgeTarget(e);
  if(!t)return 'lock';
  const st=t.r.st;
  if(e.from)return st==='done'?'done':(st==='queue'||st==='active')?'hot':'lock';
  return (st==='done')?'done':(st==='active'||st==='queue'||st==='fail')?'done':'lock';
}
function branchS(b){
  const g=NODES.find(n=>n.id===b.n);
  if(!g)return 'lock';
  if(g.r.st==='fail'&&g.r.rowhot===b.i)return 'hot';
  if(g.r.st==='done'&&(g.r.rowhot??0)===b.i)return 'done';
  return 'lock';
}
function renderEdges(){
  const col=s=>MODE==='design'?'#C9C7C0':isPrev()?'#DBD9D2':(s==='done'?'#639922':s==='hot'?'#EF9F27':'#DBD9D2');
  const mk=s=>MODE==='design'?'url(#arr)':isPrev()?'url(#arrl)':(s==='done'?'url(#arrg)':s==='hot'?'url(#arra)':'url(#arrl)');
  const branchPaths=BRANCHES.map(b=>{
    const p=portPos(b.n,b.i);
    if(!p)return '';
    const s=(MODE==='run'&&!isPrev())?branchS(b):b.s;
    const w=MODE==='run'&&s==='hot'?2:1.5;
    return `<path d="${b.mk(Math.round(p.x),Math.round(p.y))}" fill="none" stroke="${col(s)}" stroke-width="${w}" marker-end="${mk(s)}"/>`;}).join('');
  document.getElementById('edgeg').innerHTML=EDGES.map(e=>{
    const s=(MODE==='run'&&!isPrev())?edgeS(e):e.s;
    const w=MODE==='run'&&(s==='done'||s==='hot')?2:1.5;
    const dash=e.dash?'stroke-dasharray="5 4"':'';
    if(e.d){
      const d=(MODE==='run'&&e.dRun)?e.dRun:e.d;
      return `<path d="${d}" fill="none" stroke="${col(s)}" stroke-width="${w}" ${dash} marker-end="${mk(s)}"/>`;
    }
    return `<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${col(s)}" stroke-width="${w}" ${dash} marker-end="${mk(s)}"/>`;}).join('')+branchPaths;
}

function toolUsedBy(id){
  const norm=x=>((x==='checklist'||x==='intake')?'questionnaire':x);
  const target=norm(id);
  const out=[];
  NODES.forEach(n=>{
    if(!n.form||!n.form.steps)return;
    const steps=[];
    n.form.steps.forEach((sp,i)=>{
      if((sp.arts||[]).some(a=>norm(a)===target))steps.push(i+1);
    });
    if(steps.length)out.push(`${n.title} · step ${steps.join(', ')}`);
  });
  return out;
}

async function saveResultPDF(){
  const src=document.querySelector('#docm .docwrap');
  if(!src){toast('Open the result first, then Save as PDF');return;}
  const title=(document.querySelector('#docm .dtitle')?.textContent||'Customer Demand Mapping').trim();
  const base=title.replace(/[^\w\- ]+/g,' ').replace(/\s+/g,' ').trim()||'Customer Demand Mapping';
  const fname=base+'.pdf';
  const H2C=window.html2canvas, JS=window.jspdf&&window.jspdf.jsPDF;
  if(!H2C||!JS){ toast('PDF engine still loading, try again in a moment'); return; }
  toast('Generating PDF...');
  const W=800;
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:0;top:0;z-index:-9999;width:'+W+'px;background:#fff';
  const clone=src.cloneNode(true);
  clone.removeAttribute('class');
  clone.style.cssText='box-sizing:border-box;width:'+W+'px;margin:0;padding:30px 46px 34px;background:#fff;border:none;box-shadow:none;border-radius:0;color:#1F1F1D';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  try{
    const canvas=await H2C(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,width:W,windowWidth:W,scrollX:0,scrollY:0});
    // Safe break points: the top of every atomic block, so a page never ends mid-content.
    const cTop=clone.getBoundingClientRect().top;
    const ratio=canvas.height/clone.scrollHeight;
    const safe=new Set();
    clone.querySelectorAll('.dsec,.dh2,.dgrp,.docrow,.cbox,.cbox>div,.gbox,.gbox>div,.grow,.dchips,.outbox,.outdone').forEach(el=>{
      const t=(el.getBoundingClientRect().top-cTop)*ratio;
      if(t>0) safe.add(Math.round(t));
    });
    const breaks=[...safe].sort((a,b)=>a-b);
    const pdf=new JS('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const m=10, cw=pw-2*m;
    const pxPerMM=canvas.width/cw;
    const pageHpx=Math.floor((ph-2*m)*pxPerMM);
    let pos=0, first=true;
    while(pos<canvas.height-1){
      const naive=pos+pageHpx;
      let end;
      if(naive>=canvas.height){ end=canvas.height; }
      else {
        let cand=pos;
        for(const b of breaks){ if(b>pos+2 && b<=naive) cand=b; else if(b>naive) break; }
        end=(cand>pos && (cand-pos)>=pageHpx*0.25) ? cand : naive; // keep pages reasonably full
      }
      const sliceH=Math.min(end-pos, canvas.height-pos);
      const slice=document.createElement('canvas');
      slice.width=canvas.width; slice.height=sliceH;

      if(!first)pdf.addPage();

function buildResultToc(){
  const d=document.getElementById('docm'),nav=document.getElementById('dtoc');
  if(!d||!nav)return;
  const secs=[...d.querySelectorAll('.dsec')];
  if(!secs.length){nav.innerHTML='';return;}
  const live=MODE==='run'&&!isPrev();
  // Granular progress: count completed STEPS across nodes, grouped by phase band.
  const bandOf=x=>{for(let bi=0;bi<BANDS.length;bi++){const b=BANDS[bi];if(x>=b.x&&x<b.x+b.w)return bi;}return -1;};
  const stepStat=n=>{const L=(n.form&&n.form.steps)?n.form.steps.length:0;if(!L)return[0,0];
    if(RESULT_COMPLETE)return[L,L];
    if(!live)return[0,L];
    const st=n.r&&n.r.st;
    let d=st==='done'?L:(st==='active'?Math.max(0,Math.min(L,(n.r.prog!=null?n.r.prog:(n.r.cur>0?n.r.cur:0)))):0);
    return[d,L];};
  const secStats=BANDS.map(()=>[0,0]);
  NODES.forEach(n=>{const st=stepStat(n);if(!st[1])return;const bi=bandOf(n.x);if(bi<0)return;secStats[bi][0]+=st[0];secStats[bi][1]+=st[1];});
  const totD=secStats.reduce((a,s)=>a+s[0],0), totL=secStats.reduce((a,s)=>a+s[1],0);
  const pct=totL?Math.round(totD/totL*100):0;
  const secDone=secStats.map(s=>live&&s[1]>0&&s[0]===s[1]);
  const firstOpen=secDone.indexOf(false);
  let h= (live||RESULT_COMPLETE)?`<div class="tocprog"><div class="tpnum"><b>${pct}% complete</b><span>${totD} of ${totL} steps</span></div><div class="tpbar"><i style="width:${pct}%"></i></div></div>`:'';
  h+='<div class="tlab">On this page</div>';
  secs.forEach((s,i)=>{
    s.id='dsec'+i;s.style.scrollMarginTop='16px';
    const num=(s.querySelector('.dnum')?.textContent||'').trim();
    const t=(s.querySelector('.dh2')?.textContent||'').trim().replace(/^\d+\s*/,'');
    const isDone=secDone[i];
    const cur=live&&!isDone&&i===firstOpen;
    const badge=isDone?'<span class="tocb"><span class="tocchk"><i class="ti ti-check"></i></span></span>'
      :cur?'<span class="tocb"><span class="toccur"></span></span>'
      :'<span class="tocb"></span>';
    const st=secStats[i]||[0,0];
    const frac=live&&st[1]?`<span class="tocfrac">${st[0]}/${st[1]}</span>`:'';
    h+=`<a data-i="${i}" onclick="resTocGo(${i})">${badge}<span class="toctxt">${num?num+' · ':''}${t}</span>${frac}</a>`;
  });
  h+=`<button class="fdemo dtocview" onclick="toggleResultComplete()"><i class="ti ${RESULT_COMPLETE?'ti-player-track-prev':'ti-circle-check'}"></i> ${RESULT_COMPLETE?'View live progress':'View completed'}</button>`;
  nav.innerHTML=h;
  const links=[...nav.querySelectorAll('a')];
  const upd=()=>{
    const top=d.getBoundingClientRect().top;
    let cur=0;
    secs.forEach((el,i)=>{if(el.getBoundingClientRect().top-top<60)cur=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===cur));
  };
  d.onscroll=upd;upd();
}

function buildStamps(){
  const ORDER=['kickoff','sendq','receive','gate1','followup','beneficiary','abstraction','targets','funding','buyerlist','relations','gate2','park','derive','assess','gate3','draft','gonogo','share','scrape','platform','done','refresh'];
  FLOW=ORDER.filter(id=>{const n=NODES.find(x=>x.id===id);return n&&n.form&&n.form.steps&&n.form.steps.length;});
  const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let cur=new Date(2025,5,30,9,0); // Mon 30 Jun 2025, 09:00
  const fmt=d=>`${DN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const adv=m=>{cur=new Date(cur.getTime()+m*60000); if(cur.getHours()>=18){cur.setDate(cur.getDate()+1);cur.setHours(9,0,0,0);}};
  STEPSTAMP={};
  ORDER.forEach(id=>{
    const n=NODES.find(x=>x.id===id); if(!n||!n.form||!n.form.steps)return;
    STEPSTAMP[id]=n.form.steps.map(()=>{const s=fmt(cur);adv(8);return s;});
    adv(22);
  });
}

/* keep the canvas visually pinned while the drawer opens, closes or resizes.
   Only needed when the drawer is docked LEFT of the canvas (it then steals
   viewport from the left, so width changes are mirrored into scrollLeft).
   With the default right dock the canvas left edge never moves. */
(function(){
  const sideEl=document.querySelector('.main .side');
  const sc=document.querySelector('.scroll');
  if(!sideEl||!sc||!window.ResizeObserver)return;
  let last=sideEl.getBoundingClientRect().width;
  new ResizeObserver(()=>{
    const r=sideEl.getBoundingClientRect();
    const d=r.width-last; last=r.width;
    if(d&&r.left<=sc.getBoundingClientRect().left)sc.scrollLeft+=d;
  }).observe(sideEl);
})();

function ownerOf(n){ return (((n.form&&n.form.owner)||'').replace(/^\?\s*/,'').trim())||'Caitlin'; }
function applyManualLens(){
  if(!MANUAL)return;
  Object.keys(STEPWHO).forEach(function(k){ STEPWHO[k]=STEPWHO[k].map(function(){return 'human';}); });
  Object.keys(STEPARTS).forEach(function(k){ var o=STEPARTS[k]; Object.keys(o).forEach(function(i){ o[i]=o[i].filter(function(a){return !DATA_ARTS[a];}); if(!o[i].length)delete o[i]; }); });
  for(var i=ALIST.length-1;i>=0;i--){ if(DATA_ARTS[ALIST[i].id]){ALIST.splice(i,1);} }
  ALIST.forEach(function(a){
    if(a.id==='precall'||a.id==='gapsum'){ a.name=a.name.replace(/^Assistant · /,'Note · '); a.sub='drafted by the team'; a.ic='ti-file-text'; a.bg='#378ADD'; a.fg='#fff'; }
    a.name=mScrub(a.name); a.sub=mScrub(a.sub);
  });
  for(var j=ARTEFACTS.length-1;j>=0;j--){ if(DATA_ARTS[ARTEFACTS[j].id]){ARTEFACTS.splice(j,1);} }
  ARTEFACTS.forEach(function(a){
    if(a.id==='precall'||a.id==='gapsum'){ a.name=a.name.replace(/^Assistant · /,'Note · '); a.ic='ti-file-text'; }
    a.desc=mScrub(a.desc); a.name=mScrub(a.name); a.prev=mScrub(a.prev);
  });
  Object.keys(TOOLMETA).forEach(function(k){ if(DATA_ARTS[k]){delete TOOLMETA[k];return;} var m=TOOLMETA[k]; if(m&&m.mod)m.mod=mScrub(m.mod); });
  NODES.forEach(function(n){
    var own=ownerOf(n);
    if(n.t===T.agent||n.t===T.det||n.t===T.data) n.t=T.human;
    n.title=mScrub(n.title);
    if(n.d) n.d.sub=mScrub(n.d.sub);
    if(n.r){ n.r.sub=mScrub(n.r.sub); n.r.note=mScrub(n.r.note); }
    if(n.info) n.info=mScrub(n.info);
    if(n.run){ n.run.happened=mScrub(n.run.happened); n.run.status=mScrub(n.run.status); n.run.log=mScrub(n.run.log); }
    if(n.form){
      var f=n.form;
      f.exec='Human-led';
      if(Array.isArray(f.steps)) f.steps=f.steps.map(function(s){ return typeof s==='string'? mScrub(s.replace(/^AI Assistant\b/, own)) : s; });
      f.what=mScrub(f.what); f.done=mScrub(f.done); f.guard=mScrub(f.guard);
      if(Array.isArray(f.arts)) f.arts=f.arts.filter(function(a){return !DATA_ARTS[a];});
      if(Array.isArray(f.produces)) f.produces=f.produces.map(mScrub);
      if(Array.isArray(f.needs)) f.needs=f.needs.filter(function(x){return !/reference library|Hive Mind Library/.test(x[0]);}).map(function(x){return [mScrub(x[0]),mScrub(x[1])];});
    }
  });
  var byId=function(id){return NODES.find(function(x){return x.id===id;});};
  var pf=byId('platform'); if(pf){ pf.title='File the finished map'; pf.t=T.human; if(pf.d)pf.d.sub='Save to the shared folder'; if(pf.form){ pf.form.owner='Harry'; pf.form.what='Save the finished map in the shared folder.'; pf.form.produces=['Filed map, with who and when']; pf.form.done='After this: the finished map is filed in the shared folder where the team can find it.'; pf.form.steps=['Harry checks the map is complete','Harry files it in the shared folder','Harry notes who filed it and when']; } }
  var st=byId('store'); if(st){ st.title='Shared folder'; if(st.d)st.d.sub='Where finished maps live'; st.info='The shared folder where finished maps are filed, so the team can find and reuse them. No database and no integrations: just well-named files in one place.'; }
  var start=byId('start'); if(start) start.info='Terminals carry no work. A run begins here when someone on the team starts it.';
  var done=byId('done'); if(done) done.info='Demand Map complete. The finished map is filed in the shared folder for the team to use.';
  var dk=byId('desktop'); if(dk&&dk.d) dk.d.sub='Published prices and trend reports';
  // demo playback: no AI actor, human-only narration
  if(typeof DEMOSTEPS!=='undefined'&&Array.isArray(DEMOSTEPS)){
    DEMOSTEPS.forEach(function(s){
      if(s.t){ if(s.t[0]==='agent')s.t[0]='gy'; s.t[1]=mScrub(s.t[1]); }
      if(s.set)Object.keys(s.set).forEach(function(k){ if(s.set[k]&&s.set[k].sub)s.set[k].sub=mScrub(s.set[k].sub); });
    });
  }
}
function scrubBuiltSteps(){
  if(!MANUAL)return;
  NODES.forEach(function(n){
    if(!n.form||!Array.isArray(n.form.steps))return;
    var own=ownerOf(n);
    n.form.steps.forEach(function(sp){
      if(!sp||typeof sp!=='object')return;
      sp.ownerN=own;
      if(typeof sp.t==='string') sp.t=mScrub(sp.t);
      if(typeof sp.plain==='string') sp.plain=mScrub(sp.plain);
      if(typeof sp.inst==='string') sp.inst=mScrub(sp.inst);
      if(typeof sp.guard==='string') sp.guard=mScrub(sp.guard);
      if(Array.isArray(sp.arts)) sp.arts=sp.arts.filter(function(a){return !DATA_ARTS[a];});
      if(Array.isArray(sp.story)) sp.story=sp.story.map(function(clause){ return clause.map(function(part){ return mScrub(part); }); });
    });
  });
  var dk=NODES.find(function(x){return x.id==='desktop';});
  if(dk&&dk.form&&Array.isArray(dk.form.steps)&&dk.form.steps[1]){
    dk.form.steps[1].plain='Gathers published market prices from public sources by hand, noting each figure with its source and the date it was taken.';
    dk.form.steps[1].story=[['Gathers published market prices from public sources'],['Notes each figure with its source and date']];
  }
}

applyManualLens();
initSteps();
buildStamps();
scrubBuiltSteps();
function nodeNav(dir){
  const fi=FLOW.indexOf(SELECTED); if(fi<0)return;
  const t=FLOW[fi+dir]; if(!t)return;
  focusNode(t); openNode(t);
}
// Arrow keys: Up/Down page through steps in the step view; Left/Right move between nodes in the node drawer
document.addEventListener('keydown',e=>{
  if(!/^Arrow(Up|Down|Left|Right)$/.test(e.key))return;
  const t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  const side=document.querySelector('.main .side');
  if(!side||side.classList.contains('hidden'))return;
  const drawerL=document.getElementById('drawerL');
  if(drawerL&&getComputedStyle(drawerL).display!=='none')return;
  const stepView=[...document.querySelectorAll('#side .subslide .nt')].some(el=>/^Step\s/.test(el.textContent));
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(!stepView)return;
    const n=NODES.find(x=>x.id===SELECTED);
    if(!n||!n.form||!n.form.steps)return;
    e.preventDefault();
    stepNav(e.key==='ArrowDown'?1:-1);
  } else { // Left / Right
    if(stepView||SELECTED==null||FLOW.indexOf(SELECTED)<0)return;
    e.preventDefault();
    nodeNav(e.key==='ArrowRight'?1:-1);
  }
});
renderAll();
if(EMBED_DRAWER){
  openNode(EMBED_DRAWER);
  // The drawer's own X should close the drawer in the parent (Home) page.
  document.addEventListener('click',e=>{
    if(e.target.closest('.sh .x')){
      e.preventDefault();e.stopPropagation();
      try{parent.postMessage('gy-close-drawer','*');}catch(_){}
      return;
    }
    // Click on the transparent area beside the drawer: close preview, else close drawer.
    if(!e.target.closest('.side')&&!e.target.closest('.svpanel')){
      const p=document.getElementById('svpanel');
      if(p&&p.classList.contains('on')){svPanelClose();}
      else{try{parent.postMessage('gy-close-drawer','*');}catch(_){}}
    }
  },true);
}
(function(){
  if(EMBED_DRAWER)return;
  const sc=document.querySelector('.scroll');
  const center=()=>{
    const now=NODES.find(n=>n.r&&n.r.outline)||NODES.find(n=>n.r&&n.r.st==='active');
    if(now){
      const cx=600+(now.x+now.w/2)*Z, cy=800+((now.y+40)-235)*Z;
      sc.scrollLeft=cx-sc.clientWidth/2;
      sc.scrollTop=cy-sc.clientHeight/2;
    } else {
      sc.scrollTop=(sc.scrollHeight-sc.clientHeight)/2;
      sc.scrollLeft=520;
    }
  };
  // Center now, and re-center after the drawer/ResizeObserver settle their layout
  // (the drawer's initial resize otherwise shifts scrollLeft away from the node).
  center();
  requestAnimationFrame(center);
  [60,160,320].forEach(t=>setTimeout(center,t));
  window.addEventListener('load',()=>requestAnimationFrame(center));
})();

/* Apply created deliverable (?deliverable): crumb name + team from the create modal */
(function(){
  try{
    var pid=new URLSearchParams(location.search).get('deliverable');
    if(!pid)return;
    var arr=JSON.parse(localStorage.getItem('gyDeliverables')||'[]');
    var d=arr.filter(function(x){return x.id===pid;})[0];
    if(!d)return;
    var setCrumb=function(){var el=document.getElementById('crumbTitle');if(el&&d.n)el.textContent=d.n;};
    setCrumb();
    if(typeof renderTabs==='function'){var _rt=renderTabs;renderTabs=function(){_rt.apply(this,arguments);setCrumb();};}
    var COL={'Caitlin':'#1D9E75','Harry':'#EF9F27','Katia':'#7F77DD','Emily':'#378ADD','Josh':'#639922','Izzie':'#D4537E','Trade lead':'#3B82F6','Kishen':'#215274','Thomas':'#378ADD'};
    if(typeof TEAM!=='undefined'&&Array.isArray(TEAM)){
      TEAM.length=0;
      TEAM.push({n:(d.champ||'Caitlin'),c:COL[d.champ]||'#1D9E75',captain:true,live:true,seen:'now'});
      (d.team||[]).forEach(function(nm){ if(nm===d.champ)return; TEAM.push({n:nm,c:COL[nm]||'#8C887F',live:false,seen:'today'}); });
      if(typeof renderTeam==='function')renderTeam();
    }
  }catch(e){}
})();
