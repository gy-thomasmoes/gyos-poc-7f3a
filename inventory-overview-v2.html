.v8wo{font-size:12px;font-weight:500;padding:2px 9px}
.v8wo.dec{font-size:10.5px;font-weight:600}
.v8who{font-size:12.5px;gap:6px}
.v8who .dlav,.v8who .v8ava{width:20px;height:20px;font-size:8.5px}
.v8ws .ch{font-size:15px}

/* 60px all round inside the floating card, on all three tabs; content fills the width (3 Oct) */
.v5body{padding:60px}
.v5bin,.v5bin.wide{max-width:none;margin:0}
.v8setw{display:flex;gap:48px;align-items:flex-start;position:static}
.v8setc{flex:1;min-width:0;width:auto}
.v8anc{position:sticky;top:24px;left:auto;bottom:auto;width:120px;flex:none;padding-top:0}
.v8anc > div{position:static}
@container pane (max-width: 779px){
  .v8setw{flex-direction:column;gap:0}
  .v8anc{top:-60px;width:auto}
}
/* Current vs needs-you (3 Oct): the current step takes the current tokens (ink);
   amber stays only for a human in the loop: decisions and asks. */
@keyframes gypipcur{0%,100%{box-shadow:0 0 0 3px var(--curbg,#ECE8DD)}50%{box-shadow:0 0 0 6px rgba(26,12,18,.10)}}
.v8ws.cur{background:var(--currow,#F7F5EF)}
.v8ws.cur .mk{border-color:var(--cur,#1A0C12);animation:gypipcur 1.6s ease-in-out infinite}
.v8wo.now{background:var(--curbg,#ECE8DD);color:var(--curd,#1A0C12)}
.v5wf.cur .dot{border-color:var(--cur,#1A0C12);animation:gypipcur 1.6s ease-in-out infinite}
.v5wf .now{background:var(--curbg,#ECE8DD);color:var(--curd,#1A0C12)}
.v8now .pip{background:var(--cur,#1A0C12);animation:gypipcur 1.6s ease-in-out infinite}
.v8now .k{color:var(--curd,#1A0C12)}
.v8now.gate .pip{background:var(--amber);animation:gypip 1.5s ease-in-out infinite}
.v8now.gate .k{color:var(--amberd)}
@media (prefers-reduced-motion:reduce){.v8ws.cur .mk,.v5wf.cur .dot,.v8now .pip{animation:none}}

/* no divider under page titles; document gets the same anchor nav as settings (3 Oct) */
.v5dt,.v8ttl{border-bottom:none;padding-bottom:0;margin-bottom:40px}
.v8docw .v5sec:first-child{margin-top:0}

/* settings: the project header block leads (3 Oct) */
.v8proj{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#FBF8EF 0%,var(--card) 70%);
  padding:24px 24px 20px;scroll-margin-top:24px}
.v8proj .pt{display:flex;align-items:center;gap:14px}
.v8proj .pb{width:46px;height:46px;border-radius:12px;background:var(--greenbg);color:var(--greend);font-weight:700;font-size:15px;
  letter-spacing:.02em;display:flex;align-items:center;justify-content:center;flex:none}
.v8proj .n{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;line-height:1.1}
.v8proj .s{font-size:14px;color:var(--ink3);margin-top:3px}
.v8proj .pc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.v8proj .pc span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.v8proj .pc .ti{font-size:14px;color:var(--ink3)}
.v8proj .ptm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.v8proj .pp{display:flex;align-items:center;gap:10px;min-width:0}
.v8proj .pp .dlav{width:32px;height:32px;font-size:11.5px}
.v8proj .pp div{min-width:0}
.v8proj .pp b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8proj .pp > div span{display:block;font-size:12.5px;color:var(--ink3)}

/* section nav: fixed column and one weight for every label, so the active label never rewraps and shifts the list (3 Oct).
   Active is marked by ink and the bar only. */
.v8anc{width:150px}
.v8anc a{white-space:normal;line-height:1.35;font-weight:500}
.v8anc a.on{font-weight:500}

/* settings: one Agents card, add team member (3 Oct) */
.v8sub{padding:14px 18px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
  border-top:1px solid var(--line)}
.v8sub + .v8row{border-top:none}
.v8proj .pp.add{cursor:pointer;color:var(--ink2)}
.v8proj .pp.add b{font-weight:500;color:var(--ink2)}
.v8proj .pp.add:hover b{color:var(--ink)}
.v8proj .pa{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--line2);display:inline-flex;align-items:center;
  justify-content:center;flex:none;color:var(--ink3);font-size:15px}
.v8proj .pp.add:hover .pa{border-color:var(--ink3);color:var(--ink)}
.v8proj .padd{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.v8proj .padd button{display:flex;align-items:center;gap:10px;width:100%;border:none;border-top:1px solid var(--line);background:none;
  padding:9px 14px;font-family:inherit;font-size:14px;cursor:pointer;text-align:left}
.v8proj .padd button:first-child{border-top:none}
.v8proj .padd button:hover{background:#FBF9F2}
.v8proj .padd .dlav{width:24px;height:24px;font-size:9px;flex:none}
.v8proj .padd span:not(.dlav){color:var(--ink3);font-size:13px;flex:1}
.v8proj .padd .ti{color:var(--ink3);font-size:15px}

/* settings item drawer (3 Oct) */
.v8istat{display:inline-flex;margin-top:10px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--graybg);color:var(--ink2)}
.v8istat.ok{background:var(--greenbg);color:var(--greend)}
.v8istat.warn{background:var(--amberbg);color:var(--amberd)}
.v8steps{display:flex;flex-direction:column;gap:6px}
.v8steps button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;
  font-family:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.v8steps button:hover{border-color:var(--line2)}
.v8steps button b{font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;width:26px}

/* outputs drawer: the PDF up top, every output below, linked to Settings (3 Oct) */
.v8out.ph .pg{aspect-ratio:auto;height:230px}
.v8orow{padding:10px 0}
.v8orow:hover{background:none}
.v8orow:hover .nm{color:var(--ink)}
.v8oset{margin-top:16px}

/* settings: the Agents block, lead agent on top, Ecosystem Service Agents as a grid (3 Oct) */
.v8ag{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;scroll-margin-top:24px}
.v8agl{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--dark);color:#fff;cursor:pointer;
  transition:transform .12s,box-shadow .12s}
.v8agl:hover{box-shadow:0 6px 18px rgba(26,12,18,.18)}
.v8agl .av{width:46px;height:46px;border-radius:12px;background:rgba(249,221,90,.14);color:var(--yellow);display:flex;align-items:center;
  justify-content:center;flex:none}
.v8agl .av .ti{font-size:24px}
.v8agl .tx{flex:1;min-width:0}
.v8agl .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);opacity:.85}
.v8agl .n{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.v8agl .bp{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.72);
  background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px}
.v8agl .bp .ti{font-size:13px}
.v8agl .ch{color:rgba(255,255,255,.5);font-size:18px}
.v8agc{display:flex;align-items:center;gap:10px;margin:14px 2px 12px}
.v8agc .ln{flex:1;height:1px;background:var(--line)}
.v8agc .t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.v8agg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.v8age{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line);
  cursor:pointer;min-width:0;transition:border-color .12s,background .12s}
.v8age:hover{border-color:var(--c);background:var(--bg)}
.v8age .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.v8age{background:color-mix(in srgb, var(--bg) 55%, #fff)}
.v8age .ic{background:var(--c);color:#fff}
.v8age .ic .ti{font-size:17px}
.v8age .tx{flex:1;min-width:0}
.v8age b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8age span{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8age .ch{color:var(--ink3);font-size:15px;opacity:0;transition:opacity .12s}
.v8age:hover .ch{opacity:1}
@container pane (max-width: 779px){ .v8agg{grid-template-columns:minmax(0,1fr)} }

/* agents as a list again, every row the same size, coloured icon tiles (3 Oct) */
.v8agi{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.v8agi .ti{font-size:15px}

/* agents: tinted, padded, rounded items with a label per group (3 Oct) */
.v8agb{padding:6px 16px 16px;display:flex;flex-direction:column;gap:8px}
.v8agk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:12px 2px 2px}
.v8agr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--t);cursor:pointer;font-size:14.5px;
  min-width:0;transition:box-shadow .12s,transform .12s}
.v8agr:hover{box-shadow:inset 0 0 0 1px rgba(26,12,18,.10)}
.v8agr .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8agr .m{flex:none;font-size:13px;color:var(--ink2);opacity:.8;white-space:nowrap}
.v8agr .ch{flex:none;color:var(--ink3);font-size:15px}
.v8agr .v8agi{width:32px;height:32px;border-radius:10px}
.v8agr .v8agi .ti{font-size:17px}

/* activity tab (3 Oct) */
.v8act{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.v8ae{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.v8ae:first-child{border-top:none}
.v8ae.click{cursor:pointer}
.v8ae.click:hover{background:#FBF9F2}
.v8ae .who{flex:none;display:inline-flex}
.v8ae .who .dlav,.v8ae .who .v8ava,.v8ae .who .v8esa{width:24px;height:24px;font-size:9px}
.v8ae .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.v8ae .tx b{color:var(--ink);font-weight:600}
.v8ae .kd{flex:none;color:var(--ink3);font-size:15px;display:inline-flex}
.v8ae .at{flex:none;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;width:40px;text-align:right}

/* outputs: PDF cover thumbnail (3 Oct) */
.v8out .pg.cov{padding:0;overflow:hidden;aspect-ratio:1092/1542;background:#1A0F14;box-shadow:0 6px 20px rgba(26,12,18,.14)}
.v8out .pg.cov img{display:block;width:100%;height:100%;object-fit:cover}
/* settings anchor nav: a small icon before each label, the same icon as its card (3 Oct) */
.v8anc a{display:flex;align-items:flex-start;gap:8px}
.v8anc a .ti{flex:none;font-size:15px;line-height:1;margin-top:2px;color:var(--ink3)}
.v8anc a:hover .ti,.v8anc a.on .ti{color:var(--ink)}
/* project block: the blueprint chip is a link (3 Oct) */
.v8proj .pc span.lk{cursor:pointer;color:var(--ink);transition:border-color .12s}
.v8proj .pc span.lk:hover{border-color:var(--ink3)}
.v8proj .pc span.lk .ti-arrow-up-right{font-size:13px;margin-left:-1px}
/* skeletons: the filled components, muted, with bars for text (3 Oct) */
.v8skl{font-size:13.5px;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.v8skl .ti{font-size:15px}
.skb{display:block;height:9px;border-radius:5px;background:#EEE8D8;max-width:100%}
.v8sk .v5sh .skb{height:11px;margin:4px 0}
.v8sk .v5sh{margin-top:24px}
.v8sk .v5sh:first-of-type{margin-top:0}
.v8sk .v5tw,.v8sk .v8es{border-style:dashed;border-color:#DFD8C6}
.v8sk .v5tbl td{padding:15px 14px}
.v8sk .v8esh .t{opacity:.55}
.v8sk .v8esh .n{color:var(--ink3)}
.v8sk .v8achip{color:var(--ink3);cursor:default;opacity:.7}
.v8sk .v8esd dd{padding:13px 0}
.v8sk .v8esf{gap:12px}
.v8sk .v8esf .skb{flex:none}
.v8sk .v8cf.skp{width:56px;height:20px;background:#EEE8D8;padding:0}
.v8sk .v5win{background:#FEFCF2;border-style:dashed;border-color:#EADFB6}
.v8sk .v5win p .skb{height:11px;margin:9px 0}
.v8sk .v5win p .skb:first-child{margin-top:4px}
.v8sk .v5win li{margin:12px 0}
.v8sk .v5win li::marker{color:#DDD3B4}
.v8sk .v5win li .skb{display:inline-block;vertical-align:middle}
.v8sk .v8esh .t.sk{background:#F3EFE1;color:#B9B09B}
.v8sk .v8achip.sk{width:150px;padding:8px 12px;opacity:1}
/* project block: the blueprint as a one-line list row, label left, blueprint right, whole row clickable (3 Oct) */
.v8bprow{display:flex;align-items:center;gap:12px;margin-top:16px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:border-color .12s,background .12s}
.v8bprow:hover{border-color:var(--line2);background:#FBF9F2}
.v8bprow .k{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink3);flex:none}
.v8bprow .k .ti{font-size:15px}
.v8bprow .v{margin-left:auto;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.v8bprow .ch{flex:none;font-size:15px;color:var(--ink3)}
.v8bprow:hover .ch{color:var(--ink)}
/* list row icons: no box or fill, just a larger glyph (3 Oct). Tinted identity tiles (inline style) keep their box. */
.v8row .ic:not([style]){width:22px;height:22px;background:none;border-radius:0}
.v8row .ic:not([style]) .ti{font-size:19px;color:#766B62}
/* card title icons: no box or fill, a larger glyph in the card's own tint (3 Oct).
   Yellow was only legible on the dark tile, so it falls back to ink. */
.v8sh .t{width:24px;height:24px;border-radius:0;background:none!important}
.v8sh .t .ti{font-size:21px}
.v8sh .t[style*="--yellow"]{color:var(--ink)!important}
/* Settings header, what to expect (3 Oct) */
.v8exp{padding:0;overflow:hidden;background:var(--card)}
.v8bp{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#F7F4EA;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.v8bp:hover{background:#F2EEE1}
.v8bp .bi{width:34px;height:34px;border-radius:10px;background:var(--dark);color:var(--yellow);display:flex;align-items:center;justify-content:center;flex:none}
.v8bp .bi .ti{font-size:18px}
.v8bp .bt{display:flex;flex-direction:column;min-width:0;flex:1}
.v8bp .bk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.v8bp .bn{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8bp .bn em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.v8bp .bo{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);flex:none}
.v8bp:hover .bo{color:var(--ink)}
.v8bp .bo .ti{font-size:15px}
.v8exb{padding:22px 22px 6px}
.v8ext{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.015em;line-height:1.15}
.v8exp-why{font-size:15px;line-height:1.55;color:var(--ink2);margin:8px 0 0;max-width:640px}
.v8exf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.v8exf > div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FCFAF4}
.v8exf .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.v8exf .k .ti{font-size:14px}
.v8exf .v{display:block;font-size:14px;line-height:1.45;color:var(--ink);margin-top:6px}
.v8exk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:22px}
.v8exp .ptm{margin-top:10px;padding-top:0;border-top:none}
.v8exc{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 22px;margin-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3)}
.v8exc span{display:inline-flex;align-items:center;gap:6px}
.v8exc .ti{font-size:14px}
@container pane (max-width: 779px){ .v8exf{grid-template-columns:minmax(0,1fr)} }
/* what-to-expect facts as a definition list: outputs as items, the run as a segmented bar, time as a figure (3 Oct) */
.v8exl{display:grid;grid-template-columns:120px minmax(0,1fr);margin:22px 0 0;border-top:1px solid var(--line)}
.v8exl dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:16px 0;border-bottom:1px solid var(--line)}
.v8exl dd{margin:0;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.v8exo{display:flex;flex-wrap:wrap;gap:8px 22px}
.v8exo span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.v8exo .ti{font-size:18px;color:var(--ink2)}
.v8exr{display:flex;gap:10px;padding-top:3px}
.v8exr .ch{min-width:0}
.v8exr .sg{display:flex;gap:3px}
.v8exr .sg i{flex:1;height:10px;border-radius:3px}
.v8exr .ch span{display:block;font-size:12px;color:var(--ink3);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8exr i.ai,.v8exg i.ai{background:#E6E1D3}
.v8exr i.hu,.v8exg i.hu{background:var(--ink)}
.v8exr i.gt,.v8exg i.gt{background:var(--amber)}
.v8exg{display:flex;gap:18px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.v8exg span{display:inline-flex;align-items:center;gap:6px}
.v8exg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.v8ext2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-right:10px}
.v8exs{font-size:13px;color:var(--ink3)}
.v8exl dd:last-of-type,.v8exl dt:last-of-type{border-bottom:none}
@container pane (max-width: 779px){ .v8exl{grid-template-columns:minmax(0,1fr)} .v8exl dt{border-bottom:none;padding-bottom:0} }

/* chat closed: content card keeps the chat-open width, centred (3 Oct) */
body.pclosed .v5body{width:100%;max-width:calc(100vw - var(--chatw,400px) - 86px);margin-left:auto;margin-right:auto}
body.pclosed .v5vt{align-self:center}

/* page menu: delete in red (3 Oct) */
.gy-mpop .gy-mitem.danger,.gy-mpop .gy-mitem.danger .ti{color:#C23B2B}
.gy-mpop .gy-mitem.danger:hover{background:#FBEDEA}


/* ── Inventory v2: the Inventory agent on the left, the ledger on the right ── */
.v5body{--gut:0px}
.i2body{max-width:1080px;margin:0 auto}
.i2body .phead{margin-bottom:0}
.i2body .bsect:first-of-type{margin-top:26px}
.rail{margin-right:0}

/* a pending agent proposal, shown where it applies */
.i2pend{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:2px 9px 2px 3px;cursor:pointer;white-space:nowrap}
.i2pend:hover{border-color:var(--ink3)}
.i2pend .v8ava{width:18px;height:18px}
.i2pend .v8ava .ti{font-size:10px}
.svc .hd .i2pend{margin-left:auto}
.lrow .i2pend{margin-left:8px;vertical-align:middle}

/* one-line rows for Review and Checks */
.i2list{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.i2r{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line);font-size:14.5px;min-width:0;cursor:pointer}
.i2r:first-child{border-top:none}
.i2r:hover{background:#FBF8EF}
.i2r.sel{background:#F6F1E4}
.i2r .tile{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.i2r .tile .ti{font-size:15px}
.i2r .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i2r .ln{flex:none;font-size:13px;color:var(--ink3);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.i2r .ch{flex:none;color:var(--ink3);font-size:15px}
.i2r .dlav{width:22px;height:22px;font-size:9px}
.i2r.done .nm{font-weight:500;color:var(--ink2)}
.i2st{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.i2st.wait{background:var(--amberbg);color:var(--amberd)}
.i2st.ok{background:var(--greenbg);color:var(--greend)}
.i2st.no{background:var(--graybg);color:var(--ink2)}
.i2st.sync{background:var(--greenbg);color:var(--greend)}
.i2k{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:34px 0 10px}
.i2k:first-child{margin-top:0}
.v8cf.hi{background:var(--greenbg);color:var(--greend)}
.v8cf.md{background:var(--bluebg);color:var(--blued)}

/* tile colours per kind of agent job */
.k-grade{background:#E8F3EC;color:#1E7A50}
.k-recon{background:var(--bluebg);color:var(--blued)}
.k-ingest{background:#F3E8DF;color:#8A5A3B}
.k-qual{background:var(--amberbg);color:var(--amberd)}

/* proposal drawer: before and after */
.i2chg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:2px}
.i2chg div{display:grid;grid-template-columns:96px 1fr 18px 1fr;gap:8px;align-items:center;padding:9px 12px;
  border-top:1px solid var(--line);font-size:13.5px}
.i2chg div:first-child{border-top:none}
.i2chg .k{color:var(--ink3);font-size:12.5px}
.i2chg .a{color:var(--ink2)}
.i2chg .b{font-weight:600}
.i2chg .x{color:var(--ink3);font-size:13px}
.i2chg div.same .a,.i2chg div.same .b{color:var(--ink3);font-weight:400}
.i2ev{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font-size:13.5px;line-height:1.4;cursor:pointer}
.i2ev:hover{border-color:var(--line2);background:#FBF8EF}
.i2ev .ic{width:28px;height:28px;border-radius:8px;background:var(--graybg);color:#766B62;display:flex;align-items:center;justify-content:center;flex:none}
.i2why{font-size:14px;line-height:1.55;color:var(--ink)}
.i2warn{display:flex;gap:8px;align-items:flex-start;background:#FDF6EE;border:1px solid #EBD9AE;border-radius:10px;
  padding:9px 12px;font-size:13px;line-height:1.45;color:#8A5A1E;margin-top:12px}
.i2warn .ti{font-size:15px;margin-top:1px}
.i2acts{display:flex;gap:8px;margin-top:22px}
.i2acts button{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:10px 12px;font-family:inherit;
  font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.i2acts button:hover{border-color:var(--ink3)}
.i2acts button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.i2acts button.pri:hover{background:var(--blued);border-color:var(--blued)}
.i2done{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;color:var(--greend);font-weight:600}
.i2done.no{color:var(--ink2)}

/* chat answers with numbers */
.i2ans{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0 14px;overflow:hidden}
.i2ans div{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.i2ans div:first-child{border-top:none}
.i2ans span{flex:1;color:var(--ink2)}
.i2ans b{font-variant-numeric:tabular-nums}
.i2ans em{font-style:normal;color:var(--ink3);font-size:13px;width:52px;text-align:right}

/* Settings: the three permission groups */
.i2perm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.i2perm>div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.i2perm>div:first-child{border-left:none}
.i2perm .h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.i2perm .h.r{color:var(--greend)} .i2perm .h.p{color:var(--blued)} .i2perm .h.n{color:#B5462F}
.i2perm ul{margin:0;padding:0;list-style:none}
.i2perm li{font-size:13.5px;padding:4px 0;color:var(--ink)}
@media(max-width:900px){.i2perm{grid-template-columns:1fr}.i2perm>div{border-left:none;border-top:1px solid var(--line)}}
.v8row .m.sched{color:var(--ink2)}

.i2lnk{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.v5dri.k-grade,.v5dri.k-recon,.v5dri.k-ingest,.v5dri.k-qual{border-radius:8px}
.i2pend.c{padding:2px 8px 2px 3px;font-size:11.5px}
.i2r .nm{flex:1 1 auto;min-width:140px}
.i2r .ln{flex:0 1 auto;min-width:0}
@container pane (max-width: 760px){ .i2r .ln{display:none} }
.i2body .v8ttl{margin-bottom:30px}

.i2body .v8card{width:100%}
.v5drb .v8ae .tx{white-space:normal;overflow:visible;text-overflow:clip}
.v5drb .v8ae{align-items:flex-start}

.i2body .phead{flex-wrap:wrap;row-gap:14px}
.i2body .phead .acts{flex-wrap:wrap}
@container pane (max-width: 760px){
  .drow2,.rrow2{grid-template-columns:1fr;gap:14px}
  .dempty{grid-column:auto!important}
  .lhd{display:none}
  .lrow{grid-template-columns:1fr auto;row-gap:7px}
  .lrow .si{grid-column:1 / 3}
  .rrow{grid-template-columns:1fr;gap:5px;padding:6px 0}
}

<div class="mainc">

<div class="toast" id="toast"></div>
<script>if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};</script>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3400);}
if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};

/* Bulk operations for inventory. The Manage wireframe gave each of these its
   own card on a separate hub page; here they sit on the object they act on. */
var INV_ADD = [
  ['ti-file-upload','Bulk upload inventory','Bulk upload: drop a schedule, map the columns, review every line before it commits'],
  ['ti-plus','Add inventory manually','Add one line: site, parcel, service, units and condition'],
  ['ti-sparkles','Add from any file','The Inventory agent reads it and proposes the lines for review']
];
var INV_ACTIONS = [
  ['label','Bulk'],
  ['ti-tag','Set prices','Set prices: pick lines, apply a price or a per-unit uplift, effective from a date'],
  ['ti-adjustments','Set sales restrictions','Sales restrictions: who may buy these units, by LPA, NCA or named buyer'],
  '-',
  ['ti-file-export','Export inventory','Export: every line with its stage, price and restriction as a spreadsheet'],
  ['ti-file-upload','Match BNG metric','Upload a BNG metric: required units are matched against available inventory'],
  ['ti-history','Audit log','go:audit-log.html']
];
</script>
<script>
var SHORT={bng:'BNG',wcc:'WCC',soc:'Soil'};
var ESPAGE={bng:'inventory-bng-programme.html',wcc:'inventory-wcc-programme.html',soc:'inventory-soc-programme.html'};
var PROG='Evenlode';
function nameOf(k){ return GY_ES[k].name; }
function pill(k){ return '<span class="espill">'+SHORT[k]+'</span>'; }
function u(n){ return n.toLocaleString(); }

/* Pipeline: one column per service, four states stacked inside it */
function svcCard(es){
  var p=pipe(es);
  var states=[['Projected',p.projected,'s0'],['Available',p.available,'s1'],
              ['Reserved',p.reserved,'s2'],['Sold',p.sold,'s3']];
  if(es!=='bng'){ states[0][0]='Available: projected'; states[1][0]='Available: registered'; }
  var max=Math.max(p.projected.u,p.available.u,p.reserved.u,p.sold.u,1);
  return '<div class="svc '+GY_ES[es].cls+'">'
    +'<div class="hd">'+pill(es)+'<span class="nm">'+nameOf(es)+'</span>'+pendChip(pendingFor(es),1)+'</div>'
    +'<div class="card">'+states.map(function(s){
        var d=s[1], w=Math.round(d.u/max*100);
        return '<div class="st '+s[2]+'"><div class="lb">'+s[0]+'</div>'
          +'<div class="nums"><span class="u">'+u(d.u)+'</span><span class="un">units</span>'
          +'<span class="v'+(d.v?'':' none')+'">'+(d.v||'&mdash;')+'</span></div>'
          +'<div class="bar"><i style="width:'+(d.u?Math.max(w,2):0)+'%"></i></div></div>';
      }).join('')
    +'<div class="vm" onclick="location.href=\''+ESPAGE[es]+'\'">View '+nameOf(es)+' <i class="ti ti-arrow-right"></i></div>'
    +'</div></div>';
}
function rail(){
  document.getElementById('rail').innerHTML =
    GY_INV_API.services().map(svcCard).join('')
    + '<div class="svc ghost"><div class="hd"><span class="nm" style="color:var(--ink3)">Next service</span></div>'
    + '<div class="card"><span class="gt">A new ecosystem service appears here once it has a Project.</span></div></div>';
}

/* Deals */
function dealCard(es){
  var d=GY_INV_API.deals(es,PROG), n=nameOf(es);
  var head = '<div><div class="wnm">'+pill(es)+'<span class="nm">'+n+'</span></div>'
    +(d.open?'<span class="wlk" onclick="location.href=\'deals.html?es='+es+'\'">'+d.open+' open</span>':'')
    +'</div>';
  if(!d.open){
    return '<div class="'+GY_ES[es].cls+'"><div class="dcard drow2">'+head
      +'<div class="dempty" style="grid-column:2 / -1">No open deals. '
      +u(GY_INV_API.pipeline(es,PROG).projected.u)
      +' projected units, nothing registered to sell yet.</div></div></div>';
  }
  return '<div class="'+GY_ES[es].cls+'"><div class="dcard drow2">'+head
    +'<div><div class="big">'+d.pct+'%</div>'
      +'<div class="cap">('+u(d.inDeals)+' units) of available inventory in deals</div>'
      +'<div class="bar2"><i style="width:'+d.pct+'%"></i></div></div>'
    +'<div class="drow"><b>'+d.unreserved.pct+'%</b> ('+u(d.unreserved.u)+' units) in '
      +'<span class="u" onclick="toast(\''+d.unreserved.deals+' deals against unreserved '+n+'\')">'
      +d.unreserved.deals+' deal'+(d.unreserved.deals===1?'':'s')+' against unreserved</span>'
      +'<div class="bar2 lite"><i style="width:'+d.unreserved.pct+'%"></i></div></div>'
    +'<div class="drow"><b>'+d.reserved.pct+'%</b> ('+u(d.reserved.u)+' units) in '
      +'<span class="u" onclick="toast(\''+d.reserved.deals+' deals against reserved '+n+'\')">'
      +d.reserved.deals+' deal'+(d.reserved.deals===1?'':'s')+' against reserved</span>'
      +'<div class="bar2"><i style="width:'+d.reserved.pct+'%"></i></div></div>'
    +'</div></div>';
}
function deals(){
  document.getElementById('deals').innerHTML =
    '<div class="wcols">' + GY_INV_API.services().map(dealCard).join('') + '</div>';
}

/* Risk */
var RISK_OPEN={};
function riskCard(es){
  var rows=GY_INV_API.risk(es), open=RISK_OPEN[es];
  var show=open?rows:rows.slice(0,5), hidden=rows.length-5;
  var body=show.map(function(r){
    function w(v){ return (v/r.total*100).toFixed(1)+'%'; }
    return '<div class="rrow"><span class="rl">'+r.label+'</span>'
      +'<span class="rbarx">'
      +(r.reserved  ?'<span class="s1" style="width:'+w(r.reserved)+'">'+r.reserved+'</span>':'')
      +(r.unreserved?'<span class="s2" style="width:'+w(r.unreserved)+'">'+r.unreserved+'</span>':'')
      +'<span style="width:'+w(r.free)+'"></span></span></div>';
  }).join('');
  var more = hidden>0 ? '<span class="rmorex" onclick="toggleRisk(\''+es+'\')">'
    +(open?'Show fewer':'View '+hidden+' more')+'</span>' : '';
  return '<div class="'+GY_ES[es].cls+'"><div class="rcardx rrow2">'
    +'<div><div class="wnm">'+pill(es)+'<span class="nm">'+nameOf(es)+'</span></div>'
      +'<div class="wsub">'+GY_INV_API.riskLabel(es)+'</div></div>'
    +'<div>'+body+more+'</div></div></div>';
}
function toggleRisk(es){ RISK_OPEN[es]=!RISK_OPEN[es]; risks(); }
function risks(){
  document.getElementById('risks').innerHTML =
    '<div class="wcols">' + GY_INV_API.services().map(riskCard).join('') + '</div>'
    + '<div class="wkey"><span><i></i>Reserved</span>'
    + '<span><i class="m"></i>Unreserved</span>'
    + '<span><i class="l"></i>Not in deals</span></div>';
}

/* All inventory: the first rows, the full table lives on its own page */
function list(){
  var all=GY_INV_API.rows(PROG).map(function(r){
    var k=r.es+'|'+r.avail+'|'+r.type, o=OVR[k]; r.key=k;
    if(o){ if(o.units) r.units=o.units; if(o.type) r.type=o.type; if(o.avail) r.avail=o.avail; }
    return r; });
  var top=all.slice().sort(function(a,b){return b.units-a.units;}).slice(0,6);
  var total=all.reduce(function(t,r){return t+r.units;},0);
  document.getElementById('list').innerHTML =
    '<div class="lhd"><span>Type</span><span>Availability</span><span>Specific type / vintage</span>'
    +'<span class="r">Units</span><span>Site</span><span class="r">Area</span></div>'
    + top.map(function(r){
        var cls = r.avail==='Available'?'avail':r.avail==='Sold'?'sold':'future';
        return '<div class="lrow '+GY_ES[r.es].cls+'" onclick="location.href=\'inventory-programme.html?es='+r.es+'\'">'
          +'<span>'+pill(r.es)+'</span>'
          +'<span><span class="badge '+cls+'">'+r.avail+'</span></span>'
          +'<span class="ty">'+r.type+pendChip(pending().filter(function(p){ return p.key===r.key; }))+'</span>'
          +'<span class="un r">'+u(r.units)+'</span>'
          +'<span class="si">'+r.site+'</span>'
          +'<span class="r si">'+r.ha+' ha</span></div>';
      }).join('')
    + '<div class="lmore" onclick="location.href=\'inventory-programme.html\'">All '+all.length
      +' inventory lines, '+u(total)+' units ›</div>';
}

/* ── Search: the criteria builder folds into this page. It builds a
   Requirement, not a filter set: a scope plus one line. Adding a second line
   promotes the same object to requirement.html, which is why REQ travels
   through gy-search.js rather than living here. ── */
var LPA=['West Oxfordshire DC','Cotswold DC','Cherwell DC'];
var NCA=['Cotswolds','Upper Thames Clay Vales','Midvale Ridge'];
var LNRS=['Oxfordshire','Gloucestershire','Warwickshire'];
var GS=window.GY_SEARCH_API;
var REQ=GS.newReq('bng', PROG);

function opts(list, cur, ph){
  return '<option value="">'+ph+'</option>'
    + list.map(function(o){ return '<option'+(o===cur?' selected':'')+'>'+o+'</option>'; }).join('');
}
function setService(es){ GS.setService(REQ, es); redraw(); }
function setScope(k,v){ REQ.scope[k]=v; redraw(); }
function setLine(k,v,quiet){ REQ.lines[0][k]=v; redraw(quiet); }
function redraw(quiet){
  if(!quiet) document.getElementById('sbuild').innerHTML=buildHtml();
  liveCount();
}
function liveCount(){
  var r=GS.run(REQ, GS.progOf(REQ, PROG)), el=document.getElementById('lcount');
  if(!el) return;
  el.innerHTML = r.rows
    ? '<b>'+r.rows+'</b> line'+(r.rows===1?'':'s')+' match, <b>'+u(r.units)+'</b> units'
      + (r.short ? ' · <b>'+r.short+'</b> short' : '')
    : 'Nothing matches yet';
}

function buildHtml(){
  var L=REQ.lines[0], isBng=REQ.es==='bng', n=0;
  function sec(t,body){
    return '<div class="fgrp"><div class="shead"><b>'+(++n)+'</b>'+t+'</div>'+body+'</div>';
  }
  function fld(label, tip, control){
    return '<div class="fld"><label class="flab">'+label+(tip?gyInfo(tip):'')+'</label>'+control+'</div>';
  }
  /* the service picker carries the ecosystem service colours, so the same
     mark means the same product here as everywhere else */
  function pill(es){
    var e=GY_ES[es];
    return '<button class="pick '+e.cls+(REQ.es===es?' on':'')+'" onclick="setService(\''+es+'\')">'
      +'<i class="ti '+e.icon+'"></i>'+SHORT[es]+'</button>';
  }
  return ''
    + sec('Service','<div class="pickrow">'+GY_INV_API.services().map(pill).join('')+'</div>')

    + ((isBng || !PROG) ? sec('Where','<div class="fcols">'
        + (isBng ? fld('LPA','Local planning authority. A BNG buyer usually has to buy inside the LPA their development sits in, or pay a spatial penalty.',
            gySel('q-lpa',{options:LPA, value:REQ.scope.lpa, placeholder:'Any LPA', width:'100%',
                           onchange:function(v){ setScope('lpa',v); }})) : '')
        + (isBng ? fld('NCA','National Character Area. The next ring out if the LPA cannot be matched.',
            gySel('q-nca',{options:NCA, value:REQ.scope.nca, placeholder:'Any NCA', width:'100%',
                           onchange:function(v){ setScope('nca',v); }})) : '')
        + (isBng ? fld('LNRS','Local Nature Recovery Strategy area. Units inside one carry a strategic significance uplift.',
            gySel('q-lnrs',{options:LNRS, value:REQ.scope.lnrs, placeholder:'Any LNRS authority', width:'100%',
                            onchange:function(v){ setScope('lnrs',v); }})) : '')
        + (!PROG ? fld('Programme','Limit the answer to one programme. Leave it on every programme to sell from wherever the units are.',
            gySel('q-prog',{options:[['','Every programme']].concat(GY_INV_API.programmes().map(function(x){return [x,x];})),
                            value:REQ.scope.prog, placeholder:'Every programme', width:'100%',
                            onchange:function(v){ setScope('prog',v); }})) : '')
        +'</div>') : '')

    + sec('What','<div class="fcols'+(isBng?' two':'')+'">'
        + gySel('q-type',{options:function(){ return GS.typesFor(REQ.es, GS.progOf(REQ, PROG)); }, value:L.type,
                          placeholder:isBng?'Any habitat':REQ.es==='wcc'?'Any vintage':'Any land type',
                          width:'100%', onchange:function(v){ setLine('type',v); }})
        + (isBng ? gySel('q-cond',{options:function(){ return GS.condsFor(GS.progOf(REQ, PROG)); }, value:L.cond,

    + '<div class="v8dk2">'+k[1]+'</div>'

    + '<div class="v8dk2">Why</div><div class="i2why">'+p.why+'</div>'
    + '<div class="v8dk2">Change</div><div class="i2chg">' + p.ch.map(function(c){
        return '<div class="'+(c[1]===c[2]?'same':'')+'"><span class="k">'+c[0]+'</span><span class="a">'+c[1]+'</span>'
          + '<span class="x"><i class="ti ti-arrow-right"></i></span><span class="b">'+c[2]+'</span></div>'; }).join('') + '</div>'
    + '<div class="v8dk2">Evidence</div>' + p.ev.map(function(e){
        return '<div class="i2ev" style="margin-top:6px" onclick="gyToast(\'Opening files is not wired up in this sketch\')"><span class="ic"><i class="ti '+e[0]+'"></i></span><div><b>'+e[1]+'</b><br><span style="color:var(--ink3);font-size:12.5px">'+e[2]+'</span></div></div>'; }).join('')
    + '<div class="v8dk2">Confidence</div><span class="v8cf '+p.cf[0]+'">'+p.cf[1]+'</span>'
    + (p.final && p.st==='wait' ? '<div class="i2warn"><i class="ti ti-alert-circle"></i><div>Mark as Sold is final. The units cannot return to Reserved.</div></div>' : '')
    + (p.st==='wait'
        ? '<div class="i2acts"><button onclick="resolve(\''+p.id+'\',false)"><i class="ti ti-x"></i>Reject</button>'
          + '<button class="pri" onclick="resolve(\''+p.id+'\',true)"><i class="ti ti-check"></i>Approve</button></div>'
        : '<div class="i2done'+(p.st==='no'?' no':'')+'"><i class="ti '+(p.st==='ok'?'ti-circle-check':'ti-circle-x')+'"></i>'+(p.st==='ok'?'Approved':'Rejected')+' by '+firstName(ME[0])+'</div>')
    + '</div>';
}
function openIssue(i){
  var x = ISSUES[i];
  DR = 'issue';
  var ic = document.getElementById('dricon'); ic.className = 'v5dri k-qual'; ic.innerHTML = '<i class="ti ti-alert-triangle"></i>';
  document.getElementById('drtitle').textContent = x.t;
  document.getElementById('drbody').innerHTML = '<div class="v8dr">'
    + '<div class="v8dk2">Line</div><div class="v8row" style="border:none"><span class="ic"><i class="ti ti-packages"></i></span><span class="nm">'+x.d+'</span></div>'
    + '<div class="v8dk2">Why</div><div class="i2why">'+x.why+'</div>'
    + '<div class="v8dk2">Owner</div><div class="v8row" style="border:none">'+avName(x.who)+'<span class="nm">'+x.who+'</span></div>'
    + '<div class="v8dk2">Agent</div><div class="i2why">Flags it and waits. It does not fix quality issues on its own.</div>'
    + '</div>';
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
}
function openAudit(){
  if(DR==='audit') return closeDrawer();
  DR = 'audit';
  var ic = document.getElementById('dricon'); ic.className = 'v5dri hide';
  document.getElementById('drtitle').textContent = 'Audit log';
  document.getElementById('drbody').innerHTML = VIEWS.audit();
  document.getElementById('drawer').classList.remove('hide');
  paintTabs();
}
function closeDrawer(){
  DR = null; PSEL = null;
  document.getElementById('drawer').classList.add('hide');
  paintTabs(); if(TAB==='review') openTab('review', true);
}

/* ── tabs ─────────────────────────────────────────────────────────────── */
var TABS = [['overview','ti-layout-dashboard','Overview'],['review','ti-checklist','Review'],['checks','ti-heart-rate-monitor','Checks'],['settings','ti-settings','Settings']];
var TAB = 'overview';
function paintTabs(){
  var shut = document.body.classList.contains('pclosed');
  document.getElementById('tabs').innerHTML =
    '<button class="v8agt'+(shut?'':' on')+'" onclick="toggleChat()" title="'+(shut?'Show':'Hide')+' the agent">'
      + '<span class="v8ava'+(BUSY?' live':'')+'" id="agtav"><i class="ti '+AGENT_IC+'"></i></span>Agent</button>'
    + '<span class="v5tdiv"></span>'
    + '<div class="v5tabgrp">' + TABS.map(function(t){
        var badge = t[0]==='review' && pending().length ? String(pending().length) : '';
        return '<button class="v5tab'+(TAB===t[0]?' on':'')+'" onclick="openTab(\''+t[0]+'\')">'
          + '<i class="ti '+t[1]+'"></i><span class="lb">'+t[2]+'</span>'+(badge?'<b>'+badge+'</b>':'')+'</button>';
      }).join('') + '</div>'
    + '<div class="v5drgrp"><button class="v5tab dr'+(DR==='audit'?' on':'')+'" onclick="openAudit()">'
      + '<i class="ti ti-history"></i><span class="lb">Audit log</span></button></div>';
}
function openTab(k, keep){
  TAB = k; paintTabs();
  var el = document.getElementById('pbody'), sc = el.parentNode.scrollTop;
  el.innerHTML = VIEWS[k]();
  if(k==='overview') mountOverview();
  el.parentNode.scrollTop = keep ? sc : 0;
}
function paintAll(){
  paintTabs(); paintProg(); openTab(TAB, true);
  if(DR==='prop' && PSEL) document.getElementById('drbody').innerHTML = propHtml(prop(PSEL));
}
function toggleChat(){ document.body.classList.toggle('pclosed'); paintTabs(); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !searchOpen()) closeDrawer(); });

function pendChip(list, compact){
  if(!list.length) return '';
  if(compact) return '<span class="i2pend c" onclick="event.stopPropagation();'+(list.length===1?'openProp(\''+list[0].id+'\')':'openTab(\'review\')')+'" data-tip="'+list.length+' to review">'+agAv('sm')+list.length+'</span>';
  return '<span class="i2pend" onclick="event.stopPropagation();'+(list.length===1?'openProp(\''+list[0].id+'\')':'openTab(\'review\')')+'" title="Waiting for review">'
    + agAv('sm') + list.length+' to review</span>';
}

var VIEWS = {
  overview: function(){
    return '<div class="i2body">'
      + '<div class="phead"><div class="h1">Inventory</div><div class="acts" id="abar"></div></div>'
      + '<div id="results" hidden></div>'
      + '<div id="overview">'
      + '<div class="bsect">Pipeline</div><div class="rail" id="rail"></div>'
      + '<div class="bsect">Deals</div><div class="wcard" id="deals"></div>'
      + '<div class="bsect">Risk</div><div class="wcard" id="risks"></div>'
      + '<div class="bsect">All inventory'
      +   '<span class="act" onclick="location.href=\'inventory-programme.html\'">Filters</span>'
      +   '<span class="act" onclick="event.stopPropagation();gyMenu(this,INV_ACTIONS)">Actions</span></div>'
      + '<div class="ltbl" id="list"></div>'
      + '</div></div>';
  },
  review: function(){
    var w = pending(), d = PROPS.filter(function(p){ return p.st!=='wait'; });
    function row(p){
      var k = KIND[p.kind];
      var st = p.st==='wait' ? '<span class="i2st wait">Waiting</span>' : p.st==='ok' ? '<span class="i2st ok">Approved</span>' : '<span class="i2st no">Rejected</span>';
      return '<div class="i2r'+(p.st!=='wait'?' done':'')+(PSEL===p.id?' sel':'')+'" onclick="openProp(\''+p.id+'\')">'
        + '<span class="tile '+k[2]+'"><i class="ti '+k[0]+'"></i></span><span class="nm">'+p.t+'</span>'
        + '<span class="ln">'+p.line+'</span><span class="v8cf '+p.cf[0]+'">'+p.cf[1]+'</span>'+st
        + '<i class="ti ti-chevron-right ch"></i></div>';
    }
    return '<div class="i2body"><div class="v8ttl">Review</div>'
      + '<div class="i2k">Waiting for you</div>'
      + (w.length ? '<div class="i2list">'+w.map(row).join('')+'</div>' : '<div class="v8dtxt">Nothing waiting.</div>')
      + (d.length ? '<div class="i2k">Done today</div><div class="i2list">'+d.map(row).join('')+'</div>' : '')
      + '</div>';
  },
  checks: function(){
    return '<div class="i2body"><div class="v8ttl">Checks</div>'
      + '<div class="i2k">Sources</div><div class="i2list">' + SOURCES.map(function(s){
          var p = s[3] ? prop(s[3]) : null, open = p && p.st==='wait';
          return '<div class="i2r" onclick="'+(p?'openProp(\''+p.id+'\')':'gyToast(\''+s[0]+' matches inventory\')')+'">'
            + '<span class="tile" style="background:var(--graybg);color:#766B62"><i class="ti '+s[1]+'"></i></span>'
            + '<span class="nm">'+s[0]+'</span><span class="ln">'+s[2]+'</span>'
            + (open ? '<span class="i2st wait">1 change</span>' : '<span class="i2st sync">In sync</span>')
            + '<i class="ti ti-chevron-right ch"></i></div>'; }).join('') + '</div>'
      + '<div class="i2k">Quality issues</div><div class="i2list">' + ISSUES.map(function(x,i){
          return '<div class="i2r" onclick="openIssue('+i+')"><span class="tile k-qual"><i class="ti ti-alert-triangle"></i></span>'
            + '<span class="nm">'+x.t+'</span><span class="ln">'+x.d+'</span>'+avName(x.who)
            + '<i class="ti ti-chevron-right ch"></i></div>'; }).join('') + '</div>'
      + '</div>';
  },
  settings: function(){
    var row = function(ic, nm, m, mc){ return '<div class="v8row"><span class="ic"><i class="ti '+ic+'"></i></span><span class="nm">'+nm+'</span>'+(m?'<span class="m '+(mc||'')+'">'+m+'</span>':'')+'</div>'; };
    var card = function(i,bg,fg,t,n,body){
      return '<div class="v8card"><div class="v8sh"><span class="t" style="background:'+bg+';color:'+fg+'"><i class="ti '+i+'"></i></span><b>'+t+'</b><span>'+n+'</span></div>'+body+'</div>';
    };
    return '<div class="i2body" style="max-width:760px"><div class="v8ttl">Settings</div><div class="v8set" style="display:flex;flex-direction:column;align-items:stretch;gap:18px">'
      + card(AGENT_IC,'var(--dark)','var(--yellow)','Inventory agent','',
          '<div class="v8row" style="border:none;white-space:normal"><span class="nm" style="white-space:normal;line-height:1.5">Keeps Evenlode\'s inventory true: every quantity, grade and status matches its evidence. Proposes changes; people approve them.</span></div>'
          + '<div class="v8row"><span class="k">Manager</span><span class="nm">Inventory owner</span><span class="v8ph">Placeholder</span></div>'
          + '<div class="v8row"><span class="k">Backup</span>'+avName('Charlie')+'<span class="nm">Charlie</span></div>')
      + card('ti-list-check','var(--amberbg)','var(--amberd)','Jobs','4',
          row('ti-file-import','Import files into upload-ready lines','On every new file','sched')
          + row('ti-stairs-up','Propose grade steps from evidence','On every registry change','sched')
          + row('ti-arrows-exchange','Reconcile HubSpot, registries and the carbon sheet','Daily, 07:00','sched')
          + row('ti-alert-triangle','Watch quality','Daily, 07:00','sched'))
      + card('ti-lock','var(--graybg)','#766B62','Permissions','',
          '<div class="i2perm"><div><div class="h r"><i class="ti ti-eye"></i>Reads</div><ul><li>Inventory</li><li>HubSpot deals</li><li>Registries</li><li>Google Drive</li><li>Carbon curve sheet</li></ul></div>'
          + '<div><div class="h p"><i class="ti ti-hand-finger"></i>Proposes</div><ul><li>Bulk upload</li><li>Add a line</li><li>Grade progression</li><li>Mark as Sold</li><li>Archive</li></ul></div>'
          + '<div><div class="h n"><i class="ti ti-ban"></i>Never</div><ul><li>Edit quantities directly</li><li>Reserve units</li><li>Set prices</li><li>Resolve deal conflicts</li></ul></div></div>')
      + card('ti-book','#F3E8DF','#8A5A3B','Knowledge','4',
          row('ti-book','Inventory rule book','Checked 1 Oct')
          + row('ti-book','Woodland Carbon Code v3.0','Checked 12 Sep')
          + row('ti-book','BNG statutory metric 4.0','Checked 2 Sep')
          + row('ti-book','Past corrections','12 rules'))
      + card('ti-shield-check','var(--greenbg)','var(--greend)','Guardrails','',
          row('ti-paperclip','Every proposal carries its evidence and a confidence')
          + row('ti-user-check','Nothing reaches the ledger without approval')
          + row('ti-flag','When unsure, it flags instead of guessing')
          + row('ti-calendar-week','Questions to its manager go out once a week'))
      + '</div></div>';
  },
  audit: function(){
    if(!ACT.length) return '<div class="v8dtxt">Nothing yet.</div>';
    return '<div class="v8act">' + ACT.slice().reverse().map(function(e){
      var w = e.who==='ai' ? agAv('sm') : avName(e.who);
      return '<div class="v8ae"><span class="who">'+w+'</span>'
        + '<div class="tx"><b>'+(e.who==='ai'?'Agent':firstName(e.who))+'</b> '+e.text+'</div>'
        + '<span class="kd"><i class="ti '+e.ic+'"></i></span><span class="at">'+e.at+'</span></div>';
    }).join('') + '</div>';
  }
};
function mountOverview(){
  rail(); deals(); risks(); list();
  gyBar('abar', {
    buttons: [{icon:'ti-target-arrow', label:'Find units for buyer', onclick:function(){ openSearch(); }}],
    actions: INV_ACTIONS,
    primary: {icon:'ti-plus', label:'Add inventory', onclick:function(b){ gyMenu(b, INV_ADD); }}
  });
}

/* page menu */
function pageMenu(btn){
  gyMenu(btn, [
    ['ti-link','Copy link', function(){ try{ navigator.clipboard.writeText(location.href); }catch(e){} gyToast('Link copied'); }],
    ['ti-history','Audit log', function(){ openAudit(); }],
    '-',
    ['ti-player-pause','Pause agent','Pausing is not wired up in this sketch'],
    ['ti-rotate','Run the check again','go:inventory-overview-v2.html']
  ]);
}

/* chat width, shared behaviour with the deliverable sketches */
var CHAT_MIN = 340, CHAT_MAX = 680;
(function(){
  var w = 0;
  try{ w = parseInt(localStorage.getItem('gyChatW8') || '', 10) || 0; }catch(e){}
  if(w) document.body.style.setProperty('--chatw', Math.max(CHAT_MIN, Math.min(CHAT_MAX, w)) + 'px');
  var grip = document.getElementById('chatgrip'), chat = document.querySelector('.v5chat');
  if(!grip || !chat) return;
  grip.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var x0 = e.clientX, w0 = chat.getBoundingClientRect().width;
    document.body.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    function move(ev){
      var room = document.querySelector('.v5row').getBoundingClientRect().width - 420;
      var nx = Math.max(CHAT_MIN, Math.min(Math.min(CHAT_MAX, room), w0 + (ev.clientX - x0)));
      document.body.style.setProperty('--chatw', Math.round(nx) + 'px');
    }
    function up(){
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up);
      document.body.classList.remove('dragging');
      try{ localStorage.setItem('gyChatW8', String(Math.round(chat.getBoundingClientRect().width))); }catch(e){}
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
})();

/* start: the morning check runs, then the first question */
act('ai','ti-sparkles','Started the morning check on Evenlode');
paintPile(); paintTabs(); paintProg(); openTab('overview'); paintChat();
T = setTimeout(run, 400);
</script>
