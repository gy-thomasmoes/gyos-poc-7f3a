<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory v2 · Evenlode · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=dd4e9861">
<style>

:root{--gut:32px}
.wrap{max-width:1080px;margin:0 auto;padding:36px var(--gut) 100px}
@media(max-width:900px){:root{--gut:22px}.wrap{padding:32px var(--gut) 90px}}

.bsect{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em;margin:38px 0 14px;display:flex;align-items:center;gap:12px}
.bsect .act{font-family:-apple-system,system-ui,Inter,'Segoe UI',sans-serif;margin-left:auto;font-size:13.5px;font-weight:400;color:var(--ink2);cursor:pointer}
.bsect .act:hover{color:var(--ink)}
.espill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:7px;background:var(--esc);color:#fff;white-space:nowrap}

/* ── Pipeline: one column per ecosystem service, scrolling sideways ── */
.rail{display:flex;gap:16px;overflow-x:auto;padding:2px 0 12px;scroll-snap-type:x proximity;
      /* left stays on the page gutter; the right opens to the container edge so a
         rail that overflows can scroll all the way out, and does nothing if it fits */
      margin-right:calc(-1 * var(--gut))}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.svc{flex:none;width:268px;scroll-snap-align:start}
.svc .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.svc .hd .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card{background:color-mix(in srgb, var(--esc) 13%, #fff);border:1px solid color-mix(in srgb, var(--esc) 42%, #fff);
  border-radius:16px;overflow:hidden}
.st{border-bottom:1px solid color-mix(in srgb, var(--esc) 30%, #fff)}
.vm{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;font-size:13px;font-weight:600;
  color:#fff;cursor:pointer;background:var(--esc)}
.vm:hover{background:color-mix(in srgb, var(--esc) 82%, #000)}
.vm .ti{font-size:14px}
.st{padding:14px 16px}
.st:last-child{border-bottom:none}
.st .lb{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.st .nums{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.st .u{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
.st .un{font-size:12.5px;color:var(--ink2)}
.st .v{margin-left:auto;font-size:14px;font-weight:700}
.st .v.none{font-weight:400;color:var(--ink3)}
.st .bar{height:6px;border-radius:99px;background:rgba(26,12,18,.10);overflow:hidden;margin-top:9px}
.st .bar i{display:block;height:100%;border-radius:99px;background:var(--esc)}
.st.s0 .bar i{background:color-mix(in srgb, var(--esc) 30%, #fff)}
.st.s1 .bar i{background:color-mix(in srgb, var(--esc) 60%, #fff)}
.st.s3{background:color-mix(in srgb, var(--esc) 26%, #fff)}
.svc.ghost .card{border-style:dashed;border-color:var(--line2);background:transparent;min-height:232px;display:flex;align-items:center;justify-content:center}
.svc.ghost .gt{font-size:13.5px;color:var(--ink3);text-align:center;padding:0 20px;line-height:1.5}

/* ── Deals ── */
/* Deals and Risk are one wide card each, not three cards side by side.
   One border, one padding, the services split inside it by hairline dividers,
   so the section reads as a single object instead of three competing ones. */
.wcard{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.wcols>*{padding:16px 22px 18px;border-top:1px solid var(--line);min-width:0}
.wcols>*:first-child{border-top:none}
/* one service per row, its content laid out across the width */
.drow2{display:grid;grid-template-columns:200px minmax(200px,1fr) 1fr 1fr;gap:26px;align-items:start}
.rrow2{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.wnm{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wnm .nm{font-size:14px;font-weight:600}
.wlk{display:inline-block;margin-top:6px;font-size:13px;color:var(--ink2);
      text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.wlk:hover{color:var(--ink)}
.wsub{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
@media(max-width:900px){.drow2,.rrow2{grid-template-columns:1fr;gap:14px}}
.wkey{display:flex;gap:16px;flex-wrap:wrap;padding:11px 22px;border-top:1px solid var(--line);
      background:var(--bg);font-size:12px;color:var(--ink2)}
.wkey span{display:inline-flex;align-items:center;gap:6px}
.wkey i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink2)}
.wkey i.m{background:var(--ink3);opacity:.55}
.wkey i.l{background:var(--graybg)}


.dcard{min-width:0}
.dcard .dh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.dcard .dh .nm{font-size:14px;font-weight:600}
.dcard .dh .lk{margin-left:auto;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.dcard .big{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1}
.dcard .cap{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.bar2{height:7px;border-radius:99px;background:var(--graybg);overflow:hidden;margin:11px 0 0}
.bar2 i{display:block;height:100%;border-radius:99px;background:var(--esc)}
.bar2.lite i{background:color-mix(in srgb, var(--esc) 45%, #fff)}
.drow{font-size:13.5px;color:var(--ink2)}
.drow+.drow{margin-top:13px}
.drow b{color:var(--ink);font-weight:700}
.drow .u{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.dempty{font-size:13.5px;color:var(--ink3);line-height:1.55}

/* ── Risk ── */
.rcardx{min-width:0}
.rcardx .rh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rcardx .rh .nm{font-size:14px;font-weight:600}
.rrow{display:grid;grid-template-columns:minmax(0,220px) 1fr;align-items:center;gap:16px;padding:5px 0}
.rrow .rl{font-size:13.5px;line-height:1.3}
.rbarx{display:flex;height:18px;border-radius:6px;overflow:hidden;background:var(--graybg)}
.rbarx span{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;min-width:0}
.rbarx .s1{background:var(--esc)}
.rbarx .s2{background:color-mix(in srgb, var(--esc) 55%, #fff);color:var(--ink)}
.rmorex{font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-top:9px;display:inline-block}

/* ── Search ── */
[hidden]{display:none!important}

.sdrop{position:fixed;inset:0;background:rgba(31,31,29,.28);z-index:1300;opacity:0;pointer-events:none;
       transition:opacity .22s ease}
.sdrop.on{opacity:1;pointer-events:auto}
.sdrawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:var(--card);
         border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(31,31,29,.14);z-index:1301;
         display:flex;flex-direction:column;transform:translateX(100%);
         transition:transform .24s cubic-bezier(.2,.7,.3,1)}
.sdrawer.on{transform:none}
.sdhead{display:flex;align-items:center;gap:10px;padding:18px 24px 15px;border-bottom:1px solid var(--line);flex:none}
.sdhead b{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.sdhead .x{margin-left:auto;cursor:pointer;color:var(--ink3);font-size:20px;width:32px;height:32px;
           display:flex;align-items:center;justify-content:center;border-radius:8px}
.sdhead .x:hover{background:var(--graybg);color:var(--ink)}
.sdbody{flex:1;overflow-y:auto;padding:20px 24px 26px}
.sdfoot{flex:none;display:flex;align-items:center;gap:14px;padding:15px 24px;
        border-top:1px solid var(--line);background:var(--card)}
.sclose{font-size:13.5px;color:var(--ink2);cursor:pointer}
.sclose:hover{color:var(--ink)}
.fgrp{margin-top:22px}
.fgrp:first-child{margin-top:0}
.flabel{font-size:14px;font-weight:600;margin-bottom:9px}
.fnote{font-size:12.5px;color:var(--ink3);margin-top:6px}
.pickrow{display:flex;gap:9px;flex-wrap:wrap}
.pick{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 16px;font-family:inherit;
      font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.pick:hover{border-color:var(--ink3)}
.pick.on{background:var(--dark);border-color:var(--dark);color:#fff}
.fcols{display:grid;grid-template-columns:1fr;gap:12px}
.fld{min-width:0}
.flab{display:flex;align-items:center;font-size:12.5px;font-weight:500;color:var(--ink2);margin:0 0 6px 2px}
.fcols.two{grid-template-columns:1fr 1fr}
.fsel{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-family:inherit;
      font-size:14px;color:var(--ink);background:#fff}
.fnum{width:120px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-family:inherit;
      font-size:14px;color:var(--ink);background:#fff}
.frange{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}

/* results */
.rhead{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.rhead .rt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.rhead .rc{font-size:14px;color:var(--ink2)}
.rhead .rx{margin-left:auto;font-size:13.5px;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rhead .rx:hover{color:var(--ink)}
.shead{display:flex;align-items:baseline;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:.06em;
        text-transform:uppercase;color:var(--ink2);margin-bottom:11px}
.shead b{font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.pick{display:inline-flex;align-items:center;gap:7px}
.pick .ti{font-size:15px;color:var(--esc,var(--ink3))}
.pick.on{background:var(--esc,var(--dark));border-color:var(--esc,var(--dark));color:#fff}
.pick.on .ti{color:#fff}
.addline{border:1px dashed var(--line2);border-radius:11px;padding:11px 14px;margin-top:22px;
         font-size:13.5px;color:var(--ink2);text-align:center;cursor:pointer}
.addline:hover{border-color:var(--ink3);color:var(--ink)}
.lcount{font-size:13px;color:var(--ink2)}
.lcount b{color:var(--ink);font-weight:600}
.fit{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 9px}
.fit.ex{background:var(--greenbg);color:var(--greend)}
.fit.pa{background:var(--amberbg);color:var(--amberd)}
.fit.su{background:var(--bluebg);color:var(--blued)}
.shortband{display:flex;align-items:baseline;gap:14px;background:#FDF6EE;border:1px solid #EBD9AE;
           border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.shortband b{color:#B5462F;white-space:nowrap}
.shortband span{color:var(--ink2);font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chipx{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);
       background:var(--graybg);border-radius:999px;padding:5px 12px}
.nores{border:1px dashed var(--line2);border-radius:16px;padding:34px;text-align:center;color:var(--ink3);font-size:14.5px;line-height:1.6}

/* ── All inventory preview ── */
.ltbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.lhd,.lrow{display:grid;grid-template-columns:96px minmax(180px,1.5fr) 128px 66px minmax(130px,1fr) 74px;
           align-items:center;gap:14px;padding:12px 18px}
.lhd{background:var(--graybg);border-bottom:1px solid var(--line);
     font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.lhd .r,.lrow .r{text-align:right}
.lrow{border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#FBF8EF}
.lrow .ty{font-weight:600;letter-spacing:-.01em}
.lrow .un{font-variant-numeric:tabular-nums}
.lrow .si{color:var(--ink2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmore{padding:13px 18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);cursor:pointer}
.lmore:hover{color:var(--ink);background:#FBF8EF}
@media(max-width:900px){
  .lhd{display:none}
  .lrow{grid-template-columns:1fr auto;row-gap:7px}
  .lrow .si{grid-column:1 / 3}
}

/* ── from deliverable sketch v8: agent column, tabs, drawer ── */

/* v4-chat, the same deliverable with the assistant in the lead.
   Everything from the document view is still here; it has just swapped
   places with the conversation. The document becomes one tab of a docked
   panel, and the workflow shows up as the run log inside the thread. */

/* This page is a place to work rather than a place to browse, so it opens
   with the rail folded away and the path folded down to the name. Both are one
   click from coming back, and the choice is remembered for this page only. */
/* The folded path is two slashes and an ellipsis, quiet until you go near it.
   Hovering names the path, clicking unfolds it in place. */
.crmore{flex:none;border:none;background:none;padding:2px 2px;font-family:inherit;font-size:14px;
  line-height:1;color:var(--ink3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:color .12s}
.crmore .sl{color:var(--line2);transition:color .12s}
.crmore .el{letter-spacing:.09em}
.crmore:hover{color:var(--ink)}
.crmore:hover .sl{color:var(--ink3)}
.crmore.hide{display:none}
.crtrail{display:none;align-items:center}
.crtrail.on{display:inline-flex}
.mainc{overflow:hidden;display:flex;flex-direction:column}
.v5row{flex:1;display:flex;min-height:0}

/* ── the thread, which is now the page ──────────────────────────────────── */
.v5chat{position:relative;width:var(--chatw,400px);flex:none;min-width:0;display:flex;
  flex-direction:column;background:var(--bg);border-right:1px solid var(--line)}
body.pclosed .v5chat{display:none}
@media(max-width:1100px){.v5chat{width:min(var(--chatw,400px),360px)}}
/* Drag the edge to trade width between the assistant and the document. The
   handle is the border until you reach for it. */
.v5grip{position:absolute;top:0;bottom:0;right:-3px;width:7px;cursor:col-resize;z-index:6}
.v5grip:after{content:'';position:absolute;top:0;bottom:0;left:2px;width:3px;border-radius:2px;
  background:transparent;transition:background .12s}
.v5grip:hover:after,body.dragging .v5grip:after{background:var(--line2)}
body.dragging{cursor:col-resize;user-select:none}
.v5log{flex:1;overflow:auto;padding:22px 22px 6px}
.v5in{max-width:none}

.v5chead{flex:none;display:flex;align-items:center;gap:10px;min-height:55px;
  padding:11px 12px 11px 22px;border-bottom:1px solid var(--line)}
.v5on{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.v5on .ti{font-size:17px;color:var(--blued)}
.v5cx{width:32px;height:32px;flex:none;border:none;background:none;border-radius:9px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.v5cx:hover{background:var(--graybg);color:var(--ink)}
.v5on .ti{font-size:15px}
.v5on b{font-weight:500;color:var(--ink2)}

.v5turn{margin-bottom:30px}
.v5you{background:#F6EFE2;border-radius:16px 16px 5px 16px;padding:12px 15px;font-size:15px;line-height:1.5;
  margin-left:auto;max-width:90%;width:fit-content}
.v5say{font-size:15px;line-height:1.62;color:var(--ink);margin:13px 0}
.v5say b{font-weight:600}

/* what it did, in the order it did it */
.v5step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px;color:var(--ink2)}
.v5step .bx{width:15px;height:15px;border-radius:4px;flex:none;margin-top:3px;background:var(--greend);position:relative}
.v5step .bx:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5step .bx.run{background:none;border:1.5px solid var(--amber)}
.v5step .bx.run:after{display:none}
.v5step div{min-width:0}
.v5step em{display:block;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  color:var(--ink3);margin-top:3px}
.v5step .w{color:var(--ink)}

/* something it made */
.v5made{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin:14px 0;background:var(--card);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.v5made:hover{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.06)}
.v5mt{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.v5mn{flex:1;min-width:0}
.v5mn b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.v5mn span{font-size:13.5px;color:var(--ink3)}
.v5made .ti.go{font-size:17px;color:var(--ink3);flex:none}

/* The one thing to do next, in the assistant column, as a card with a single
   button. Automated steps run themselves; a person's step is just marked. */
/* The run should look like it is happening. Tasks rise in one at a time, the
   in-flight marker spins, the live step's dot breathes, the chapter bars slide
   and a freshly written field flashes once. */
@keyframes gyspin{to{transform:rotate(360deg)}}
@keyframes gyrise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes gypip{0%,100%{box-shadow:0 0 0 3px var(--amberbg)}50%{box-shadow:0 0 0 7px rgba(239,159,39,.20)}}
@keyframes gyflash{0%{background:#FEF6D8;border-color:#E9D79A}100%{background:var(--card);border-color:var(--line)}}
@keyframes gyglow{0%,100%{box-shadow:0 2px 10px rgba(31,31,29,.05)}50%{box-shadow:0 2px 18px rgba(24,95,165,.18)}}
.gyspin{animation:gyspin .9s linear infinite;display:inline-block}
.v5step.rise{animation:gyrise .22s ease both}
.v5wf.cur .dot,.dlpip.live{animation:gypip 1.5s ease-in-out infinite}
.v5inp.just{animation:gyflash 1.2s ease-out}
.v5tw.just,.v5win.just{animation:gyflash 1.2s ease-out}
.dlsgb i{transition:width .45s ease}
.v5rc.live{animation:gyglow 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  .gyspin,.v5step.rise,.v5wf.cur .dot,.dlpip.live,.v5inp.just,.v5rc.live{animation:none}
}
.v5rc{border:1px solid var(--line2);border-radius:16px;background:var(--card);padding:16px 17px;
  margin-top:8px;box-shadow:0 2px 10px rgba(31,31,29,.05)}
.v5rch{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.v5rch .ti{font-size:17px;color:var(--blued);flex:none}
.v5rcb{font-size:14px;line-height:1.55;color:var(--ink2);margin-top:9px}
.v5rcw{font-size:12.5px;color:var(--ink3);margin-top:9px;display:flex;align-items:center;gap:7px}
.v5rcw .dlav{width:18px;height:18px;font-size:8.5px}
.v5go{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;
  border-radius:12px;padding:11px 16px;margin-top:14px;font-family:inherit;font-size:14.5px;
  font-weight:600;cursor:pointer;background:var(--dark);color:#fff}
.v5go.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.v5go .ti{font-size:16px}
.v5pl{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:7px 14px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--dark);color:#fff}
.v5pl .ti{font-size:15px}
.v5sug{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.v5sug button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 14px;
  font-family:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
.v5sug button:hover{border-color:var(--ink3);color:var(--ink)}

/* ── composer ───────────────────────────────────────────────────────────── */
.v5comp{flex:none;padding:10px 22px 14px}
.v5box{max-width:none;border:1px solid var(--line2);border-radius:18px;background:var(--card);
  padding:14px 16px 11px;box-shadow:0 2px 10px rgba(31,31,29,.05)}
.v5box .q{font-size:14.5px;color:var(--ink3);padding-bottom:11px}
.v5tools{display:flex;align-items:center;gap:9px}
.v5tb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:none;border-radius:999px;
  padding:6px 12px;font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer}
.v5tb:hover{border-color:var(--line2);color:var(--ink)}
.v5send{margin-left:auto;width:34px;height:34px;border-radius:11px;border:none;background:var(--dark);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}

/* ── the docked panel, tabs across the top ──────────────────────────────── */
.v5panel{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card)}
/* A quiet pair of icons in the panel's top corner: the same sixteen steps as
   a list, or as the canvas they live on. It floats in the body's top padding
   so it stays put while the list scrolls under it. */
.v5vt{position:absolute;top:13px;right:16px;z-index:5;display:flex;gap:2px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 1px 4px rgba(31,31,29,.05)}
.v5vt.hide{display:none}
.v5vb{width:29px;height:26px;border:none;background:none;border-radius:8px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .12s,color .12s}
.v5vb:hover{background:var(--graybg);color:var(--ink2)}
.v5vb.on{background:var(--graybg);color:var(--ink)}
/* The second bar spans the whole page, above the three columns, so its width
   never moves when a column opens or closes. Everything the buttons open ,
   the assistant on the left, the document in the middle, a drawer on the
   right, appears underneath it. */
.v5tabs{flex:none;display:flex;align-items:center;gap:10px;min-height:55px;
  padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.v5tabgrp{flex:1;min-width:0;display:flex;align-items:center;gap:3px;padding-right:4px;overflow-x:auto;scrollbar-width:none}
.v5tabgrp::-webkit-scrollbar{display:none}
.v5tab{position:relative;display:inline-flex;align-items:center;gap:6px;border:none;background:none;
  border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.v5tab:hover{background:var(--graybg)}
.v5tab.on{background:var(--graybg);color:var(--ink);font-weight:600}
.v5tab .ti{font-size:16px;color:var(--ink3)}
.v5tab.on .ti{color:var(--ink)}
.v5tab b{min-width:16px;height:16px;border-radius:999px;background:var(--graybg);color:var(--grayd);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.v5tab.chat{flex:none;order:-2;border:1px solid var(--line)}
.v5tdiv{order:-1;flex:none;width:1px;align-self:stretch;background:var(--line);margin:2px 2px 2px 0}
.v5tab.chat .ti{color:var(--blued)}
.v5tab.chat.on{background:var(--bluebg);border-color:#CBE1F5;color:var(--blued)}
.v5tab.chat.on .ti{color:var(--blued)}
/* the right-hand drawer: Comments, To-dos and Sources open here, and the
   assistant closes when they do, because the page holds one side panel at a
   time and the middle should never be squeezed from both ends at once. */
.v5dr{width:360px;flex:none;display:flex;flex-direction:column;min-width:0;
  background:var(--bg);border-left:1px solid var(--line)}
.v5dr.hide{display:none}
.v5drh{flex:none;display:flex;align-items:center;gap:11px;min-height:55px;
  padding:11px 12px 11px 18px;border-bottom:1px solid var(--line)}
.v5drt{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.v5dri{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.v5dri .ti{font-size:16px}
.v5dri.hide{display:none}
.v5drx{width:32px;height:32px;flex:none;border:none;background:none;border-radius:9px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
.v5drx:hover{background:var(--graybg);color:var(--ink)}
.v5drb{flex:1;overflow:auto;padding:20px 20px 40px;font-size:14px;line-height:1.55}
.v5drgrp{flex:none;display:flex;align-items:center;gap:3px;margin-left:auto}
.v5tab.dr.on{background:var(--graybg);color:var(--ink);font-weight:600}
.v5body{flex:1;overflow:auto;padding:46px 40px 110px}
.v5bin{max-width:780px;margin:0 auto}

/* the document, living inside the panel */
.v5dt{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1;
  padding-bottom:22px;border-bottom:1px solid var(--line)}

/* A chapter is a block of fields with one heading. The guidance that used to
   sit in a grey box under the heading now hangs off the i beside it, so the
   page is fields and nothing else. */
.v5sec{margin-top:54px}
.v5ch{display:flex;align-items:center;gap:11px;margin-bottom:30px}
.v5chn{width:30px;height:30px;border-radius:9px;background:var(--dark);color:var(--yellow);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.v5cht{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.01em}
.v5ch .gyinfo{margin-left:1px}

/* One field: a label row, then the field itself. Filled fields read as a
   completed input, unwritten ones as an empty one, so the document looks like
   something with blanks in it rather than prose with gaps. */
.v5f{margin-bottom:34px}
.v5f:last-child{margin-bottom:0}
.v5flab{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:20px}
.v5fl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.v5inp{border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:16px 18px;font-size:16.5px;line-height:1.6;color:var(--ink);outline:none;
  transition:border-color .12s,box-shadow .12s,background .12s}
.v5inp:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(31,31,29,.04)}
.v5inp:focus{background:var(--card);border-style:solid;border-color:#9FC4E4;
  box-shadow:0 0 0 3px rgba(24,95,165,.10)}
/* An unwritten field is an empty field with a hint in it, so the first thing
   you can do to it is type. The dashed frame clears itself on the first
   keystroke, along with the chip that said it was not written yet. */
.v5inp.empty{background:#FBF9F2;border-style:dashed;border-color:#DFD8C6;min-height:78px;
  font-size:14.5px;color:var(--ink3)}
.v5inp.empty:before{content:attr(data-ph);color:var(--ink3)}
.v5inp.empty:focus:before{opacity:.45}
.v5inp.parked{background:#FBF9F2;border-style:dashed;border-color:#DFD8C6;
  font-size:14.5px;line-height:1.6;color:var(--ink3)}
.v5tbl td[contenteditable]{outline:none}
.v5tbl td[contenteditable]:focus{background:#F4F8FC;box-shadow:inset 0 0 0 2px #9FC4E4}
.v5dt[contenteditable]{outline:none}
.v5dt[contenteditable]:focus{box-shadow:inset 0 0 0 2px #9FC4E4;border-radius:8px}

/* Provenance did not go away, it went quiet: one dot, coloured by how much the
   field can be trusted, tooltip on hover, click for the full record. */
.v5dot{width:9px;height:9px;border-radius:50%;flex:none;cursor:pointer;
  box-shadow:0 0 0 3px transparent;transition:box-shadow .12s}
.v5dot:hover{box-shadow:0 0 0 3px rgba(31,31,29,.07)}
.v5dot.ai{background:var(--blued)}
.v5dot.ok{background:var(--greend)}
/* Chapter 2 splits into lettered markets, each with a buyer table; chapter 3
   is one wide table. Tables scroll inside their own frame so the page never
   does. An empty cell is drawn as an empty cell, not as nothing, because in
   the source those blanks are work that has not happened yet. */
.v5sh{font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin:34px 0 13px;color:var(--ink)}
.v5sec .v5sh:first-of-type{margin-top:0}
.v5tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.v5tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5}
.v5tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:bottom}
.v5tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
/* Chapter 3 has seven columns. Squeezing them into the panel turns every cell
   into a column of single words, so the table keeps its natural width and the
   frame scrolls instead. */
.v5tbl.wide{width:auto;min-width:1180px}
.v5tbl.wide td,.v5tbl.wide th{min-width:150px}
.v5tbl.wide td:nth-child(4),.v5tbl.wide td:nth-child(5){min-width:230px}
.v5tbl tr:last-child td{border-bottom:none}
.v5tbl td.k{color:var(--ink);font-weight:600;min-width:150px}
.v5tbl td.mt{background:#FBF9F2}
.v5note{font-size:13.5px;line-height:1.6;color:var(--ink3);margin-top:11px}
.v5call{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  margin-top:18px;font-size:14.5px;line-height:1.6;color:var(--ink2);background:var(--card)}
.v5call > .ti{font-size:16px;color:var(--ink3);flex:none;margin-top:3px}
.v5call ul{margin:0;padding-left:17px}
.v5call li{margin:5px 0}
.v5call b{color:var(--ink)}
.v5win{background:#FEFAE6;border:1px solid #F1E3A6;border-radius:14px;padding:22px 24px}
.v5win p{font-size:16.5px;line-height:1.62;color:var(--ink)}
.v5win ul{margin:15px 0 0;padding-left:19px;font-size:15px;line-height:1.62;color:var(--ink2)}
.v5win li{margin:8px 0}
.v5win .gate{margin-top:17px;padding-top:15px;border-top:1px solid #F1E3A6;font-size:15px;color:var(--ink)}
.v5txt{font-size:17px;line-height:1.62;color:var(--ink)}
.v5pv{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink3)}
.v5pv b{font-weight:400;color:var(--ink2)}
.v5cf{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.v5cf.ai{background:var(--bluebg);color:var(--blued)}
.v5cf.ok{background:var(--greenbg);color:var(--greend)}
.v5cf.none{background:var(--amberbg);color:var(--amberd);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.v5cf.click{cursor:pointer}
.v5cf.click:hover{filter:brightness(.97)}

/* ── the Home tab ─────────────────────────────────────────────────────────
   The v3 deliverable layout, lifted into the panel: progress as one reading,
   the document and the workflow as real previews of themselves, then every
   object this deliverable is wired to, grouped by the verb. Its .dl* names
   never meet the .v5* ones, so it came across unchanged. */
.dlav{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
/* ── progress, the one big reading on the page ── */
/* The workflow bar carries the same title bar as the Document block, and
   leads with the step in flight rather than with a big total. Smaller, but
   the amber pip and the live step do the work the 28px number used to. */
.dlpb{margin-bottom:18px;padding:11px 16px 13px}
/* A ribbon, not a block: no title bar of its own, everything live on one
   line, and four hairline bars under it. Two rows, about 70px. */
.dlnow{display:flex;align-items:center;gap:9px;flex-wrap:nowrap;margin-bottom:11px;min-width:0}
.dlnow > .ti{font-size:16px;color:#12684C;flex:none}
.dlpip{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;
  box-shadow:0 0 0 3px var(--amberbg);margin-left:3px}
.dlnow .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--amberd);flex:none;margin-right:1px}
.dlnow .v{font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlnow .w{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;
  flex:none;white-space:nowrap}
.dlnow .w .dlav{width:17px;height:17px;font-size:8px}
.dlnow .c{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap;
  padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.dlseg{display:flex;gap:6px}
.dlsg{flex-basis:0;min-width:0}
.dlsgb{height:5px;border-radius:999px;background:#F0EEE7;overflow:hidden;display:flex}
.dlsgb i{display:block;height:100%}
.dlsgb i.done{background:var(--greend)}
.dlsgb i.cur{background:var(--yellow)}
.dlsgl{display:flex;align-items:baseline;gap:5px;margin-top:6px;font-size:11px;color:var(--ink2);min-width:0}
.dlsgl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlsgl .c{color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.dlsg.off .dlsgl{color:var(--ink3)}

/* ── the two objects the deliverable really is ── */
.dlhero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:980px){.dlhero{grid-template-columns:minmax(0,1fr)}}
.dlcol{display:flex;flex-direction:column;gap:18px}

.dlobj{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:border-color .12s,box-shadow .12s}
.dlobj:hover{border-color:var(--line2);box-shadow:0 4px 16px rgba(31,31,29,.08)}
.dlohd{display:flex;align-items:center;gap:11px;padding:13px 15px}
.dltile{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.dltile .ti{font-size:17px}
.dlonm{flex:1 1 auto;min-width:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlkeb{width:28px;height:28px;flex:none;border:none;background:transparent;border-radius:8px;
  color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.dlkeb:hover{background:var(--graybg);color:var(--ink)}
.dloft{display:flex;align-items:center;gap:10px;padding:12px 15px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.dloft .r{margin-left:auto;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.dloft .r .ti{font-size:15px}

/* the document, as a small true miniature of the editor page */
.dlthumb{position:relative;height:414px;overflow:hidden;background:#F1EDE0;padding:16px 0 0;
  display:flex;justify-content:center;align-items:flex-start;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dlpage{width:900px;flex:none;background:#fff;border-radius:4px 4px 0 0;padding:50px 64px;
  box-shadow:0 3px 14px rgba(26,12,18,.12);transform:scale(.5);transform-origin:top center;
  font-family:var(--serif);color:var(--ink);text-align:left}
.dlthumb:after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(rgba(241,237,224,0),#F1EDE0)}
.dlpage h1{font-size:38px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}
.dlpage .by{font-family:var(--sans);font-size:15px;color:var(--ink3);margin-bottom:34px}
.dlpage h2{font-size:25px;font-weight:500;letter-spacing:-.015em;margin:30px 0 12px}
.dlpage h2:first-of-type{margin-top:0}
.dlpage p{font-size:17.5px;line-height:1.6;color:#33272C;margin-bottom:13px}
.dlpage ul{margin:0 0 13px 22px}
.dlpage li{font-size:17.5px;line-height:1.6;color:#33272C;margin-bottom:7px}
.dlpage table{width:100%;border-collapse:collapse;margin:0 0 15px;font-family:var(--sans);font-size:15.5px}
.dlpage th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1.5px solid var(--line2);padding:7px 10px 7px 0}
.dlpage td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;color:#33272C}
.dlpage .blank{font-family:var(--sans);font-size:15.5px;color:var(--ink3);font-style:italic}
.dlpage .em{background:#FEF6D8;padding:1px 3px;border-radius:3px}

/* the workflow, as a viewport onto the real canvas: one line of nodes that
   runs off both edges, parked on the step you are actually on */
.dlwf{position:relative;height:182px;overflow:hidden;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background-color:#FBFAF5;background-image:radial-gradient(circle,#E0DED6 1px,transparent 1px);background-size:13px 13px}
.dlstrip{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center}
.dlwn{width:104px;flex:none;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:8px 9px 9px;box-shadow:0 1px 3px rgba(31,31,29,.06)}
.dlwn .h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dlwn .ic{width:21px;height:21px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.dlwn .ic .ti{font-size:12px}
.dlwn .n{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:auto}
.dlwn .t{font-size:11px;line-height:1.3;color:var(--ink);height:43px;overflow:hidden}
.dlwn.pend{background:#FCFBF7;border-color:#EAE6DA}
.dlwn.pend .ic{background:#F1EFE8;color:#C6C1B4}
.dlwn.pend .t{color:var(--ink3)}
.dlwn.cur{box-shadow:0 0 0 2.5px var(--yellow),0 3px 10px rgba(31,31,29,.10)}
.dlwl{width:17px;height:2px;border-radius:1px;background:#D8D2C4;flex:none}
.dlwl.pend{background:#EAE6DC}
.dlwph{position:absolute;top:18px;font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);white-space:nowrap}

/* to-dos */
.dlcardb{padding:4px 17px 14px}
/* In a narrow panel the count gives way before the block's name does. */
.dlohd .n{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--ink3);
  flex:0 5 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlohd .n.warn{color:var(--amberd)}
.dltd{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.dltd:first-of-type{border-top:none}
.dltd .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dltd .d{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap}
.dltd .d.warn{color:var(--amberd)}
.dltd .dlav{width:21px;height:21px;font-size:9.5px;box-shadow:none}
.dlmore{border:none;background:transparent;color:var(--ink2);font-family:inherit;font-size:13px;
  cursor:pointer;padding:9px 0 0;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);width:100%;margin-top:2px}
.dlmore:hover{color:var(--ink)}

/* ── related objects: the verb is the relationship, the noun is the type,
      and each object is a tile whose width its own content decides ── */
/* Everything the deliverable leans on, in one block rather than three
   loose lists. The verb and the count came off the group headings: inside a
   named block, the noun is enough. */
.dlrun{margin-top:24px}
.dlrunb{padding:2px 18px 20px}
.dlg{padding:20px 0 2px;border-top:1px solid var(--line)}
.dlg:first-child{border-top:none;padding-top:16px}
.dlghd{margin-bottom:13px}
.dlghd .t{font-family:var(--serif);font-size:17.5px;font-weight:500;letter-spacing:-.01em}
/* One line per object, nothing but what it is. The group header already
   says how many there are and how many need attention. */
.dlgw{display:flex;flex-direction:column}
.dlr{display:flex;align-items:center;gap:14px;padding:15px 2px;border-top:1px solid var(--line);
  cursor:pointer;font-size:15px;transition:padding-left .12s}
.dlr:first-child{border-top:none}
.dlr:hover{padding-left:6px}
.dlr .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.dlr .ic .ti{font-size:17px}
.dlr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlr .go{font-size:16px;color:var(--ink3);flex:none;opacity:0;transition:opacity .12s}
.dlr:hover .go{opacity:1}
.dlr.miss .nm{color:var(--ink3)}

/* Documents are shown as documents: the same page preview as the main
   thumbnail, at a size you can line four of up. */
.dlfilm{display:flex;flex-wrap:wrap;gap:16px}
.dlfile{width:146px;cursor:pointer}
.dlfp{height:104px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;
  padding:13px 12px;transition:border-color .12s,box-shadow .12s}
.dlfile:hover .dlfp{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.08)}
.dlfp b{display:block;height:6px;border-radius:2px;background:#D9D4C6;width:72%;margin-bottom:9px}
.dlfp i{display:block;height:4px;border-radius:2px;background:#EDEAE1;margin-bottom:6px}
.dlfile.miss .dlfp{border-style:dashed;background:transparent;display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:12.5px;text-align:center;padding:13px}
.dlfn{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;min-width:0}
.dlfn .ti{font-size:15px;flex:none;color:var(--ink3)}
.dlfn .ti.pdf{color:#C0432C}
.dlfn .ti.doc{color:#185FA5}
.dlfn .ti.xls{color:#1C7A4E}
.dlfn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlfile.miss .dlfn span{color:var(--ink3)}
.dltool{width:146px;cursor:pointer}
.dltp{height:78px;border:1px solid var(--line);border-radius:10px;display:flex;
  align-items:center;justify-content:center;transition:border-color .12s,box-shadow .12s}
.dltp .ti{font-size:28px}
.dltool:hover .dltp{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.08)}
.dltn{margin-top:10px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The document miniature and the object tiles want more room than a column
   of prose does, so the Home tab widens the measure. */
.v5bin.wide{max-width:1060px}

/* the other tabs */
.v5item{padding:13px 0;border-top:1px solid var(--line)}
.v5item:first-child{border-top:none;padding-top:0}
.v5who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.v5who .v5av{width:22px;height:22px;font-size:9.5px}
.v5who b{font-size:13.5px;font-weight:600}
.v5who span{font-size:12.5px;color:var(--ink3);margin-left:auto}
.v5sub{font-size:12.5px;color:var(--ink3);margin-bottom:5px}
.v5srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0;font-size:14px}
.v5srow:first-child{border-top:none;padding-top:0}
.v5srow .ti{font-size:16px;color:var(--ink3);flex:none}
.v5srow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v5srow .s{flex:none;font-size:13px;color:var(--ink3);white-space:nowrap}
.v5srow .s.warn{color:var(--amberd)}
.v5srow .s.ok{color:var(--greend)}
.v5box2{width:15px;height:15px;border-radius:4px;border:1.5px solid #B4B2A9;flex:none;margin-top:2px;background:#fff}
.v5box2.on{background:#185FA5;border-color:#185FA5;position:relative}
.v5box2.on:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5td{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.v5td:first-child{border-top:none;padding-top:0}
/* workflow tab */
.v5wfc{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;font-size:12px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.v5wfc:first-child{margin-top:14px}
.v5wfc{padding:0 10px}

/* ── the step detail: what it is for, the tasks inside it, what it leaves ── */
.v5sk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.v5swhat{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:22px}
.v5tkb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.v5tkr{position:relative;display:flex;gap:12px;padding:14px;border-top:1px solid var(--line)}
.v5tkr:first-child{border-top:none}
.v5tkr:before{content:'';position:absolute;left:25px;top:0;height:14px;width:1px;background:var(--line)}
.v5tkr:after{content:'';position:absolute;left:25px;top:36px;bottom:0;width:1px;background:var(--line)}
.v5tkr:first-child:before,.v5tkr:last-child:after{display:none}
.v5tkn{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;flex:none;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.v5tkc{min-width:0}
.v5act{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:11.5px;font-weight:500;
  padding:3px 10px 3px 5px;margin-bottom:8px}
.v5act.ai{background:var(--dark);color:#fff}
.v5act.ai .ti{font-size:13px;color:var(--yellow)}
.v5act.who{background:var(--graybg);color:var(--ink)}
.v5act.who .dlav{width:17px;height:17px;font-size:8px}
.v5tkt{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
.v5tkw{font-size:12.5px;color:var(--ink3);margin-top:5px}
.v5aft{display:flex;gap:11px;background:var(--bluebg);border-radius:12px;padding:14px 16px;margin-top:20px;
  font-size:13.5px;line-height:1.55;color:var(--blued)}
.v5aft .ti{font-size:16px;flex:none;margin-top:1px}

/* ── the canvas view ──────────────────────────────────────────────────────
   Not a redrawing of the canvas: the canvas itself. gy-nav.js already reads
   ?embed=1 and drops its own sidebar, top bar and collapse control, which is
   what that flag exists for, so the page arrives as the world plus its own
   floating pills and side panel. The panel goes full-bleed to receive it. */
.v5body.bleed{padding:0;overflow:hidden}
.v5body.bleed #pbody{max-width:none;margin:0;height:100%}
.v5cvf{display:block;width:100%;height:100%;border:none;background:#FBFAF5}
.v5wfc span{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink3)}
/* A step is an object you can open, so the row behaves like one. */
.v5wf{display:flex;align-items:center;gap:11px;padding:10px 10px;border-top:1px solid var(--line);
  font-size:14.5px;cursor:pointer;transition:background .12s}
.v5wf:hover{background:var(--graybg)}
.v5wf.sel{background:var(--graybg)}
.v5wf .ch{flex:none;font-size:15px;color:var(--ink3);opacity:0;transition:opacity .12s}
.v5wf:hover .ch,.v5wf.sel .ch{opacity:1}
.v5wf .dot{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid var(--line2);position:relative}
.v5wf.done .dot{background:var(--greend);border-color:var(--greend)}
.v5wf.done .dot:after{content:'';position:absolute;left:50%;top:50%;width:3.5px;height:7px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5wf.cur .dot{border-color:var(--amber);border-width:4px}
.v5wf .no{flex:none;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;width:26px}
.v5wf .ti2{flex:1;min-width:0}
.v5wf.pend .ti2,.v5wf.pend .no{color:var(--ink3)}
.v5wf.cur .ti2{font-weight:600}
.v5wf .now{flex:none;font-size:12px;font-weight:500;color:var(--amberd);background:var(--amberbg);
  padding:2px 8px;border-radius:999px}
.v5dl{display:flex;gap:12px;padding:8px 0;font-size:13.5px}
.v5dl dt{flex:none;width:84px;color:var(--ink3)}
.v5dl dd{flex:1;min-width:0}
.v5back{display:inline-flex;align-items:center;gap:7px;border:none;background:none;font-family:inherit;
  font-size:13.5px;color:var(--blued);cursor:pointer;padding:0;margin-bottom:14px}
.v5back:hover{text-decoration:underline}

/* ── header bits ────────────────────────────────────────────────────────── */
.v5av{border-radius:50%;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;flex:none;width:30px;height:30px}
.v5pile{display:flex;align-items:center}
.v5pile .v5av{margin-left:-9px;box-shadow:0 0 0 2px var(--bg)}
.v5pile .v5av:first-child{margin-left:0}
.v5keb{width:34px;height:34px;flex:none;border:none;background:transparent;border-radius:9px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px}
.v5keb:hover{background:var(--graybg);color:var(--ink)}
.v5keb.on{background:var(--graybg);color:var(--ink)}


/* ── v8: the agent leads, the document fills in ────────────────────────────
   Built on v4-chat. The tab bar keeps its structure, minus Home and To-dos,
   plus Settings. The assistant toggle became the agent itself: an avatar
   with a name, like a colleague on the team. */

/* the agent, in the tab bar */
.v8agt{order:-2;flex:none;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);
  background:var(--card);border-radius:999px;padding:3px 13px 3px 3px;font-family:inherit;font-size:14px;
  font-weight:600;color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s}
.v8agt:hover{border-color:var(--line2)}
.v8agt.on{background:var(--graybg);border-color:var(--graybg)}
.v8ava{position:relative;width:28px;height:28px;border-radius:50%;background:var(--dark);color:var(--yellow);
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.v8ava .ti{font-size:15px}
.v8ava.lg{width:32px;height:32px}
.v8ava.lg .ti{font-size:17px}
.v8ava.sm{width:20px;height:20px}
.v8ava.sm .ti{font-size:11px}
.v8ava.live:after{content:'';position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--green);box-shadow:0 0 0 2px var(--card);animation:gypip2 1.5s ease-in-out infinite}
@keyframes gypip2{0%,100%{opacity:1}50%{opacity:.45}}

/* chat header and the progress line under it */
.v8ch{flex:none;display:flex;align-items:center;gap:11px;min-height:58px;padding:10px 14px 10px 20px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.v8chn{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.v8prog{flex:none;padding:12px 20px 13px;border-bottom:1px solid var(--line);background:var(--bg)}
.v8pt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:8px}
.v8pt b{color:var(--ink);font-weight:600}
.v8pt .c{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.v8bar{display:flex;gap:4px}
.v8bar span{height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.v8bar span i{position:absolute;left:0;top:0;bottom:0;background:var(--greend);transition:width .45s ease}
.v8bar span em{position:absolute;top:0;bottom:0;background:var(--yellow)}

/* the thread */
.v8lab{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
.v8lab:after{content:'';flex:1;height:1px;background:var(--line)}
.v8lab:first-child{margin-top:0}
.v8tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:11.5px;font-style:normal;
  border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.v8tag .ti{font-size:12px}
.v8tag.tool{background:var(--graybg);color:#766B62}
.v8tag.conn{background:var(--bluebg);color:var(--blued)}
.v8tag.know{border:1px dashed var(--line2);color:var(--ink2)}
.v8them{margin:16px 0}
.v8them .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:7px}
.v8them .who .dlav{width:22px;height:22px;font-size:9px}
.v8them .bub{background:var(--card);border:1px solid var(--line);border-radius:5px 16px 16px 16px;
  padding:11px 14px;font-size:14.5px;line-height:1.55}
.v5you{margin-left:40px}

/* a question from the agent */
.v8ask{border:1px solid var(--line2);border-radius:16px;background:var(--card);padding:16px 17px;margin:14px 0;
  box-shadow:0 2px 10px rgba(31,31,29,.05)}
.v8ask .q{font-size:15px;line-height:1.55}
.v8opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.v8opt{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 15px;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.v8opt:hover{border-color:var(--ink3)}
.v8opt.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.v8opt.pri:hover{background:var(--blued);border-color:var(--blued)}

/* a decision: its own shape, its own colour, a named decider */
.v8dec{border:1px solid #E9D79A;background:#FEFAE6;border-radius:16px;padding:16px 17px;margin:14px 0}
.v8dh{display:flex;align-items:center;gap:11px}
.v8dia{width:22px;height:22px;border-radius:5px;background:var(--dark);transform:rotate(45deg);flex:none;
  display:inline-flex;align-items:center;justify-content:center;margin:0 3px}
.v8dia .ti{transform:rotate(-45deg);color:var(--yellow);font-size:13px}
.v8dk{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--amberd)}
.v8dq{font-family:var(--serif);font-size:20px;line-height:1.25;letter-spacing:-.01em;margin:12px 0 12px}
.v8rec{display:flex;gap:9px;background:var(--card);border:1px solid #F1E3A6;border-radius:11px;padding:10px 12px;
  font-size:13.5px;line-height:1.5;color:var(--ink2)}
.v8rec b{color:var(--ink)}
.v8by{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);margin-top:12px}
.v8by .dlav{width:18px;height:18px;font-size:8px}
.v8dopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.v8dopt{border:1px solid #E2D08C;background:var(--card);border-radius:12px;padding:11px 12px;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.v8dopt .ti{font-size:16px;flex:none}
.v8dopt:hover{border-color:var(--amberd)}
.v8dopt.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.v8dopt.pri:hover{border-color:var(--blued);background:var(--blued)}
.v8dout{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;flex-wrap:wrap}
.v8dout .ok{display:inline-flex;align-items:center;gap:6px;background:var(--greenbg);color:var(--greend);
  border-radius:999px;padding:4px 11px;font-weight:600;font-size:13.5px}
.v8dout .m{color:var(--ink3);font-size:13px}

/* waiting on a person */
.v8wait{border:1px dashed var(--line2);border-radius:14px;padding:13px 15px;margin:14px 0;background:var(--bg)}
.v8wait .h{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.5}
.v8wait .h .dlav{width:24px;height:24px;font-size:9.5px}
.v8wait .v8opts{margin-top:11px}

/* asking an Ecosystem Service agent */
.v8con{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;margin:9px 0;cursor:pointer}
.v8con:hover{border-color:var(--line2)}
.v8con.rise{animation:gyrise .22s ease both}
.v8conh{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.v8conh .s{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--ink3);display:inline-flex;align-items:center;gap:5px}
.v8conb{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-top:7px}
.v8conm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:8px}
.v8conm .dlav{width:16px;height:16px;font-size:7px}
.v8esa{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.v8esa .ti{font-size:14px}
.v8esa.sm{width:18px;height:18px}
.v8esa.sm .ti{font-size:10px}

/* confidence, three words only */
.v8cf{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.v8cf.lo{background:var(--amberbg);color:var(--amberd)}
.v8cf.ind{background:var(--bluebg);color:var(--blued)}
.v8cf.val{background:var(--greenbg);color:var(--greend)}

/* the document, before and after */
.v8ghost{border:1.5px dashed #DFD8C6;border-radius:14px;background:#FBF9F2;padding:18px 20px}
.v8ghost .l{font-size:13.5px;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.v8ghost .l .ti{font-size:15px}
.v8ghost i{display:block;height:9px;border-radius:5px;background:#EEE8D8;margin-top:9px}
.v8sec{scroll-margin-top:24px}
.v8es{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:16px;overflow:hidden}
.v8es.just{animation:gyflash 1.2s ease-out}
.v8esh{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.v8esh .t{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.v8esh .t .ti{font-size:18px}
.v8esh .n{flex:1;min-width:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.v8achip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;
  background:var(--card);font-family:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;flex:none;white-space:nowrap}
.v8achip:hover{border-color:var(--line2);color:var(--ink)}
.v8esd{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;margin:0;padding:4px 16px}
.v8esd dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 0;
  border-bottom:1px solid var(--line)}
.v8esd dd{margin:0;font-size:14px;line-height:1.5;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line)}
.v8esd dd.mt{color:var(--ink3)}
.v8esd dt:nth-last-child(2),.v8esd dd:last-child{border-bottom:none}
.v8esf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;background:#FBF9F2;border-top:1px solid var(--line)}
.v8esf .nx{flex:1;min-width:0;font-size:13.5px;color:var(--ink2)}
.v8flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:5px 12px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;flex:none}
.v8flag:hover{border-color:var(--ink3)}
.v8flag.on{background:var(--graybg);border-color:var(--graybg);color:var(--ink2);cursor:default}
.v8flag .ti{font-size:14px}
@media(max-width:1200px){.v8esd{grid-template-columns:minmax(0,1fr)}.v8esd dt{border-bottom:none;padding-bottom:0}}

/* a decision, recorded where it applies in the document */
.v8drec{display:flex;align-items:center;gap:11px;flex-wrap:wrap;border:1px dashed var(--line2);border-radius:12px;
  padding:11px 14px;margin-top:22px;font-size:14px;color:var(--ink3)}
.v8drec .v8dia{width:16px;height:16px;border-radius:4px;background:var(--line2)}
.v8drec .v8dia .ti{font-size:10px;color:#fff}
.v8drec .q{flex:1;min-width:0}
.v8drec .dlav{width:20px;height:20px;font-size:8px}
.v8drec.done{border-style:solid;border-color:#E9D79A;background:#FEFAE6;color:var(--ink)}
.v8drec.done .v8dia{background:var(--dark)}
.v8drec.done .v8dia .ti{color:var(--yellow)}
.v8drec .ok{display:inline-flex;align-items:center;gap:5px;background:var(--greenbg);color:var(--greend);border-radius:999px;
  padding:3px 10px;font-weight:600;font-size:13px}

/* workflow list: who runs each step, and gates drawn as decisions */
.v5wf .who8{flex:none;display:inline-flex;align-items:center}
.v5wf .who8 .dlav{width:20px;height:20px;font-size:8px}
.v5wf.gate .dot{border-radius:3px;transform:rotate(45deg);width:12px;height:12px;margin:0 1.5px}
.v5wf.gate.done .dot{background:var(--dark);border-color:var(--dark)}
.v5wf.gate.done .dot:after{display:none}
.v5wf .out{flex:none;font-size:12px;font-weight:600;color:var(--greend);background:var(--greenbg);border-radius:999px;padding:2px 9px}

/* settings: everything this deliverable runs on, one line per thing */
.v8set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:1100px){.v8set{grid-template-columns:minmax(0,1fr)}}
.v8card{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;min-width:0}

.v8sh{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}

.v8sh span{font-size:13px;color:var(--ink3)}
.v8row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px;min-width:0}
.v8row:first-of-type{border-top:none}

.v8row.click:hover{background:var(--graybg)}
.v8row .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--graybg);color:#766B62}
.v8row .ic .ti{font-size:14px}
.v8row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v8row .k{flex:none;width:120px;color:var(--ink3);font-size:13px}
.v8row .m{flex:none;color:var(--ink3);font-size:13px;white-space:nowrap}
.v8row .m.warn{color:var(--amberd)}
.v8row .m.ok{color:var(--greend)}
.v8row .dlav{width:22px;height:22px;font-size:9px}
.v8row .ch{flex:none;color:var(--ink3);font-size:15px}
.v8ph{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line2);
  border-radius:5px;padding:1px 5px;flex:none}
.v8ttl{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.02em;margin-bottom:24px}

/* the agent drawer */
.v8dk2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:22px 0 6px}
.v8dk2:first-child{margin-top:0}
.v8dr .v8row{padding:9px 0}
.v8dtxt{font-size:14px;line-height:1.55;color:var(--ink2)}

.v8q:first-of-type{border-top:none}

.v8q.new{background:#FEFAE6;margin:0 -10px;padding:10px;border-radius:10px;border-top:none}

/* composer, quieter: the send button is not the one dark thing on screen */
.v5send{background:var(--graybg);color:var(--ink)}

/* step explainer in the Workflow drawer */
.v5wf{cursor:pointer}
.v8tk{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.v8tk:first-of-type{border-top:none}
.v8tk .n{width:20px;height:20px;border-radius:6px;background:var(--graybg);color:var(--ink2);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.v8tk .a{display:flex;align-items:center;gap:7px;font-size:13px}
.v8tk .a b{font-weight:600}
.v8tk .a .dlav{width:20px;height:20px;font-size:8px}
.v8tk .a .ic{border-radius:6px;background:var(--graybg);color:#766B62;display:inline-flex;align-items:center;justify-content:center;flex:none}
.v8tk .d{font-size:14px;line-height:1.5;color:var(--ink2);margin-top:4px}
.v8dopts{display:grid;grid-template-columns:minmax(0,1fr)}

.v8in{display:block;width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:14.5px;color:var(--ink);padding:0 0 11px}

/* progress line is the way into the workflow */
.v8prog{cursor:pointer;transition:background .12s}
.v8prog:hover{background:transparent}
/* step explainer, laid over the agent column */
.v5chat{position:relative}
.v8sov{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
  box-shadow:inset -1px 0 0 var(--line)}

/* outputs: the PDF, or its placeholder */
.v8out .pg{position:relative;aspect-ratio:1/1.3;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:22px 20px;box-shadow:0 4px 16px rgba(31,31,29,.06)}
.v8out .pg.live{cursor:pointer}
.v8out .pg.live:hover{border-color:var(--line2)}

.v8out .pg b{display:block;height:9px;width:42%;border-radius:4px;background:var(--line2);margin:18px 0 8px}
.v8out .pg i.l{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:7px}
.v8out.ph .pg{border:1.5px dashed #DFD8C6;background:#FBF9F2;box-shadow:none}
.v8out.ph .pg > .ti{font-size:26px;color:var(--ink3)}
.v8out.ph .pg b{background:#EEE8D8}

/* topbar matches every other page: 61px, so the Share button is compact */

/* ── v8 pass 4 ─────────────────────────────────────────────────────────── */

.v5row{background:var(--bg)}

  transition:border-color .12s,background .12s}

  display:inline-flex;align-items:center;justify-content:center;flex:none}
.v8aopt .l{flex:1;min-width:0}

.v8dec{box-shadow:0 8px 24px rgba(138,90,16,.08)}

/* outputs empty state: one icon, one sentence */

.v8now{border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:22px;cursor:pointer;
  background:linear-gradient(0deg,var(--card),var(--card));box-shadow:0 2px 12px rgba(26,12,18,.05);transition:border-color .12s}
