<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrations · Settings · Great Yellow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=c2eda4c9">
<style>
.wrap{max-width:1080px;margin:0 auto;padding:36px 32px 100px}
@media(max-width:900px){.wrap{padding:32px 22px 90px}}

/* attention band, the same idiom as Deals */
.rband{display:flex;gap:14px;align-items:center;background:var(--amberbg);border:1px solid #EBD9AE;
       border-radius:14px;padding:14px 18px;margin:0 0 22px}
.rband>.ti{font-size:19px;color:var(--amberd)}
.rband .rt{font-size:14.5px;font-weight:600;color:var(--amberd)}
.rband .rbtn{margin-left:auto;background:var(--amberd);color:#fff;border:none;border-radius:10px;
             padding:9px 15px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
             display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rband .rbtn .ti{font-size:17px;color:inherit}
.rband .rbtn:hover{background:#6F470C}

.sect{display:flex;align-items:baseline;gap:10px}
.sect .n{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink3)}
.sect:first-of-type{margin-top:0}
#allhead{margin-bottom:16px}

/* ── the hub, one strip: the OS and what connects to it ── */
.hub{display:grid;grid-template-columns:34px 1fr;gap:9px 14px;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px;margin-bottom:30px}
.hub .wt{width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.hub .hn{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.hub .hn b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hub .hn span{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.hub .hn span b{font-size:12.5px;color:var(--ink)}
.hub .objs{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.oc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;border-radius:999px;
    padding:4px 10px 4px 8px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.oc:hover{border-color:var(--ink3);background:var(--graybg)}
.oc.on{background:var(--dark);border-color:var(--dark);color:#fff}
.oc.on .ti,.oc.on i.n{color:rgba(255,255,255,.7)}
.oc .ti{font-size:14px;color:var(--ink3)}
.oc i.n{font-style:normal;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ── category sections, each a card of rows ── */
.sec{margin-bottom:26px}
.sec .sh{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 2px}
.sec .sh .ic{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.sec .sh h2{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0}
.sec .sh .n{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(200px,1.1fr) minmax(0,1.5fr) 76px 128px 96px 32px;gap:14px;align-items:center;
     padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:#FBF8EF}
.row.flag{background:#FDF6EE}
.row.flag:hover{background:#FBEFDF}
.row .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fl{white-space:nowrap;overflow:hidden}
.row .mut{font-size:13px;color:var(--ink2);white-space:nowrap}
.row.avail .nm{color:var(--ink2);font-weight:500}
.row.avail .mut{color:var(--ink3)}
.row.avail .fc{background:var(--graybg);color:var(--ink3)}
@media(max-width:900px){.row{grid-template-columns:36px 1fr 96px 32px}.row .fl,.row .avs,.row .last{display:none}}
.mark{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;letter-spacing:.03em;flex:none}
.mark.avail{background:#fff!important;color:var(--ink3)!important;border:1px dashed #C9C3B4}
.sdhead .mark{width:30px;height:30px;border-radius:8px;font-size:11px}
.dots{border:none;background:transparent;color:var(--ink3);cursor:pointer;font-size:17px;
      width:30px;height:30px;border-radius:8px;line-height:1}
.dots:hover{background:var(--graybg);color:var(--ink)}
.badge.st-on{background:var(--greenbg);color:var(--greend)}
.badge.st-warn{background:var(--amberbg);color:var(--amberd)}
.badge.st-off{background:var(--graybg);color:var(--ink2)}
.badge.st-avail{background:#fff;color:var(--ink3);border:1px solid var(--line2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border:1px solid var(--line2);border-radius:6px;
     padding:2px 7px;color:var(--ink2);background:#fff;white-space:nowrap}
.tag .ti{font-size:12px;color:var(--ink3)}
.tag.on{background:var(--greenbg);border-color:var(--greenbg);color:var(--greend)}
.tag.on .ti{color:var(--greend)}
.tag.warn{background:var(--amberbg);border-color:#EBD9AE;color:var(--amberd)}
.tag.warn .ti{color:var(--amberd)}
.tag.off{background:var(--graybg);border-color:var(--graybg);color:var(--ink2)}
.tag.avail{color:var(--ink3);border-style:dashed}
.fc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:7px;padding:3px 8px 3px 6px;
    background:var(--graybg);color:var(--ink2);white-space:nowrap;vertical-align:middle}
.fc+.fc{margin-left:4px}
.fc .ti{font-size:13px}
.fc.in{background:var(--bluebg);color:var(--blued)}
.fc.out{background:var(--greenbg);color:var(--greend)}
.fc.both{background:#EEE9DA;color:var(--ink2)}
.fc.more{background:transparent;color:var(--ink3);padding-left:2px}
.avs{display:inline-flex}
.av{width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
    border:2px solid #fff;margin-left:-6px;flex:none}
.av:first-child{margin-left:0}
.empty{padding:22px 18px;text-align:center;color:var(--ink3);font-size:14px}

/* ── drawer, the house pattern ── */
.sdrop{position:fixed;inset:0;background:rgba(26,12,18,.34);z-index:1300;opacity:0;pointer-events:none;transition:opacity .2s}
.sdrop.on{opacity:1;pointer-events:auto}
.sdrawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:var(--card);
  border-left:1px solid var(--line);z-index:1301;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.3,1)}
.sdrawer.on{transform:none}
.sdhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sdhead b{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdhead .badge{flex:none}
.sdhead .x{margin-left:auto;font-size:19px;color:var(--ink3);cursor:pointer;flex:none}
.sdhead .x:hover{color:var(--ink)}
.sdbody{flex:1;overflow:auto;padding:20px 22px}
.sdfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.sdfoot .ghost{margin-right:auto;border:none;background:transparent;color:var(--ink3);font-family:inherit;font-size:13.5px;cursor:pointer;padding:9px 4px}
.sdfoot .ghost:hover{color:var(--ink)}
.shead{display:flex;align-items:baseline;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.shead b{font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.fgrp+.fgrp{margin-top:24px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:13.5px}
.kv .k{color:var(--ink3)}
.kv .v{color:var(--ink);min-width:0}
.kv .v.mut{color:var(--ink2)}
.issue{display:flex;gap:10px;align-items:flex-start;background:var(--amberbg);border:1px solid #EBD9AE;border-radius:10px;
       padding:10px 12px;margin-top:12px;font-size:13.5px;color:var(--amberd);line-height:1.45}
.issue .ti{font-size:16px;flex:none;margin-top:1px}
.note{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:12px}
.frow2{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.frow2:last-child{border-bottom:none}
.frow2 .di{font-size:15px;color:var(--ink3)}
.frow2 .di.in{color:var(--blued)}
.frow2 .di.out{color:var(--greend)}
.frow2 .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow2 .r{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.frow2 .r .oc{padding:3px 9px 3px 8px;font-size:12px;cursor:default}
.frow2 .r .oc:hover{background:#fff;border-color:var(--line2)}
.frow2 .when{font-size:12px;color:var(--ink3);min-width:78px;text-align:right}
.frow2.plan .w,.frow2.plan .when{color:var(--ink3)}
.hat{display:grid;grid-template-columns:118px 1fr;gap:9px 12px;align-items:center;font-size:13.5px;padding:6px 0}
.hat .k{color:var(--ink3)}
.hat .p{display:inline-flex;align-items:center;gap:8px}
.hat .p .av{margin:0;border:none;width:22px;height:22px}
.hat .p.none{color:var(--ink3)}
.run{display:grid;grid-template-columns:126px 18px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.run:last-child{border-bottom:none}
.run .t{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.run .ti{font-size:14px}
.run .ok{color:#578A1D}
.run .bad{color:#C0392B}
.run .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emptybox{padding:16px;border:1px dashed var(--line2);border-radius:10px;color:var(--ink3);font-size:13.5px;text-align:center}
.map{display:inline-flex;align-items:center;gap:6px}
.map .bar{width:84px;height:6px;border-radius:999px;background:var(--graybg);overflow:hidden;display:inline-block}
.map .bar i{display:block;height:100%;background:#578A1D;border-radius:999px}
.map.warn .bar i{background:#C87F0A}
</style>
</head>
<body>
<div class="shell">
<script>window.GYNAV={"active":"","scope":"portfolio"};</script>
<script src="gy-nav.js?v=ca057c36"></script>
<script src="gy-integrations.js?v=625a81ad"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Expand sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr">Settings</span>
    <span class="sep">›</span><span class="cr cur">Integrations</span>
  </div>
</div>

<div class="wrap">
  <div class="phead">
    <div class="h1">Integrations</div>
    <span id="synclab"></span>
    <div class="acts" id="abar"></div>
  </div>

  <div id="rband"></div>

  <div class="hub" id="hub"></div>

  <div class="sect" id="allhead">All integrations <span class="n" id="cnt"></span></div>
  <div id="secs"></div>
  <div class="showing" id="showing" style="margin-top:4px"></div>
</div>
</div>
</div>

<div class="sdrop" id="drop" onclick="closeDrawer()"></div>
<aside class="sdrawer" id="drawer" aria-hidden="true">
  <div class="sdhead"><span class="mark" id="dMark"></span><b id="dName"></b><span id="dBadge"></span><i class="ti ti-x x" onclick="closeDrawer()" title="Close"></i></div>
  <div class="sdbody" id="dBody"></div>
  <div class="sdfoot" id="dFoot"></div>
</aside>

<div class="toast" id="toast"></div>
<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},3400);}
if(!window.toggleNav)window.toggleNav=function(){document.body.classList.toggle('navhid');};

var I = window.GY_INTEG_API;
var ALL = I.all();
var CATS = I.cats, ST = I.status, DIR = I.dir, PEOPLE = I.people;

var state = {q:'', f:{'Category':'all','Status':'all','Direction':'all','Object':'all'}};

/* ── small renderers ── */
function mark(it, extra){
  var c = CATS[it.cat];
  return '<span class="mark'+(it.status==='avail'?' avail':'')+(extra?' '+extra:'')+'" style="background:'+c.bg+';color:'+c.fg+'">'+it.mark+'</span>';
}
function badge(it){ var s = ST[it.status]; return '<span class="badge '+s.cls+'">'+s.label+'</span>'; }
function av(name){
  var p = PEOPLE[name]; if(!p) return '';
  return '<span class="av" style="background:'+p.c+'" data-tip="'+name+'">'+p.ini+'</span>';
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }

/* flows collapse to one chip per object and direction, so a row stays one line */
function flowChips(it, max){
  var by = {}, order = [];
  it.flows.forEach(function(f){
    if(f.when === 'Planned') return;
    if(!by[f.obj]){ by[f.obj] = {dirs:{}, what:[]}; order.push(f.obj); }
    by[f.obj].dirs[f.dir] = 1; by[f.obj].what.push(f.what);
  });
  var out = order.map(function(o){
    var d = by[o].dirs, dir = (d['both'] || (d['in'] && d['out'])) ? 'both' : d['in'] ? 'in' : 'out';
    return '<span class="fc '+dir+'" data-tip="'+esc(DIR[dir].label+': '+by[o].what.join(', '))+'"><i class="ti '+DIR[dir].icon+'"></i>'+o+'</span>';
  });
  var extra = out.length - max;
  if(extra > 0){
    var rest = order.slice(max).join(', ');
    out = out.slice(0, max);
    out.push('<span class="fc more" data-tip="'+esc(rest)+'">+'+extra+'</span>');
  }
  return out.join('');
}

/* ── filtering ── */
function match(it){
  var f = state.f;
  if(f.Category !== 'all' && it.cat !== f.Category) return false;
  if(f.Status !== 'all' && it.status !== f.Status) return false;
  if(f.Direction !== 'all' && I.dirOf(it) !== f.Direction) return false;
  if(f.Object !== 'all' && !it.flows.some(function(x){ return x.obj === f.Object; })) return false;
  if(state.q){
    var hay = (it.name+' '+it.vendor+' '+CATS[it.cat].name+' '+it.flows.map(function(x){ return x.what+' '+x.obj; }).join(' ')).toLowerCase();
    if(hay.indexOf(state.q.toLowerCase()) < 0) return false;
  }
  return true;
}
function rowsFor(){ return ALL.filter(match); }

var STORD = ['warn','on','off','avail'];
function bySt(list){ return list.slice().sort(function(a,b){ var x=STORD.indexOf(a.status)-STORD.indexOf(b.status); return x || a.name.localeCompare(b.name); }); }
function filtered(){ return state.q || Object.keys(state.f).some(function(k){ return state.f[k] !== 'all'; }); }

/* the one filter bar owns every dimension, so the map and the hub drive it */
function setFilter(group, label){
  if(!bar || !bar.pop) return;
  var row = [].filter.call(bar.pop.querySelectorAll('.ar[data-g="'+group+'"]'), function(r){
    return r.textContent.indexOf(label) === 0; })[0];
  if(row) row.click();
}
function filterObj(obj){ setFilter('Object', state.f.Object === obj ? 'All objects' : obj); }

/* ── attention band ── */
function band(){
  var el = document.getElementById('rband');
  var w = ALL.filter(function(i){ return i.status === 'warn'; });
  if(!w.length){ el.innerHTML = ''; return; }
  var one = w.length === 1;
  el.innerHTML = '<div class="rband"><i class="ti ti-alert-triangle"></i>'
    + '<div class="rt">'+(one ? w[0].name+' needs attention' : w.length+' integrations need attention')+'</div>'
    + '<button class="rbtn" onclick="'+(one ? 'openDrawer(\''+w[0].id+'\')' : 'setFilter(\'Status\',\'Needs attention\')')+'">'
    + '<i class="ti ti-list-check"></i> Review</button></div>';
}

/* ── hub strip ── */
var OBJ_ICON = {Inventory:'ti-packages', Deals:'ti-businessplan', Projects:'ti-folders', Sites:'ti-map-pin', Documents:'ti-file-text', Intelligence:'ti-bulb'};
function renderHub(){
  var c = I.counts();
  document.getElementById('hub').innerHTML =
    '<span class="wt">GY</span>'
    + '<div class="hn"><b>Great Yellow OS</b><span><b>'+c.on+'</b> connected · <b>'+c.warn+'</b> needs attention · <b>'+c.off+'</b> paused · <b>'+c.avail+'</b> available</span></div>'
    + '<div class="objs">' + I.objects.map(function(o){
        var t = I.touching(o);
        return '<span class="oc'+(state.f.Object===o?' on':'')+'" onclick="filterObj(\''+o+'\')" data-tip="'+esc(t.map(function(i){ return i.name; }).join(', ') || 'Nothing connected yet')+'">'
          + '<i class="ti '+OBJ_ICON[o]+'"></i>'+o+'<i class="n">'+t.length+'</i></span>';
      }).join('') + '</div>';
}

/* ── bundled list: one card of rows per category ── */
function stag(it){
  var st = ST[it.status];
  var ic = it.status==='on'?'ti-plug-connected':it.status==='warn'?'ti-alert-triangle':it.status==='off'?'ti-player-pause':'ti-plug';
  return '<span class="tag '+it.status+'"><i class="ti '+ic+'"></i>'+st.label+'</span>';
}
function row(it){
  var o = it.owners;
  var owners = it.status === 'avail' ? '<span class="mut">-</span>' : '<span class="avs">'+av(o.eng)+av(o.method)+av(o.ui)+'</span>';
  return '<div class="row'+(it.status==='warn'?' flag':'')+(it.status==='avail'?' avail':'')+'" onclick="openDrawer(\''+it.id+'\')">'
    + mark(it)
    + '<span class="nm">'+it.name+'</span>'
    + '<span class="fl">'+flowChips(it, 3)+'</span>'
    + owners
    + '<span>'+stag(it)+'</span>'
    + '<span class="mut last">'+(it.last || '-')+'</span>'
    + '<button class="dots" onclick="rowMenu(event,\''+it.id+'\')">&#8943;</button>'
    + '</div>';
}
function render(){
  var vis = rowsFor(), n = 0, h = '';
  Object.keys(CATS).forEach(function(cat){
    var c = CATS[cat], all = I.byCat(cat), list = bySt(vis.filter(function(i){ return i.cat === cat; }));
    if(!list.length && filtered()) return;
    n += list.length;
    var on = all.filter(function(i){ return i.status !== 'avail'; }).length;
    h += '<section class="sec"><div class="sh"><span class="ic" style="background:'+c.bg+';color:'+c.fg+'"><i class="ti '+c.icon+'"></i></span><h2>'+c.name+'</h2>'
      + '<span class="n">'+on+' connected'+(all.length-on ? ' · '+(all.length-on)+' available' : '')+'</span></div>'
      + '<div class="list">'+(list.length ? list.map(row).join('') : '<div class="empty">Nothing here</div>')+'</div></section>';
  });
  if(!n) h = '<div class="list"><div class="empty">No integrations match these filters</div></div>';
  document.getElementById('secs').innerHTML = h;
  document.getElementById('showing').textContent = 'Showing ' + n + ' of ' + ALL.length + ' integrations';
  document.getElementById('cnt').textContent = ALL.length;
  renderHub();
  band();
}

function rowMenu(e, id){
  e.stopPropagation();
  var it = I.byId(id);
  var rows = [['ti-eye','View details', function(){ openDrawer(id); }]];
  if(it.status === 'on' || it.status === 'warn') rows.push(['ti-refresh','Sync now', function(){ syncNow(it); }]);
  if(it.status === 'warn') rows.push(['ti-alert-triangle','View errors', function(){ openDrawer(id); }]);
  if(it.status !== 'avail') rows.push(['ti-external-link','Open in '+it.name, 'Opens '+it.name+' in a new tab']);
  if(it.status === 'on' || it.status === 'warn') rows.push(['ti-player-pause','Pause', function(){ setStatus(it,'off'); }]);
  if(it.status === 'off') rows.push(['ti-player-play','Resume', function(){ setStatus(it,'on'); }]);
  if(it.status === 'avail') rows.push(['ti-plug','Request connection', function(){ request(it); }]);
  rows.push('-', ['ti-lock','Audit log','go:audit-log.html']);
  gyMenu(e.currentTarget, rows);
}

/* ── state changes stay in the page: the demo data resets on reload ── */
function syncNow(it){
  gyToast('Sync started: '+it.name+'. Results land in the audit log as they arrive');
  it.runs.unshift(['Just now', it.status !== 'warn', it.status === 'warn' ? 'Still blocked by 14 unmapped fields' : 'No change']);
  if(drawerId === it.id) paintDrawer(it);
}
function setStatus(it, s){
  it.status = s;
  gyToast(s === 'off' ? it.name+' paused. Nothing new arrives until it is resumed' : it.name+' resumed');
  render();
  if(drawerId === it.id) paintDrawer(it);
}
function request(it){
  gyToast('Connection requested: '+it.name+'. The data team assigns the three owners before anything flows');
  closeDrawer();
}
function retry(it){
  gyToast('Retry queued: '+it.name+'. It will fail again until the 14 fields are mapped');
  it.runs.unshift(['Just now', false, 'Schema mismatch, 14 fields']);
  paintDrawer(it);
}

/* ── drawer ── */
var drawerId = null;
function openDrawer(id){
  var it = I.byId(id); if(!it) return;
  drawerId = id;
  paintDrawer(it);
  document.getElementById('drop').classList.add('on');
  var d = document.getElementById('drawer');
  d.classList.add('on'); d.setAttribute('aria-hidden','false');
}
function closeDrawer(){
  drawerId = null;
  document.getElementById('drop').classList.remove('on');
  var d = document.getElementById('drawer');
  d.classList.remove('on'); d.setAttribute('aria-hidden','true');
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && drawerId) closeDrawer(); });

function hatRow(label, name){
  return '<div class="hat"><span class="k">'+label+'</span>'
    + (name ? '<span class="p">'+av(name)+name+'</span>' : '<span class="p none">Not assigned</span>') + '</div>';
}
function paintDrawer(it){
  var c = CATS[it.cat], d = DIR[I.dirOf(it)];
  document.getElementById('dMark').outerHTML = mark(it, '').replace('class="mark', 'id="dMark" class="mark');
  document.getElementById('dName').textContent = it.name;
  document.getElementById('dBadge').innerHTML = badge(it);

  var live = I.liveFlows(it);
  var pct = it.fields[1] ? Math.round(100*it.fields[0]/it.fields[1]) : 0;
  var unmapped = it.fields[1] - it.fields[0];
  var h = '';

  h += '<div class="fgrp"><div class="shead"><b>1</b>Connection</div><div class="kv">'
    + '<span class="k">Category</span><span class="v">'+c.name+'</span>'
    + '<span class="k">Vendor</span><span class="v">'+it.vendor+'</span>'
    + '<span class="k">Direction</span><span class="v"><i class="ti '+d.icon+'" style="font-size:14px;color:var(--ink3);vertical-align:-2px"></i> '+d.label+'</span>'
    + '<span class="k">Last sync</span><span class="v'+(it.last?'':' mut')+'">'+(it.last || 'Never')+'</span>'
    + '<span class="k">Next run</span><span class="v'+(it.next?'':' mut')+'">'+(it.next || 'Not scheduled')+'</span>'
    + '<span class="k">Fields mapped</span><span class="v"><span class="map'+(unmapped && it.status!=='avail'?' warn':'')+'"><span class="bar"><i style="width:'+pct+'%"></i></span>'+it.fields[0]+' of '+it.fields[1]+'</span></span>'
    + '</div>'
    + (it.issue ? '<div class="issue"><i class="ti ti-alert-triangle"></i><span>'+it.issue+'</span></div>' : '')
    + '<div class="note">'+it.note+'</div></div>';

  h += '<div class="fgrp"><div class="shead"><b>2</b>Flows</div>'
    + it.flows.map(function(f){
        var plan = f.when === 'Planned';
        return '<div class="frow2'+(plan?' plan':'')+'" data-tip="'+esc(DIR[f.dir].label+(f.last?' · last: '+f.last:''))+'">'
          + '<i class="ti '+DIR[f.dir].icon+' di '+f.dir+'"></i>'
          + '<span class="w">'+f.what+'</span>'
          + '<span class="r"><span class="oc"><i class="ti '+OBJ_ICON[f.obj]+'"></i>'+f.obj+'</span><span class="when">'+f.when+'</span></span></div>';
      }).join('') + '</div>';

  h += '<div class="fgrp"><div class="shead"><b>3</b>Owners</div>'
    + hatRow('Data engineer', it.owners.eng) + hatRow('Methodology', it.owners.method) + hatRow('Presentation', it.owners.ui) + '</div>';

  h += '<div class="fgrp"><div class="shead"><b>4</b>Recent runs</div>'
    + (it.runs.length ? it.runs.slice(0,5).map(function(r){
        return '<div class="run"><span class="t">'+r[0]+'</span><i class="ti '+(r[1]?'ti-circle-check ok':'ti-circle-x bad')+'"></i><span class="d">'+r[2]+'</span></div>';
      }).join('') : '<div class="emptybox">Nothing has run yet.</div>')
    + '</div>';

  document.getElementById('dBody').innerHTML = h;

  /* footer: weakest to strongest, primary last */
  var f = '';
  if(it.status === 'on'){
    f = '<button class="ghost" onclick="setStatus(I.byId(\''+it.id+'\'),\'off\')">Pause</button>'
      + '<button class="btn-out" onclick="gyToast(\'Opens '+esc(it.name)+' in a new tab\')"><i class="ti ti-external-link"></i> Open in '+it.name+'</button>'
      + '<button class="btn-dark" onclick="syncNow(I.byId(\''+it.id+'\'))"><i class="ti ti-refresh"></i> Sync now</button>';
  } else if(it.status === 'warn'){
    f = '<button class="ghost" onclick="setStatus(I.byId(\''+it.id+'\'),\'off\')">Pause</button>'
      + '<button class="btn-out" onclick="gyToast(\'Field mapping: '+unmapped+' fields from '+esc(it.name)+' have no home in the GY schema yet\')"><i class="ti ti-arrows-split"></i> Map fields</button>'
      + '<button class="btn-dark" onclick="retry(I.byId(\''+it.id+'\'))"><i class="ti ti-refresh"></i> Retry</button>';
  } else if(it.status === 'off'){
    f = '<button class="btn-out" onclick="gyToast(\'Opens '+esc(it.name)+' in a new tab\')"><i class="ti ti-external-link"></i> Open in '+it.name+'</button>'
      + '<button class="btn-dark" onclick="setStatus(I.byId(\''+it.id+'\'),\'on\')"><i class="ti ti-player-play"></i> Resume</button>';
  } else {
    f = '<button class="btn-out" onclick="gyToast(\'Opens the '+esc(it.name)+' documentation\')"><i class="ti ti-book"></i> How it connects</button>'
      + '<button class="btn-dark" onclick="request(I.byId(\''+it.id+'\'))"><i class="ti ti-plug"></i> Request connection</button>';
  }
  document.getElementById('dFoot').innerHTML = f;
}

/* ── header ── */
var c0 = I.counts();
document.getElementById('synclab').innerHTML = gyChip('Synced ' + I.lastSync.split(' ')[0],
  'Last sync ' + I.lastSync + ' (HubSpot).\n' + c0.on + ' connected, ' + c0.warn + ' needs attention, ' + c0.off + ' paused, ' + c0.avail + ' available.',
  c0.warn ? 'warn' : '');

var ACTIONS = [
  ['label','Integrations'],
  ['ti-refresh','Sync all now','Sync started for every connected integration. Results land in the audit log as they arrive'],
  ['ti-file-export','Export connection register','Export: a CSV of every integration, its flows and its owners'],
  '-',
  ['label','Rules'],
  ['ti-arrows-split','Field mappings','Field mappings: how each system\'s fields land in the GY schema'],
  ['ti-clock','Sync schedule','Sync schedule: when each integration runs and who is told when it does not'],
  '-',
  ['ti-lock','Audit log','go:audit-log.html']
];

function addMenu(b){
  var rows = [];
  Object.keys(CATS).forEach(function(cat){
    var av_ = I.byCat(cat).filter(function(i){ return i.status === 'avail'; });
    if(!av_.length) return;
    rows.push(['label', CATS[cat].name]);
    av_.forEach(function(i){ rows.push(['ti-plug', i.name, function(){ openDrawer(i.id); }]); });
  });
  rows.push('-', ['ti-message-plus','Request another system','Request a system that is not in the catalogue yet: the data team scopes it as a bet']);
  gyMenu(b, rows);
}

var bar = gyBar('abar', {
  search: {placeholder:'Search integrations', oninput:function(v){ state.q = v; render(); }},
  filters: [
    ['Category',  [['ti-circle-dot','All categories','all']].concat(Object.keys(CATS).map(function(k){
                     return [CATS[k].icon, CATS[k].name, k]; }))],
    ['Status',    [['ti-circle-dot','All statuses','all'],
                   ['ti-plug-connected','Connected','on'],
                   ['ti-alert-triangle','Needs attention','warn'],
                   ['ti-player-pause','Paused','off'],
                   ['ti-plug','Available','avail']]],
    ['Direction', [['ti-circle-dot','All directions','all'],
                   ['ti-arrow-down-left','Into GY OS','in'],
                   ['ti-arrow-up-right','Out of GY OS','out'],
                   ['ti-arrows-exchange','Two-way','both']]],
    ['Object',    [['ti-circle-dot','All objects','all']].concat(I.objects.map(function(o){
                     return [OBJ_ICON[o], o, o]; }))]
  ],
  onfilter: function(g, v){ state.f[g] = v; render(); },
  actions: ACTIONS,
  primary: {icon:'ti-plus', label:'Add integration', onclick:function(b){ addMenu(b); }}
});

render();

/* deep links: ?i=<id> opens a drawer, ?cat=<cat> preselects the category */
(function(){
  var q = location.search;
  var cat = (q.match(/[?&]cat=([^&]+)/) || [])[1];
  if(cat && CATS[cat]) setFilter('Category', CATS[cat].name);
  var id = (q.match(/[?&]i=([^&]+)/) || [])[1];
  if(id && I.byId(id)) openDrawer(id);
})();
</script>
</body>
</html>
