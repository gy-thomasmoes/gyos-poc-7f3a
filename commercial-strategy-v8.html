var UD = {"meta": {"client": "Dee Rivers Trust and Atlantic Salmon Trust", "area_ha": "150,000", "title": "Upper River Dee Commercial Strategy", "subtitle": "Nature Finance & Commercial Strategy: a 150,000-hectare landscape and river restoration for Spring salmon conservation", "date": "May 2026", "location": "Cairngorms National Park, Scotland"}, "exec_summary": "Great Yellow assessed how the Dee Rivers Trust and partners can use the natural capital of the Upper Dee to fund salmon conservation and landscape restoration. Woodland and peatland carbon are the largest funding streams, with a conservative financing potential of approximately £50M over a 20 year period. A second opportunity sits in the voluntary water markets: Natural Flood Management, Water Quality and Replenish, driven by the many businesses and communities that depend on the Dee. Voluntary biodiversity and species funding could add a meaningful contribution, helped by the charismatic nature of the project. A catchment scale approach is judged the most compelling nature finance solution for this geography. The next phase should focus on landowner participation and baseline habitat surveys to natural capital standards.", "questions_for_client": ["How should the strategy be communicated to landowners and communities, and what engagement process would build trust from the outset?", "Who takes this work forward: an existing organisation with a mandate, or a new delivery function?", "How are benefits shared among stakeholders and communities?", "What will the proposed work cost, who funds pre-commercial development, and can Great Yellow bring in catalytic private capital?", "What governance structure and delivery body would suit the Upper Dee, and how are competing interests represented and resolved?", "Who are the ideal partners across engagement, structuring, delivery, monitoring and buyer engagement, and where are the critical gaps?", "How is project integrity protected over time, which standards govern credits, and what happens if outcomes fall short?", "What does success look like at five, ten and twenty-five years, and are ecological, financial and community outcomes weighted equally?", "How should the Upper Dee position itself against the Natural Environment (Scotland) Act 2026 and the Ecosystem Restoration Code, and what are the risks of being an early demonstrator?"], "introduction": "The Upper Dee spans approximately 150,000 hectares in the Cairngorms National Park and is held mainly across eight major sporting estates. Overgrazing by deer, peatland drainage and climate change have degraded the landscape, and Atlantic salmon on the Dee are now critically endangered. Great Yellow was commissioned to produce a roadmap to finance restoration at catchment scale. The report asks two questions: can the Upper Dee be restored at catchment scale, and is it investable beyond grant dependency?", "project_vision": {"intro": "The original vision was to restore instream and riparian habitat to halt the decline of Atlantic salmon and freshwater pearl mussels. It has evolved into a holistic, catchment-scale nature recovery project, with resilience for communities, businesses and stakeholders at its heart. Salmon remain an essential outcome.", "interventions": [{"name": "Peatland Restoration", "text": "Over 9,000 hectares of degraded peatland have been identified for restoration. Rewetted peat regulates flows, cools river water and cuts sediment, and supports flood and drought resilience for a river that supplies approximately 300,000 people."}, {"name": "Riparian and Native Woodland Planting", "text": "1,700+ hectares have been identified for tree planting, mainly along river corridors, to shade water towards the 16°C salmon threshold, exceeded by 70% of Scottish rivers in 2018. The 1,784.3 hectares identified are eligible for the Woodland Carbon Code. WCC eligibility extends to 69% of the Upper Dee landscape."}, {"name": "Grazing Management", "text": "Deer density currently exceeds 12 to 15 deer per km², well above the less than 5 deer per km² needed for natural regeneration. High deer numbers also undermine peatland restoration. Regenerative deer management is presented as a commercial case as much as an ecological one."}, {"name": "Floodplain and River Restoration", "text": "Measures include breaching old embankments to reconnect rivers to floodplains, creating wetlands and open water, and seepage ponds on valley sides. Small structural works include channel widening, embankment removal and flow-deflecting structures. These amplify the benefits of peatland and woodland work."}], "es_opportunity": "Together the interventions deliver carbon, biodiversity, water quality, flood management, water security and socio-cultural benefits. The identified market mechanisms are woodland and peatland carbon, voluntary biodiversity, Natural Flood Management, Water Quality, Replenish and supply chain resilience funding schemes."}, "market_readiness": {"intro": "Nature markets differ in maturity, judged by standard availability, MRV complexity, market traction, buyer appetite and market value. The UK voluntary carbon market is the most mature, while the voluntary water markets are the least mature commercially but have high potential.", "rows": [{"market": "Voluntary Carbon", "risk": "1", "note": "Most mature, but costly and slow to take from concept to transactable"}, {"market": "Compliance Biodiversity", "risk": "N/A", "note": "Not yet mandated in Scotland"}, {"market": "Voluntary Biodiversity", "risk": "3", "note": "Nascent and fragmented, buyers favour bespoke deals"}, {"market": "Water Quality", "risk": "3", "note": "Technically complex, least mature commercially, high potential"}, {"market": "Natural Flood Management", "risk": "2", "note": "Technically complex, least mature commercially, high potential"}, {"market": "Replenish", "risk": "3", "note": "Technically complex, least mature commercially, high potential"}]}, "demand_mapping_methodology": "Great Yellow combined geospatial beneficiary analysis with direct market intelligence. Its Geospatial Predictive Analysis Platform (GPAP) maps water abstraction licence holders and flood-prone communities and assets using SEPA's National Flood Risk Assessment data. Internal GY research identified asset holders, landowners, communities and businesses within or next to the project boundary. This was supplemented by GY's wider buyer network, which matters most for carbon, where buyers are national and international.", "markets": [{"key": "carbon", "title": "The Carbon Markets", "introduction": "Carbon is the most investable and stable natural capital market in this strategy. The voluntary carbon market is the only one open to the Upper Dee, through the Peatland Carbon Code and Woodland Carbon Code, with possible Verra routes.", "status": "The VCM went through a dip after media criticism in 2021 and 2022, followed by a maturation phase. Retirements have held at approximately 182 MtCO₂e since 2021, even as transaction volumes fell by 25%. Buyers now seek domestic, verified, nature-based credits with strong co-benefits.", "supply_demand": "UK domestic credits sold for £35 to £100/tCO₂e in 2025. WCC sold 345,725 units in 2023 and 277,815 in 2024, while PCC units rose from 9,053 in 2022 and 11,416 in 2023 to 187,291 in 2024, an increase of over 1,500%. PCC credits are avoidance credits, but buyer appetite for them is growing.", "mrv": "Both codes quantify in tCO₂e and issue through the S&P Global Environmental Registry. The process runs from baseline surveys and validation to Pending Issuance Units, annual monitoring and five-yearly verification. Permanence monitoring runs 40 to 100 years for woodland and 30 years for peatland.", "routes": "WCC needs a Woodland Creation Design Plan, registry listing, validation, verification at year 5 then every ten years, a 40 year minimum permanence and a 20% buffer. PCC needs a peat condition survey, GHG baseline, registry listing, validation, five-yearly verification, a minimum 30-year duration and a 20% buffer. Great Yellow can support both codes and structure forward sales of PIUs.", "pricing": "GY's indicative curve gives WCC spot prices rising from £82 in 2026 to £116 in 2032, and PCC spot from £62 to £87. Risk-adjusted forward prices fall from £82 to £61 (WCC) and £62 to £46 (PCC) over the same years. Spot prices are expected to rise, while forward prices are lower to reflect delivery risk.", "opportunity": "GIS analysis finds 9,113 hectares of degraded peatland: 6,674 ha eroded and 2,605 ha affected by drainage. At £25/tCO₂e, peatland revenue is ~£31.7m (6,600 ha conservative) to ~£43.7m (9,113 ha upside), an indicative £44 million over a 30-year crediting period. The 1,784.3 ha of WCC-eligible riparian woodland gives 171,300 net tCO₂e and an indicative £8.6 million over 30 years. Combined carbon sits at approximately £50 million against gross restoration costs of £27 million to £35 million. After about £6.24 million of Forestry Grant Scheme funding, the indicative net surplus is approximately £25 million.", "opportunity_table": [["", "Peatland Scenario A, Conservative (6,600 ha)", "Peatland Scenario B, Upside (9,113 ha)", "Woodland (1,784.3 ha)"], ["Gross credits", "1,584,000tCO₂e", "2,187,120tCO₂e", "214,116 tCO₂e"], ["Less 20% buffer", "(316,800)", "(437,424)", ""], ["Net credits", "~1,267,200tCO₂e", "~1,749,696 tCO₂e", "171,300 tCO₂e"], ["Indicative revenue", "~£31.7m (at £25/tCO₂e)", "~£43.7m (at £25/tCO₂e)", "~£8.6M (at £30/tCO₂e)"], ["Indicative gross restoration cost", "", "~£9.4 million to £17.3 million", "~£17.84 million (~£11.6 million net of FGS)"]], "case_study": "", "customer_targets": [{"name": "Aviva", "why": "229,794 credits retired, high integrity preference"}, {"name": "NatWest Group", "why": "Confirmed Woodland Carbon Code buyer, 2030 operational net zero"}, {"name": "Lloyds Banking Group", "why": "Net zero operations 2030, interested in water as a carbon co-benefit"}, {"name": "Bupa", "why": "Net Zero operations 2040, SBTi validated"}, {"name": "Diageo / Royal Lochnagar Distillery", "why": "Distillery on the Dee, £5 million peatland restoration fund"}, {"name": "Unilever", "why": "SBTi FLAG Scope 3 rationale, commitment status to verify"}, {"name": "Marks & Spencer", "why": "SBTi FLAG Scope 3 rationale, commitment status to verify"}, {"name": "John Lewis Partnership / Waitrose", "why": "SBTi FLAG Scope 3 rationale, commitment status to verify"}, {"name": "Universities of St Andrews and Edinburgh", "why": "Institutional targets for peatland and soil carbon"}, {"name": "Scottish Water", "why": "Abstracts from the Dee, peatland restoration is a stated priority"}, {"name": "Deeside Water Company", "why": "Business depends on the purity and brand of Deeside water"}, {"name": "Scottish Power", "why": "Net Positive biodiversity target by 2030"}, {"name": "Deeside and Lost Loch Distilleries", "why": "Story-driven pilot partners rather than volume buyers"}]}, {"key": "bng", "title": "Biodiversity Net Gain (BNG)", "introduction": "England's compliance BNG market has grown fast, from approximately 1,500 units allocated in February 2026 to upwards of 2,400 by June 2026, with units at £20,000 to £130,000. Scotland has no mandatory BNG yet, but the English market has driven voluntary demand in Scotland using the same metric.", "status": "Using compliance-grade tools gives voluntary buyers confidence. In 2025 Gaia listed 79 registered projects, 47 pending issuance and 125 voluntary BNG projects.", "supply_demand": "A small but growing number of Scottish corporates buy voluntary BNG credits or fund habitat creation measured with the BNG metric. True demand is hard to size, as most commitments do not specify a method, which leaves room for the Upper Dee to absorb it.", "mrv": "In England, BNG requires a Habitat Management and Monitoring Plan, a 30-year legal agreement, a Biodiversity Gain Plan using DEFRA's metric and registration on the Gain Site Register. Voluntary BNG does not need formal registration.", "routes": "The BNG Metric scores habitat type, condition and spatial distinctiveness before and after intervention. The Upper Dee route involves a baseline survey, gain site registration (or voluntary equivalent), monitoring over the agreement and independent verification.", "pricing": "Voluntary units price well below compliance units at £20,000 to £130,000. Purely voluntary credits, such as Earthly's, sell at approximately £100-200 per unit. Great Yellow assumes £200 per BNG equivalent unit as a working assumption.", "opportunity": "The Upper Dee has highly distinctive habitats such as blanket and modified bog, upland heath, riparian woodland and river systems, many in degraded condition. Unit volumes and revenue will be confirmed after baseline surveys. BNG units and carbon cannot currently come from the same hectare within one project. The programme is designed to move into a Scottish compliance market when it arrives.", "opportunity_table": [], "case_study": "", "customer_targets": [{"name": "Scottish and Southern Electricity Networks (SSEN)", "why": "Active BNG-style adopter in Scotland, existing GY relationship"}, {"name": "ScottishPower", "why": "Net positive biodiversity by 2030, buys voluntary BNG credits"}, {"name": "Scottish Water", "why": "Abstracts from the Dee, invests in upstream nature-based solutions"}, {"name": "Network Rail", "why": "UK-wide biodiversity uplift commitments, existing GY relationship"}, {"name": "Balfour Beatty", "why": "Delivering peat BNG for SSEN in Scotland, active Scottish pipeline"}, {"name": "Amey plc", "why": "Nature Positive Strategy launched September 2025, Scottish infrastructure contracts"}, {"name": "SGN (Scotia Gas Networks)", "why": "Committed to BNG across its operational sites, Scottish award winner"}, {"name": "Aggregate Industries", "why": "Nature positive by 2030, Glensanda quarry in Scotland"}]}, {"key": "volbio", "title": "Voluntary Biodiversity", "introduction": "Voluntary biodiversity finance is driven by nature-positive pledges, ESG commitments and reputation. Companies either fund biodiversity uplift directly or buy voluntary biodiversity credits.", "status": "Uptake is held back by a lack of agreed standards, oversight and a single trusted framework. The Biodiversity Credit Alliance formed in 2024, and High-Level Principles were issued in May 2025.", "supply_demand": "Brands such as Chanel, Coca Cola and Nestlé are striking bespoke biodiversity deals, and TNFD adoption is accelerating. Lidl, AstraZeneca and Nestlé have shown interest, and AstraZeneca has approximately £5 million for UK nature-based supply chain resilience projects.", "mrv": "MRV starts with a field baseline of habitat condition and species diversity, with satellite and AI monitoring where required. CreditNature runs five-year cycles, Wallacea combines annual remote monitoring with field checks over at least 30 years, and Earthly uses buyer-specific frameworks.", "routes": "Three methodologies were appraised: the Ecosystem Restoration Code via CreditNature (NARIA), RePlanet using the Wallacea Trust method, and Earthly. Wallacea ranked first of 91 global methodologies under EU LIFE Biodiv CrEW. Earthly's first UK sale was 543 credits at approximately £50 per unit in October 2024.", "pricing": "CreditNature and RePlanet both indicate £9,000 to £10,000 per hectare. Earthly pricing is around £100-200 per credit, with £300 per hectare also cited. Bespoke deal prices depend on package and sponsor priorities.", "opportunity": "At 150,000 hectares the Upper Dee holds a mosaic of heath, blanket bog, riparian woodland, montane scrub and river habitats in degraded but restorable condition. Charismatic species such as Atlantic salmon, otters, pearl mussels and wading birds open up species restoration funding. Its multi-benefit profile could command a premium over single-outcome projects. The NASCO angle may open a cross-border buyer market as NASCO's Ten-Year Strategy reporting begins from 2026.", "opportunity_table": [], "case_study": "", "customer_targets": [{"name": "Scottish Water", "why": "Primary Dee abstractor supplying approximately 300,000 people"}, {"name": "Diageo Scotland Limited", "why": "Abstraction licence for Royal Lochnagar, depends on clean water"}, {"name": "Deeside Water Company", "why": "Brand built on Dee provenance"}, {"name": "Scottish Power", "why": "Shown appetite for voluntary biodiversity credits in Scotland"}, {"name": "SSEN", "why": "Shown appetite for voluntary biodiversity credits in Scotland"}, {"name": "Harbour Energy", "why": "Aberdeen-based, TNFD-aligned, nature-positive by 2030"}, {"name": "Hardy & Greys", "why": "Salmon fly fishing brand, brand alignment"}, {"name": "Orvis", "why": "5% for Nature programme funds salmon restoration"}, {"name": "Simms Fishing Products", "why": "Conservation partnership programme published 2024"}, {"name": "Patagonia", "why": "Environmental mission central to brand"}, {"name": "Fisheries Management Scotland", "why": "Voluntary biodiversity fund in development with GY"}, {"name": "Stabiliti", "why": "Green Margin route for food and drink retailers, concept stage"}, {"name": "Mowi ASA", "why": "Net positive biodiversity by 2030, wild salmon narrative"}, {"name": "SalMar ASA", "why": "TNFD early adopter, Scottish operations via Scottish Sea Farms"}, {"name": "Cermaq", "why": "Scottish fish farms make Upper Dee attributable in reporting"}, {"name": "AstraZeneca", "why": "£5m nature-based solutions envelope"}]}, {"key": "nfm", "title": "Natural Flood Management (NFM)", "introduction": "UK flood costs are estimated at £1.6 billion a year, projected to reach £3.6 billion per year by 2050. Scotland published its first National Resilience Strategy in December 2024 and committed £150 million to flood resilience this Parliament. Most NFM deals so far are bespoke and made with nearby buyers who share an asset risk.", "status": "The UK NFM market is nascent, with no credit standards, pricing benchmarks or secondary market. Policy signals are strengthening, and Scottish Water has restored over 50 hectares of peatland at Loch Katrine since January 2025.", "supply_demand": "Great Yellow is selling NFM benefits in the Evenlode Landscape Recovery project, with several deals advanced with utilities, roads and rail operators. Network Rail is in active NFM discussions with Great Yellow.", "mrv": "Phase 1 covers a broad assessment of hydrograph impact, buyer engagement on asset hotspots and upstream modelling. Phase 2 agrees success metrics, the asset ledger, verification principles and monitoring. Hydrological modelling is essential to any commercial deal.", "routes": "NFM is not yet traded as a formal credit, and quantification is bespoke. Detailed hydrological modelling is the best way to build a buyer case. The Replenish standard is a secondary route.", "pricing": "There is no uniform pricing for NFM credits or deals, as arrangements are made directly with each customer.", "opportunity": "SEPA's 2025 assessment puts 400,000 Scottish properties at medium flood risk, up from 284,000 in 2018 and projected to reach 634,000 by 2100. GPAP analysis finds over 310 km of roads and £114 million of economic assets within the project boundary at risk in the 1 in 200 plus climate change scenario. Invercauld and Ballater have 601 properties at risk in that scenario compared with 6 at the 1 in 10 return period. Proposed interventions are peatland restoration on 9,113 hectares, 1,784.3 hectares of riparian woodland and floodplain reconnection, with peatland revegetation able to cut peak flows by up to 27%.", "opportunity_table": [], "case_study": "Nature for Networks (N4N), a five year SSEN and Ofgem programme with a trial site at the 3,500 hectare Evenlode Landscape Recovery project, which holds contracts with over 60 farmers and landowners.", "customer_targets": [{"name": "Aberdeenshire Council and the Ballater Community", "why": "Storm Frank flooded 307 homes and 60 businesses, Ballater defence plan priced at £31 million"}, {"name": "SSEN", "why": "Distribution lines in the Ballater and Braemar corridor, existing N4N relationship"}, {"name": "Scottish Water", "why": "Cairnton abstraction and Invercannie works, £13.4 billion business plan"}, {"name": "Transport Scotland and Roads Infrastructure", "why": "A93 and over 310 km of roads at risk"}, {"name": "Amey", "why": "Transport Scotland contractor, possible buyer or delivery partner"}]}, {"key": "wq", "title": "Water Quality", "introduction": "Water treatment costs have risen sharply, and water companies are turning to nature-based solutions that tackle pollution at source. This shift has created a voluntary water quality market.", "status": "Scottish Water compliance is 99.92%, but it received 16,779 water quality complaints in 2024 and 34 incidents needed investigation, up from 29. Dissolved organic carbon from degraded peat is the root problem and is getting harder and costlier to treat.", "supply_demand": "Great Yellow is working with English water companies on nature-based solutions, helped by Ofwat funding cycles. Great Yellow has yet to meaningfully engage Scottish Water on water quality, so Scottish demand is promising but nascent.", "mrv": "The main pollutant is diffuse DOC from degraded blanket peat, which is hard to attribute to specific actions. Credible MRV needs robust source apportionment and a clear causal chain from action to outcome.", "routes": "A two-tier monitoring framework is proposed: baseline and trend monitoring with in-stream sensors and sampling, then attribution and valuation using sediment fingerprinting and avoided damage costs. Scottish Water's monitoring at Cairnton is an anchor point.", "pricing": "Pricing is currently very bespoke and depends on the value a project offers to each client.", "opportunity": "The 150,000 hectare catchment supplies drinking water to approximately 300,000 people and sits directly at investments match the company's disclosed water impacts and are sited in the catchment it abstracts from, mainly through the Alliance for Water Stewardship Standard.", "routes": "Three routes: direct engagement with Scottish Water, direct engagement with licensed abstractors in the Dee catchment, and corporate water stewardship and supply chain insetting under TNFD and SBTN.", "pricing": "", "opportunity": "The offer restores the catchment's natural water regulation across 150,000 ha, through peatland restoration, riparian woodland and river restoration. Buyers can join a catchment-scale payment for ecosystem services agreement, with payments calibrated to their licensed abstraction volume, water risk and disclosure duties. Contributions can stand alone or be bundled with carbon and biodiversity credits.", "opportunity_table": [], "case_study": "The Coca-Cola Foundation and The Rivers Trust partnership, which has replenished an estimated 2.75 billion litres of water and improved approximately 3,100 hectares since 2012.", "customer_targets": [{"name": "Scottish Water", "why": "Anchor buyer, Cairnton abstraction, restored over 600 ha in the Cairngorms in 2025"}, {"name": "Diageo Scotland Ltd", "why": "Abstraction licence at Royal Lochnagar, up to £5m pledged to Scottish peatland"}, {"name": "Deeside Water Company Ltd", "why": "Abstracts at Ballater, brand tied to Dee purity"}, {"name": "Elixir Distilleries", "why": "Independent distillery abstracting in the catchment"}, {"name": "James Jones & Sons Ltd", "why": "Abstraction licences at Burnroot Sawmill, Dinnet"}, {"name": "Balmoral, Invercauld, Glen Tanar and Glenmuick Estates, and NTS at Mar Lodge", "why": "Licence holders, better suited to partnership than PES"}, {"name": "Glenshee Ltd", "why": "Abstraction licences for the Cairnwell ski centre"}, {"name": "The Inver Hotel", "why": "Licensed abstractor at Crathie"}, {"name": "Spittal of Glenshee Hotel", "why": "Licensed abstractor"}, {"name": "Ballater Golf Club" /* a simple rule-based rewrite for the sketch: shorter and or plainer */
function rewrite(q, msg){
  var m = msg.toLowerCase(), t = q;
  var plain = /simpl|plain|jargon|clear|understand|easier|layman|landowner/.test(m), short = /short|concise|tight|brief|less|trim|cut|wordy/.test(m);
  if(!plain && !short){ plain = short = true; }
  if(short){
    t = t.replace(/\s*\([^)]*\)/g, '').replace(/\b(really|very|also|just|actually|both|already|currently)\s+/gi, '');
    var ss = t.match(/[^.!?]+[.!?]+/g); if(ss && ss.length > 2) t = ss.slice(0, 2).join('');
    t = t.replace(/,\s*(which|and)\s+[^,.]*(?=\.)/, '');
  }
  if(plain){
    [['dissolved organic carbon','brown water'],['\\bDOC\\b','brown water'],['\\bMRV\\b','measurement'],['monetisable','sellable'],['abstracts from','takes water from'],
     ['abstraction','water taking'],['co-funded by','part-funded by'],['co-funding','part-funding'],['indicative','rough'],['landscape-scale','large-scale'],
     ['landscape scale','large scale'],['sequestering','storing'],['interventions','planned work'],['additionality','extra impact'],['stacking','combining'],['bilateral','one-to-one']]
      .forEach(function(p){ t = t.replace(new RegExp(p[0], 'gi'), function(w){ return /^[A-Z]/.test(w) && !/^[A-Z]+$/.test(w) ? p[1].charAt(0).toUpperCase()+p[1].slice(1) : p[1]; }); });
  }
  return t.replace(/\s{2,}/g, ' ').trim();
}

function navOff(){ var nav = navRow(); return nav ? nav.offsetHeight : 0; }

  var el = document.getElementById(id), sc = document.querySelector('.v5body');
  if(!el || !sc) return;

  sc.scrollTo({top: Math.max(0, relTop(el, sc) - 32 - navOff()), behavior:'smooth'});

  var nav = document.getElementById('setnav'); if(!nav) return;
  [].forEach.call(nav.querySelectorAll('a'), function(a){ a.classList.toggle('on', a.getAttribute('data-id') === id); });
  var row = navRow(), on = nav.querySelector('a.on');

  tocFollow(nav);
}
document.addEventListener('scroll', function(e){
  if(!e.target || !e.target.classList || !e.target.classList.contains('v5body')) return;
  var nav = document.getElementById('setnav'); if(!nav || Date.now() < ANCLOCK) return;
  var sc = e.target, ids = [].map.call(nav.querySelectorAll('a'), function(a){ return a.getAttribute('data-id'); }), cur = ids[0];
  ids.forEach(function(id){ var el = document.getElementById(id); if(el && relTop(el, sc) - 80 - navOff() <= sc.scrollTop) cur = id; });
  if(sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) cur = ids[ids.length-1];
  setActive(cur);
}, true);

/* ── tabs and panels ───────────────────────────────────────────────────── */
var TABS = [['doc','ti-file-text','Document'],['workflow','ti-hierarchy-2','Workflow'],['activity','ti-activity','Activity'],['settings','ti-settings','Settings']];
var DRAWERS = [['outputs','ti-package','Outputs','']];
var TAB = 'doc', DR = null;
function paintTabs(){
  var shut = document.body.classList.contains('pclosed');
  document.getElementById('tabs').innerHTML =
    '<button class="v8agt'+(shut?'':' on')+'" onclick="toggleChat()" title="'+(shut?'Show':'Hide')+' the agent">'
      + '<span class="v8ava'+(BUSY?' live':'')+'" id="agtav"><i class="ti '+AGENT_IC+'"></i></span>Agent</button>'

function openTab(k, keep){
  if(k === 'doc' && keep && TAB === 'doc' && docBusy()){ DOCPEND = true; return; }
  if(k !== 'workflow' && DR === 'step') closeDrawer();
  TAB = k; paintTabs();

  var sc = el.parentNode.scrollTop;
  el.classList.remove('wide');

function paintAll(){ paintTabs(); paintProg(); openTab(TAB, true);

function toggleChat(){

function openDrawer(k){
  if(DR === k) return closeDrawer();
  DR = k;
  var d = DRAWERS.filter(function(x){ return x[0]===k; })[0];
  document.getElementById('dricon').className = 'v5dri hide';

}
function closeDrawer(){
  var wasStep = DR === 'step';

  document.getElementById('dricon').style.borderRadius = '';

}

  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));

/* chat width, as in v4-chat */
var CHAT_MIN = 340, CHAT_MAX = 680;
(function(){
  var w = 0;
  try{ w = parseInt(localStorage.getItem('gyChatW8') || '', 10) || 0; }catch(e){}
  if(w) document.body.style.setProperty('--chatw', Math.max(CHAT_MIN, Math.min(CHAT_MAX, w)) + 'px');
  var grip = document.getElementById('chatgrip'), chat = document.querySelector('.v5chat');
  if(!grip || !chat) return;
  grip.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var x0 = e.clientX, w0 = chat.getBoundingClientRect().width;
    document.body.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    function move(ev){
      var room = document.querySelector('.v5row').getBoundingClientRect().width - 420;
      var nx = Math.max(CHAT_MIN, Math.min(Math.min(CHAT_MAX, room), w0 + (ev.clientX - x0)));
      document.body.style.setProperty('--chatw', Math.round(nx) + 'px');
    }
    function up(){
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up);
      document.body.classList.remove('dragging');
      try{ localStorage.setItem('gyChatW8', String(Math.round(chat.getBoundingClientRect().width))); }catch(e){}
    }
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
})();

/* ── fill to here (8 Oct): click a step's circle in Workflow and the run fast-forwards to the end of
   that step, taking the recommended answer at every question, decision and review, then pauses. ── */
var FF = null, FFSP = null;
function ffTo(k){
  if(FF) return;
  if(isDone(k)){ gyToast('Step '+k+' is already done. Restart the run from the page menu to go back.'); return; }
  FF = k; FFSP = {say:SP.say, item:SP.item, settle:SP.settle, con:SP.con};
  SP.say = SP.item = SP.settle = SP.con = 0;
  if(Q && Q.t === 'ff'){ Q = null; }
  if(!Q && !T && S[BI] && S[BI].t !== 'end') run();
  ffPump();
}
function ffPump(){
  if(!FF) return;
  if(S[BI-1] && S[BI-1].t === 'end' && !Q){ ffRestore(); return; }
  if(Q){
    if(Q.t === 'start') startDeliverable();
    else if(Q.t === 'ask') answer(0);
    else if(Q.t === 'dec') decide(0);
    else if(Q.t === 'wait') reply();
  }
  setTimeout(ffPump, 15);
}
function ffRestore(){ if(FFSP){ SP.say = FFSP.say; SP.item = FFSP.item; SP.settle = FFSP.settle; SP.con = FFSP.con; } FFSP = null; FF = null; }
var ffRun0 = run;
run = function(){
  if(FF && isDone(FF)){
    var k = FF; T = null; BUSY = false; ffRestore();
    LOG.push(say('Filled the document up to step <b>'+k+'</b>, taking the recommended answer at each question and decision. I paused here.'));
    Q = {t:'ff'}; paintAll(); paintChat(); return;
  }
  ffRun0();
};
function ffResume(){ if(!Q || Q.t !== 'ff') return; Q = null; paintChat(); run(); }
var ffPaint0 = paintChat;
paintChat = function(keep){
  ffPaint0(keep);
  if(Q && Q.t === 'ff'){
    var el = document.getElementById('chatin');
    el.insertAdjacentHTML('beforeend', '<div class="v8start"><button class="v8aopt pri" onclick="ffResume()"><i class="ti ti-player-play"></i><span>Continue the run</span></button></div>');
    var lg = document.getElementById('chatlog'); if(lg && !keep) lg.scrollTop = lg.scrollHeight;
  }
};
document.addEventListener('click', function(e){
  var m = e.target.closest && e.target.closest('.v8ws .mk'); if(!m) return;
  e.stopPropagation(); e.preventDefault();
  var no = m.parentNode.querySelector('.no'); if(no) ffTo(no.textContent.trim());
}, true);
