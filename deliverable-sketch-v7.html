<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upper Dee: Customer Demand Mapping &middot; Great Yellow</title>
<!-- sketch 7: three columns, the rail, the conversation with the queue folded in, and the document floating -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="gy-manner-font.css?v=96c98a0d">
<link rel="stylesheet" href="gy-shell.css?v=dd4e9861">
<style>
/* ── v7: three columns. The rail on the left, the conversation in the middle,
   the document floating on the right. Same model as v6: the queue is still
   the spine and the log is still a record, but both now live in the
   conversation column, as collapsible sections above the log, so the page
   reads like a chat with the deliverable and the document beside it. ── */
.mainc{overflow:hidden;display:flex;flex-direction:column}
.v7row{flex:1;display:flex;min-height:0;background:var(--bg)}

/* ── the conversation column ── */
.v7chat{width:var(--chatw,460px);flex:none;min-width:0;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--bg)}
body.nochat .v7chat{display:none}
body.nodoc .v7chat{width:auto;flex:1;border-right:none}
body.nodoc .v7chat .v7scroll > *,body.nodoc .v7chat .v6comp{max-width:760px;width:100%;margin:0 auto}
@media(max-width:1180px){.v7chat{width:min(var(--chatw,460px),380px)}}

/* the sections: a chevron, a name, a count. Open ones carry a body. */
.v7scroll{flex:1;min-height:0;overflow:auto}
.v7acc{padding:0 14px 0;border-bottom:1px solid var(--line)}
.v7sec{border-top:1px solid var(--line)}
.v7sec:first-child{border-top:none}
/* Needs you stays put while the rest of the column scrolls under it. It is a
   direct child of the scroller, because sticky only holds inside its parent. */
.v7needs{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 14px 0;border-bottom:1px solid var(--line)}
.v7needs .v7sec{border-top:none}
.v7acc .v7sec:first-child{border-top:none}
.v7sh{width:100%;display:flex;align-items:center;gap:8px;border:none;background:none;padding:9px 4px 8px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.v7sh .ti{font-size:14px;color:var(--ink3);transition:transform .15s;flex:none}
.v7sec.on .v7sh .ti{transform:rotate(90deg)}
.v7sh em{font-style:normal;font-weight:500;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.v7sh em.hot{background:var(--amber);color:#1A0C12;border-radius:999px;min-width:18px;height:18px;padding:0 6px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.v7sb{padding:0 4px 9px}

/* Needs you: one line per item where it fits, two where the question needs
   them. The text carries its own context in a dimmer tail; the action sits
   right. Hairlines between items, no card chrome. */
.v7qi{display:flex;align-items:center;gap:10px;padding:6px 0 7px;border-top:1px solid var(--line)}
.v7qi:first-child{border-top:none;padding-top:0}
.v7qi .t{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--ink)}
.v7qi .t em{font-style:normal;color:var(--ink3);font-size:12px;margin-left:6px}
.v7qi .acts{flex:none;display:flex;gap:4px}
.v7qi .acts .v6b{padding:3px 10px;font-size:12px}
.v7qi .alt{opacity:0;transition:opacity .12s}
.v7qi:hover .alt,.v7qi:focus-within .alt{opacity:1}
.v7qi.flash{animation:gyflash 1.2s ease-out}
.v7empty{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:2px 0 1px}
.v7empty .ti{color:var(--greend);font-size:16px}

/* progress: the chapter bars stacked, one line each, live state on the right */
.v7pr{display:flex;align-items:center;gap:10px;padding:5px 4px;margin:0 -4px;border-radius:7px;font-size:12.5px;cursor:pointer}
.v7pr:hover{background:rgba(31,31,29,.04)}
.v7pr:hover .nm{color:var(--ink)}
.v7pr .nm{width:104px;flex:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v7pr .dlsgb{flex:1;height:5px}
.v7pr .c{flex:none;width:30px;text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}
.v7pr .lv{flex:none;color:var(--ink3);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.v7pr.off .nm{color:var(--ink3)}

/* a long assistant entry folds to four lines with a fade, and opens on Show more */
.v6ev.clip .v6evb{max-height:5.9em;overflow:hidden;position:relative}
.v6ev.clip .v6evb:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.2em;
  background:linear-gradient(rgba(246,243,236,0),var(--bg))}
.v7more{border:none;background:none;padding:6px 0 0;font-family:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer}
.v7more:hover{color:var(--ink)}
.v7frh .dlonm{flex:0 1 auto;margin-right:auto}

/* the log under the sections */
.v7log{padding:0 18px 10px}
.v7lh{display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);padding:14px 18px 4px}
.v7reopen{display:none;margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;width:28px;height:26px;
  color:var(--ink3);cursor:pointer;align-items:center;justify-content:center;font-size:15px}
.v7reopen:hover{color:var(--ink);border-color:var(--ink3)}
body.nodoc .v7reopen{display:inline-flex}
.v7log .v6ev:first-child{border-top:none}
.v7chat .v6comp{border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--bg)}

/* ── the document column: one card, floating ── */
.v7doc{flex:1;min-width:0;display:flex;padding:16px;min-height:0}
body.nodoc .v7doc{display:none}
.v7doc .v5card{flex:1;min-height:0;position:relative}
/* the card header: the two tabs on the left, the tools on the right */
.v7frh{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px 10px 14px;
  border-bottom:1px solid var(--line)}
.v7frh .v6tabs{margin-right:auto}
.v7ib{width:32px;height:32px;flex:none;border:none;background:none;border-radius:8px;color:var(--ink3);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.v7ib:hover{background:var(--graybg);color:var(--ink)}
.v7frh .v5vt{margin-left:0}

/* the step detail: a sheet inside the card, so the plan stays in view */
.v7side{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:92%;background:var(--card);
  border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:4;
  box-shadow:-8px 0 24px rgba(26,12,18,.06)}
.v7side.hide{display:none}


/* ── carried over from v6: tabs, buttons, plan rows, confirm, log entries, composer, add a step ── */
/* the folded path, unchanged from v5 */
.crmore{flex:none;border:none;background:none;padding:2px 2px;font-family:inherit;font-size:14px;
  line-height:1;color:var(--ink3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:color .12s}
.crmore .sl{color:var(--line2);transition:color .12s}
.crmore .el{letter-spacing:.09em}
.crmore:hover{color:var(--ink)}
.crmore:hover .sl{color:var(--ink3)}
.crmore.hide{display:none}
.crtrail{display:none;align-items:center}
.crtrail.on{display:inline-flex}

/* ── the plan. Every row carries who runs it as well as where it stands.
   Two rows can be live at once, and a dashed row is a step the assistant
   proposed that is not in the plan until someone says so. ── */
.v5wf .ex{width:20px;height:20px;border-radius:50%;flex:none;display:inline-flex;align-items:center;
  justify-content:center;font-size:11px;background:var(--graybg);color:var(--ink3)}
.v5wf .ex.ai{background:var(--dark);color:var(--yellow)}
.v5wf .ex.gate{background:transparent;border:1.5px dashed var(--line2);color:var(--ink3)}
.v5wf .ex.sys{background:var(--graybg);color:var(--ink2)}
.v5wf .ex .dlav{width:20px;height:20px;font-size:8.5px}
.v5wf.pend .ex.ai{background:#3B2C33}
.v5wf .st{flex:none;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.v5wf .st.run{color:var(--amberd);background:var(--amberbg)}
.v5wf .st.wait{color:var(--amberd);border:1px solid #F1D9A8}
.v5wf .st.wait .dlav{width:15px;height:15px;font-size:7px}
.v5wf .st.prop{color:var(--ink2);background:var(--graybg)}
.v5wf .st.done{color:var(--ink3);padding-right:2px}
.v5wf.wait .dot{border-color:var(--amber);border-style:dashed}
.v5wf.prop{border-top-style:dashed}
.v5wf.prop + .v5wf{border-top-style:dashed}
.v5wf.prop .no,.v5wf.prop .ti2{color:var(--ink2)}
.v5wf .mini{flex:none;display:flex;gap:5px}
.v5wf .mini .v6b{padding:3px 10px;font-size:12px}
.v5wf.run .ti2{font-weight:600}
.v5wf.run .dot{border-color:var(--amber);border-width:4px}

/* ── confirming a field. The dot stays; a Confirm appears when you are near
   an unconfirmed field, and the queue counts down as you use it. ── */
.v5flab .v6cf{margin-left:auto;opacity:0;transition:opacity .12s;padding:2px 10px;font-size:12px}
.v5f:hover .v6cf,.v5f.flash .v6cf{opacity:1}
.v5f.flash .v5inp{animation:gyflash 1.2s ease-out}
.v6chs{margin-left:auto;font-size:12px;font-weight:500;color:var(--amberd);background:var(--amberbg);
  border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.v6ev{padding:14px 0;border-top:1px solid var(--line)}
.v6ev:first-child{border-top:none;padding-top:2px}
.v6evh{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
.v6evh .who{font-weight:600}
.v6evh .at{margin-left:auto;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.v6evh .dlav{width:22px;height:22px;font-size:9px}
.v6ai{width:22px;height:22px;border-radius:50%;background:var(--dark);color:var(--yellow);display:inline-flex;
  align-items:center;justify-content:center;font-size:12px;flex:none}
.v6evb{font-size:14px;line-height:1.55;color:var(--ink)}
.v6evb b{font-weight:600}
.v6ev.you .v6evb{background:#F6EFE2;border-radius:12px;padding:10px 13px}
.v6ev .v5step{padding:4px 0}
.v6ev .v5made{margin:10px 0 2px;padding:11px 13px}
.v6ev.ask .v6evb{border-left:2px solid #CBE1F5;padding-left:12px}
.v6ev.sys .v6evb{color:var(--ink2);font-size:13.5px}
.v6ev .v6evb .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink3)}
.v6comp{flex:none;padding:12px 16px 14px;border-top:1px solid var(--line)}
.v6comp.hide{display:none}
.v6box{border:1px solid var(--line2);border-radius:14px;background:var(--card);padding:10px 12px 9px;
  display:flex;flex-direction:column;gap:9px;box-shadow:0 2px 10px rgba(31,31,29,.05)}
.v6box input{border:none;outline:none;font-family:inherit;font-size:14px;background:none;color:var(--ink);width:100%}
.v6box input::placeholder{color:var(--ink3)}
.v6tools{display:flex;align-items:center;gap:8px}
.v6tb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;
  padding:5px 11px;font-family:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.v6tb:hover{border-color:var(--line2);color:var(--ink)}
.v6send{margin-left:auto;width:30px;height:30px;border-radius:9px;border:none;background:var(--dark);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.v6ctx{display:flex;flex-direction:column;gap:8px}
.v6ctx .l{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.v6ctx .x{margin-left:auto;cursor:pointer;color:var(--ink3)}
.v6ctx .x:hover{color:var(--ink)}
.v6ctx .opts{display:flex;gap:6px;flex-wrap:wrap}
.v6wait{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--ink3);cursor:pointer}
.v6wait:hover{color:var(--ink)}

/* to-dos: one line per row, owner on the left, date on the right */
.v6td{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.v6td:first-child{border-top:none;padding-top:0}
.v6td .dlav{width:21px;height:21px;font-size:9px}
.v6td .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v6td .t.done{color:var(--ink3);text-decoration:line-through}
.v6td .d{flex:none;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.v6td .d.warn{color:var(--amberd)}

/* adding a step: a ghost row at the end of each chapter, then an inline row
   with a title and an executor */
.v5wf.add{color:var(--ink3);border-top-style:dashed}
.v5wf.add .dot{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink3)}
.v5wf.add .ti2{color:var(--ink3)}
.v5wf.add:hover .ti2,.v5wf.add:hover .dot{color:var(--ink)}
.v5wf.add .ch{display:none}
.v6addrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px dashed var(--line2)}
.v6addrow input{flex:1;min-width:120px;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);outline:none}
.v6addrow input:focus{border-color:#9FC4E4;box-shadow:0 0 0 3px rgba(24,95,165,.10)}
.v6xs{display:flex;gap:4px;flex:none}
.v6xp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;border-radius:999px;
  padding:3px 9px 3px 4px;font-family:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer}
.v6xp .dlav{width:17px;height:17px;font-size:7.5px}
.v6xp .ti{width:17px;height:17px;border-radius:50%;background:var(--dark);color:var(--yellow);
  display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.v6xp:hover{border-color:var(--ink3);color:var(--ink)}
.v6xp.on{background:var(--graybg);border-color:var(--ink3);color:var(--ink);font-weight:600}

.v6tabs{display:flex;align-items:center;gap:2px;background:var(--graybg);border-radius:12px;padding:3px}
.v6tab{display:inline-flex;align-items:center;gap:7px;border:none;background:none;border-radius:9px;
  padding:6px 13px;font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.v6tab:hover{color:var(--ink)}
.v6tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(31,31,29,.08)}
.v6tab .ti{font-size:16px;color:var(--ink3)}
.v6tab.on .ti{color:var(--ink)}
.v6b{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.v6b:hover{border-color:var(--ink3)}
.v6b.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.v6b.pri:hover{background:#31202A}
.v6b.gh{border-color:transparent;color:var(--ink3)}
.v6b.gh:hover{color:var(--ink);background:var(--graybg)}
.v6b .ti{font-size:14px}


/* ── carried over from v5 unchanged: the card, the document, the drawer, the step detail ── */
/* what it did, in the order it did it */
.v5step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px;color:var(--ink2)}
.v5step .bx{width:15px;height:15px;border-radius:4px;flex:none;margin-top:3px;background:var(--greend);position:relative}
.v5step .bx:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5step .bx.run{background:none;border:1.5px solid var(--amber)}
.v5step .bx.run:after{display:none}
.v5step div{min-width:0}
.v5step em{display:block;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  color:var(--ink3);margin-top:3px}
.v5step .w{color:var(--ink)}

/* something it made */
.v5made{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin:14px 0;background:var(--card);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.v5made:hover{border-color:var(--line2);box-shadow:0 3px 12px rgba(31,31,29,.06)}
.v5mt{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.v5mn{flex:1;min-width:0}
.v5mn b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.v5mn span{font-size:13.5px;color:var(--ink3)}
.v5made .ti.go{font-size:17px;color:var(--ink3);flex:none}

@keyframes gyspin{to{transform:rotate(360deg)}}
@keyframes gyrise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes gypip{0%,100%{box-shadow:0 0 0 3px var(--amberbg)}50%{box-shadow:0 0 0 7px rgba(239,159,39,.20)}}
@keyframes gyflash{0%{background:#FEF6D8;border-color:#E9D79A}100%{background:var(--card);border-color:var(--line)}}
@keyframes gyglow{0%,100%{box-shadow:0 2px 10px rgba(31,31,29,.05)}50%{box-shadow:0 2px 18px rgba(24,95,165,.18)}}
.gyspin{animation:gyspin .9s linear infinite;display:inline-block}
.v5step.rise{animation:gyrise .22s ease both}
.v5wf.cur .dot,.dlpip.live{animation:gypip 1.5s ease-in-out infinite}
.v5inp.just{animation:gyflash 1.2s ease-out}
.v5tw.just,.v5win.just{animation:gyflash 1.2s ease-out}
.dlsgb i{transition:width .45s ease}
.v5rc.live{animation:gyglow 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  .gyspin,.v5step.rise,.v5wf.cur .dot,.dlpip.live,.v5inp.just,.v5rc.live{animation:none}
}
.v5panel{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:transparent}
/* The assistant, the document and the drawer all stand on the same ground.
   Nothing is a column with a fill of its own; the only object is the card. */
.v5row{background:var(--bg)}
/* A quiet pair of icons in the panel's top corner: the same sixteen steps as
   a list, or as the canvas they live on. It floats in the body's top padding
   so it stays put while the list scrolls under it. */
.v5vt{flex:none;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:2px;margin-left:12px}
.v5vb{width:29px;height:26px;border:none;background:none;border-radius:8px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .12s,color .12s}
.v5vb:hover{background:var(--graybg);color:var(--ink2)}
.v5vb.on{background:var(--graybg);color:var(--ink)}
/* The second bar spans the whole page, above the three columns, so its width
   never moves when a column opens or closes. Everything the buttons open ,
   the assistant on the left, the document in the middle, a drawer on the
   right, appears underneath it. */
.v5tabs{flex:none;display:flex;align-items:center;gap:10px;min-height:55px;
  padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.v5tabgrp{flex:1;min-width:0;display:flex;align-items:center;gap:3px;padding-right:4px;overflow-x:auto;scrollbar-width:none}
.v5tabgrp::-webkit-scrollbar{display:none}
.v5tab{position:relative;display:inline-flex;align-items:center;gap:6px;border:none;background:none;
  border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.v5tab:hover{background:var(--graybg)}
.v5tab.on{background:var(--graybg);color:var(--ink);font-weight:600}
.v5tab .ti{font-size:16px;color:var(--ink3)}
.v5tab.on .ti{color:var(--ink)}
.v5tab b{min-width:16px;height:16px;border-radius:999px;background:var(--graybg);color:var(--grayd);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.v5tab.chat{flex:none;order:-2;border:1px solid var(--line)}
.v5tdiv{order:-1;flex:none;width:1px;align-self:stretch;background:var(--line);margin:2px 2px 2px 0}
.v5tab.chat .ti{color:var(--blued)}
.v5tab.chat.on{background:var(--bluebg);border-color:#CBE1F5;color:var(--blued)}
.v5tab.chat.on .ti{color:var(--blued)}
/* the right-hand drawer: Comments, To-dos and Sources open here, and the
   assistant closes when they do, because the page holds one side panel at a
   time and the middle should never be squeezed from both ends at once. */
.v5dr{width:360px;flex:none;display:flex;flex-direction:column;min-width:0;
  background:transparent}
.v5dr.hide{display:none}
.v5drh{flex:none;display:flex;align-items:center;gap:11px;min-height:55px;
  padding:11px 12px 11px 18px;border-bottom:1px solid var(--line)}
.v5drt{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.v5dri{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.v5dri .ti{font-size:16px}
.v5dri.hide{display:none}
.v5drx{width:32px;height:32px;flex:none;border:none;background:none;border-radius:9px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
.v5drx:hover{background:var(--graybg);color:var(--ink)}
.v5drb{flex:1;overflow:auto;padding:20px 20px 40px;font-size:14px;line-height:1.55}
.v5drgrp{flex:none;display:flex;align-items:center;gap:3px;margin-left:auto}
.v5tab.dr.on{background:var(--graybg);color:var(--ink);font-weight:600}

.v5bin{max-width:780px;margin:0 auto}

/* ── the framed tabs ──────────────────────────────────────────────────────
   The document and the workflow are one component each: a chrome bar naming
   what you are looking at, and the page under it, in a single card hovering
   on the shared ground. No frame around the frame. */
.v5body.framed{padding:16px;overflow:hidden;display:flex;min-height:0}
.v5body.framed #pbody{max-width:none;margin:0;flex:1;display:flex;min-width:0}
.v5card{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);
  border-radius:16px;overflow:hidden;
  box-shadow:0 2px 16px rgba(26,12,18,.07),0 1px 3px rgba(26,12,18,.05)}
.v5frh{flex:none;display:flex;align-items:center;gap:11px;min-height:56px;padding:12px 16px;
  border-bottom:1px solid var(--line)}
.v5frh .dlonm{flex:1 1 auto;min-width:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v5frh .n{margin-left:auto;font-size:12.5px;color:var(--ink3);flex:none;white-space:nowrap}
.v5out{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;border:none;
  border-radius:999px;padding:8px 15px 8px 13px;background:var(--dark);color:#fff;font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.v5out:hover{background:#31202A}
.v5out .ti{font-size:16px;color:var(--yellow)}
.v5cbody{flex:1;min-height:0;overflow:auto;padding:42px 40px 70px}
.v5cin{max-width:780px;margin:0 auto}
.v5cbody.list{padding:24px 26px 34px}
.v5cbody.list .v5cin{max-width:860px}
/* Home holds its own blocks, so it gets room rather than a reading measure. */
.v5cbody.home{padding:32px 32px 60px}
.v5cbody.home .v5cin{max-width:1060px}
/* the canvas carries its own ground, so it fills the card edge to edge */
.v5cbody.bare{padding:0;overflow:hidden;display:flex}

/* the document, living inside the panel */
.v5dt{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1;
  padding-bottom:22px;border-bottom:1px solid var(--line)}

/* A chapter is a block of fields with one heading. The guidance that used to
   sit in a grey box under the heading now hangs off the i beside it, so the
   page is fields and nothing else. */
.v5sec{margin-top:54px}
.v5ch{display:flex;align-items:center;gap:11px;margin-bottom:30px}
.v5chn{width:30px;height:30px;border-radius:9px;background:var(--dark);color:var(--yellow);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.v5cht{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.01em}
.v5ch .gyinfo{margin-left:1px}

/* One field: a label row, then the field itself. Filled fields read as a
   completed input, unwritten ones as an empty one, so the document looks like
   something with blanks in it rather than prose with gaps. */
.v5f{margin-bottom:34px}
.v5f:last-child{margin-bottom:0}
.v5flab{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:20px}
.v5fl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.v5inp{border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:16px 18px;font-size:16.5px;line-height:1.6;color:var(--ink);outline:none;
  transition:border-color .12s,box-shadow .12s,background .12s}
.v5inp:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(31,31,29,.04)}
.v5inp:focus{background:var(--card);border-style:solid;border-color:#9FC4E4;
  box-shadow:0 0 0 3px rgba(24,95,165,.10)}
/* An unwritten field is an empty field with a hint in it, so the first thing
   you can do to it is type. The dashed frame clears itself on the first
   keystroke, along with the chip that said it was not written yet. */
.v5inp.empty{background:#FBF9F2;border-style:dashed;border-color:#DFD8C6;min-height:78px;
  font-size:14.5px;color:var(--ink3)}
.v5inp.empty:before{content:attr(data-ph);color:var(--ink3)}
.v5inp.empty:focus:before{opacity:.45}
.v5inp.parked{background:#FBF9F2;border-style:dashed;border-color:#DFD8C6;
  font-size:14.5px;line-height:1.6;color:var(--ink3)}
.v5tbl td[contenteditable]{outline:none}
.v5tbl td[contenteditable]:focus{background:#F4F8FC;box-shadow:inset 0 0 0 2px #9FC4E4}
.v5dt[contenteditable]{outline:none}
.v5dt[contenteditable]:focus{box-shadow:inset 0 0 0 2px #9FC4E4;border-radius:8px}

/* Provenance did not go away, it went quiet: one dot, coloured by how much the
   field can be trusted, tooltip on hover, click for the full record. */
.v5dot{width:9px;height:9px;border-radius:50%;flex:none;cursor:pointer;
  box-shadow:0 0 0 3px transparent;transition:box-shadow .12s}
.v5dot:hover{box-shadow:0 0 0 3px rgba(31,31,29,.07)}
.v5dot.ai{background:var(--blued)}
.v5dot.ok{background:var(--greend)}
/* Chapter 2 splits into lettered markets, each with a buyer table; chapter 3
   is one wide table. Tables scroll inside their own frame so the page never
   does. An empty cell is drawn as an empty cell, not as nothing, because in
   the source those blanks are work that has not happened yet. */
.v5sh{font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin:34px 0 13px;color:var(--ink)}
.v5sec .v5sh:first-of-type{margin-top:0}
.v5tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.v5tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5}
.v5tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:bottom}
.v5tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
/* Chapter 3 has seven columns. Squeezing them into the panel turns every cell
   into a column of single words, so the table keeps its natural width and the
   frame scrolls instead. */
.v5tbl.wide{width:auto;min-width:1180px}
.v5tbl.wide td,.v5tbl.wide th{min-width:150px}
.v5tbl.wide td:nth-child(4),.v5tbl.wide td:nth-child(5){min-width:230px}
.v5tbl tr:last-child td{border-bottom:none}
.v5tbl td.k{color:var(--ink);font-weight:600;min-width:150px}
.v5tbl td.mt{background:#FBF9F2}
.v5note{font-size:13.5px;line-height:1.6;color:var(--ink3);margin-top:11px}
.v5call{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  margin-top:18px;font-size:14.5px;line-height:1.6;color:var(--ink2);background:var(--card)}
.v5call > .ti{font-size:16px;color:var(--ink3);flex:none;margin-top:3px}
.v5call ul{margin:0;padding-left:17px}
.v5call li{margin:5px 0}
.v5call b{color:var(--ink)}
.v5win{background:#FEFAE6;border:1px solid #F1E3A6;border-radius:14px;padding:22px 24px}
.v5win p{font-size:16.5px;line-height:1.62;color:var(--ink)}
.v5win ul{margin:15px 0 0;padding-left:19px;font-size:15px;line-height:1.62;color:var(--ink2)}
.v5win li{margin:8px 0}
.v5win .gate{margin-top:17px;padding-top:15px;border-top:1px solid #F1E3A6;font-size:15px;color:var(--ink)}
.v5txt{font-size:17px;line-height:1.62;color:var(--ink)}
.v5pv{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink3)}
.v5pv b{font-weight:400;color:var(--ink2)}
.v5cf{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.v5cf.ai{background:var(--bluebg);color:var(--blued)}
.v5cf.ok{background:var(--greenbg);color:var(--greend)}
.v5cf.none{background:var(--amberbg);color:var(--amberd);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.v5cf.click{cursor:pointer}
.v5cf.click:hover{filter:brightness(.97)}

.dlav{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
/* ── progress, the one big reading on the page ── */
/* The workflow bar carries the same title bar as the Document block, and
   leads with the step in flight rather than with a big total. Smaller, but
   the amber pip and the live step do the work the 28px number used to. */
.dlpb{margin-bottom:18px;padding:11px 16px 13px}
/* A ribbon, not a block: no title bar of its own, everything live on one
   line, and four hairline bars under it. Two rows, about 70px. */
.dlnow{display:flex;align-items:center;gap:9px;flex-wrap:nowrap;margin-bottom:11px;min-width:0}
.dlnow > .ti{font-size:16px;color:#12684C;flex:none}
.dlpip{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;
  box-shadow:0 0 0 3px var(--amberbg);margin-left:3px}
.dlnow .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--amberd);flex:none;margin-right:1px}
.dlnow .v{font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlnow .w{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;
  flex:none;white-space:nowrap}
.dlnow .w .dlav{width:17px;height:17px;font-size:8px}
.dlnow .c{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap;
  padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.dlseg{display:flex;gap:6px}
.dlsg{flex-basis:0;min-width:0}
.dlsgb{height:5px;border-radius:999px;background:#F0EEE7;overflow:hidden;display:flex}
.dlsgb i{display:block;height:100%}
.dlsgb i.done{background:var(--greend)}
.dlsgb i.cur{background:var(--yellow)}
.dlsgl{display:flex;align-items:baseline;gap:5px;margin-top:6px;font-size:11px;color:var(--ink2);min-width:0}
.dlsgl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlsgl .c{color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.dlsg.off .dlsgl{color:var(--ink3)}

/* to-dos */
.dlcardb{padding:4px 17px 14px}
/* In a narrow panel the count gives way before the block's name does. */
.dlohd .n{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--ink3);
  flex:0 5 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlohd .n.warn{color:var(--amberd)}
.dltd{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.dltd:first-of-type{border-top:none}
.dltd .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dltd .d{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap}
.dltd .d.warn{color:var(--amberd)}
.dltd .dlav{width:21px;height:21px;font-size:9.5px;box-shadow:none}
.dlmore{border:none;background:transparent;color:var(--ink2);font-family:inherit;font-size:13px;
  cursor:pointer;padding:9px 0 0;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);width:100%;margin-top:2px}
.dlmore:hover{color:var(--ink)}

/* the other tabs */
.v5item{padding:13px 0;border-top:1px solid var(--line)}
.v5item:first-child{border-top:none;padding-top:0}
.v5who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.v5who .v5av{width:22px;height:22px;font-size:9.5px}
.v5who b{font-size:13.5px;font-weight:600}
.v5who span{font-size:12.5px;color:var(--ink3);margin-left:auto}
.v5sub{font-size:12.5px;color:var(--ink3);margin-bottom:5px}
.v5srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0;font-size:14px}
.v5srow:first-child{border-top:none;padding-top:0}
.v5srow .ti{font-size:16px;color:var(--ink3);flex:none}
.v5srow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v5srow .s{flex:none;font-size:13px;color:var(--ink3);white-space:nowrap}
.v5srow .s.warn{color:var(--amberd)}
.v5srow .s.ok{color:var(--greend)}
.v5box2{width:15px;height:15px;border-radius:4px;border:1.5px solid #B4B2A9;flex:none;margin-top:2px;background:#fff}
.v5box2.on{background:#185FA5;border-color:#185FA5;position:relative}
.v5box2.on:after{content:'';position:absolute;left:50%;top:50%;width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5td{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.v5td:first-child{border-top:none;padding-top:0}
/* workflow tab */
.v5wfc{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;font-size:12px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.v5wfc:first-child{margin-top:0}
.v5wfc{padding:0 10px}

/* ── the step detail: what it is for, the tasks inside it, what it leaves ── */
.v5sk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.v5swhat{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:22px}
.v5tkb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.v5tkr{position:relative;display:flex;gap:12px;padding:14px;border-top:1px solid var(--line)}
.v5tkr:first-child{border-top:none}
.v5tkr:before{content:'';position:absolute;left:25px;top:0;height:14px;width:1px;background:var(--line)}
.v5tkr:after{content:'';position:absolute;left:25px;top:36px;bottom:0;width:1px;background:var(--line)}
.v5tkr:first-child:before,.v5tkr:last-child:after{display:none}
.v5tkn{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;flex:none;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.v5tkc{min-width:0}
.v5act{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:11.5px;font-weight:500;
  padding:3px 10px 3px 5px;margin-bottom:8px}
.v5act.ai{background:var(--dark);color:#fff}
.v5act.ai .ti{font-size:13px;color:var(--yellow)}
.v5act.who{background:var(--graybg);color:var(--ink)}
.v5act.who .dlav{width:17px;height:17px;font-size:8px}
.v5tkt{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
.v5tkw{font-size:12.5px;color:var(--ink3);margin-top:5px}
.v5aft{display:flex;gap:11px;background:var(--bluebg);border-radius:12px;padding:14px 16px;margin-top:20px;
  font-size:13.5px;line-height:1.55;color:var(--blued)}
.v5aft .ti{font-size:16px;flex:none;margin-top:1px}

/* ── the canvas view ──────────────────────────────────────────────────────
   Not a redrawing of the canvas: the canvas itself. gy-nav.js already reads
   ?embed=1 and drops its own sidebar, top bar and collapse control, which is
   what that flag exists for, so the page arrives as the world plus its own
   floating pills and side panel. The panel goes full-bleed to receive it. */
.v5cvf{display:block;width:100%;height:100%;border:none;background:#FBFAF5}
.v5wfc span{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink3)}
/* A step is an object you can open, so the row behaves like one. */
.v5wf{display:flex;align-items:center;gap:11px;padding:10px 10px;border-top:1px solid var(--line);
  font-size:14.5px;cursor:pointer;transition:background .12s}
.v5wf:hover{background:var(--graybg)}
.v5wf.sel{background:var(--graybg)}
.v5wf .ch{flex:none;font-size:15px;color:var(--ink3);opacity:0;transition:opacity .12s}
.v5wf:hover .ch,.v5wf.sel .ch{opacity:1}
.v5wf .dot{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid var(--line2);position:relative}
.v5wf.done .dot{background:var(--greend);border-color:var(--greend)}
.v5wf.done .dot:after{content:'';position:absolute;left:50%;top:50%;width:3.5px;height:7px;border:solid #fff;
  border-width:0 2px 2px 0;transform:translate(-50%,-58%) rotate(45deg)}
.v5wf.cur .dot{border-color:var(--amber);border-width:4px}
.v5wf .no{flex:none;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;width:26px}
.v5wf .ti2{flex:1;min-width:0}
.v5wf.pend .ti2,.v5wf.pend .no{color:var(--ink3)}
.v5wf.cur .ti2{font-weight:600}
.v5wf .now{flex:none;font-size:12px;font-weight:500;color:var(--amberd);background:var(--amberbg);
  padding:2px 8px;border-radius:999px}
.v5dl{display:flex;gap:12px;padding:8px 0;font-size:13.5px}
.v5dl dt{flex:none;width:84px;color:var(--ink3)}
.v5dl dd{flex:1;min-width:0}
.v5back{display:inline-flex;align-items:center;gap:7px;border:none;background:none;font-family:inherit;
  font-size:13.5px;color:var(--blued);cursor:pointer;padding:0;margin-bottom:14px}
.v5back:hover{text-decoration:underline}

/* ── header bits ────────────────────────────────────────────────────────── */
.v5av{border-radius:50%;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;flex:none;width:30px;height:30px}
.v5pile{display:flex;align-items:center}
.v5pile .v5av{margin-left:-9px;box-shadow:0 0 0 2px var(--bg)}
.v5pile .v5av:first-child{margin-left:0}
.v5keb{width:34px;height:34px;flex:none;border:none;background:transparent;border-radius:9px;color:var(--ink3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px}
.v5keb:hover{background:var(--graybg);color:var(--ink)}
.v5keb.on{background:var(--graybg);color:var(--ink)}
/* topbar matches every other page: 61px, so the Share button is compact */
.topbar{height:61px}
.topbar .btn-out{padding-top:6px;padding-bottom:6px}
</style>
</head>
<body>

<div class="shell">
<script>window.GYNAV={"active":"deliverables","arts":"demand"};</script>

<script src="gy-versions.js?v=2400190b"></script>

<div class="mainc">
<div class="topbar">
  <button class="scollapse exp" id="expandBtn" onclick="toggleNav()" title="Show the sidebar"><i class="ti ti-layout-sidebar"></i></button>
  <div class="crumbs">
    <span class="cr cur">Customer Demand Mapping</span>
  </div>
  <div class="spacer"></div>
  <div class="v5pile" id="pile"></div>
  <button class="btn-out" onclick="gyToast('Sharing is not wired up in this sketch')"><i class="ti ti-users"></i> Share</button>
  <button class="v5keb" onclick="gyMenu(this,[
    ['ti-layout-sidebar-right','Open sketch 6','go:deliverable-sketch-v6.html'],

    ['ti-rotate','Reset this sketch', function(){ resetSketch(); }]])">&#8942;</button>
</div>

<div class="v7row">

  <div class="v7chat">

      <div class="v7needs" id="needs"></div>
      <div class="v7lh">Activity<button class="v7reopen" onclick="showDoc()" title="Show the document"><i class="ti ti-layout-sidebar-right-expand"></i></button></div>
      <div class="v7log" id="log"></div>
    </div>

    var run = ps.filter(function(s){ return s.st === 'run'; }), wt = ps.filter(function(s){ return s.st === 'wait'; });
    var lv = run.map(function(s){ return s.k+' running'; }).concat(wt.map(function(s){ return s.k+' with '+firstName(s.x); })).join(', ');
    return '<div class="v7pr'+(cd||run.length?'':' off')+'" onclick="goChapter('+ci+')"><span class="nm">'+c.n.replace(/^\d\. /,'')+'</span>'
      + '<span class="dlsgb"><i class="done" style="width:'+(cd/ps.length*100)+'%"></i>'
      + (run.length ? '<i class="cur" style="width:'+(run.length/ps.length*100)+'%"></i>' : '')+'</span>'
      + '<span class="c">'+cd+'/'+ps.length+'</span>'+(lv ? '<span class="lv">'+lv+'</span>' : '')+'</div>';
  }).join('');
}
function paintAcc(){
  var items = queueItems();
  document.getElementById('needs').innerHTML =
      sec('needs', 'Needs you', items.length || '', needsBody(items), items.length > 0);
}

/* ── the card: two tabs and the tools in its own header ── */
function paintHead(){
  document.getElementById('frh').innerHTML = '<div class="v7frh">'
    + '<span class="dltile" style="background:var(--bluebg);color:var(--blued)"><i class="ti ti-file-text"></i></span>'
    + '<span class="dlonm">Document</span>'
    + '<button class="btn-out" onclick="viewOutput()"><i class="ti ti-file-type-pdf"></i> View output (PDF)</button>'
    + (document.body.classList.contains('nochat')
        ? '<button class="v7ib" onclick="toggleChat()" title="Show the conversation"><i class="ti ti-layout-sidebar-left-expand"></i></button>'
        : '<button class="v7ib" onclick="toggleChat()" title="Document only"><i class="ti ti-arrows-maximize"></i></button>')
    + '<button class="v7ib" onclick="hideDoc()" title="Close the document"><i class="ti ti-x"></i></button>'
    + '</div>';
}
function openTab(k, keep){
  TAB = k;
  paintHead();
  var cb = document.getElementById('cbody'), pb = document.getElementById('pbody');
  var bare = (k === 'workflow' && WFVIEW === 'canvas');
  cb.className = 'v5cbody' + (bare ? ' bare' : (k === 'workflow' ? ' list' : ''));
  pb.className = bare ? '' : 'v5cin';
  if(bare) pb.style.cssText = 'flex:1;display:flex;min-width:0'; else pb.style.cssText = '';
  var was = cb.scrollTop;
  pb.innerHTML = VIEWS[k]();
  cb.scrollTop = keep ? was : 0;
  if(k === 'doc') decorateDoc();
}
/* chapter 3 is being written right now, and the heading says so */
function decorateDoc(){
  var s31 = stepByKey('3.1');
  var chs = document.querySelectorAll('#pbody .v5ch');
  if(s31 && s31.st === 'run' && chs[2]){
    chs[2].insertAdjacentHTML('beforeend', '<span class="v6chs">3.1 running</span>');
  }
}
function paintAll(){ paintAcc(); paintLog(); openTab(TAB, true); }

/* the same workflow, as a list to run or as the canvas it was shaped on */
var CANVAS_SRC = 'customer-demand-mapping-v2-canvas.html?embed=1&bare=1';
var WFVIEW = 'list';
try{ if(localStorage.getItem('gyWfView') === 'canvas') WFVIEW = 'canvas'; }catch(e){}
var VT = [['list','ti-list','List, to run it'],['canvas','ti-hierarchy-2','Canvas, to shape it']];
function vtHtml(){
  return '<span class="v5vt">' + VT.map(function(v){
    return '<button class="v5vb'+(WFVIEW===v[0]?' on':'')+'" data-tip="'+v[2]+'"'
      + ' onclick="setWfView(\''+v[0]+'\')"><i class="ti '+v[1]+'"></i></button>';
  }).join('') + '</span>';
}
function setWfView(v){
  if(WFVIEW === v) return;
  WFVIEW = v;
  try{ localStorage.setItem('gyWfView', v); }catch(e){}
  openTab('workflow');
}

/* ── the step detail, as a sheet inside the card so the plan stays in view ── */
function openStep(k){
  if(STEPSEL === k) return closeSide();
  var st = null;
  STEPS.forEach(function(x){ if(x[0] === k) st = x; });
  var pl = st ? (PAL[st[3]] || PAL.gray) : PAL.gray;
  var s = stepByKey(k);
  STEPSEL = k;
  var ic = document.getElementById('dricon');
  ic.style.background = pl[0]; ic.style.color = pl[1];
  ic.innerHTML = '<i class="ti '+(st ? st[2] : 'ti-file-plus')+'"></i>';
  document.getElementById('drtitle').textContent = k + ' ' + (s ? s.t : 'Step');
  document.getElementById('drbody').innerHTML = stepBody(k);
  document.getElementById('drbody').scrollTop = 0;
  document.getElementById('side').classList.remove('hide');
}
function closeSide(){
  var was = STEPSEL; STEPSEL = null;
  document.getElementById('side').classList.add('hide');
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSide(); });

/* ── what the queue lets you do ── */
function goAnswer(){
  var ev = document.getElementById('ev-sw');
  if(ev) ev.scrollIntoView({behavior:'smooth', block:'center'});
  CTX = 'sw';
  var c = document.getElementById('ctx');
  c.className = 'v6ctx';
  c.innerHTML = '<span class="l"><i class="ti ti-corner-down-right"></i>Answering: Scottish Water in two markets'
    + '<i class="ti ti-x x" onclick="clearCtx()"></i></span>'
    + '<span class="opts"><button class="v6b" onclick="answer(\'Lead with water quality\')">Lead with water quality</button>'
    + '<button class="v6b" onclick="answer(\'Keep both rows\')">Keep both rows</button></span>';
  document.getElementById('ask').focus();
}
function clearCtx(){ CTX = null; document.getElementById('ctx').className = 'v6ctx hide'; }
function answer(text){
  ASKED = false;
  logPush({who:'Caitlin Ciceri', kind:'you', at:'Just now', html:text});
  var reply;
  if(/^Lead/.test(text)){
    /* the biodiversity table keeps a pointer, not a full row */
    MARKETS[2][1] = MARKETS[2][1].filter(function(r){ return r[0] !== 'Scottish Water'; });
    MARKETS[2][2] = 'Scottish Water is covered under b. Water Quality, where its reliance on the catchment is direct.';
    reply = 'Done. Scottish Water leads <b>b. Water Quality</b> and the biodiversity table carries a one-line pointer. '
      + 'Izzie will see the change in the Trade check.';
  } else if(/^Keep/.test(text)){
    reply = 'Kept as a full row in both. I have noted on each that the other exists, so the summary does not count it twice.';
  } else {
    reply = 'Noted. I will apply that in chapter 2 and flag it for Izzie\'s check.';
  }
  logPush({who:'ai', kind:'say', at:'Just now', html:reply});
  clearCtx();
  paintAll();
  gyToast('Answered. Chapter 2 updated.');
}
function send(){
  var inp = document.getElementById('ask'), v = inp.value.trim();
  if(!v) return;
  inp.value = '';
  if(CTX === 'sw'){ answer(v); return; }
  logPush({who:'Caitlin Ciceri', kind:'you', at:'Just now', html:v.replace(/</g,'&lt;')});
  gyToast('The assistant is not wired up in this sketch: its reply would land here, in the log');
}
function reviewFields(){
  if(TAB !== 'doc') openTab('doc');
  var unc = Object.keys(CONF).filter(function(k){ return !CONF[k]; });
  if(!unc.length) return;
  var el = document.getElementById('f-'+unc[0]);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function confirmField(k){
  CONF[k] = 1;
  FIELDS[k].cf = ['ok','Confirmed by Caitlin Ciceri'];
  logPush({who:'Caitlin Ciceri', kind:'sys', at:'Just now', html:'Confirmed the wording of <b>'+FIELDS[k].l+'</b>.'});
  var cb = document.getElementById('cbody'), keep = cb.scrollTop;
  paintAcc(); openTab('doc');
  cb.scrollTop = keep;
  var left = Object.keys(CONF).filter(function(x){ return !CONF[x]; }).length;
  gyToast(left ? FIELDS[k].l + ' confirmed, ' + left + ' to go' : 'Chapter 1 is confirmed');
}
function addProp(){
  var s = stepByKey('2.4a'); if(!s) return;
  PROP = 'added'; s.st = 'queued';
  logPush({who:'Caitlin Ciceri', kind:'sys', at:'Just now', html:'Added <b>2.4a Draft the peat resurvey request</b> to the plan.'});
  logPush({who:'ai', kind:'sys', at:'Just now', html:'2.4a is queued. It runs as soon as 3.1 finishes, and the request goes to Harry to send.'});
  paintAll();
  gyToast('2.4a added. The plan is 17 steps now.');
}
function dismissProp(){
  var s = stepByKey('2.4a'); if(!s) return;
  PROP = 'dismissed'; s.st = 'gone';
  logPush({who:'Caitlin Ciceri', kind:'sys', at:'Just now', html:'Did not add 2.4a. The peat resurvey stays with Harry as a to-do.'});
  paintAll();
  gyToast('Not added. The 2015 figure stays flagged in Constraints.');
}
function resetSketch(){
  CONF = {a0:0, a3:0, a4:0}; ASKED = true; PROP = 'open'; CTX = null;
  ['a0','a3','a4'].forEach(function(k){ FIELDS[k].cf = ['ai',"Assistant's reading"]; });
  MARKETS[2][1] = MARKETS0[2][1].slice(); MARKETS[2][2] = MARKETS0[2][2];
  var s = stepByKey('2.4a') || WF[1].s[4]; s.st = 'prop';
  ADDING = null; ADDX = 'ai';
  WF.forEach(function(c){ c.s = c.s.filter(function(x){ return !x.added; }); });
  LOG = LOG0.slice();
  closeSide(); paintAll();
  gyToast('Sketch reset');
}
var MARKETS0 = MARKETS.map(function(m){ return [m[0], m[1].slice(), m[2]]; });

/* the dot opens the provenance of its field, inside the card */
function openProv(k){
  var f = FIELDS[k];
  var read = f.cf[0]==='ai' || /Caitlin/.test(f.cf[1]) ? 'Kick-off recording, transcript 14 Jul' : 'Upper Dee land management plan, 2 Jul';

(function(){
  var orig = window.gyMenu;
  if(!orig) return;
  window.gyMenu = function(el, items){
    return orig(el, (items || []).map(function(it){
      if(it && it[2] === 'run:reset') return [it[0], it[1], 'Reset, use the button below'];
      return it;
    }));
  };
})();
document.addEventListener('paste', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[contenteditable]') : null;
  if(!t) return;
  e.preventDefault();
  var txt = (e.clipboardData || window.clipboardData).getData('text');
  document.execCommand('insertText', false, txt);
});
/* A field stops looking empty the moment it is not. */
document.addEventListener('input', function(e){
  var el = e.target && e.target.closest ? e.target.closest('.v5inp, .v5tbl td') : null;
  if(!el) return;
  var has = el.textContent.replace(/\u00a0/g,' ').trim().length > 0;
  if(el.classList.contains('v5inp')){
    if(el.hasAttribute('data-ph')) el.classList.toggle('empty', !has);
    var f = el.closest('.v5f');
    var chip = f && f.querySelector('.v5cf.none');
    if(chip) chip.style.display = has ? 'none' : '';
  } else {
    el.classList.toggle('mt', !has);
  }
});

/* The path is there, just folded. One click unfolds it and the chip steps
   aside; it refolds on the next visit. */
function crExpand(){
  document.getElementById('crtrail').classList.add('on');
  document.getElementById('crmore').classList.add('hide');
}
/* The rail starts folded on this page. gy-nav.js already handles the layout
   through body.navhid, so this only chooses the default and remembers it
   under a key of its own, leaving every other page's preference alone. */
(function(){
  var pref = null;
  try{ pref = localStorage.getItem('gyDelNav7'); }catch(e){}
  var hide = pref === 'hidden';
  document.body.classList.toggle('navhid', hide);
  var b = document.getElementById('expandBtn');
  if(b) b.style.display = hide ? 'flex' : 'none';
  window.toggleNav = function(){
    var hid = document.body.classList.toggle('navhid');
    var btn = document.getElementById('expandBtn');
    if(btn) btn.style.display = hid ? 'flex' : 'none';
    try{ localStorage.setItem('gyDelNav7', hid ? 'hidden' : 'open'); }catch(e){}
    fitThumb();
  };
})();

openTab(TAB);
